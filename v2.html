      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;">${suppRowsHtml}</div>
    </div>`;

  // ---- Sedute della settimana ----
  const maxVol = Math.max(1, ...wk.sessions.map(s => s.vol));
  const sessRows = wk.sessions.map(s => `
        <div onclick="selDate='${s.dateISO}';oggiViewMode='day';render();" style="display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line2);cursor:pointer;">
          <span style="flex:0 0 30px;font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${s.dow}</span>
          <span style="flex:0 0 58px;font-size:10.5px;font-weight:600;color:#57575f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.type)}</span>
          <div style="flex:1 1 auto;min-width:0;height:5px;border-radius:999px;background:var(--line2);overflow:hidden;">
            <div style="height:100%;width:${s.vol ? Math.round(s.vol / maxVol * 100) : 0}%;border-radius:999px;background:${s.done ? 'var(--accent)' : 'var(--line)'};"></div>
          </div>
          <span style="flex:0 0 auto;font-size:10.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${s.vol ? nf(s.vol / 1000, 1) + 'k' : '—'}</span>
          <span style="flex:0 0 38px;text-align:right;font-size:10px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${s.dur ? Math.round(s.dur) + '′' : '—'}</span>
          <span style="flex:0 0 26px;text-align:right;font-size:10px;font-weight:600;color:${s.rpe != null && s.rpe >= 8 ? 'var(--warn-ink)' : 'var(--ink2)'};font-variant-numeric:tabular-nums;">${s.rpe != null ? s.rpe : '—'}</span>
        </div>`).join('');
  const sedCard = `
    <div style="grid-column:5 / 9;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.training}</span>
        <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.woDone}/${wk.woTot} ${LANG === 'it' ? 'sedute' : 'sessions'}</span>
      </div>
      <div style="flex:0 0 auto;display:flex;gap:16px;">
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">Volume</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekVolume / 1000, 1)}k</span><span style="font-size:10px;color:var(--ink3);">kg</span></div>
        </div>
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Tempo' : 'Time'}</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekDurationMin / 60, 1)}</span><span style="font-size:10px;color:var(--ink3);">h</span></div>
        </div>
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Calorie' : 'Calories'}</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekKcal / 1000, 1)}k</span><span style="font-size:10px;color:var(--ink3);">kcal</span></div>
        </div>
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:1px;">${sessRows || `<span style="font-size:11px;color:var(--ink3);padding-top:8px;">${LANG === 'it' ? 'Nessuna sessione ancora' : 'No sessions yet'}</span>`}</div>
    </div>`;

  // ---- Soggettivo: 8 medie + 3 categorici ----
  const SUBJ_LABELS = { energia: L.subj.energia, recupero: L.subj.recupero, umore: L.subj.umore, rpe: L.subj.rpe, appetito: L.subj.appetito, sonno_sogg: L.subj.sonno_sogg, libido: L.subj.libido, chiarezza: L.subj.chiarezza };
  const SUBJ_COLORS = { energia: 'var(--accent)', recupero: '#5b93cc', umore: 'var(--warn)', rpe: '#8a8a93', appetito: '#a86a00', sonno_sogg: '#3d6f9e', libido: 'var(--bad)', chiarezza: '#6d6d76' };
  const prevSubj = weekIdx > 0 ? weekAggregate(weekIdx - 1).subjSeries : null;
  const subjTiles = Object.keys(SUBJ_LABELS).map(k => {
    const arr = wk.subjSeries[k];
    const cur = wk.avg(arr), prev = prevSubj ? wk.avg(prevSubj[k]) : null;
    const dt = deltaTxt(cur, prev, '1');
    const sp = svgPath(arr, 100, 16, 3);
    return `
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${SUBJ_LABELS[k]}</span>
          <div style="display:flex;align-items:baseline;gap:4px;">
            <span style="font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${cur == null ? '—' : nf(cur)}</span>
            ${dt ? `<span style="font-size:9.5px;font-weight:600;color:${dt.color};font-variant-numeric:tabular-nums;">${dt.txt}</span>` : ''}
          </div>
          <svg viewBox="0 0 100 16" preserveAspectRatio="none" style="width:100%;height:15px;display:block;overflow:visible;">
            <path d="${sp.d}" fill="none" stroke="${SUBJ_COLORS[k]}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>

  const CAT_LABELS3 = { pienezza_add: L.subj.pienezza_add, ritenzione: L.subj.ritenzione, formicolio: L.subj.formicolio };
  const catRowsHtml = wk.catRows.map(r => {
    const cells = r.cells.map(c => {
      if (c.val == null) return `<span style="height:17px;border-radius:4px;background:transparent;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:var(--ink3);cursor:pointer;"></span>`;
      const table = r.key === 'formicolio' ? CAT_CELL_COLORS.formicolio : CAT_CELL_COLORS.default;
      const col = table[c.val] || table[0];
      const mark = c.val === 0 ? '·' : c.val;
      return `<span style="height:17px;border-radius:4px;background:${col.bg};display:flex;align-items:center;justify-content:center;font-size:8px;font-weight:700;color:${col.ink};cursor:pointer;">${mark}</span>`;
    }).join('');
    return `
        <div style="display:grid;grid-template-columns:96px repeat(7,1fr);gap:2px;align-items:center;">
          <span style="font-size:9.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(CAT_LABELS3[r.key])}</span>
          ${cells}
        </div>`;
  }).join('');

  const subjCard = `
    <div style="grid-column:9 / 13;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.subjective}</span>
        <span style="font-size:10.5px;font-weight:500;color:var(--ink3);">${LANG === 'it' ? 'media' : 'average'} · ${L.subjScale}</span>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px;">${subjTiles}</div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--line);">
        <span style="flex:0 0 auto;font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Categorici · giorno per giorno' : 'Categorical · day by day'}</span>
        ${catRowsHtml}
        <div style="flex:0 0 auto;display:flex;gap:9px;flex-wrap:wrap;padding-top:4px;">
          <span style="display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:3px;background:var(--line2);"></span>0</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:3px;background:var(--accent-soft);"></span>1</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:3px;background:#fdf3e4;"></span>2</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:8.5px;font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:3px;background:#fbe9e6;"></span>3</span>
        </div>
      </div>
    </div>`;

  if (isDesktop) {
    return `
      ${renderDayNav()}
      <div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,min-content);gap:9px;align-content:start;">
        ${recapCard}${pesoCard}${injCard}${adherenceCard}${suppCard}${sedCard}${subjCard}
      </div>`;
  }

  // ---- MOBILE: stessa aggregazione dati, una colonna sola ----
  const recapCardM = `
    <div style="flex:0 0 auto;border-radius:18px;background:var(--hero);padding:16px 18px;display:flex;flex-direction:column;gap:9px;">
      <span style="display:flex;align-items:center;gap:7px;font-size:11px;font-weight:600;color:#9d9da6;">
        <span style="width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:${recapDot};"></span>${recapLabel} · ${rangeTxt}
      </span>
      <span style="font-size:18px;line-height:1.25;letter-spacing:-.012em;font-weight:700;color:#ffffff;text-wrap:pretty;">${esc(recapTitle)}</span>
      <span style="font-size:13px;line-height:1.5;color:#c8c8ce;text-wrap:pretty;">${esc(recapText)}</span>
      ${wk.isFutureWeek ? '' : `
      <div style="display:flex;gap:12px;padding-top:4px;">
        ${miniStat('Peso', pesoAvgCur, v => nf(v, 1), pesoAvgPrev)}
        ${miniStat('HRV', hrvAvgCur, v => v == null ? '—' : Math.round(v), hrvAvgPrev, 'int')}
        ${miniStat('Sonno', sonnoAvgCur, sonnoFmt, sonnoAvgPrev)}
      </div>`}
    </div>`;

  const pesoCardM = `
    <div style="flex:0 0 auto;border-radius:18px;background:var(--surf);box-shadow:var(--shadow);padding:16px 18px;display:flex;flex-direction:column;gap:9px;">
      <div style="display:flex;align-items:flex-end;justify-content:space-between;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Peso' : 'Weight'}</span>
          <div style="display:flex;align-items:baseline;gap:6px;">
            <span style="font-size:30px;line-height:1.05;letter-spacing:-.02em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">${nf(pesoValid[pesoValid.length - 1])}</span>
            <span style="font-size:13px;font-weight:400;color:var(--ink3);">kg</span>
          </div>
        </div>
        ${pesoDeltaWeek != null ? `<span style="font-size:12px;font-weight:600;color:${pesoDeltaWeek <= 0 ? 'var(--ok)' : 'var(--warn-ink)'};font-variant-numeric:tabular-nums;">${pesoDeltaWeek >= 0 ? '+' : ''}${nf(pesoDeltaWeek)} kg</span>` : ''}
      </div>
      <svg viewBox="0 0 320 56" preserveAspectRatio="none" style="width:100%;height:52px;display:block;overflow:visible;">
        ${plPrev && plPrev.d ? `<path d="${svgPath(prevWkForChart.pesoArr, 320, 56, 8).d}" fill="none" stroke="var(--ink3)" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.55"></path>` : ''}
        ${(() => { const pm = svgPath(wk.pesoArr, 320, 56, 8); return pm.d ? `<path d="${pm.d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path>` : ''; })()}
      </svg>
      <span style="font-size:10.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;">${pesoSlope == null ? '' : (pesoSlope >= 0 ? '+' : '') + nf(pesoSlope, 2) + (LANG === 'it' ? ' kg / sett.' : ' kg/wk')}${plPrev && plPrev.d ? (LANG === 'it' ? ' · tratteggio: settimana precedente' : ' · dashed: previous week') : ''}</span>
    </div>`;

  const ringM = (pct, color, label, sub, deltaInfo) => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:7px;">
          <div style="position:relative;width:82px;height:82px;">
            <svg viewBox="0 0 84 84" style="width:82px;height:82px;transform:rotate(-90deg);display:block;">
              <circle cx="42" cy="42" r="34" fill="none" stroke="var(--line2)" stroke-width="8"></circle>
              <circle cx="42" cy="42" r="34" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(213.63 * pct / 100).toFixed(1)} 213.63"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">${pct}%</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;">
            <span style="font-size:11.5px;font-weight:600;color:var(--ink);">${label}</span>
            <span style="font-size:10px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${sub}</span>
            ${deltaInfo}
          </div>
        </div>`;
  const adherenceCardM = `
    <div style="flex:0 0 auto;border-radius:18px;background:var(--surf);box-shadow:var(--shadow);padding:16px 12px 14px;display:flex;flex-direction:column;gap:12px;">
      <div style="display:flex;justify-content:space-around;">
        ${ringM(wk.injPct, 'var(--accent)', L.injectionsRing, `${wk.injDoneTot}/${wk.injApplTot}`, ringDelta(wk.injPct, prevShallow && prevShallow.injPct))}
        ${ringM(wk.suppPct, 'var(--ok)', L.supplements, `${wk.suppDoneTot}/${wk.suppApplTot}`, ringDelta(wk.suppPct, prevShallow && prevShallow.suppPct))}
        ${ringM(wk.woPct, 'var(--warn)', L.workoutsRing, `${wk.woDone}/${wk.woTot}`, ringDelta(wk.woPct, prevShallow && prevShallow.woPct))}
      </div>
      <div style="display:flex;flex-direction:column;gap:6px;padding:0 6px;">
        <span style="font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Le 16 settimane' : 'All 16 weeks'}</span>
        <div style="height:46px;display:flex;align-items:flex-end;gap:3px;">${barsHtml}</div>
      </div>
    </div>`;

  const bioTileM = (label, arr, unit, fmtFn, invert) => {
    const cur = wk.avg(arr);
    const prevArr2 = prevWkForChart ? (label === 'HRV' ? prevWkForChart.hrvArr : label === (LANG === 'it' ? 'Riposo' : 'Resting') ? prevWkForChart.rhrArr : label === (LANG === 'it' ? 'Sonno' : 'Sleep') ? prevWkForChart.sonnoArr : label === 'REM' ? prevWkForChart.remArr : label === (LANG === 'it' ? 'Profondo' : 'Deep') ? prevWkForChart.profArr : prevWkForChart.risvArr) : null;
    const prevVal = prevArr2 ? wk.avg(prevArr2) : null;
    const dt = deltaTxt(cur, prevVal, unit, invert);
    const sp = svgPath(arr, 100, 18, 3);
    const anyEst = label === 'HRV' && wk.hrvIsEst.some(x => x);
    return `
              <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
                <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
                <div style="display:flex;align-items:baseline;gap:4px;">
                  <span style="font-size:15px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${fmtFn(cur)}</span>
                  ${dt ? `<span style="font-size:10px;font-weight:600;color:${dt.color};font-variant-numeric:tabular-nums;">${dt.txt}</span>` : ''}
                </div>
                <svg viewBox="0 0 100 18" preserveAspectRatio="none" style="width:100%;height:17px;display:block;overflow:visible;">
                  <path d="${sp.d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${anyEst ? 'stroke-dasharray="3 2"' : ''}></path>
                </svg>
                ${anyEst ? `<span style="font-size:7.5px;color:var(--ink3);">${LANG === 'it' ? 'media parz. stimata' : 'partly estimated avg'}</span>` : ''}
              </div>`;
  };
  const bioCardM = `
    <div style="flex:0 0 auto;border-radius:18px;background:var(--surf);box-shadow:var(--shadow);padding:14px 16px;display:flex;flex-direction:column;gap:10px;">
      <span style="font-size:11px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Biometria · media della settimana' : 'Biometrics · week average'}</span>
      <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:11px 12px;">
        ${bioTileM('HRV', wk.hrvArr, 'int', v => v == null ? '—' : Math.round(v))}
        ${bioTileM(LANG === 'it' ? 'Riposo' : 'Resting', wk.rhrArr, 'int', v => v == null ? '—' : Math.round(v), true)}
        ${bioTileM(LANG === 'it' ? 'Sonno' : 'Sleep', wk.sonnoArr, '', sonnoFmt)}
        ${bioTileM('REM', wk.remArr, 'int', v => v == null ? '—' : Math.round(v) + '′')}
        ${bioTileM(LANG === 'it' ? 'Profondo' : 'Deep', wk.profArr, 'int', v => v == null ? '—' : Math.round(v) + '′')}

  const subjTilesM = Object.keys(SUBJ_LABELS).map(k => {

              <div style="display:grid;grid-template-columns:104px repeat(7,1fr);gap:2px;align-items:center;">

  return `
    ${renderDayNav()}

/* ------------------------------------------------------------
   Vista Oggi completa — nav settimana/giorno + card riepilogo
   (nuove, 09/09/2026) sopra la day-card esistente (invariata).
   ------------------------------------------------------------ */
function renderOggiFull() {
  const L = t();
  const a = adherence(store.blob);
  const wHist = weightHistory(pesoRange, selDate);
  const wTrend = weeklyTrend(wHist);
  const hrvHist = (() => {
    const dIdx = dayIdxFromISO(selDate), from = Math.max(0, dIdx - 13);
    const arr = [];
    for (let i = from; i <= dIdx; i++) {
      const rec = (store.blob && store.blob['p2_day_' + i]) || {};
      const lo = parseFloat(rec.hrv_min), hi = parseFloat(rec.hrv_max);
      if (!isNaN(lo) && !isNaN(hi)) { arr.push((lo + hi) / 2); continue; }
      const real = parseFloat(rec.hrv);
      arr.push(isNaN(real) ? null : real);
    }
    return arr;
  })();
  const hrvTrend = weeklyTrend(hrvHist);
  const hero = buildHeroNarrative(a, wTrend, hrvTrend);

  const lastPeso = wHist.filter(v => v !== null).pop();
  const pesoDelta = (lastPeso !== undefined) ? (lastPeso - T0_PESO) : null;
  const trendTxt = wTrend === null ? '—' : `${wTrend >= 0 ? '+' : ''}${wTrend.toFixed(2)} kg / sett. su ${pesoRange}gg`;

  const s = renderOggiSections();

  // Dati di giorno/settimana/allenamento, serve sia per la riga di stato
  // dell'hero sia per il controllo override spostato dentro Allenamento
  // su desktop (vedi sotto — non più una banda a sé stante).
  const day = getDay(selDate);
  const dayIdx = dayIdxFromISO(selDate);
  const wo = getWorkout2(dayIdx);
  const rest = wo.type === 'Riposo';
  const slots = getInjectionSlots2(dayIdx);
  const weekN = Math.floor(dayIdx / 7) + 1;
  const isOverridden = !!day.wo_override;
  const dowLbl = new Date(selDate + 'T00:00:00').getDay();
  const mapLbl = { 0: 'Upper Dom', 1: 'Riposo', 2: 'Push', 3: 'Pull', 4: 'Riposo', 5: 'Legs', 6: 'Upper Sab' };
  const defaultType = mapLbl[dowLbl] || 'Riposo';
  const overrideOpts = ['Riposo', 'Push', 'Pull', 'Legs', 'Upper Sab', 'Upper Dom'];
  const dayMetaTxt = `${LANG === 'it' ? 'giorno' : 'day'} ${dayIdx} ${LANG === 'it' ? 'di' : 'of'} ${CFG.CYCLE_DAYS} · WK${weekN} · ${wo.type}`;

  const heroHtml = `
    <div class="hero-card">
      <div class="hero-status"><span class="hero-status-dot"></span>${LANG === 'it' ? 'In linea' : 'On track'} · ${dayMetaTxt}</div>

  const pesoHtml = `

        <span class="weight-value">${lastPeso !== undefined ? lastPeso.toFixed(1).replace('.', ',') : '—'}</span>

  const adherenceHtml = `
    <div class="adherence-card">
      <div class="adherence-title">${L2().adherence}</div>
      <div class="adherence-grid">
        <div class="adherence-item">
          <div class="adherence-ring-wrap"><canvas id="ring-inj"></canvas><span class="adherence-pct">${a.inj}%</span></div>

        </div>
        <div class="adherence-item">
          <div class="adherence-ring-wrap"><canvas id="ring-supp"></canvas><span class="adherence-pct">${a.supp}%</span></div>
          <span class="adherence-label">${L2().supplements}</span>

          <span class="adherence-sub">${a.woDone} / ${a.woTot}</span>

  const v = verdict(a);

    bad:     { dot: 'var(--bad)',  label: LANG === 'it' ? 'sotto target' : 'below target' },
    neutral: { dot: 'var(--idle)', label: LANG === 'it' ? 'senza dati' : 'no data' }
  }[v.tone];
  const VD_TEXT = {
    onTrack:      [L.vdText.onTrack[0], L.vdText.onTrack[1](a)],
    someGaps:     [L.vdText.someGaps[0], L.vdText.someGaps[1](a)],
    trainingGaps: [L.vdText.trainingGaps[0], L.vdText.trainingGaps[1](a)],

  const exList = (() => {
    if (!day.motra_log) return null;

      const parsed = typeof day.motra_log === 'object' ? day.motra_log : JSON.parse(day.motra_log);
      return Array.isArray(parsed.exercises) ? parsed.exercises : null;

    const pesoM = `

        <svg viewBox="0 0 320 54" preserveAspectRatio="none" style="width:100%;height:48px;display:block;overflow:visible;">

    const ringsM = (() => {

  const sonnoTot = parseSonnoHours(day.ore_sonno);

  const sonnoTile = `
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">

      <input data-f="ore_sonno" value="${esc(day.ore_sonno || '')}" placeholder="5.18" style="${micro}width:100%;min-width:0;background:var(--surf2);border-radius:6px;padding:5px 6px;text-align:center;" title="${sonnoShort}">
    </div>`;
  const hrvTile = (!day.hrv_min && !day.hrv_max && day.hrv) ? `
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
      <span style="font-size:9px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">HRV</span>
      <span style="${micro}width:100%;display:block;background:var(--surf2);border-radius:6px;padding:5px 6px;text-align:center;color:var(--ink3);" title="${LANG === 'it' ? 'Media storica, di sola lettura' : 'Historical average, read-only'}">${esc(day.hrv)}</span>

        <input data-f="hrv_min" value="${esc(day.hrv_min || '')}" placeholder="min" style="${micro}width:26px;background:transparent;text-align:right;">

  const TILES_HTML = [

  const RINGS = [

  // Iniezioni — appiattite in un'unica lista di righe (come nel mockup: non

  const MUSCLE_OPTS = ['Petto', 'Bicipiti', 'Deltoidi', 'Tricipiti', 'Quadricipiti'];

  // attaccato alla dose: "25mcg dx") — per mostrarli su due righe, la dose
  // in font più piccolo, come richiesto per leggibilità.
  function splitDose(f) {
    const m = f.match(/^(.*?)\s+(\d+(?:[.,]\d+)?\s?(?:mcg|mg|g|ml)(?:\s+(?:dx|sx))?)$/i);
    return m ? { name: m[1], dose: m[2] } : { name: f, dose: '' };
  }

  const flatDoses = [];
  slots.forEach(s => {

        siteOpts: isIgf ? MUSCLE_OPTS : SITES_SC,

  const injDoneCount = flatDoses.filter(fd => day[fd.stateKey] === 'fatto').length;

  const heroCard = `
    <section style="grid-column:1 / 6;grid-row:1 / 2;border-radius:var(--r-card);background:var(--hero);padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;">

        </span>

        <div style="display:flex;gap:4px;">

            const on = dayIdx >= from && dayIdx <= to;
            return `<div style="flex:1 1 0;display:flex;flex-direction:column;gap:5px;min-width:0;">
              <div style="height:4px;border-radius:999px;background:${on ? '#fff' : 'rgba(255,255,255,.18)'};"></div>
              <span style="font-size:9px;font-weight:600;color:${on ? '#fff' : 'rgba(255,255,255,.45)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
            </div>`;

        </div>
        <div style="display:flex;flex-direction:column;gap:5px;">
          <div style="height:5px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;display:flex;">

          </div>
          <div style="display:flex;justify-content:space-between;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;">
            <span>${L.phaseDates[0]}</span><span>${cycPct}</span><span>${L.phaseDates[1]}</span>
          </div>
        </div>
      </div>
    </section>`;

  const pesoCard = `
    <section style="grid-column:6 / 13;grid-row:1 / 2;${card}padding:16px 20px;display:flex;flex-direction:column;gap:6px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="${lbl}">${L.weight}</span>
          <div style="display:flex;align-items:baseline;gap:7px;">
            <input data-f="peso" value="${esc(day.peso || '')}" placeholder="—" inputmode="decimal" style="border:none;outline:none;font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;width:112px;background:var(--surf2);border-radius:9px;padding:3px 10px;">
            <span style="font-size:13.5px;font-weight:500;color:var(--ink2);">kg</span>
            <span style="font-size:12px;font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums;margin-left:3px;">${firstP != null && lastP != null ? (lastP - firstP > 0 ? '+' : '') + nf(lastP - firstP) + ' ' + L.inPeriod : ''}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div style="display:flex;gap:2px;background:var(--surf2);border-radius:8px;padding:3px;">
            ${[7, 14, 30, 60].map(n => `<button data-range="${n}" style="border:none;cursor:pointer;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:600;background:${n === pesoRange ? 'var(--accent)' : 'transparent'};color:${n === pesoRange ? '#fff' : 'var(--ink2)'};">${n}g</button>`).join('')}

          <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${slopeD === null ? '—' : (slopeD > 0 ? '+' : '') + nf(slopeD, 2) + ' ' + L.perWeekOver(pesoRange)}</span>

  const iniezioniCard = `

              <span style="font-size:8.5px;font-weight:500;color:var(--ink2);white-space:nowrap;">${(L.slotLabels[fd.label] || fd.label).toLowerCase()}${dose ? ' · ' + esc(dose.replace(/(\d)([a-zA-Z])/, '$1 $2')) : ''}</span>

              </span>
              ${open ? `<div style="position:absolute;top:25px;right:0;z-index:20;min-width:132px;background:var(--surf);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:4px;display:flex;flex-direction:column;">
                ${fd.siteOpts.map(o => `<span data-injsite="${k}|${esc(o)}" style="padding:6px 9px;border-radius:6px;background:${o === siteVal ? 'var(--surf2)' : 'transparent'};color:var(--ink);font-size:10.5px;font-weight:${o === siteVal ? 700 : 500};cursor:pointer;white-space:nowrap;">${siteLabel(o)}</span>`).join('')}

          const s = doseLook(k);
          return `<span style="display:flex;align-items:center;gap:4px;font-size:9px;font-weight:500;color:var(--ink2);">
            <span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:${s.ink};background:${s.bg};">${s.mark}</span>${s.label}</span>`;
        }).join('')}

  const adherenceCard = `
    <section style="grid-column:7 / 13;grid-row:2 / 3;${card}padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">

      <div style="flex:1 1 auto;display:flex;align-items:center;justify-content:space-around;">
        ${RINGS.map(r => `
          <div style="display:flex;flex-direction:column;align-items:center;gap:9px;">
            <div style="position:relative;width:104px;height:104px;">
              <svg viewBox="0 0 84 84" style="width:104px;height:104px;transform:rotate(-90deg);display:block;">
                <circle cx="42" cy="42" r="34" fill="none" stroke="var(--line2)" stroke-width="8"></circle>
                <circle cx="42" cy="42" r="34" fill="none" stroke="${r.color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(213.63 * r.pct / 100).toFixed(1)} 213.63"></circle>

            </div>
            <div style="display:flex;flex-direction:column;align-items:center;">
              <span style="font-size:12.5px;font-weight:600;color:var(--ink);">${r.label}</span>
              <span style="font-size:10.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;">${r.sub}</span>
            </div>
          </div>`).join('')}
      </div>
    </section>`;

  const integratoriCard = `
    <section style="grid-column:1 / 5;grid-row:3 / 4;${card}padding:12px 15px;display:flex;flex-direction:column;gap:8px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="${lbl}">${L.supplements}</span>
        <span style="font-size:11px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;">${SUPP_FIELDS.filter(sf => suppState(day, sf) === 'fatto').length}/${SUPP_FIELDS.length}</span>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:32px;gap:6px;">
        ${SUPP_FIELDS.map(sf => {
          const st = doseLook(suppState(day, sf));
          return `<div data-suppdose="${sf}" style="display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:9px;background:var(--surf2);cursor:pointer;overflow:hidden;">
            <span style="width:19px;height:19px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:${st.ink};background:${st.bg};border:1.5px solid ${st.border};">${st.mark}</span>
            <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;">
              <span style="font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${SUPP_LABELS[sf]}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>`;

  // Allenamento — Durata/Volume/Calorie/RPE su una riga. RPE qui è lo
  // STESSO campo reale 'rpe' mostrato anche in Soggettivo (non un duplicato
  // separato: il mockup teorico aveva 'rpe_wo' distinto, ma in produzione
  // esiste un solo campo RPE, modificabile da entrambi i punti.
  const WO_FIELDS = [['Durata', 'wo_durata'], ['Volume', 'wo_volume'], ['Calorie', 'wo_kcal'], ['RPE', 'rpe']];
  const allenamentoCard = `
    <section style="grid-column:5 / 8;grid-row:3 / 4;${card}padding:12px 15px;display:flex;flex-direction:column;gap:8px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="${lbl}">${L.training}</span>
        <a href="${CFG.OLD_APP}" style="text-decoration:none;padding:4px 9px;border-radius:6px;background:${exList ? 'var(--accent-soft)' : 'var(--surf2)'};color:${exList ? 'var(--accent)' : 'var(--ink3)'};font-size:10px;font-weight:600;">${exList ? (LANG === 'it' ? 'Log Motra importato' : 'Motra log imported') : (LANG === 'it' ? 'Importa da Motra…' : 'Import from Motra…')}</a>
      </div>
      <div style="flex:0 0 auto;display:flex;align-items:center;gap:7px;">
        <span style="padding:3px 9px;border-radius:6px;background:${isOverridden ? 'var(--warn)' : 'var(--surf2)'};color:${isOverridden ? '#3d3100' : 'var(--ink2)'};font-size:10px;font-weight:700;text-transform:uppercase;">${esc(wo.type)}</span>
        <select onchange="patch(selDate,'wo_override',this.value)" style="border:1px solid var(--line);background:var(--surf);color:var(--ink2);font-size:10.5px;border-radius:6px;padding:3px 6px;flex:1 1 auto;min-width:0;">
          <option value="" ${!isOverridden ? 'selected' : ''}>${LANG === 'it' ? 'Scegli' : 'Choose'} (${defaultType})</option>
          ${overrideOpts.map(o => `<option value="${o}" ${day.wo_override === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>
      ${rest ? `<div style="font-size:12px;color:var(--ink2);">${L.restDay}</div>` : `
      <div style="flex:0 0 auto;display:flex;gap:7px;">
        ${WO_FIELDS.map(([label, key]) => `
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;">
            <input data-f="${key}" value="${esc(day[key] || '')}" placeholder="—" style="${micro}width:100%;background:var(--surf2);border-radius:6px;padding:6px;text-align:center;">
            <span style="text-align:center;font-size:9px;font-weight:500;color:var(--ink2);">${label}</span>
          </div>`).join('')}
      </div>
      <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:9.5px;font-weight:600;color:var(--ink2);">${L.exercises}</span>
        ${exList ? exList.map(e => {
          const working = (e.sets || []).filter(st => st.label !== 'W');
          const reps = working[0] ? working[0].reps : ((e.sets || [])[0] || {}).reps;
          const kg = working[0] ? working[0].kg : ((e.sets || [])[0] || {}).kg;
          return `

  const SUBJ_SCALE_KEYS = ['energia', 'recupero', 'umore', 'rpe', 'appetito', 'sonno_sogg', 'libido', 'chiarezza'];

    appetito: '#a86a00', sonno_sogg: '#3d6f9e', libido: 'var(--bad)', chiarezza: '#6d6d76'
  };

    <section style="grid-column:8 / 13;grid-row:3 / 4;${card}padding:12px 15px;display:flex;flex-direction:column;gap:7px;">

          const open = openMenu === 'cat-' + key;
          const hot = cur === 'Marcata' || cur === 'Intensa' || cur === 'Presente';
          const ink = !cur ? 'var(--ink2)' : (hot ? 'var(--bad)' : 'var(--accent-ink)');
          const bg = cur ? (hot ? 'rgba(216,30,5,.10)' : 'var(--accent-soft)') : 'transparent';
          return `<div style="display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;">
            <span style="font-size:9px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${L.subj[key]}</span>
            <span data-subjmenu="cat-${key}" style="display:flex;align-items:center;justify-content:center;height:10px;padding:5px 4px;box-sizing:content-box;border-radius:5px;background:${bg};border:1px solid ${cur ? 'transparent' : 'var(--line)'};font-size:9px;font-weight:600;color:${ink};cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cur || '—'}</span>
            ${open ? `<div style="position:absolute;bottom:100%;margin-bottom:5px;right:0;z-index:25;min-width:104px;background:var(--surf);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:4px;display:flex;flex-direction:column;">
              ${ENUM_LABELS[key].map((o, i) => `<span data-subjenum="${key}|${i}" style="padding:6px 9px;border-radius:6px;background:${i === idx ? 'var(--surf2)' : 'transparent'};color:var(--ink);font-size:10.5px;font-weight:${i === idx ? 700 : 500};cursor:pointer;white-space:nowrap;">${o}</span>`).join('')}
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </section>`;

  return `
    <div class="g-nav">${renderDayNav()}</div>
    <div class="oggi-grid" style="display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,min-content);gap:9px;">
      ${heroCard}${pesoCard}${iniezioniCard}${adherenceCard}${integratoriCard}${allenamentoCard}${soggettivoCard}
    </div>
  `;
}
function L2() { return t(); } // alias breve, usato solo dentro renderOggiFull per leggibilità

    <div class="section">
      <div class="section-label">${L.notes}</div>
      <textarea style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px;min-height:60px;background:var(--surf2);color:var(--ink)" placeholder="—" oninput="patch(selDate,'note',this.value)">${day.note || ''}</textarea>
    </div>`;

  return { hdr, biometria, biometriaChips, iniezioni, iniezioniDesktop, integratori, legend, allenamento, allenamentoDesktop, soggettivo, soggettivoDesktop, note };
}

// Vista mobile della card giorno — invariata rispetto a prima: un'unica
// day-card con tutte le sezioni impilate. Ora è solo un assemblaggio dei
// frammenti di renderOggiSections(), la logica dei campi non è duplicata.
function renderOggi() {
  const s = renderOggiSections();
  return `
  <div class="day-card">
    ${s.hdr}
    ${s.biometria}
    ${s.iniezioni}
    ${s.integratori}
    ${s.legend}
    ${s.allenamento}
    ${s.soggettivo}
    ${s.note}
  </div>
  `;
}
function bindOggi() {
  if (!MIGRATED[tab] || tab !== 'oggi' || !store.loaded) return;
  const app = document.getElementById('app');

  // Grafico peso e gauge aderenza sono SVG inline sia su mobile che su
  // desktop (portati verbatim dai due export reali) — niente più canvas
  // da ridisegnare qui, solo handler sui data-attributi delle celle
  // interattive, condivisi tra le due viste.
  //
  // Bug corretto 15/09/2026 (segnalato da iPhone, Safari e Chrome — quindi
  // WebKit, non uno specifico browser): i campi testo/numero salvavano
  // SOLO su 'onchange', che su un <input> scatta solo quando il campo
  // perde il focus. Su mobile questo non è affidabile: se l'utente scrive
  // un valore e poi cambia scheda, blocca lo schermo, o comunque non
  // "sfoca" il campo in modo pulito, onchange può non scattare mai —
  // patch() non viene mai chiamato, non c'è nulla in coda, e il pulsante
  // Salva sembra inerte perché non ha davvero nulla da salvare. Ora
  // 'oninput' (che scatta a ogni tasto premuto, sempre affidabile)
  // aggiorna silenziosamente lo stato e mette in coda il salvataggio
  // SENZA il render() completo di patch() — che ricostruirebbe il campo
  // a ogni carattere, interrompendo la digitazione. 'onchange' resta per
  // il render completo (percentuali di aderenza, ecc.) quando il campo
  // si sistema.
  app.querySelectorAll('[data-f]').forEach(el => {
    el.oninput = () => patchSilent(selDate, el.dataset.f, el.value);
    el.onchange = () => patch(selDate, el.dataset.f, el.value);
  });
  app.querySelectorAll('[data-range]').forEach(el => {
    el.onclick = () => { pesoRange = +el.dataset.range; render(); };
  });
  app.querySelectorAll('[data-week]').forEach(el => {
    el.onclick = () => jumpToWeek(+el.dataset.week);
  });
  app.querySelectorAll('[data-injdose]').forEach(el => {
    const k = +el.dataset.injdose;
    el.onclick = () => {
      // ricostruita qui invece di richiamare renderOggiFull: ci serve solo
      // la stessa lista appiattita di dosi per risalire alla stateKey di k.
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[k];
      if (fd) guardedToggle('inj-' + k, () => cycleInjState(dayIdx2, fd.n, fd.f));
    };
  });
  app.querySelectorAll('[data-injmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.injmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-injsite]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [k, site] = el.dataset.injsite.split('|');
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[+k];
      if (!fd) return;
      const siteKey = fd.isIgf ? ('inj_' + fd.n + '_distretto') : ('inj_' + fd.n + '_' + fieldKey(fd.f) + '_sito');
      const cur = getDay(selDate)[siteKey] || '';
      openMenu = null;
      patch(selDate, siteKey, cur === site ? '' : site);
    };
  });
  app.querySelectorAll('[data-suppdose]').forEach(el => {
    el.onclick = () => guardedToggle('supp-' + el.dataset.suppdose, () => cycleSuppState(el.dataset.suppdose));
  });
  app.querySelectorAll('[data-subjpip]').forEach(el => {
    el.onclick = () => {
      const [key, n] = el.dataset.subjpip.split('|');
      const cur = parseInt(getDay(selDate)[key], 10) || 0;
      patch(selDate, key, cur === +n ? 0 : +n); // ritocco sullo stesso pip azzera
    };
  });
  app.querySelectorAll('[data-subjmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.subjmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-subjenum]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [key, idx] = el.dataset.subjenum.split('|');
      openMenu = null;
      patch(selDate, key, idx);
    };
  });
}

/* Un click fuori dalle celle interattive chiude qualunque menù aperto
   (sede iniezione / valore categorico) — porting diretto dal riferimento. */
document.addEventListener('click', () => {
  if (openMenu) { openMenu = null; render(); }
});

window.addEventListener('hashchange', () => {
  tab = location.hash.replace('#', '') || 'oggi';
  render();
});

// Ridisegna quando si attraversa la soglia desktop (non ad ogni pixel di
// resize, solo quando cambia effettivamente il layout da mostrare).
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const nowDesktop = window.innerWidth >= 1024;
    if (nowDesktop !== isDesktop) { isDesktop = nowDesktop; render(); }
  }, 150);
});

document.documentElement.lang = LANG;
render();
loadBlob().then(render).catch(e => console.error('Errore caricamento dati', e));
</script>
