<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Diario Protocollo v2</title>
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<style>
  :root{
    --bg:#f4f4f6; --surf:#ffffff; --surf2:#f7f7f9; --line:#e4e4e8; --line2:#eeeef1;
    --ink:#0a0a0c; --ink2:#57575f; --ink3:#8a8a93;
    --accent:#1f5fbf; --accent-soft:#e7effc; --accent-ink:#1a4f9e;
    --hero:#0a0a0c;
    --ok:#2e9e4f; --warn:#f5c400; --warn-ink:#8a6d00; --bad:#d81e05; --idle:#b6b6be;
    --shadow:0 1px 2px rgba(10,10,14,.05), 0 8px 24px -8px rgba(10,10,14,.10);
    --shadow-lg:0 2px 4px rgba(10,10,14,.06), 0 24px 60px -20px rgba(10,10,14,.22);
    --r-card:16px;
  }
  [data-theme="dark"]{
    --bg:#000000; --surf:#131317; --surf2:#1b1b20; --line:#292930; --line2:#212127;
    --ink:#f5f5f7; --ink2:#9d9da6; --ink3:#6d6d76;
    --accent:#5b95e8; --accent-soft:#0f2340; --accent-ink:#9cc2f5;
    --hero:#131317;
    --ok:#3ecf65; --warn:#ffd426; --warn-ink:#ffd426; --bad:#ff4433; --idle:#4a4a54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  input,textarea,select,button{font:inherit;color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,140,.35);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ══ Card giorno — porting di day_card_mockup_v2.html (approvato dopo
     due iterazioni: pattern a righe uniforme, pallini di stato al posto
     delle tendine). Nessun colore nuovo: riusa le variabili sopra. ══ */
  .day-card{background:var(--surf);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;max-width:600px;}
  .day-hdr{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .day-hdr-left{display:flex;align-items:baseline;gap:10px;}
  .day-date{font-size:18px;font-weight:600;letter-spacing:-.01em;}
  .day-meta{font-size:13px;color:var(--ink2);}
  .day-badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;}
  .day-badge.overridden{background:var(--warn);color:var(--warn-ink);}
  .day-override-sel{font-size:12px;color:var(--ink2);background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;}

  .section{padding:16px 22px;}
  .section + .section{border-top:1px solid var(--line);}
  .section-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:2px;letter-spacing:.01em;text-transform:uppercase;}

  .field-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;min-height:24px;gap:12px;}
  .field-row + .field-row{border-top:1px solid var(--line);}
  .field-label{font-size:15px;color:var(--ink);font-weight:400;}
  .field-value{font-size:17px;font-weight:600;letter-spacing:-.005em;color:var(--ink);border:none;background:transparent;text-align:right;font-family:inherit;width:90px;padding:0;}
  .field-value:focus{outline:none;background:var(--accent-soft);border-radius:6px;}
  .field-value-unit{font-size:13px;color:var(--ink3);font-weight:400;margin-left:2px;}
  .field-sub{font-size:13px;color:var(--ink2);}

  .state-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:10px;}
  .state-row + .state-row{border-top:1px solid var(--line);}
  .state-name{font-size:15px;color:var(--ink);flex:1;min-width:0;}
  .state-site{font-size:11px;color:var(--ink3);background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;flex-shrink:0;max-width:120px;}
  .state-dot{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);background:var(--surf);
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .state-dot.fatto{background:var(--ok);border-color:var(--ok);color:#fff;}
  .state-dot.saltato,.state-dot.saltata{background:var(--surf);border-color:var(--warn);color:var(--warn-ink);}
  .state-dot.na{background:var(--surf2);border-color:var(--surf2);color:var(--ink3);}

  .slot-hdr{font-size:13px;font-weight:600;color:var(--ink3);padding-top:12px;padding-bottom:2px;}
  .slot-hdr:first-child{padding-top:0;}

  .legend{display:flex;gap:16px;padding:12px 22px;background:var(--surf2);font-size:11px;color:var(--ink2);align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}

  .subj-select{font-size:14px;color:var(--ink);background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;}
  .rest-msg{padding:24px 0;text-align:center;color:var(--ink2);font-size:14px;}

  /* ══ Navigazione giorno/settimana + card riepilogo — aggiunte 09/09/2026
     per portare il resto del mockup "Diario - Palette navy" approvato da
     Giorgio. Nessun colore nuovo: riusa le stesse variabili sopra. ══ */
  .oggi-top{display:flex;flex-direction:column;gap:10px;max-width:600px;margin-bottom:10px;}
  .view-toggle{display:flex;gap:2px;background:var(--surf2);border-radius:9px;padding:3px;align-self:flex-start;}
  .view-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;}
  .view-toggle button.active{background:var(--surf);color:var(--ink);box-shadow:var(--shadow);}
  .week-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .week-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;}
  .week-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-pill{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
  .day-pill.active{background:var(--accent);border-color:var(--accent);}
  .day-pill.active .day-pill-dow,.day-pill.active .day-pill-num{color:#fff;}
  .day-pill-dow{font-size:10.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;}
  .day-pill-num{font-size:14px;font-weight:600;color:var(--ink);}

  /* ══ Testata desktop — rifatta il 10/09/2026 sul mockup "Mac 1340x852":
     le 16 settimane stanno su una riga sola (nessuno scroll), "Ciclo 1" e
     il pulsante warm-up sono nella stessa riga, tutta la pagina è centrata
     invece di allargarsi bordo a bordo. Sotto i 1024px resta tutto come
     prima (verificato, non toccato). ══ */
  .page-wrap{max-width:1320px;margin:0 auto;}
  @media (min-width:1024px){
    .week-row-desktop{display:flex;align-items:center;gap:14px;}
    .cycle-label{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;}
    .week-tabs-desktop{flex:1 1 auto;display:flex;gap:5px;min-width:0;}
    .week-tabs-desktop .week-tab{flex:1 1 0;min-width:0;padding:7px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .warmup-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surf2);color:var(--ink2);font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;text-decoration:none;}
    .warmup-btn:hover{background:var(--line2);}
    .header-actions{display:flex;align-items:center;gap:10px;}
    .sync-status{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink2);white-space:nowrap;}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;}
    .sync-dot.saving{background:var(--warn);}
    .save-btn{border:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;}
  }
  .day-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--idle);}
  .day-pill-dot.has-data{background:var(--ok);}
  .day-pill-dot.is-future{background:transparent;}

  .hero-card{background:var(--hero);color:#fff;border-radius:var(--r-card);padding:20px 22px;max-width:600px;box-shadow:var(--shadow);}
  .hero-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#9d9da6;margin-bottom:10px;}
  .hero-status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  .hero-title{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:8px;letter-spacing:-.01em;}
  .hero-text{font-size:13.5px;line-height:1.55;color:#c8c8ce;}

  .weight-card{background:var(--surf);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 22px;max-width:600px;margin-top:10px;}
  .weight-card-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .weight-value-row{display:flex;align-items:baseline;gap:6px;}
  .weight-value{font-size:32px;font-weight:700;letter-spacing:-.02em;}
  .weight-unit{font-size:14px;color:var(--ink3);}
  .weight-delta{font-size:13px;font-weight:600;color:var(--ok);}
  .weight-delta.neg{color:var(--bad);}
  .weight-chart-wrap{position:relative;margin:10px 0 6px;}
  .weight-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .weight-trend-note{font-size:12px;color:var(--ink2);}
  .range-btns{display:flex;gap:2px;background:var(--surf2);border-radius:8px;padding:3px;}
  .range-btns button{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;}
  .range-btns button.active{background:var(--surf);color:var(--ink);box-shadow:var(--shadow);}

  .adherence-card{background:var(--surf);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 22px;max-width:600px;margin-top:10px;}
  .adherence-title{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;margin-bottom:14px;}
  .adherence-grid{display:flex;justify-content:space-between;gap:10px;}
  .adherence-item{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
  .adherence-ring-wrap{position:relative;width:56px;height:56px;}
  .adherence-ring-wrap canvas{position:absolute;top:0;left:0;width:56px;height:56px;}
  .adherence-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink);}
  .adherence-label{font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;}
  .adherence-sub{font-size:11px;color:var(--ink3);}

  /* ══ Layout desktop a griglia — aggiunto 10/09/2026, porta il mockup
     "Diario - Palette navy" / artboard "Mac 1340x852" approvato da Giorgio.
     Sotto i 1024px resta tutto come prima (colonna singola, verificata). ══ */
  .biometria-chips{display:none;}
  @media (min-width:1024px){
    .oggi-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:start;max-width:1280px;}
    .oggi-grid .g-nav{grid-column:1/-1;}
    .oggi-grid .g-hero{grid-column:1/6;}       /* 5/12, come nel mockup */
    .oggi-grid .g-peso{grid-column:6/13;}      /* 7/12 */
    .oggi-grid .g-iniezioni{grid-column:1/7;}  /* 6/12 */
    .oggi-grid .g-adherence{grid-column:7/13;} /* 6/12 */
    .oggi-grid .g-integratori{grid-column:1/5;}     /* 4/12 */
    .oggi-grid .g-allenamento{grid-column:5/9;}     /* 4/12 */
    .oggi-grid .g-soggettivo{grid-column:9/13;}     /* 4/12 */
    .oggi-grid .g-legend{grid-column:1/-1;}
    .oggi-grid .g-note{grid-column:1/-1;}
    /* Le card che su mobile hanno un max-width fisso per restare leggibili
       a colonna singola devono invece riempire la loro cella di griglia. */
    .oggi-grid .hero-card,.oggi-grid .weight-card,.oggi-grid .adherence-card,
    .oggi-grid .day-card,.oggi-grid .oggi-top{max-width:none;margin-top:0;height:100%;}
    .oggi-grid .oggi-top{max-width:none;}
    /* Riepilogo biometrico compatto dentro la card Peso — solo desktop,
       come nel mockup. Su mobile i dati restano editabili sopra, invariati. */
    .biometria-chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
    .biometria-chip{display:flex;flex-direction:column;gap:2px;min-width:64px;}
    .biometria-chip-label{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;}
    .biometria-chip-value{font-size:14px;font-weight:600;color:var(--ink);}
    .weight-value-input{border:none;background:transparent;font:inherit;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink);width:110px;padding:0;}
    .weight-value-input:focus{outline:none;border-bottom:1.5px solid var(--accent);}
    .chip-input{border:none;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:0 1px;text-align:center;}
    .chip-input:focus{outline:none;border-bottom-color:var(--accent);}

    /* Esercizi svolti (da motra_log) dentro Allenamento */
    .exercises-block{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);}
    .exercise-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--ink);}
    .exercise-sets{color:var(--ink2);font-weight:600;}
    .exercise-empty{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);}

    /* Densità da cruscotto — sul mockup approvato le righe sono molto più
       compatte che su mobile (dove servono target di tocco più larghi).
       Restringo solo qui, sotto i 1024px resta tutto come prima. */
    .oggi-grid .field-row{padding:6px 0;min-height:0;}
    .oggi-grid .state-row{padding:5px 0;}
    .oggi-grid .section{padding:14px 18px;}
    .oggi-grid .day-hdr{padding:14px 18px;}
    .oggi-grid .field-sub,.oggi-grid .state-name,.oggi-grid .field-label{font-size:12.5px;}
    .oggi-grid .slot-hdr{font-size:11.5px;margin-top:6px;}

    /* Iniezioni — due colonne dense come nel mockup (stesso markup, il
       flusso CSS a colonne lo spezza da solo). L'orario è inline nel nome
       della riga (.inj-time), non più un'intestazione a riga intera. */
    .oggi-grid .g-iniezioni .section{column-count:2;column-gap:20px;}
    .oggi-grid .g-iniezioni .section-label{column-span:all;}
    .oggi-grid .g-iniezioni .slot-hdr{column-span:all;}
    .oggi-grid .rest-msg{column-span:all;}
    .oggi-grid .g-iniezioni .state-row{break-inside:avoid;}
    .inj-time{font-size:10.5px;color:var(--ink3);font-weight:400;}
    .oggi-grid .state-dot{width:20px;height:20px;font-size:11px;}

    /* Integratori — stesso trattamento a 2 colonne di Iniezioni: 9 righe in
       una sola colonna erano la seconda causa principale dei 3 schermi di
       scroll che Giorgio segnalava. */
    .oggi-grid .g-integratori .section{column-count:2;column-gap:20px;}
    .oggi-grid .g-integratori .section-label{column-span:all;}
    .oggi-grid .g-integratori .state-row{break-inside:avoid;}

    /* Soggettivo — 2 colonne, non 3. Calcolo verificato: la card è 4/12
       di una griglia 1280px con gap 16px = 416px di larghezza, meno il
       padding della card (36px) = 380px utilizzabili. Con 3 colonne
       sarebbero 113px l'una — non ci sta nemmeno la sola barra (10 segmenti
       ≈128px), da qui il testo tagliato che Giorgio ha visto. Con 2 colonne
       sono 180px l'una, margine reale verificato, non a occhio. */
    .subj-grid-2{display:grid;grid-template-columns:repeat(2,1fr);column-gap:20px;}
    .subj-grid-2 .field-row{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 0;}
    .bar-row{display:flex;align-items:center;gap:8px;}
    .bar-segs{display:flex;gap:2px;}
    .bar-seg{width:11px;height:11px;border-radius:2.5px;background:var(--line);cursor:pointer;}
    .bar-seg.filled{background:var(--accent);}
    .bar-val{font-size:11.5px;color:var(--ink2);font-weight:600;min-width:26px;}
    .pill-cycle{border:none;background:var(--accent-soft);color:var(--accent-ink);font:inherit;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;cursor:pointer;}

    /* Allenamento desktop — Durata/Volume/Calorie su una riga sola invece
       di tre field-row impilate. */
    .wo-fields-row{display:flex;gap:28px;padding:8px 0 2px;}
    .wo-field{display:flex;flex-direction:column;gap:4px;}
    .wo-field-label{font-size:11px;color:var(--ink3);text-transform:uppercase;}
    .wo-field-val{display:flex;align-items:baseline;gap:4px;}
    .wo-field-val input{border:none;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--ink);width:44px;padding:0;}
    .wo-field-val input:focus{outline:none;border-bottom-color:var(--accent);}
    .wo-field-unit{font-size:11px;color:var(--ink3);}
  }
</style>
</head>
<body>

<!-- ============================================================
     Diario Protocollo · v2
     ============================================================
     Convive con index.html, NON lo sostituisce e non lo modifica.
     La vecchia app resta pienamente funzionante fino alla
     migrazione completa di tutte le sezioni.

     Regola di indipendenza:
       - nessun file condiviso fra le due app
       - stesso database, stessa riga (una sola per utente), stesso proxy
       - stessi NOMI DI CAMPO dentro quella riga: è l'unico contratto

     Consolidamento 08/09/2026: la prima stesura di questo file
     assumeva uno schema campi e un modello dati (una riga per
     giorno) che NON corrispondono alla produzione reale. Riscritto
     dopo aver verificato ogni singolo nome contro index.html e
     contro la tabella Supabase vera. Vedi MIRROR_INDEX per le
     funzioni copiate verbatim invece di re-implementate a mano —
     è la lezione appresa dall'errore precedente: dove la logica è
     delicata (slot iniezione, split settimanale), si copia, non si
     ricostruisce da un'assunzione.
     ============================================================ -->

<div id="app"></div>

<script>
/* ============================================================
   1 · CONFIG — copiare i valori da index.html (SB_URL/SB_KEY),
   non reinventarli. USER_ID è quello del Ciclo v2 (giorni p2_day_N).
   ============================================================ */
const CFG = {
  PROXY_URL: 'https://viarmvaukgwdoursfnwu.supabase.co/functions/v1/diario-proxy/rest/v1/diary',
  PROXY_KEY: 'sb_publishable_ppqlo1IbPDjWqnkw_h5wuA_WH8dCtPx',
  USER_ID: 'giorgio_proto2_2026',   // riga v2 (Ciclo attivo) — NON 'giorgio_protocollo_2026' (v1/warm-up)
  CYCLE_START: '2026-07-20',
  CYCLE_DAYS: 112,
  OLD_APP: 'index.html'
};

// MIRROR · Trasferta Bangkok (7-21 agosto 2026) — split irregolare che
// sovrascrive la mappa settimanale fissa per queste date, in getWorkout2()
// e getInjectionSlots2(). Trovata mancante il 10/09/2026 verificando contro
// index.html: senza questa, i giorni BKK venivano letti come Riposo/training
// standard da calendario, sballando sia il conteggio iniezioni (slot Post-WO
// IGF-1 presente/assente sbagliato) sia l'aderenza allenamenti per quel
// periodo — causa principale dello scarto segnalato da Giorgio (91% vs 98%).
const BKK_START = new Date('2026-08-07');
const BKK_END = new Date('2026-08-21');
function isBkkDate(d) {
  const s = new Date(BKK_START); s.setHours(0, 0, 0, 0);
  const e = new Date(BKK_END); e.setHours(0, 0, 0, 0);
  const dd = new Date(d); dd.setHours(0, 0, 0, 0);
  return dd >= s && dd <= e;
}

/* ============================================================
   2 · SCHEMA DEI CAMPI — il contratto con la vecchia app.
   Ogni chiave qui esiste già identica in index.html. Consolidamento
   08/09/2026: 'pienezza_add' e 'sonno_sogg' erano stati segnalati

/* ============================================================
   4 · DATA — Consolidamento 08/09/2026: riscritto da zero. La
   produzione NON ha una riga per giorno: la tabella `diary` ha
   UNA riga per utente, colonna `data` (jsonb) con dentro TUTTI i
   giorni come chiavi p2_day_N. Ogni scrittura deve quindi:
     1. fetch fresco dell'INTERO blob (mai lavorare su una copia
        in cache — è la stessa disciplina già in uso su index.html,
        vedi KB "near-miss" sul fetch-modify-write)
     2. merge del solo giorno cambiato dentro il blob
     3. PATCH dell'intero blob aggiornato
   ============================================================ */
const store = { blob: null, loaded: false, dirty: {}, saving: false };

function dayIdxFromISO(dateISO) {
  const start = new Date(CFG.CYCLE_START + 'T00:00:00');
  const d = new Date(dateISO + 'T00:00:00');
  return Math.round((d - start) / 86400000);
}
function dayKeyFromISO(dateISO) { return 'p2_day_' + dayIdxFromISO(dateISO); }

// Bug reale trovato il 10/09/2026: ".toISOString().slice(0,10)" converte
// SEMPRE in UTC — a mezzanotte locale in Italia (UTC+1/+2) questo fa
// scivolare la data indietro di un giorno. In Node (dove giravano i miei
// test) il fuso è UTC, quindi il bug non si vedeva mai; nel browser vero
// di Giorgio sì — è la causa dei giorni sbagliati che ha segnalato
// (pallino attivo sbagliato in renderDayNav, click su un giorno che ne
// selezionava un altro, adherence() che leggeva il record del giorno
// sbagliato ad ogni iterazione). Usare SEMPRE questa funzione per
// convertire un Date in stringa AAAA-MM-GG, mai .toISOString().
function isoLocal(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

async function loadBlob() {
  const res = await fetch(`${CFG.PROXY_URL}?user_id=eq.${CFG.USER_ID}&select=data`, {
    headers: { apikey: CFG.PROXY_KEY, Authorization: `Bearer ${CFG.PROXY_KEY}` }
  });
  if (!res.ok) throw new Error(`load ${res.status}`);
  const rows = await res.json();
  store.blob = (rows[0] && rows[0].data) || {};
  store.loaded = true;
  return store.blob;
}

function getDay(dateISO) {
  const key = dayKeyFromISO(dateISO);
  return (store.blob && store.blob[key]) || {};
}

/* Consolidamento 09/09/2026: patch() e patchPending() erano due funzioni
   scollegate — flush() legge solo da store.pending, ma patch() non lo
   popolava mai. Ogni modifica sarebbe stata persa in silenzio al primo
   salvataggio. Unite in un'unica funzione: patch() ora aggiorna sia il
   blob locale (per il render immediato) sia store.pending (l'unica
   fonte che flush() usa davvero per il merge fetch-modify-write). */
store.pending = {}; // { 'p2_day_44': { peso: '73.2', ... } }

function patch(dateISO, field, value) {
  const key = dayKeyFromISO(dateISO);
  if (!store.blob) return; // non scrivere mai prima del fetch iniziale
  if (!store.blob[key]) store.blob[key] = {};
  store.blob[key][field] = value;
  if (!store.pending[key]) store.pending[key] = {};
  store.pending[key][field] = value;
  store.dirty[key] = true;
  render();
  queueSave();
}

let saveTimer = null;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}

/* Fetch-modify-write reale: rilegge il blob dal server subito prima
   di scrivere, riapplica sopra la versione fresca solo i campi
   effettivamente pendenti (store.pending), poi fa un unico PATCH.
   Evita di sovrascrivere un cambiamento fatto nel frattempo dalla
   vecchia app o da un'altra scheda. */

async function flush() {
  const dirtyKeys = Object.keys(store.dirty);
  if (!dirtyKeys.length || store.saving) return;
  store.saving = true;
  try {
    const fresh = await loadBlob();
    dirtyKeys.forEach(key => {
      fresh[key] = Object.assign({}, fresh[key] || {}, store.pending[key] || {});
    });
    store.blob = fresh;
    const res = await fetch(`${CFG.PROXY_URL}?user_id=eq.${CFG.USER_ID}`, {
      method: 'PATCH',
      headers: {
        apikey: CFG.PROXY_KEY,
        Authorization: `Bearer ${CFG.PROXY_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ data: store.blob })
    });
    if (!res.ok) throw new Error(`save ${res.status}`);
    dirtyKeys.forEach(key => { delete store.dirty[key]; delete store.pending[key]; });
  } catch (e) {
    console.warn('salvataggio rimandato, verrà ritentato', e);
  }
  store.saving = false;
  render();
  if (Object.keys(store.dirty).length) queueSave();
}

// MIRROR · parseSonnoHours — verbatim da index.html. "5.18" = 5h18m,
// NON 5,18 ore decimali — usare SEMPRE questa funzione per il sonno,
// mai parseFloat diretto (vedi KB 26.14, bug reale già trovato e corretto).
function parseSonnoHours(raw) {
  if (raw === null || raw === undefined || raw === '') return NaN;
  const s = String(raw).trim();
  const m = s.match(/^(\d+)\.(\d{1,2})$/);
  if (!m) return parseFloat(s);
  const h = parseInt(m[1], 10);
  let mm = m[2];
  if (mm.length === 1) mm += '0';
  const mins = parseInt(mm, 10);
  if (mins >= 0 && mins <= 59) return h + mins / 60;
  return parseFloat(s);
}

// MIRROR · adherence — da index.html (getInjComplianceV2/getSuppComplianceV2/
// getWorkoutComplianceV2 unificate). Corretta il 10/09/2026 dopo una verifica
// diretta contro index.html (Giorgio ha segnalato lo scarto: v2 mostrava
// 91%/84%, index.html 98%/93% per lo stesso giorno). Due bug reali trovati:
//   1) mancavano i 2 giorni "test_proto" (18-19 luglio, dati reali già
//      presenti sotto le chiavi test_proto_0/test_proto_1, non p2_day_N) —
//      index.html li include nel calcolo cumulativo, qui erano ignorati.
//   2) il criterio "allenamento fatto" era sbagliato: controllavo solo
//      wo_durata, la produzione (getWorkoutComplianceV2) considera fatto se
//      calorie>0 OPPURE volume>0 (anche da motra_log) OPPURE RPE è un numero.
// Iterare per DATA (come fa resolveDay() in produzione), non per chiavi del
// blob, è l'unico modo per includere correttamente i giorni test_proto.
const TEST_PROTO_START = '2026-07-18'; // MIRROR — invariato rispetto a index.html
const TEST_PROTO_DAYS = 2;             // MIRROR

// MIRROR · getWorkoutVolume2 — da index.html: legge wo_volume, altrimenti
// prova a estrarre il volume dalla stringa di motra_log (es. "11,8K kg").
function getWorkoutVolume2(rec) {
  if (!rec) return null;
  if (rec.wo_volume) {
    const v = parseFloat(rec.wo_volume);
    if (!isNaN(v) && v > 0) return v;
  }
  if (rec.motra_log) {
    try {
      const m = typeof rec.motra_log === 'object' ? rec.motra_log : JSON.parse(rec.motra_log);
      if (m.volume) {
        const mm = String(m.volume).match(/([\d,\.]+)([Kk])?/);
        if (mm) {
          let val = parseFloat(mm[1].replace(',', '.'));
          if (mm[2]) val *= 1000;
          if (!isNaN(val) && val > 0) return Math.round(val);
        }
      }
    } catch (e) { /* motra_log malformato: ignora, non è un dato di volume valido */ }
  }
  return null;
}

function adherence(blob) {
  blob = blob || {};
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const testStart = new Date(TEST_PROTO_START + 'T00:00:00');
  if (today < testStart) return { inj: 0, supp: 0, wo: 0, injDone: 0, injTot: 0, suppDone: 0, suppTot: 0, woDone: 0, woTot: 0 };

  let injDone = 0, injTot = 0, suppDone = 0, suppTot = 0, woDone = 0, woTot = 0;

  for (let d = new Date(testStart); d <= today; d.setDate(d.getDate() + 1)) {
    const dateISO = isoLocal(d);
    let rec, woIdx;
    const testEnd = new Date(testStart); testEnd.setDate(testEnd.getDate() + TEST_PROTO_DAYS - 1);
    if (d >= testStart && d <= testEnd) {
      const t = Math.round((d - testStart) / 86400000);
      rec = blob['test_proto_' + t] || {};
      woIdx = t - TEST_PROTO_DAYS; // -2, -1 — stessa convenzione a indici negativi di index.html
    } else {
      const dIdx = dayIdxFromISO(dateISO);
      rec = blob['p2_day_' + dIdx] || {};
      woIdx = dIdx;
    }

    getInjectionSlots2(woIdx).forEach(s => {
      s.fields.forEach(f => {
        const v = rec['inj_' + s.n + '_' + fieldKey(f)] || '';
        if (v === 'skip' || v === 'na') return; // 'skip' = valore legacy pre-31/07, trattato come 'na'
        injTot++; if (v === 'fatto') injDone++;
      });
    });

    SUPP_FIELDS.forEach(sf => {
      if (rec[sf + '_skip']) return;
      suppTot++; if (rec[sf] === '1') suppDone++;
    });

    if (getWorkout2(woIdx).type !== 'Riposo') {
      woTot++;
      const kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe);
      const vol = getWorkoutVolume2(rec);
      if ((!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe)) woDone++;
    }
  }

  return {
    inj: injTot ? Math.round(injDone / injTot * 100) : 0,
    supp: suppTot ? Math.round(suppDone / suppTot * 100) : 0,
    wo: woTot ? Math.round(woDone / woTot * 100) : 0,
    injDone, injTot, suppDone, suppTot, woDone, woTot
  };
}

// MIRROR · verdict — da index.html
function verdict(a) {
  if (!a.injTot) return { tone: 'neutral', key: 'noData' };
  if (a.inj >= 90 && a.wo >= 90 && a.supp >= 85) return { tone: 'good', key: 'onTrack' };
  if (a.wo < 75) return { tone: 'bad', key: 'trainingGaps' };
  return { tone: 'warn', key: 'someGaps' };
}

// esc/nf/svgPath/svgTrend/doseLook — porting diretto dal codice reale
// generato da Claude Design (produzione/v2.html), adattati solo dove i nomi
// di campo o gli stati differiscono dallo schema reale già verificato.
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '—' : Number(v).toFixed(d).replace('.', ',');
function svgPath(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  if (v.length < 2) return { d: '', area: '', lastX: 0, lastY: h / 2 };
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  const pts = v.map((x, i) => [(i / (v.length - 1)) * w, pad + (1 - (x - mn) / sp) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return { d, area: d + ` L${last[0].toFixed(1)} ${h} L0 ${h} Z`, lastX: last[0], lastY: last[1] };
}
function svgTrend(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  const n = v.length;
  if (n < 3) return '';
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  v.forEach((y, i) => { sx += i; sy += y; sxy += i * y; sxx += i * i; });
  const m = (n * sxy - sx * sy) / (n * sxx - sx * sx), b = (sy - m * sx) / n;
  const yAt = i => pad + (1 - ((m * i + b) - mn) / sp) * (h - pad * 2);
  return `M0 ${yAt(0).toFixed(1)} L${w} ${yAt(n - 1).toFixed(1)}`;
}
// doseLook — stessa idea del riferimento, ma sui 4 stati REALI
// (''/fatto/saltata/na), non su quelli d'esempio ('','done','skip','na').
function doseLook(v) {
  const L = t();
  return {
    '':        { bg: 'transparent',  border: 'var(--idle)', mark: '',  ink: 'var(--ink2)', label: '' },
    'fatto':   { bg: 'var(--ok)',    border: 'var(--ok)',   mark: '✓', ink: '#fff',        label: L.doseDone },
    'saltata': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: '#3d3100',     label: L.doseSkip },
    'saltato': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: '#3d3100',     label: L.doseSkip },
    'na':      { bg: 'var(--surf2)', border: 'var(--surf2)',mark: 'N', ink: 'var(--ink3)', label: L.doseNa }
  }[v || ''];
}

function stateDot(state, onclick, label) {

  const glyph = state === 'fatto' ? '✓' : (state === 'saltata' || state === 'saltato') ? '–' : state === 'na' ? 'N' : '';

/* ------------------------------------------------------------
   Storico peso + trend — nuovo (09/09/2026), nessun equivalente in
   index.html da copiare verbatim (funzione non-MIRROR, prima stesura).
   ------------------------------------------------------------ */
function weightHistory(days, anchorISO) {
  const dIdx = dayIdxFromISO(anchorISO);
  const from = Math.max(0, dIdx - days + 1);
  const arr = [];
  for (let i = from; i <= dIdx; i++) {
    const rec = (store.blob && store.blob['p2_day_' + i]) || {};
    const v = parseFloat(rec.peso);
    arr.push(isNaN(v) ? null : v);
  }
  return arr;
}
// Regressione lineare semplice sui punti non nulli; ritorna kg/settimana
// (slope giornaliero * 7), o null se meno di 2 punti validi.
function weeklyTrend(values) {
  const pts = values.map((v, i) => ({ x: i, y: v })).filter(p => p.y !== null);
  if (pts.length < 2) return null;
  const n = pts.length;
  const sx = pts.reduce((s, p) => s + p.x, 0), sy = pts.reduce((s, p) => s + p.y, 0);
  const sxx = pts.reduce((s, p) => s + p.x * p.x, 0), sxy = pts.reduce((s, p) => s + p.x * p.y, 0);
  const denom = (n * sxx - sx * sx) || 1;
  const slope = (n * sxy - sx * sy) / denom;
  return slope * 7;
}

// MIRROR · drawComplianceRing — verbatim da index.html (riga 6183).
function drawComplianceRing(canvasId, pct, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 56 * dpr; canvas.height = 56 * dpr;
  ctx.scale(dpr, dpr);
  const cx = 28, cy = 28, r = 22, C = 2 * Math.PI * r;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#e8e8ed'; ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2);
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
}

// Grafico peso — adattato da drawChart (index.html riga 2203): stessa
// tecnica (fill a gradiente + linea + puntino), ma senza l'etichetta
// fluttuante sull'ultimo punto (il numero grande è già mostrato sopra
// il grafico nella nuova card).
function drawWeightChart(id, data, color) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width || 300, H = 70;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  const pts = data.filter(v => v !== null);
  if (pts.length < 2) {
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#aeaeb2'; ctx.fillText('Dati insufficienti', 8, 36);
    return;
  }
  const TOP_PAD = 8, BOTTOM_PAD = 8;
  const mn = Math.min(...pts) * 0.997, mx = Math.max(...pts) * 1.003, rng = mx - mn || 1;
  const valid = data.map((v, i) => v !== null ? {
    x: i / (data.length - 1) * (W - 8) + 4,
    y: H - BOTTOM_PAD - ((v - mn) / rng) * (H - TOP_PAD - BOTTOM_PAD), v
  } : null);
  ctx.beginPath(); let st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  const lp = valid.filter(Boolean).pop(), fp = valid.filter(Boolean)[0];
  if (lp && fp) {
    ctx.lineTo(lp.x, H); ctx.lineTo(fp.x, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, color + '28'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.beginPath(); st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  if (lp) { ctx.beginPath(); ctx.arc(lp.x, lp.y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
}

/* ------------------------------------------------------------
   Card narrativa — PRIMA STESURA, non-MIRROR (nessun testo simile
   esiste già in index.html da copiare). Regole/soglie scelte qui
   sono un punto di partenza ragionevole, NON ancora approvate da
   Giorgio nei dettagli — da rivedere con lui alla prima occasione
   utile, in particolare: soglie "segnale da tenere d'occhio" e
   soglia di "HRV fermo" (±1ms/settimana).
   ------------------------------------------------------------ */
function buildHeroNarrative(a, wTrend, hrvTrend) {
  const signals = [];
  if (a.inj < 90) signals.push('iniezioni');
  if (a.supp < 85) signals.push('integratori');
  if (a.wo < 85) signals.push('allenamenti');
  if (wTrend !== null && wTrend > 0.35) signals.push('peso in salita rapida');
  if (wTrend !== null && wTrend < -0.35) signals.push('peso in calo rapido');
  if (hrvTrend !== null && hrvTrend < -3) signals.push('HRV in calo');

  const tone = signals.length === 0 ? 'good' : signals.length <= 2 ? 'warn' : 'bad';
  const title = tone === 'good'
    ? 'Il ciclo tiene, tutto sotto controllo.'
    : `Il ciclo tiene, con ${signals.length} segnal${signals.length === 1 ? 'e' : 'i'} da tenere d'occhio.`;

  const wTrendTxt = wTrend === null ? 'il peso (dati insufficienti)'
    : `il peso, che ${wTrend > 0.05 ? 'sale' : wTrend < -0.05 ? 'scende' : 'resta stabile'} di ${Math.abs(wTrend).toFixed(2)} kg a settimana`;
  const hrvTxt = hrvTrend === null ? 'HRV (dati insufficienti)'
    : `l'HRV è ${Math.abs(hrvTrend) < 1 ? 'fermo' : hrvTrend > 0 ? 'in salita' : 'in calo'}`;

  const text = `Reggono l'aderenza alle iniezioni (${a.inj}%), ${wTrendTxt} e gli allenamenti (${a.wo}%). Gli integratori sono al ${a.supp}% e ${hrvTxt}.`;
  return { title, text, tone };
}

        <div class="adherence-item">
          <div class="adherence-ring-wrap"><canvas id="ring-supp"></canvas><span class="adherence-pct">${a.supp}%</span></div>

          <div class="adherence-ring-wrap"><canvas id="ring-wo"></canvas><span class="adherence-pct">${a.wo}%</span></div>

  if (!isDesktop) {
    // Mobile — invariato: nav, poi le tre card, poi l'unica day-card con
    // tutte le sezioni impilate (renderOggi() la assembla da renderOggiSections()).
    return `
      ${renderDayNav()}

      ${pesoHtml}
      ${adherenceHtml}
      <div style="margin-top:10px">${renderOggi()}</div>

  }

  // ============================================================
  // Desktop — PORTATO da produzione/v2.html generato da Claude Design
  // (markup, griglia, padding, colori, SVG presi verbatim). Sostituiti
  // solo i nomi di campo: quel file usava uno schema teorico mai
  // riconciliato con la produzione (pa/sonno/rem/prof/risv/durata/
  // volume/kcal/inj[] array) — qui sotto ogni valore legge/scrive i
  // campi VERI già verificati in questa conversazione con dati reali.
  // ============================================================
  const v = verdict(a);
  const VD = {
    good:    { dot: 'var(--ok)',   label: 'in linea' },
    warn:    { dot: 'var(--warn)', label: "da tenere d'occhio" },
    bad:     { dot: 'var(--bad)',  label: 'sotto target' },

  }[v.tone];
  const VD_TEXT = {
    onTrack:      ['Il ciclo procede in linea.', `Iniezioni al ${a.inj}%, allenamenti al ${a.wo}%, integratori all'${a.supp}%. Nessuno dei tre scende sotto la soglia.`],
    someGaps:     ['Qualche buco, niente di strutturale.', `Iniezioni al ${a.inj}%, integratori all'${a.supp}%. Gli allenamenti restano al ${a.wo}%.`],
    trainingGaps: ['Gli allenamenti sono il punto debole.', `Sedute al ${a.wo}%: ${a.woTot - a.woDone} salti su ${a.woTot} previste. Iniezioni al ${a.inj}%.`],
    noData:       ['Nessun dato ancora registrato.', 'Compila il primo giorno per vedere la sintesi.']
  }[v.key];

  const cycPct = Math.round((dayIdx + 1) / CFG.CYCLE_DAYS * 100) + '%';
  const PHASES = [
    ['Fase 1 · adattamento', 0, 27], ['Fase 2 · costruzione', 28, 55],
    ['Fase 3 · peak', 56, 83], ['Fase 4 · mantenimento', 84, 111]
  ];

  const pesoS = weightHistory(pesoRange, selDate);
  const pl = svgPath(pesoS, 560, 120, 12);
  const slopeD = weeklyTrend(pesoS);
  const firstP = pesoS.find(x => x != null);
  const lastP = [...pesoS].reverse().find(x => x != null);

  const card = 'border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);';
  const lbl = 'font-size:11px;font-weight:600;color:var(--ink2);';
  const micro = 'border:none;outline:none;font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;';

  // 7 indicatori sulla card peso — Pressione e Sonno hanno due sotto-campi
  // reali, gli altri sono 1:1. Ogni cella resta un editor diretto (patch).
  const bpTile = `
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
      <span style="font-size:9px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Pressione</span>
      <div style="display:flex;align-items:center;justify-content:center;gap:2px;background:var(--surf2);border-radius:6px;padding:5px 4px;">
        <input data-f="bp_sys" value="${esc(day.bp_sys || '')}" placeholder="—" style="${micro}width:26px;background:transparent;text-align:right;">
        <span style="${micro}">/</span>
        <input data-f="bp_dia" value="${esc(day.bp_dia || '')}" placeholder="—" style="${micro}width:26px;background:transparent;text-align:left;">
      </div>
    </div>`;
  const sonnoTot = parseSonnoHours(day.ore_sonno);
  const sonnoShort = isNaN(sonnoTot) ? '' : Math.floor(sonnoTot) + 'h' + Math.round((sonnoTot % 1) * 60);
  const sonnoTile = `
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
      <span style="font-size:9px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">Sonno</span>
      <input data-f="ore_sonno" value="${esc(day.ore_sonno || '')}" placeholder="5.18" style="${micro}width:100%;min-width:0;background:var(--surf2);border-radius:6px;padding:5px 6px;text-align:center;" title="${sonnoShort}">
    </div>`;
  const simpleTile = (label, field) => `
    <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
      <span style="font-size:9px;font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
      <input data-f="${field}" value="${esc(day[field] || '')}" placeholder="—" style="${micro}width:100%;min-width:0;background:var(--surf2);border-radius:6px;padding:5px 6px;text-align:center;">
    </div>`;
  const TILES_HTML = [
    simpleTile('HRV', 'hrv'), simpleTile(LANG === 'it' ? 'Freq. riposo' : 'Resting HR', 'rhr'), bpTile, sonnoTile,
    simpleTile('REM', 'sonno_rem_min'), simpleTile('Profondo', 'sonno_profondo_min'), simpleTile('Risvegli', 'sonno_risvegli')
  ];

  const RINGS = [
    { label: 'Iniezioni',            pct: a.inj,  sub: `${a.injDone}/${a.injTot}`,   color: 'var(--accent)' },
    { label: L.supplements,          pct: a.supp, sub: `${a.suppDone}/${a.suppTot}`, color: 'var(--ok)' },
    { label: L.training,             pct: a.wo,   sub: `${a.woDone}/${a.woTot}`,     color: 'var(--warn)' }
  ];

  // Iniezioni — appiattite in un'unica lista di righe (come nel mockup: non
  // raggruppate per fascia oraria, l'orario è solo sottotitolo), ma le
  // chiavi di stato/sede sono quelle VERE (inj_{slotN}_{campo}[_sito]).
  // MUSCLE_OPTS per gli slot IM (solo IGF-1 DES) — stessi 5 gruppi già
  // usati altrove in questa conversazione per il distretto post-WO.
  const MUSCLE_OPTS = ['Petto', 'Bicipiti', 'Deltoidi', 'Tricipiti', 'Quadricipiti'];
  const flatDoses = [];
  slots.forEach(s => {
    const isIgf = s.igfMuscle !== undefined;
    s.fields.forEach(f => {
      flatDoses.push({
        label: s.label, name: f, via: isIgf ? 'IM' : 'SC', isIgf,
        stateKey: 'inj_' + s.n + '_' + fieldKey(f),
        siteKey: isIgf ? ('inj_' + s.n + '_distretto') : ('inj_' + s.n + '_' + fieldKey(f) + '_sito'),
        siteOpts: isIgf ? MUSCLE_OPTS : SITES_SC,
        siteLabelFn: opt => opt // entrambe le liste sono già in italiano leggibile
      });
    });
  });
  const injDoneCount = flatDoses.filter(fd => day[fd.stateKey] === 'fatto').length;

  const heroCard = `
    <section style="grid-column:1 / 6;grid-row:1 / 2;border-radius:var(--r-card);background:var(--hero);padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;">
      <div style="display:flex;flex-direction:column;gap:9px;">
        <span style="display:flex;align-items:center;gap:8px;font-size:11px;font-weight:600;color:rgba(255,255,255,.62);">
          <span style="width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:${VD.dot};"></span>
          ${VD.label} · ${L.day} ${dayIdx + 1} / ${CFG.CYCLE_DAYS}
        </span>
        <span style="font-size:24px;line-height:1.13;letter-spacing:-.024em;font-weight:600;color:#fff;text-wrap:pretty;">${esc(VD_TEXT[0])}</span>
      </div>
      <span style="font-size:12.5px;line-height:1.5;color:rgba(255,255,255,.86);text-wrap:pretty;">${esc(VD_TEXT[1])}</span>
      <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:7px;justify-content:flex-end;">
        <div style="display:flex;gap:4px;">
          ${PHASES.map(([label, from, to]) => {
            const on = dayIdx >= from && dayIdx <= to;
            return `<div style="flex:1 1 0;display:flex;flex-direction:column;gap:5px;min-width:0;">
              <div style="height:4px;border-radius:999px;background:${on ? '#fff' : 'rgba(255,255,255,.18)'};"></div>
              <span style="font-size:9px;font-weight:600;color:${on ? '#fff' : 'rgba(255,255,255,.45)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
            </div>`;
          }).join('')}
        </div>
        <div style="display:flex;flex-direction:column;gap:5px;">
          <div style="height:5px;border-radius:999px;background:rgba(255,255,255,.16);overflow:hidden;display:flex;">
            <div style="width:${cycPct};background:#fff;border-radius:999px;"></div>
          </div>
          <div style="display:flex;justify-content:space-between;font-size:9.5px;font-weight:600;color:rgba(255,255,255,.7);font-variant-numeric:tabular-nums;">
            <span>20 LUG</span><span>${cycPct}</span><span>8 NOV</span>
          </div>
        </div>
      </div>
    </section>`;

  const pesoCard = `
    <section style="grid-column:6 / 13;grid-row:1 / 2;${card}padding:16px 20px;display:flex;flex-direction:column;gap:6px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;">
        <div style="display:flex;flex-direction:column;gap:3px;">
          <span style="${lbl}">${L.weight}</span>
          <div style="display:flex;align-items:baseline;gap:7px;">
            <input data-f="peso" value="${esc(day.peso || '')}" placeholder="—" inputmode="decimal" style="border:none;outline:none;font-size:34px;line-height:1.05;letter-spacing:-.03em;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;width:112px;background:var(--surf2);border-radius:9px;padding:3px 10px;">
            <span style="font-size:13.5px;font-weight:500;color:var(--ink2);">kg</span>
            <span style="font-size:12px;font-weight:600;color:var(--ok);font-variant-numeric:tabular-nums;margin-left:3px;">${firstP != null && lastP != null ? (lastP - firstP > 0 ? '+' : '') + nf(lastP - firstP) + ' nel periodo' : ''}</span>
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;">
          <div style="display:flex;gap:2px;background:var(--surf2);border-radius:8px;padding:3px;">
            ${[7, 14, 30, 60].map(n => `<button data-range="${n}" style="border:none;cursor:pointer;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:600;background:${n === pesoRange ? 'var(--accent)' : 'transparent'};color:${n === pesoRange ? '#fff' : 'var(--ink2)'};">${n}g</button>`).join('')}
          </div>
          <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${slopeD === null ? '—' : (slopeD > 0 ? '+' : '') + nf(slopeD, 2) + ' kg / sett. su ' + pesoRange + ' gg'}</span>
        </div>
      </div>
      <svg viewBox="0 0 560 120" preserveAspectRatio="none" style="flex:0 0 auto;width:100%;height:112px;display:block;overflow:visible;">
        <defs><linearGradient id="wfill" x1="0" y1="0" x2="0" y2="1">

          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"></stop>
        </linearGradient></defs>
        <line x1="0" y1="30" x2="560" y2="30" stroke="var(--line2)" stroke-width="1"></line>
        <line x1="0" y1="76" x2="560" y2="76" stroke="var(--line2)" stroke-width="1"></line>
        <path d="${pl.area}" fill="url(#wfill)"></path>
        <path d="${pl.d}" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path>
        <path d="${svgTrend(pesoS, 560, 120, 12)}" fill="none" stroke="var(--ink2)" stroke-width="1.3" stroke-dasharray="4 5" opacity="0.6"></path>
        <circle cx="${pl.lastX}" cy="${pl.lastY}" r="4" fill="var(--accent)"></circle>
      </svg>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(7,1fr);gap:10px;padding-top:9px;border-top:1px solid var(--line2);">
        ${TILES_HTML.join('')}
      </div>
    </section>`;

  const iniezioniCard = `
    <section style="grid-column:1 / 7;grid-row:2 / 3;${card}display:flex;flex-direction:column;">
      <div style="flex:0 0 auto;padding:11px 15px 7px;display:flex;align-items:baseline;justify-content:space-between;gap:12px;">
        <span style="${lbl}">${L.injections}</span>
        <div style="display:flex;gap:14px;align-items:baseline;">
          <span style="display:flex;align-items:baseline;gap:5px;font-size:9px;font-weight:500;color:var(--ink2);"><span style="font-size:8.5px;font-weight:700;color:var(--accent-ink);">SC</span>addome, spalla, gluteo</span>
          <span style="display:flex;align-items:baseline;gap:5px;font-size:9px;font-weight:500;color:var(--ink2);"><span style="font-size:8.5px;font-weight:700;color:var(--bad);">IM</span>gruppo muscolare · solo IGF-1</span>
          <span style="font-size:11px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;">${injDoneCount}/${flatDoses.length}</span>
        </div>
      </div>
      <div style="flex:1 1 auto;display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line2);">
        ${flatDoses.map((fd, k) => {
          const st = doseLook(day[fd.stateKey]);
          const siteVal = day[fd.siteKey] || (fd.isIgf ? '' : '');
          const hasSite = !!siteVal;
          const open = openMenu === 'site-' + k;
          return `
          <div style="min-height:34px;display:flex;align-items:center;gap:9px;padding:3px 15px;border-bottom:1px solid var(--line2);">
            <span data-injdose="${k}" style="width:18px;height:18px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:${st.ink};background:${st.bg};border:1.5px solid ${st.border};cursor:pointer;">${st.mark}</span>
            <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;">
              <span style="font-size:11px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(fd.name)}</span>
              <span style="font-size:8.5px;font-weight:500;color:var(--ink2);white-space:nowrap;">${fd.label}</span>
            </div>
            <span style="flex:0 0 18px;font-size:8.5px;font-weight:700;color:${fd.via === 'IM' ? 'var(--bad)' : 'var(--accent-ink)'};">${fd.via}</span>
            <div style="flex:0 0 116px;position:relative;">
              <span data-injmenu="site-${k}" style="display:flex;align-items:center;justify-content:space-between;gap:5px;height:22px;padding:0 8px;border-radius:6px;background:${hasSite ? 'var(--accent-soft)' : 'transparent'};border:1px solid ${hasSite ? 'transparent' : 'var(--line)'};cursor:pointer;">
                <span style="font-size:9.5px;font-weight:600;color:${hasSite ? 'var(--accent-ink)' : 'var(--ink2)'};white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${hasSite ? siteVal : L.choose}</span>

                ${fd.siteOpts.map(o => `<span data-injsite="${k}|${esc(o)}" style="padding:6px 9px;border-radius:6px;background:${o === siteVal ? 'var(--surf2)' : 'transparent'};color:var(--ink);font-size:10.5px;font-weight:${o === siteVal ? 700 : 500};cursor:pointer;white-space:nowrap;">${o}</span>`).join('')}

      <div style="flex:0 0 auto;display:flex;gap:10px;flex-wrap:wrap;padding:6px 15px;border-top:1px solid var(--line2);">
        ${['fatto', 'saltata', 'na'].map(k => {
          const s = doseLook(k);
          return `<span style="display:flex;align-items:center;gap:4px;font-size:9px;font-weight:500;color:var(--ink2);">
            <span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:${s.ink};background:${s.bg};">${s.mark}</span>${s.label}</span>`;
        }).join('')}
      </div>
    </section>`;

  const adherenceCard = `
    <section style="grid-column:7 / 13;grid-row:2 / 3;${card}padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <span style="flex:0 0 auto;${lbl}">${L.adherence}</span>
      <div style="flex:1 1 auto;display:flex;align-items:center;justify-content:space-around;">
        ${RINGS.map(r => `
          <div style="display:flex;flex-direction:column;align-items:center;gap:9px;">
            <div style="position:relative;width:104px;height:104px;">
              <svg viewBox="0 0 84 84" style="width:104px;height:104px;transform:rotate(-90deg);display:block;">
                <circle cx="42" cy="42" r="34" fill="none" stroke="var(--line2)" stroke-width="8"></circle>
                <circle cx="42" cy="42" r="34" fill="none" stroke="${r.color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(213.63 * r.pct / 100).toFixed(1)} 213.63"></circle>

              <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:21px;font-weight:600;color:var(--ink);letter-spacing:-.024em;font-variant-numeric:tabular-nums;">${r.pct}%</div>
            </div>
            <div style="display:flex;flex-direction:column;align-items:center;">

  const integratoriCard = `
    <section style="grid-column:1 / 5;grid-row:3 / 4;${card}padding:12px 15px;display:flex;flex-direction:column;gap:8px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">

        <span style="font-size:11px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums;">${SUPP_FIELDS.filter(sf => suppState(day, sf) === 'fatto').length}/${SUPP_FIELDS.length}</span>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:32px;gap:6px;">
        ${SUPP_FIELDS.map(sf => {
          const st = doseLook(suppState(day, sf));
          return `<div data-suppdose="${sf}" style="display:flex;align-items:center;gap:8px;padding:0 9px;border-radius:9px;background:var(--surf2);cursor:pointer;overflow:hidden;">
            <span style="width:19px;height:19px;border-radius:50%;flex:0 0 auto;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700;color:${st.ink};background:${st.bg};border:1.5px solid ${st.border};">${st.mark}</span>
            <div style="flex:1 1 auto;min-width:0;display:flex;flex-direction:column;">
              <span style="font-size:11.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${SUPP_LABELS[sf]}</span>
            </div>
          </div>`;
        }).join('')}
      </div>
    </section>`;

  // Allenamento — Durata/Volume/Calorie/RPE su una riga. RPE qui è lo
  // STESSO campo reale 'rpe' mostrato anche in Soggettivo (non un duplicato
  // separato: il mockup teorico aveva 'rpe_wo' distinto, ma in produzione
  // esiste un solo campo RPE, modificabile da entrambi i punti.
  const WO_FIELDS = [['Durata', 'wo_durata'], ['Volume', 'wo_volume'], ['Calorie', 'wo_kcal'], ['RPE', 'rpe']];
  const exList = (() => {
    if (!day.motra_log) return null;
    try {
      const parsed = typeof day.motra_log === 'object' ? day.motra_log : JSON.parse(day.motra_log);
      return Array.isArray(parsed.exercises) ? parsed.exercises : null;
    } catch (e) { return null; }
  })();
  const allenamentoCard = `
    <section style="grid-column:5 / 8;grid-row:3 / 4;${card}padding:12px 15px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="${lbl}">${L.training}</span>
        <span style="padding:4px 9px;border-radius:6px;background:${exList ? 'var(--accent-soft)' : 'var(--surf2)'};color:${exList ? 'var(--accent)' : 'var(--ink3)'};font-size:10px;font-weight:600;">${exList ? 'Log Motra importato' : 'Nessun log Motra'}</span>
      </div>
      ${rest ? `<div style="font-size:12px;color:var(--ink2);">${L.restDay}</div>` : `
      <div style="flex:0 0 auto;display:flex;gap:7px;">
        ${WO_FIELDS.map(([label, key]) => `
          <div style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;gap:3px;">
            <input data-f="${key}" value="${esc(day[key] || '')}" placeholder="—" style="${micro}width:100%;background:var(--surf2);border-radius:6px;padding:6px;text-align:center;">
            <span style="text-align:center;font-size:9px;font-weight:500;color:var(--ink2);">${label}</span>
