/* D · sonno + scatter sonno→HRV del giorno dopo */
function buildSleep(root){
  var n = RANGES["sleep.main"], w = windowDays(D(), TODAY(), n);
  renderChart(chartEl(root, "sleep.hours"), {
    series: [{ type: "line", data: seriesOf(w.slice, "ore_sonno", parseSonnoHours), color: "var(--c-s1)", trend: true, label: "ore totali" }],
    options: { height: 110, xLabels: xLabelsFor(w.from, w.slice.length), xMax: w.slice.length - 1,
               loading: VIEW.loading, tooltip: true, fmtY: fmtHours, fmtTip: fmtHours }
  });
  renderChart(chartEl(root, "sleep.stages"), {
    series: [
      { type: "line", data: seriesOf(w.slice, "sonno_rem_min"), color: "var(--c-s1)", label: "REM", markExtremes: false, width: 1.8 },
      { type: "line", data: seriesOf(w.slice, "sonno_profondo_min"), color: "var(--c-s2)", label: "profondo", markExtremes: false, width: 1.8 },
      { type: "line", data: seriesOf(w.slice, "sonno_principale_min"), color: "var(--c-s3)", label: "principale", markExtremes: false, width: 1.8 },
      { type: "line", data: seriesOf(w.slice, "sonno_veglia_min"), color: "var(--c-s4)", label: "veglia", markExtremes: false, width: 1.8 }
    ],
    options: { height: 110, xLabels: xLabelsFor(w.from, w.slice.length), xMax: w.slice.length - 1,
               loading: VIEW.loading, tooltip: true, fmtY: function(v){ return Math.round(v) + "\u2032"; } }
  });
  renderChart(chartEl(root, "sleep.wakes"), {
    series: [{ type: "bar", data: seriesOf(w.slice, "sonno_risvegli"), color: "var(--c-s3)", label: "risvegli" }],
    options: { height: 68, clampZero: true, xLabels: xLabelsFor(w.from, w.slice.length), xMax: w.slice.length - 1,
               loading: VIEW.loading, fmtY: function(v){ return String(Math.round(v)); } }
  });

  /* scatter: ore di sonno del giorno i, HRV del giorno i+1 */
  var ns = RANGES["sleep.scatter"], ws = windowDays(D(), TODAY(), ns);
  var pts = [], pairs = [];
  for (var i = 0; i < ws.slice.length - 1; i++) {
    var h = parseSonnoHours(ws.slice[i] ? ws.slice[i].ore_sonno : "");
    var nx = ws.slice[i + 1];
    var hv = nx ? num(nx.hrv) : null;
    if (h != null && hv != null) { pts.push({ x: h, y: hv }); pairs.push([h, hv]); }
  }
  var pr = pearson(pairs);
  var fit = null;
  if (pts.length >= 3) {
    var mx = meanOf(pts.map(function(p){ return p.x; })), my = meanOf(pts.map(function(p){ return p.y; }));
    var sxy = 0, sxx = 0;
    pts.forEach(function(p){ sxy += (p.x - mx) * (p.y - my); sxx += (p.x - mx) * (p.x - mx); });
    var b = sxx ? sxy / sxx : 0;
    var xs = pts.map(function(p){ return p.x; });
    var x0 = Math.min.apply(null, xs), x1 = Math.max.apply(null, xs);
    fit = { x0: x0, x1: x1, y0: my + b * (x0 - mx), y1: my + b * (x1 - mx) };
  }
  var xs2 = pts.map(function(p){ return p.x; });
  renderChart(chartEl(root, "sleep.scatter"), {
    series: [{ type: "scatter", points: pts, color: "var(--c-s1)", fit: fit }],
    options: { height: 132, loading: VIEW.loading,
               xMin: xs2.length ? Math.min.apply(null, xs2) - 0.3 : 0,
               xMax: xs2.length ? Math.max.apply(null, xs2) + 0.3 : 1,
               xLabels: xs2.length ? [{ x: Math.min.apply(null, xs2), label: fmtHours(Math.min.apply(null, xs2)) },
                                      { x: Math.max.apply(null, xs2), label: fmtHours(Math.max.apply(null, xs2)) }] : [],
               fmtY: function(v){ return String(Math.round(v)); },
               emptyText: "Servono almeno due giorni consecutivi con sonno e HRV" }
  });
  setBind(root, "sleep.r", pr.r == null ? "r non calcolabile" : "r = " + it(pr.r, 2) + " · " + strengthOf(pr.r) + " · n=" + pr.n);
}

/* G · correlazioni + confronto 14 vs 14 */
function buildCorrelations(root){
  var n = RANGES["corr.main"], w = windowDays(D(), TODAY(), n);
  var rows = [
    { label: "Energia \u2194 Sonno", a: "energia", b: "ore_sonno", convB: parseSonnoHours },
    { label: "Recupero \u2194 Sonno", a: "recupero", b: "ore_sonno", convB: parseSonnoHours }
  ].map(function(cfg){
    var pairs = w.slice.map(function(d){
      return [d ? num(d[cfg.a]) : null, d ? (cfg.convB ? cfg.convB(d[cfg.b]) : num(d[cfg.b])) : null];
    });
    var pr = pearson(pairs);
    return { label: cfg.label, r: pr.r, n: pr.n };
  });
  var host = root.querySelector('[data-chart="corr.main"]');
  if (!host) return;
  host.innerHTML = "";
  rows.forEach(function(r){
    var el = document.createElement("div");
    el.className = "tbl-row";
    el.style.gridTemplateColumns = "1fr 130px 52px 78px 44px";
    var a = Math.abs(r.r || 0);
    var col = r.r == null ? "var(--ink3)" : (a < 0.3 ? "var(--ink3)" : (r.r > 0 ? "var(--ok)" : "var(--warn-ink)"));
    el.innerHTML = '<span>' + r.label + '</span>' +
      '<span style="position:relative;height:5px;border-radius:999px;background:var(--line2)">' +
        '<span style="position:absolute;top:-3px;bottom:-3px;left:50%;width:1px;background:var(--line)"></span>' +
        '<span style="position:absolute;top:0;bottom:0;left:' + (r.r >= 0 ? "50%" : (50 - a * 50).toFixed(0) + "%") +
          ';width:' + (a * 50).toFixed(0) + '%;border-radius:999px;background:' + col + '"></span></span>' +
      '<strong class="num">' + (r.r == null ? "—" : it(r.r, 2)) + '</strong>' +
      '<span class="num" style="color:' + col + ';font-weight:600">' + strengthOf(r.r) + '</span>' +
      '<span class="num">n=' + r.n + '</span>';
    host.appendChild(el);
  });

  /* 14 vs 14 precedenti: stessi campi, due finestre adiacenti */
  var h2 = root.querySelector('[data-chart="corr.delta14"]');
  if (!h2) return;
  h2.innerHTML = "";
  var t = TODAY();
  var recent = D().slice(Math.max(0, t - 13), t + 1);
  var before = D().slice(Math.max(0, t - 27), Math.max(0, t - 13));
  [["peso", "Peso", "kg", 1, null, null], ["hrv", "HRV", "ms", 0, null, "up"],
   ["rhr", "Riposo", "bpm", 0, null, "down"], ["ore_sonno", "Sonno", "", 0, parseSonnoHours, "up"],
   ["energia", "Energia", "/10", 1, null, "up"], ["wo_volume", "Volume", "kg", 0, null, "up"]].forEach(function(c){
    var a = meanOf(recent.map(function(d){ return d ? (c[4] ? c[4](d[c[0]]) : num(d[c[0]])) : null; }));
    var b = meanOf(before.map(function(d){ return d ? (c[4] ? c[4](d[c[0]]) : num(d[c[0]])) : null; }));
    var dl = (a != null && b != null) ? a - b : null;
    var better = (dl == null || c[5] == null) ? null : (c[5] === "down" ? dl < 0 : dl > 0);
    var col = (dl == null || c[5] == null) ? "var(--ink3)" : (Math.abs(dl) < 0.05 ? "var(--ink3)" : (better ? "var(--ok)" : "var(--warn-ink)"));
    var fmt = c[0] === "ore_sonno" ? fmtHours : function(v){ return it(v, c[3]); };
    var el = document.createElement("div");
    el.className = "tbl-row";
    el.style.gridTemplateColumns = "1fr 74px 74px 68px";
    el.innerHTML = '<span>' + c[1] + '</span>' +
      '<span class="num">' + (b == null ? "—" : fmt(b)) + '</span>' +
      '<strong class="num">' + (a == null ? "—" : fmt(a)) + '</strong>' +
      '<span class="num" style="color:' + col + ';font-weight:600">' +
        (dl == null ? "—" : (c[0] === "ore_sonno" ? (dl > 0 ? "+" : "\u2212") + fmtHours(Math.abs(dl)) : itSigned(dl, c[3]))) + '</span>';
    h2.appendChild(el);
  });
}

/* E/F · ALLENAMENTO ═══════════════════════════════════════ */

/* "seduta registrata" = esiste wo_volume oppure wo_durata.
   Il criterio vero lo decide il dominio: qui serve solo a
   sapere quali giorni disegnare. Marcato nel README.        */
/* PORTING: criterio reale di "seduta fatta" (calorie>0 | volume>0 | RPE presente), calcolato in AN_buildDays */
function hasSession(d){ return !!(d && d._done); }

function buildWorkout(root){
  var nv = RANGES["wo.volume"], wv = windowDays(D(), TODAY(), nv);
  var vol = seriesOf(wv.slice, "wo_volume");
  var rpe = seriesOf(wv.slice, "rpe");
  var ev = eventsFor(wv.from, wv.slice.length);
  renderChart(chartEl(root, "wo.volume"), {
    series: [{ type: "bar", data: vol, color: "var(--accent-soft)", label: "volume" }],
    options: { height: 118, clampZero: true, xLabels: xLabelsFor(wv.from, wv.slice.length),
               xMax: wv.slice.length - 1, bands: ev.bands, marks: ev.marks, loading: VIEW.loading,
               fmtY: function(v){ return it(Math.round(v / 100) / 10, 1) + "t"; } }
  });
  renderChart(chartEl(root, "wo.rpe"), {
    series: [{ type: "line", data: rpe, color: "var(--c-s3)", label: "RPE", markExtremes: false, width: 1.8 }],
    options: { height: 62, yMin: 5, yMax: 10, yTicks: 2, xLabels: xLabelsFor(wv.from, wv.slice.length),
               xMax: wv.slice.length - 1, loading: VIEW.loading, tooltip: true,
               fmtY: function(v){ return String(Math.round(v)); } }
  });

  /* distribuzione per tipo seduta */
  var nt = RANGES["wo.type"], wt = windowDays(D(), TODAY(), nt);
  var byType = {}, totS = 0;
  wt.slice.forEach(function(d){
    if (!hasSession(d)) return;
    var k = (d.wo_override || "Altro");
    if (!byType[k]) byType[k] = { n: 0, vol: 0 };
    byType[k].n++;
    byType[k].vol += (num(d.wo_volume) || 0);
    totS++;
  });
  var hostT = root.querySelector('[data-chart="wo.type"]');
  if (hostT) {
    hostT.innerHTML = "";
    var keys = Object.keys(byType).sort(function(a, b){ return byType[b].n - byType[a].n; });
    if (!keys.length) hostT.innerHTML = '<div class="chart-state">Nessuna seduta in questo intervallo</div>';
    var mx = keys.length ? byType[keys[0]].n : 1;
    keys.forEach(function(k, i){
      var col = ["var(--c-g1)", "var(--c-g2)", "var(--c-g3)", "var(--c-g4)", "var(--c-g5)"][i % 5];
      var el = document.createElement("div");
      el.className = "tbl-row";
      el.style.gridTemplateColumns = "1fr 1fr 50px 58px";
      el.innerHTML = '<span style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:2px;background:' + col + '"></span>' + k + '</span>' +
        '<span style="height:14px;border-radius:4px;background:var(--line2);overflow:hidden;display:block">' +
          '<span style="display:block;height:100%;width:' + (byType[k].n / mx * 100).toFixed(0) + '%;background:' + col + ';border-radius:4px"></span></span>' +
        '<strong class="num">' + byType[k].n + '</strong>' +
        '<span class="num">' + it(Math.round(byType[k].vol / 100) / 10, 1) + 't</span>';
      hostT.appendChild(el);
    });
  }
  setBind(root, "wo.sessions", totS ? totS + " sedute" : "nessuna seduta");

  /* PORTING: completamento per tipo = fatte / previste dal piano (getWorkout2), nello stesso intervallo di
     "distribuzione per tipo". Il giorno in corso non conta come saltato finché non è fatto. */
  var hostC = root.querySelector('[data-chart="wo.completion"]');
  if (hostC) {
    hostC.innerHTML = "";
    var plan = {}, extra = 0;
    wt.slice.forEach(function(d, i){
      if (!d) return;
      var idx = wt.from + i;
      if (d._planned) {
        if (idx === TODAY() && !d._done) return;
        var k = d._typeLabel;
        if (!plan[k]) plan[k] = { p: 0, f: 0 };
        plan[k].p++;
        if (d._done) plan[k].f++;
      } else if (d._done) extra++;
    });
    var keysC = Object.keys(plan).sort(function(a2, b2){ return plan[b2].p - plan[a2].p; });
    if (!keysC.length) hostC.innerHTML = '<div class="chart-state">Nessun giorno previsto in questo intervallo</div>';
    keysC.forEach(function(k, i){
      var col = ["var(--c-g1)", "var(--c-g2)", "var(--c-g3)", "var(--c-g4)", "var(--c-g5)", "var(--c-g6)"][i % 6];
      var pct = plan[k].p ? Math.round(plan[k].f / plan[k].p * 100) : 0;
      var el = document.createElement("div");
      el.style.cssText = "flex:1 1 90px;min-width:0;display:flex;flex-direction:column;gap:4px;padding:9px 11px;border-radius:10px;background:var(--surf2)";
      el.innerHTML = '<span style="font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase">' + k + '</span>' +
        '<span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums">' + plan[k].f + '/' + plan[k].p + '</span>' +
        '<span style="height:4px;border-radius:999px;background:var(--line2);overflow:hidden;display:block">' +
          '<span style="display:block;height:100%;width:' + pct + '%;background:' + col + ';border-radius:999px"></span></span>' +
        '<span data-bind="wo.completion.' + k + '" style="font-size:9.5px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums">' + pct + '% completato</span>';
      hostC.appendChild(el);
    });
    if (extra) {
      var ex = document.createElement("div");
      ex.style.cssText = "flex:1 1 90px;min-width:0;display:flex;flex-direction:column;gap:4px;padding:9px 11px;border-radius:10px;background:var(--surf2)";
      ex.innerHTML = '<span style="font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase">Fuori piano</span>' +
        '<span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums">' + extra + '</span>' +
        '<span style="font-size:9.5px;font-weight:500;color:var(--ink3)">sedute in giorni di riposo</span>';
      hostC.appendChild(ex);
    }
  }

  /* tabella riepilogo sedute */
  var nr = RANGES["wo.table"], wr = windowDays(D(), TODAY(), nr);
  var hostR = root.querySelector('[data-chart="wo.table"]');
  if (hostR) {
    hostR.innerHTML = "";
    var rowsR = [];
    wr.slice.forEach(function(d, i){ if (hasSession(d)) rowsR.push({ i: wr.from + i, d: d }); });
    rowsR.reverse();
    if (!rowsR.length) hostR.innerHTML = '<div class="chart-state">Nessuna seduta registrata</div>';
    rowsR.slice(0, 10).forEach(function(r){
      var dt = dateOfDay(r.i);
      var el = document.createElement("div");
      el.className = "tbl-row";
      el.style.gridTemplateColumns = "58px 82px 1fr 62px 48px 38px"; /* PORTING: Tipo più largo */
      el.innerHTML = '<span>' + fmtDM(dt) + '</span>' +
        '<span style="font-weight:600;color:var(--ink)">' + (r.d.wo_override || "—") + '</span>' +
        '<span>' + DOW[dowIndex(dt)] + '</span>' +
        '<strong class="num">' + (num(r.d.wo_volume) == null ? "—" : it(Math.round(num(r.d.wo_volume) / 100) / 10, 1) + "t") + '</strong>' +
        '<span class="num">' + (r.d.wo_durata ? r.d.wo_durata + "\u2032" : "—") + '</span>' +
        '<span class="num">' + (r.d.rpe || "—") + '</span>';
      hostR.appendChild(el);
    });
  }

  /* medie per fase */
  var hostP = root.querySelector('[data-chart="wo.phase"]');
  if (hostP) {
    hostP.innerHTML = "";
    var acc = 0;
    PHASES.forEach(function(p){
      var from = acc, to = acc + p.weeks * 7 - 1;
      acc = to + 1;
      var vols = [], rpes = [], cnt = 0;
      for (var i = from; i <= Math.min(to, TODAY()); i++) {
        var d = D()[i];
        if (!hasSession(d)) continue;
        cnt++;
        var v = num(d.wo_volume); if (v != null) vols.push(v);
        var rr = num(d.rpe); if (rr != null) rpes.push(rr);
      }
      var future = from > TODAY();
      var el = document.createElement("div");
      el.className = "tbl-row";
      el.style.gridTemplateColumns = "1fr 56px 62px 48px";
      el.innerHTML = '<span style="display:flex;align-items:center;gap:7px"><span style="width:8px;height:8px;border-radius:2px;background:' + p.color + '"></span>' + p.label + '</span>' +
        '<span class="num">' + (future ? "—" : cnt) + '</span>' +
        '<strong class="num">' + (vols.length ? it(Math.round(meanOf(vols) / 100) / 10, 1) + "t" : "—") + '</strong>' +
        '<span class="num">' + (rpes.length ? it(meanOf(rpes), 1) : "—") + '</span>';
      if (future) el.style.opacity = "0.45";
      hostP.appendChild(el);
    });
  }

  /* settimana tipo: media per giorno della settimana, n sempre visibile */
  var nw = RANGES["wo.week"], ww = windowDays(D(), TODAY(), nw);
  var hostW = root.querySelector('[data-chart="wo.week"]');
  if (hostW) {
    hostW.innerHTML = "";
    var buckets = [[], [], [], [], [], [], []];
    ww.slice.forEach(function(d, i){
      if (!hasSession(d)) return;
      var v = num(d.wo_volume);
      if (v != null) buckets[dowIndex(dateOfDay(ww.from + i))].push(v);
    });
    var mxw = 1;
    buckets.forEach(function(b){ var m = meanOf(b); if (m != null && m > mxw) mxw = m; });
    var wrap = document.createElement("div");
    wrap.style.cssText = "display:grid;grid-template-columns:repeat(7,1fr);gap:5px;align-items:end;height:92px";
    buckets.forEach(function(b, i){
      var m = meanOf(b);
      var col = document.createElement("div");
      col.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:3px;height:100%;justify-content:flex-end";
      col.innerHTML = '<span style="font-size:9px;font-weight:600;color:var(--ink2);font-variant-numeric:tabular-nums">' +
          (m == null ? "—" : it(Math.round(m / 100) / 10, 1)) + '</span>' +
        '<span style="width:100%;height:' + (m == null ? 3 : Math.max(6, m / mxw * 100)) + '%;border-radius:3px 3px 0 0;background:' +
          (m == null ? "var(--line2)" : "var(--accent)") + '"></span>' +
        '<span style="font-size:9.5px;font-weight:600;color:var(--ink3)">' + DOW[i] + '</span>' +
        '<span style="font-size:8.5px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums">n=' + b.length + '</span>';
      wrap.appendChild(col);
    });
    hostW.appendChild(wrap);
  }

  buildSentinels(root);
  buildGroupVolume(root);
}

/* F · sentinel lift: 19, raccolti per gruppo, gruppo espandibile */
function buildSentinels(root){
  var host = root.querySelector('[data-chart="wo.sentinels"]');
  if (!host) return;
  host.innerHTML = "";
  var t = TODAY();
  SL_GROUPS.forEach(function(g){
    var lifts = g.lifts.map(function(l){
      var last = null, first = null, sessions = 0;
      for (var i = 0; i <= t; i++) {
        var d = D()[i];
        var kg = d ? num(d["sl_" + l.id + "_kg"]) : null;
        if (kg == null) continue;
        sessions++;
        if (first == null) first = { kg: kg, i: i };
        last = { kg: kg, i: i, reps: d["sl_" + l.id + "_reps"], sets: d["sl_" + l.id + "_sets"] };
      }
      return { def: l, last: last, first: first, sessions: sessions };
    });
    var withData = lifts.filter(function(x){ return x.last; });
    var grp = document.createElement("div");
    grp.className = "grp" + (OPEN_GROUPS[g.id] ? " is-open" : "");
    grp.setAttribute("data-group", g.id);
    var head = document.createElement("button");
    head.className = "grp-head";
    head.setAttribute("type", "button");
    head.setAttribute("aria-expanded", OPEN_GROUPS[g.id] ? "true" : "false");
    head.innerHTML = '<span class="grp-caret">\u25B6</span>' +
      '<span class="grp-sw" style="background:' + g.color + '"></span>' +
      '<span class="grp-name">' + g.label + '</span>' +
      '<span class="grp-meta">' + withData.length + "/" + lifts.length + ' con dati</span>';
    head.addEventListener("click", function(){
      OPEN_GROUPS[g.id] = !OPEN_GROUPS[g.id];
      grp.classList.toggle("is-open");
      head.setAttribute("aria-expanded", OPEN_GROUPS[g.id] ? "true" : "false");
    });
    grp.appendChild(head);
    var body = document.createElement("div");
    body.className = "grp-body";
    lifts.forEach(function(x){
      var row = document.createElement("div");
      row.className = "sl-row";
      if (!x.last) {
        row.innerHTML = '<span class="sl-name">' + x.def.label + '</span>' +
          '<span class="sl-empty" style="grid-column:2 / -1">mai registrato</span>';
      } else {
        var dl = x.first ? x.last.kg - x.first.kg : null;
        var col = dl == null ? "var(--ink3)" : (dl > 0 ? "var(--ok)" : (dl < 0 ? "var(--warn-ink)" : "var(--ink3)"));
        row.innerHTML = '<span class="sl-name">' + x.def.label + '</span>' +
          '<strong class="num" style="font-size:11px">' + it(x.last.kg, 1) + ' kg</strong>' +
          '<span class="num" style="font-size:10px;color:var(--ink3)">' + (x.last.sets || "?") + "\u00d7" + (x.last.reps || "?") + '</span>' +
          '<span class="num" style="font-size:10px;font-weight:600;color:' + col + '">' + (dl == null ? "—" : itSigned(dl, 1)) + '</span>';
      }
      body.appendChild(row);
    });
    grp.appendChild(body);
    host.appendChild(grp);
  });
}

/* PORTING · F2 · volume per gruppo muscolare = muscle_volume_summary del diario V1 (stessa fonte e stessi
   numeri della vecchia Dashboard). Cumulativo: nessun selettore di intervallo. */
var V1_MUSCLE = { status: "idle", rows: null };
var MUSCLE_LABELS_IT = { shoulders: "Spalle", lats: "Dorso (lat)", chest: "Petto", triceps: "Tricipiti",
  quads: "Quadricipiti", glutes: "Glutei", traps: "Trapezi", biceps: "Bicipiti",
  hamstrings: "Femorali", calves: "Polpacci", lowerBack: "Lombari", unknown: "Altro" };
function loadV1Muscle(){
  if (V1_MUSCLE.status !== "idle") return;
  V1_MUSCLE.status = "loading";
  fetch(CFG.PROXY_URL + "?user_id=eq.giorgio_protocollo_2026&select=data-%3Emuscle_volume_summary", {
    headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY }
  }).then(function(r){ if (!r.ok) throw new Error("v1 " + r.status); return r.json(); })
    .then(function(j){ V1_MUSCLE.rows = (j[0] && j[0].muscle_volume_summary) || []; V1_MUSCLE.status = "ok"; })
    .catch(function(){ V1_MUSCLE.status = "err"; })
    .then(function(){ var r = AN_ROOT(); if (r) buildGroupVolume(r); });
}
function buildGroupVolume(root){
  var host = root.querySelector('[data-chart="wo.group"]');
  if (!host) return;
  host.innerHTML = "";
  if (V1_MUSCLE.status === "idle" || V1_MUSCLE.status === "loading") { host.innerHTML = '<div class="chart-state">Caricamento…</div>'; return; }
  if (V1_MUSCLE.status === "err" || !V1_MUSCLE.rows || !V1_MUSCLE.rows.length) { host.innerHTML = '<div class="chart-state">Riepilogo V1 non disponibile</div>'; return; }
  var rows = V1_MUSCLE.rows.filter(function(r){ return r && r.volume_kg > 0; });
  var sum = rows.reduce(function(a, r){ return a + r.volume_kg; }, 0);
  var mx = Math.max.apply(null, rows.map(function(r){ return r.volume_kg; })) || 1;
  rows.forEach(function(r){
    var el = document.createElement("div");
    el.className = "tbl-row";
    el.style.gridTemplateColumns = "96px 1fr 54px 44px";
    el.innerHTML = '<span style="font-weight:600;color:var(--ink)">' + (MUSCLE_LABELS_IT[r.muscle] || r.muscle) + '</span>' +
      '<span style="height:14px;border-radius:4px;background:var(--line2);overflow:hidden;display:block">' +
        '<span style="display:block;height:100%;width:' + (r.volume_kg / mx * 100).toFixed(0) + '%;background:var(--accent);border-radius:4px"></span></span>' +
      '<strong class="num">' + it(Math.round(r.volume_kg / 100) / 10, 1) + 't</strong>' +
      '<span class="num">' + (sum ? Math.round(r.volume_kg / sum * 100) : 0) + '%</span>';
    host.appendChild(el);
  });
}

/* H · narrativa: slot, non testo scritto nel markup */
function buildNarrative(root){

/* ══════════════════════════════════════════════════════════
   11 · ORCHESTRAZIONE
   ══════════════════════════════════════════════════════════ */
function renderAll(){
  var root = AN_ROOT();
  if (!root) return;
  buildPhases(root);
  buildKPI(root, "kpi.peso", "peso", { dec: 1, better: null, label: "peso", minPad: 0.4 }); /* PORTING: peso neutro (ricomposizione) */
  buildKpiHrv(root); /* PORTING: KPI HRV a formato misto (min–max per i giorni a intervallo) */
  buildKPI(root, "kpi.rhr", "rhr", { dec: 0, better: "down", label: "riposo", eps: 0.5, fmt: function(v){ return String(Math.round(v)); } });
  buildKPI(root, "kpi.sonno", "ore_sonno", { conv: parseSonnoHours, better: "up", label: "sonno", eps: 0.02, fmt: fmtHours });
  /* riga pressione dentro il KPI riposo */
  var wpa = windowDays(D(), TODAY(), RANGES["kpi.rhr"]);
  var sSys = statsOf(seriesOf(wpa.slice, "bp_sys")), sDia = statsOf(seriesOf(wpa.slice, "bp_dia"));
  setBind(root, "kpi.pa.value", (sSys.last == null || sDia.last == null) ? "—" : Math.round(sSys.last) + "/" + Math.round(sDia.last) + " mmHg");
  setBind(root, "kpi.pa.avg", (sSys.avg == null) ? "—" : "media " + Math.round(sSys.avg) + "/" + Math.round(sDia.avg));
  buildBio(root);

/* ── interazioni ── */
function bindUI(){
  var root = AN_ROOT();
  if (!root) return;

  /* chip di sotto-vista */
  root.querySelectorAll(".chip").forEach(function(c){
    c.addEventListener("click", function(){
      VIEW.tab = c.getAttribute("data-an-tab");
      root.querySelectorAll(".chip").forEach(function(x){ x.classList.toggle("is-active", x === c); });
      root.querySelectorAll(".view").forEach(function(v){
        v.classList.toggle("is-active", v.getAttribute("data-an-view") === VIEW.tab);
      });
      renderAll();
    });
  });

  /* selettore intervallo: uno per widget, indipendente */
  root.querySelectorAll(".range").forEach(function(r){
    var id = r.getAttribute("data-range-for");
    r.querySelectorAll("button").forEach(function(b){
      b.classList.toggle("is-active", parseInt(b.getAttribute("data-days"), 10) === RANGES[id]);
      b.addEventListener("click", function(){
        RANGES[id] = parseInt(b.getAttribute("data-days"), 10);
        r.querySelectorAll("button").forEach(function(x){ x.classList.toggle("is-active", x === b); });
        renderAll();
      });
    });
  });

  /* tema */
  var tb = root.querySelector(".app-theme");
  if (tb) tb.addEventListener("click", function(){
    VIEW.theme = VIEW.theme === "dark" ? "light" : "dark";
    root.setAttribute("data-theme", VIEW.theme);
    document.body.setAttribute("data-theme", VIEW.theme);
    tb.textContent = VIEW.theme === "dark" ? "Chiaro" : "Scuro";
    renderAll();
  });

  /* lingua: solo stato visivo, i testi restano IT in questo frame */
  root.querySelectorAll(".app-lang button").forEach(function(b){
    b.addEventListener("click", function(){
      VIEW.lang = b.getAttribute("data-lang");
      root.querySelectorAll(".app-lang button").forEach(function(x){ x.classList.toggle("is-active", x === b); });
    });
  });

  /* i grafici si ridisegnano al resize: i margini dipendono dalla
     larghezza reale, non da valori fissi */
  if (!bindUI._g) {
    bindUI._g = true;
    var rt = null;
    window.addEventListener("resize", function(){
      if (!AN_ROOT()) return;
      clearTimeout(rt);
      rt = setTimeout(renderAll, 120);
    });
    window.addEventListener("scroll", hidePop, true);
  }
}



/* ══════════════════════════════════════════════════════════
   12 · ADATTATORE DATI REALI (non fa parte del design)
   Legge SOLO da store.blob (mai scrive). Produce, per ogni giorno del ciclo, una COPIA con i campi
   del contratto più i derivati: _done, _planned, _type, _typeLabel, _filled; e normalizza:
   ore_sonno "0" → non registrato; wo_volume con fallback motra_log; wo_override = tipo reale del giorno.
   ══════════════════════════════════════════════════════════ */
function AN_ROOT(){ return document.querySelector(".an-root"); }
var AN_TYPE_LABEL = { "Allenamento BKK": "BKK" };
function AN_buildDays(){
  var idxToday = dayIdxFromISO(today);
  var len = Math.max(CYCLE.days, idxToday + 1);
  var out = [];
  for (var i = 0; i < len; i++) {
    if (i > idxToday) { out.push(null); continue; }
    var rec = (store.blob && store.blob["p2_day_" + i]) || {};
    var d = {};
    Object.keys(rec).forEach(function(k){
      if (k.indexOf("inj_") === 0 || k.indexOf("ck_") === 0 || k === "motra_log") return;
      d[k] = rec[k];
    });
    if (parseSonnoHours(rec.ore_sonno) === 0) d.ore_sonno = "";
    var vol = getWorkoutVolume2(rec);
    d.wo_volume = (vol != null) ? String(vol) : "";
    var kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe);
    d._done = (!isNaN(kcal) && kcal > 0) || (vol != null && vol > 0) || !isNaN(rpe);
    var type = getWorkout2(i).type;
    d._planned = type !== "Riposo";
    d._type = type;
    d._typeLabel = AN_TYPE_LABEL[type] || type;
    d.wo_override = d._done ? (type === "Riposo" ? "Fuori piano" : d._typeLabel) : "";
    d._filled = Object.keys(FIELDS).some(function(k){ return rec[k] !== "" && rec[k] != null; });
    out.push(d);
  }
  return out;
}

// Protezione aggiunta 17/09/2026: il ciclo a 4 stati (vuoto->fatto->
// saltata->na->vuoto) significa che 4 tocchi ravvicinati sullo stesso
// cerchietto -- anche solo un doppio tocco accidentale ripetuto due

// del 17/09, ma questa è una protezione sensata a prescindere: ignora un
// secondo click sullo stesso elemento entro 400ms dal primo.
const _lastToggleAt = {};
function guardedToggle(id, fn) {
  const now = Date.now();

  _lastToggleAt[id] = now;

}

function cycleInjState(dayIdx, slotN, fkey) {

// esc/nf/svgPath/svgTrend/doseLook — porting diretto dal codice reale
// generato da Claude Design (produzione/v2.html), adattati solo dove i nomi
// di campo o gli stati differiscono dallo schema reale già verificato.
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '—' : (LANG === 'it' ? Number(v).toFixed(d).replace('.', ',') : Number(v).toFixed(d));
function svgPath(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  if (v.length < 2) return { d: '', area: '', lastX: 0, lastY: h / 2 };
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  const pts = v.map((x, i) => [(i / (v.length - 1)) * w, pad + (1 - (x - mn) / sp) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return { d, area: d + ` L${last[0].toFixed(1)} ${h} L0 ${h} Z`, lastX: last[0], lastY: last[1] };
}
function svgTrend(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  const n = v.length;
  if (n < 3) return '';
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  v.forEach((y, i) => { sx += i; sy += y; sxy += i * y; sxx += i * i; });
  const m = (n * sxy - sx * sy) / (n * sxx - sx * sx), b = (sy - m * sx) / n;
  const yAt = i => pad + (1 - ((m * i + b) - mn) / sp) * (h - pad * 2);
  return `M0 ${yAt(0).toFixed(1)} L${w} ${yAt(n - 1).toFixed(1)}`;
}
// doseLook — stessa idea del riferimento, ma sui 4 stati REALI
// (''/fatto/saltata/na), non su quelli d'esempio ('','done','skip','na').
function doseLook(v) {
  const L = t();
  return {
    '':        { bg: 'transparent',  border: 'var(--idle)', mark: '',  ink: 'var(--ink2)', label: '' },
    'fatto':   { bg: 'var(--ok)',    border: 'var(--ok)',   mark: '✓', ink: '#fff',        label: L.doseDone },
    'saltata': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: '#3d3100',     label: L.doseSkip },
    'saltato': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: '#3d3100',     label: L.doseSkip },
    'na':      { bg: 'var(--surf2)', border: 'var(--surf2)',mark: 'N', ink: 'var(--ink3)', label: L.doseNa }
  }[v || ''];
}

function stateDot(state, onclick, label) {
  const cls = state === 'fatto' ? 'fatto' : (state === 'saltata' || state === 'saltato') ? 'saltato' : state === 'na' ? 'na' : '';
  const glyph = state === 'fatto' ? '✓' : (state === 'saltata' || state === 'saltato') ? '–' : state === 'na' ? 'N' : '';
  return `<button type="button" class="state-dot ${cls}" onclick='${onclick}' aria-label="${label}">${glyph}</button>`;

/* ------------------------------------------------------------
   Storico peso + trend — nuovo (09/09/2026), nessun equivalente in
   index.html da copiare verbatim (funzione non-MIRROR, prima stesura).
   ------------------------------------------------------------ */
function weightHistory(days, anchorISO) {
  const dIdx = dayIdxFromISO(anchorISO);
  const from = Math.max(0, dIdx - days + 1);
  const arr = [];
  for (let i = from; i <= dIdx; i++) {
    const rec = (store.blob && store.blob['p2_day_' + i]) || {};
    const v = parseFloat(rec.peso);
    arr.push(isNaN(v) ? null : v);
  }
  return arr;
}
// Regressione lineare semplice sui punti non nulli; ritorna kg/settimana
// (slope giornaliero * 7), o null se meno di 2 punti validi.
function weeklyTrend(values) {
  const pts = values.map((v, i) => ({ x: i, y: v })).filter(p => p.y !== null);
  if (pts.length < 2) return null;
  const n = pts.length;
  const sx = pts.reduce((s, p) => s + p.x, 0), sy = pts.reduce((s, p) => s + p.y, 0);
  const sxx = pts.reduce((s, p) => s + p.x * p.x, 0), sxy = pts.reduce((s, p) => s + p.x * p.y, 0);
  const denom = (n * sxx - sx * sx) || 1;
  const slope = (n * sxy - sx * sy) / denom;
  return slope * 7;
}

// MIRROR · drawComplianceRing — verbatim da index.html (riga 6183).
function drawComplianceRing(canvasId, pct, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 56 * dpr; canvas.height = 56 * dpr;
  ctx.scale(dpr, dpr);
  const cx = 28, cy = 28, r = 22, C = 2 * Math.PI * r;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#e8e8ed'; ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2);
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
}

// Grafico peso — adattato da drawChart (index.html riga 2203): stessa
// tecnica (fill a gradiente + linea + puntino), ma senza l'etichetta
// fluttuante sull'ultimo punto (il numero grande è già mostrato sopra
// il grafico nella nuova card).
function drawWeightChart(id, data, color) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width || 300, H = 70;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  const pts = data.filter(v => v !== null);
  if (pts.length < 2) {
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#aeaeb2'; ctx.fillText('Dati insufficienti', 8, 36);
    return;
  }
  const TOP_PAD = 8, BOTTOM_PAD = 8;
  const mn = Math.min(...pts) * 0.997, mx = Math.max(...pts) * 1.003, rng = mx - mn || 1;
  const valid = data.map((v, i) => v !== null ? {
    x: i / (data.length - 1) * (W - 8) + 4,
    y: H - BOTTOM_PAD - ((v - mn) / rng) * (H - TOP_PAD - BOTTOM_PAD), v
  } : null);
  ctx.beginPath(); let st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  const lp = valid.filter(Boolean).pop(), fp = valid.filter(Boolean)[0];
  if (lp && fp) {
    ctx.lineTo(lp.x, H); ctx.lineTo(fp.x, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, color + '28'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.beginPath(); st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  if (lp) { ctx.beginPath(); ctx.arc(lp.x, lp.y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
}

/* ------------------------------------------------------------
   Card narrativa — PRIMA STESURA, non-MIRROR (nessun testo simile
   esiste già in index.html da copiare). Regole/soglie scelte qui
   sono un punto di partenza ragionevole, NON ancora approvate da
   Giorgio nei dettagli — da rivedere con lui alla prima occasione
   utile, in particolare: soglie "segnale da tenere d'occhio" e
   soglia di "HRV fermo" (±1ms/settimana).
   ------------------------------------------------------------ */
function buildHeroNarrative(a, wTrend, hrvTrend) {
  const signals = [];
  if (a.inj < 90) signals.push('iniezioni');
  if (a.supp < 85) signals.push('integratori');
  if (a.wo < 85) signals.push('allenamenti');
  if (wTrend !== null && wTrend > 0.35) signals.push('peso in salita rapida');
  if (wTrend !== null && wTrend < -0.35) signals.push('peso in calo rapido');
  if (hrvTrend !== null && hrvTrend < -3) signals.push('HRV in calo');

  const tone = signals.length === 0 ? 'good' : signals.length <= 2 ? 'warn' : 'bad';
  const title = tone === 'good'
    ? 'Il ciclo tiene, tutto sotto controllo.'
    : `Il ciclo tiene, con ${signals.length} segnal${signals.length === 1 ? 'e' : 'i'} da tenere d'occhio.`;

  const wTrendTxt = wTrend === null ? 'il peso (dati insufficienti)'
    : `il peso, che ${wTrend > 0.05 ? 'sale' : wTrend < -0.05 ? 'scende' : 'resta stabile'} di ${Math.abs(wTrend).toFixed(2)} kg a settimana`;
  const hrvTxt = hrvTrend === null ? 'HRV (dati insufficienti)'
    : `l'HRV è ${Math.abs(hrvTrend) < 1 ? 'fermo' : hrvTrend > 0 ? 'in salita' : 'in calo'}`;

  const text = `Reggono l'aderenza alle iniezioni (${a.inj}%), ${wTrendTxt} e gli allenamenti (${a.wo}%). Gli integratori sono al ${a.supp}% e ${hrvTxt}.`;
  return { title, text, tone };
}

/* ------------------------------------------------------------
   Navigazione settimana/giorno — nuovo (09/09/2026). Settimane 1..16

function dayHasAnyData(dayIdx) {

  // Mobile — PORTATO VERBATIM da produzione/v2-mobile.html: intestazione
  // completamente diversa da prima (data corrente + giorno/settimana del

  // righe separate), settimane a capsula, giorni impilati con pallino 5px.
  const dowFullIt = ['Dom', 'Lun', 'Mar', 'Mer', 'Gio', 'Ven', 'Sab'];
  const dowFullEn = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const monthsIt = ['gennaio', 'febbraio', 'marzo', 'aprile', 'maggio', 'giugno', 'luglio', 'agosto', 'settembre', 'ottobre', 'novembre', 'dicembre'];
  const monthsEn = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const selD = new Date(selDate + 'T00:00:00');

  `).join('');

  const dayPillsM = Array.from({ length: 7 }, (_, i) => weekStartIdx + i).map((dIdx, i) => {
    if (dIdx < 0 || dIdx >= CFG.CYCLE_DAYS) return `<span style="flex:1 1 0;"></span>`;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dIdx);
    const iso = isoLocal(d);
    const isSel = iso === selDate;
    const isFuture = dIdx > todayIdx;
    const dotColor = isFuture ? 'var(--idle)' : (dayHasAnyData(dIdx) ? (isSel ? 'var(--accent)' : 'var(--ok)') : 'var(--idle)');
    return `
      <span onclick="selDate='${iso}'; render();" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:9px;cursor:pointer;
        background:${isSel ? 'var(--accent-soft)' : 'var(--surf)'};border:1px solid ${isSel ? 'var(--accent)' : 'var(--line)'};">
        <span style="font-size:10px;font-weight:600;color:${isSel ? 'var(--accent-ink)' : 'var(--ink)'};">${dowNames[i]}</span>
        <span style="font-size:11.5px;font-weight:600;color:${isSel ? 'var(--accent-ink)' : 'var(--ink)'};font-variant-numeric:tabular-nums;">${d.getDate()}</span>
        <span style="width:5px;height:5px;border-radius:50%;background:${dotColor};"></span>
      </span>`;
  }).join('');

  // In modalità settimana la testata mostra "Settimana N" + intervallo e
  // fase, non la data del giorno (spec README v2-settimana-mobile.html) —
  // e la strip dei 7 giorni non c'è, solo quella delle 16 settimane.
  const weekStartM = new Date(CFG.CYCLE_START + 'T00:00:00'); weekStartM.setDate(weekStartM.getDate() + weekStartIdx);
  const weekEndM = new Date(weekStartM); weekEndM.setDate(weekEndM.getDate() + 6);
  const monthsShortIt = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const monthsShortEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const monthsShort = LANG === 'it' ? monthsShortIt : monthsShortEn;
  const weekRangeM = `${weekStartM.getDate()} ${monthsShort[weekStartM.getMonth()]} – ${weekEndM.getDate()} ${monthsShort[weekEndM.getMonth()]}`;
  const PHASE_NAMES_SHORT = LANG === 'it'
    ? ['Adattamento', 'Costruzione', 'Peak', 'Mantenimento']
    : ['Adaptation', 'Build', 'Peak', 'Maintenance'];
  const phaseIdxM = weekStartIdx <= 27 ? 0 : weekStartIdx <= 55 ? 1 : weekStartIdx <= 83 ? 2 : 3;
  const titleBlockM = oggiViewMode === 'week' ? `
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
        <span style="font-size:19px;line-height:1.1;letter-spacing:-.02em;font-weight:600;color:var(--ink);white-space:nowrap;">${LANG === 'it' ? 'Settimana' : 'Week'} ${selWeek + 1}</span>
        <span style="font-size:10.5px;font-weight:600;color:var(--ink2);">${weekRangeM} · ${PHASE_NAMES_SHORT[phaseIdxM]}</span>
      </div>` : `
      <div style="display:flex;flex-direction:column;gap:1px;min-width:0;">
        <span style="font-size:19px;line-height:1.1;letter-spacing:-.02em;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${dateHeaderTxt}</span>
        <span style="font-size:10.5px;font-weight:600;color:var(--ink2);">${L.day} ${selIdx + 1} ${LANG === 'it' ? 'di' : 'of'} ${CFG.CYCLE_DAYS} · WK${selWeek + 1}</span>
      </div>`;

  return `
    <div style="flex:0 0 auto;padding:10px 18px 8px;display:flex;align-items:center;justify-content:space-between;gap:10px;">
      ${titleBlockM}
      <div style="flex:0 0 auto;display:flex;gap:3px;background:var(--surf2);border-radius:8px;padding:3px;">
        <span onclick="oggiViewMode='day'; render();" style="padding:6px 11px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;background:${oggiViewMode === 'day' ? 'var(--accent)' : 'transparent'};color:${oggiViewMode === 'day' ? '#fff' : 'var(--ink2)'};">${L.day}</span>
        <span onclick="oggiViewMode='week'; render();" style="padding:6px 11px;border-radius:6px;font-size:11.5px;font-weight:600;cursor:pointer;background:${oggiViewMode === 'week' ? 'var(--accent)' : 'transparent'};color:${oggiViewMode === 'week' ? '#fff' : 'var(--ink2)'};">${LANG === 'it' ? 'Settimana' : 'Week'}</span>
      </div>
    </div>
    <div style="flex:0 0 auto;padding:0 18px 7px;display:flex;gap:5px;overflow-x:auto;">${weekTabsM}</div>
    ${oggiViewMode === 'week' ? '' : `<div style="flex:0 0 auto;padding:0 18px 9px;display:flex;gap:4px;">${dayPillsM}</div>`}

}
function jumpToWeek(w) {
  // Porta selDate al lunedì della settimana scelta, mantenendo il giorno
  // della settimana se possibile (semplice: vai al primo giorno valido).
  const targetIdx = Math.min(Math.max(w * 7, 0), CFG.CYCLE_DAYS - 1);
  const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + targetIdx);
  selDate = isoLocal(d);
  render();
}

/* ============================================================
   VISTA SETTIMANA — nuova (14/09/2026), portata da
   produzione/v2-settimana-{desktop,mobile}.html (export reale di
   Claude Design). Sola lettura: nessun input, nessun pulsante Salva —
   ogni cella/intestazione porta al giorno in vista Giorno, che resta
   l'unico punto di scrittura (vedi README del pacchetto).
   ============================================================ */

// Righe canoniche delle iniezioni — stesse 9 dosi sempre nello stesso
// ordine, indipendentemente da come getInjectionSlots2() rinumera gli
// slot giorno per giorno (lo slot IGF inserito sposta n del gruppo Sera
// da 3 a 4). L'abbinamento avviene per (timing, nome campo), non per n.
const CANON_INJ_ROWS = [
  { timing: 'Mattino',   field: 'Fragment 176-191 250mcg' },
  { timing: 'Mattino',   field: 'BPC-157 250mcg' },
  { timing: 'Pomeriggio',field: 'Fragment 176-191 250mcg' },
  { timing: 'Post-WO',   field: 'IGF-1 DES 25mcg dx', igf: true },
  { timing: 'Post-WO',   field: 'IGF-1 DES 25mcg sx', igf: true },
  { timing: 'Sera',      field: 'Tesamorelin 2mg' },
  { timing: 'Sera',      field: 'Ipamorelin 100mcg' },
  { timing: 'Sera',      field: 'BPC-157 250mcg' },
  { timing: 'Sera',      field: 'TB-500 500mcg' },
];

// Stato di una singola dose per un giorno dato, cercando lo slot del
// timing giusto in quel giorno specifico (gli slot REALI di quel
// giorno, non un elenco fisso) e leggendo inj_{n}_{fieldKey}.
function injCellState(dayIdx, rec, row) {
  const slots = getInjectionSlots2(dayIdx);
  const slot = slots.find(s => s.label === row.timing && s.fields.includes(row.field));
  if (!slot) return { state: 'non-prevista' }; // IGF in un giorno di riposo
  const v = rec['inj_' + slot.n + '_' + fieldKey(row.field)] || '';
  return { state: v || 'vuoto' };
}

function weekAggregate(weekIdx) {
  const startIdx = weekIdx * 7;
  const todayIdx = dayIdxFromISO(today);
  const dowShort = LANG === 'it' ? ['LUN','MAR','MER','GIO','VEN','SAB','DOM'] : ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dowInitial = LANG === 'it' ? ['L','M','M','G','V','S','D'] : ['M','T','W','T','F','S','S'];

  const days = Array.from({ length: 7 }, (_, i) => {
    const dayIdx = startIdx + i;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    const dateISO = isoLocal(d);
    const rec = getDay(dateISO);
    const wo = getWorkout2(dayIdx);
    return {
      dayIdx, dateISO, date: d, rec, wo,
      isFuture: dayIdx > todayIdx,
      isRest: wo.type === 'Riposo',
      dow: dowShort[i], dowIni: dowInitial[i], num: d.getDate()
    };
  });

  const elapsed = days.filter(d => !d.isFuture).length; // 0..7
  const isClosed = elapsed === 7;
  const isFutureWeek = elapsed === 0;

  // ---- Iniezioni: 9 righe canoniche × 7 giorni ----
  const injRows = CANON_INJ_ROWS.map(row => {
    const cells = days.map(d => d.isFuture ? { state: 'futuro' } : injCellState(d.dayIdx, d.rec, row));
    const doneCount = cells.filter(c => c.state === 'fatto').length;
    const applicable = cells.filter(c => c.state !== 'non-prevista' && c.state !== 'futuro').length;
    return { row, cells, doneCount, applicable };
  });
  const injDoneTot = injRows.reduce((s, r) => s + r.doneCount, 0);
  const injApplTot = injRows.reduce((s, r) => s + r.applicable, 0);

  // ---- Integratori: 9 campi × 7 giorni ----
  const suppRows = SUPP_FIELDS.map(sf => {
    const cells = days.map(d => {
      if (d.isFuture) return { state: 'futuro' };
      if (d.rec[sf + '_skip']) return { state: 'na' };
      return { state: d.rec[sf] === '1' ? 'fatto' : 'vuoto' };
    });
    const doneCount = cells.filter(c => c.state === 'fatto').length;
    const applicable = cells.filter(c => c.state !== 'na' && c.state !== 'futuro').length;
    return { field: sf, label: SUPP_LABELS[sf], cells, doneCount, applicable };
  });
  const suppDoneTot = suppRows.reduce((s, r) => s + r.doneCount, 0);
  const suppApplTot = suppRows.reduce((s, r) => s + r.applicable, 0);

  // ---- Allenamenti della settimana ----
  const trainingDays = days.filter(d => !d.isRest);
  const woTot = trainingDays.length;
  const woDone = trainingDays.filter(d => {
    if (d.isFuture) return false;
    const kcal = parseFloat(d.rec.wo_kcal), rpe = parseFloat(d.rec.rpe);
    const vol = getWorkoutVolume2(d.rec);
    return (!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe);
  }).length;
  const sessions = trainingDays.filter(d => !d.isFuture).map(d => {
    const vol = getWorkoutVolume2(d.rec) || 0;
    const dur = parseFloat(d.rec.wo_durata) || 0;
    const rpe = d.rec.rpe !== undefined && d.rec.rpe !== '' ? parseFloat(d.rec.rpe) : null;
    return { dow: d.dow, dateISO: d.dateISO, type: d.wo.type, vol, dur, rpe, done: vol > 0 || dur > 0 || rpe !== null };
  });
  const weekVolume = sessions.reduce((s, x) => s + x.vol, 0);
  const weekDurationMin = sessions.reduce((s, x) => s + x.dur, 0);
  const weekKcal = trainingDays.filter(d => !d.isFuture).reduce((s, d) => s + (parseFloat(d.rec.wo_kcal) || 0), 0);

  // ---- Percentuali della settimana ----
  const pct = (done, tot) => tot ? Math.round(done / tot * 100) : 0;
  const injPct = pct(injDoneTot, injApplTot), suppPct = pct(suppDoneTot, suppApplTot), woPct = pct(woDone, woTot);
  const overall = Math.round((injPct + suppPct + woPct) / 3);

  // ---- Confronto con la settimana precedente (solo se non è la prima) ----
  let prevOverall = null, prevInjPct = null;
  if (weekIdx > 0) {
    const prev = weekAggregateShallow(weekIdx - 1);
    if (prev) { prevOverall = prev.overall; prevInjPct = prev.injPct; }
  }

  // ---- Categorici: 3 campi × 7 giorni ----
  const CATN = ['pienezza_add', 'ritenzione', 'formicolio'];
  const catRows = CATN.map(key => {
    const cells = days.map(d => {
      if (d.isFuture) return { val: null };
      const raw = d.rec[key];
      if (raw === '' || raw === undefined || raw === null) return { val: null };
      return { val: parseInt(raw, 10) };
    });
    return { key, cells };
  });

  // ---- Biometria + peso: serie di 7 valori ----
  const pesoArr = days.map(d => parseFloat(d.rec.peso));
  // HRV: dal 15/09/2026 alcuni giorni hanno solo hrv_min/hrv_max (intervallo),
  // non più una media vera. Per la LINEA del grafico si usa il punto medio
  // (unico modo di avere comunque un andamento), ma si traccia quali punti
  // sono stimati (hrvIsEst) così il disegno può distinguerli visivamente —
  // il punto medio non va MAI mostrato come fosse una media reale altrove.
  const hrvArr = days.map(d => {
    const lo = parseFloat(d.rec.hrv_min), hi = parseFloat(d.rec.hrv_max);
    if (!isNaN(lo) && !isNaN(hi)) return (lo + hi) / 2;
    const real = parseFloat(d.rec.hrv);
    return isNaN(real) ? NaN : real;
  });
  const hrvIsEst = days.map(d => {
    const lo = parseFloat(d.rec.hrv_min), hi = parseFloat(d.rec.hrv_max);
    return !isNaN(lo) && !isNaN(hi);
  });
  const lastHrvDay = days[days.length - 1] ? days[days.length - 1].rec : {};
  const hrvLastRangeText = (lastHrvDay.hrv_min || lastHrvDay.hrv_max)
    ? `${lastHrvDay.hrv_min || '?'}–${lastHrvDay.hrv_max || '?'}` : null;
  const sonnoArr = days.map(d => parseSonnoHours(d.rec.ore_sonno));
  const rhrArr = days.map(d => parseFloat(d.rec.rhr));
  const remArr = days.map(d => parseFloat(d.rec.sonno_rem_min));
  const profArr = days.map(d => parseFloat(d.rec.sonno_profondo_min));
  const risvArr = days.map(d => parseFloat(d.rec.sonno_risvegli));
  const avg = arr => { const v = arr.filter(x => !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

  // ---- Soggettivo: 8 medie ----
  const SUBJ_KEYS = ['energia', 'recupero', 'umore', 'rpe', 'appetito', 'sonno_sogg', 'libido', 'chiarezza'];
  const subjSeries = {};
  SUBJ_KEYS.forEach(k => { subjSeries[k] = days.map(d => d.isFuture ? NaN : parseFloat(d.rec[k])); });

  return {
    weekIdx, days, elapsed, isClosed, isFutureWeek,
    injRows, injDoneTot, injApplTot, injPct,
    suppRows, suppDoneTot, suppApplTot, suppPct,
    woTot, woDone, woPct, sessions, weekVolume, weekDurationMin, weekKcal,
    overall, prevOverall, prevInjPct,
    catRows,
    pesoArr, hrvArr, hrvIsEst, hrvLastRangeText, sonnoArr, rhrArr, remArr, profArr, risvArr, avg,
    subjSeries, dowInitial
  };
}

// Versione leggera usata solo per il confronto con la settimana precedente
// (evita di ricalcolare le 9+9+3 griglie quando servono solo le percentuali).
function weekAggregateShallow(weekIdx) {
  if (weekIdx < 0) return null;
  const startIdx = weekIdx * 7;
  const todayIdx = dayIdxFromISO(today);
  if (startIdx > todayIdx) return null; // settimana futura, nessun dato
  let injDone = 0, injTot = 0, suppDone = 0, suppTot = 0, woDone = 0, woTot = 0;
  for (let i = 0; i < 7; i++) {
    const dayIdx = startIdx + i;
    if (dayIdx > todayIdx) break;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    const rec = getDay(isoLocal(d));
    getInjectionSlots2(dayIdx).forEach(s => s.fields.forEach(f => {
      const v = rec['inj_' + s.n + '_' + fieldKey(f)] || '';
      if (v === 'na') return;
      injTot++; if (v === 'fatto') injDone++;
    }));
    SUPP_FIELDS.forEach(sf => { if (rec[sf + '_skip']) return; suppTot++; if (rec[sf] === '1') suppDone++; });
    if (getWorkout2(dayIdx).type !== 'Riposo') {
      woTot++;
      const kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe), vol = getWorkoutVolume2(rec);
      if ((!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe)) woDone++;
    }
  }
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const injPct = pct(injDone, injTot), suppPct = pct(suppDone, suppTot), woPct = pct(woDone, woTot);
  return { overall: Math.round((injPct + suppPct + woPct) / 3), injPct, suppPct, woPct };
}

/* ------------------------------------------------------------
   Vista Oggi — porting di day_card_mockup_v2.html (approvato dopo
   due iterazioni). Stesso pattern a righe per ogni sezione, stesso
   pallino di stato tappabile per iniezioni/integratori.

/* ------------------------------------------------------------
   Vista Settimana completa — desktop. Sola lettura, portata da
   produzione/v2-settimana-desktop.html. Il mobile resta da fare.

const INJ_CELL_STYLE = {
  fatto:        { bg: 'var(--ok)',    border: 'var(--ok)',   mark: '✓', ink: '#fff' },
  saltata:      { bg: 'var(--surf)',  border: 'var(--warn)', mark: '–', ink: 'var(--warn-ink)' },
  saltato:      { bg: 'var(--surf)',  border: 'var(--warn)', mark: '–', ink: 'var(--warn-ink)' },
  na:           { bg: 'var(--surf2)', border: 'var(--surf2)',mark: 'N', ink: 'var(--ink3)' },
  vuoto:        { bg: 'transparent',  border: 'var(--line)', mark: '',  ink: 'var(--ink3)' },
  'non-prevista': { bg: 'var(--surf2)', border: 'var(--surf2)', mark: '·', ink: 'var(--ink3)' },
  futuro:       { bg: 'transparent',  border: 'var(--line2)',mark: '',  ink: 'var(--ink3)' }
};
const CAT_CELL_COLORS = {
  formicolio: { 0: { bg: 'var(--line2)', ink: 'var(--ink3)' }, 1: { bg: 'var(--bad)', ink: '#fff' } },
  default: {
    0: { bg: 'var(--line2)', ink: 'var(--ink3)' },
    1: { bg: 'var(--accent-soft)', ink: 'var(--accent-ink)' },
    2: { bg: '#fdf3e4', ink: 'var(--warn-ink)' },
    3: { bg: '#fbe9e6', ink: 'var(--bad)' }
  }
};

function renderWeekFull() {
  const L = t();
  const selIdx = dayIdxFromISO(selDate);
  const weekIdx = Math.floor(selIdx / 7);
  const totalWeeks = Math.ceil(CFG.CYCLE_DAYS / 7);
  const wk = weekAggregate(weekIdx);
  const nf = (v, d = 1) => v == null || isNaN(v) ? '—' : (LANG === 'it' ? Number(v).toFixed(d).replace('.', ',') : Number(v).toFixed(d));
  const deltaTxt = (cur, prev, unit, invert) => {
    if (cur == null || isNaN(cur) || prev == null || isNaN(prev)) return null;
    const d = cur - prev;
    if (Math.abs(d) < 0.05) return { txt: '=', color: 'var(--ink3)' };
    const good = invert ? d < 0 : d > 0;
    return { txt: (d > 0 ? '+' : '') + nf(d, unit === 'int' ? 0 : 1), color: good ? 'var(--ok)' : 'var(--warn-ink)' };
  };

  const phaseIdx = wk.days[0].dayIdx <= 27 ? 0 : wk.days[0].dayIdx <= 55 ? 1 : wk.days[0].dayIdx <= 83 ? 2 : 3;
  const PHASE_NAMES = LANG === 'it' ? ['Adattamento','Costruzione','Peak','Mantenimento'] : ['Adaptation','Build','Peak','Maintenance'];
  const monthsIt = ['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];
  const monthsEn = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  const months = LANG === 'it' ? monthsIt : monthsEn;
  const rangeTxt = `${wk.days[0].num} ${months[wk.days[0].date.getMonth()]} – ${wk.days[6].num} ${months[wk.days[6].date.getMonth()]}`;

  // ---- Recap: tre varianti temporali (chiusa/in corso/futura) ----
  const cyc = adherence(store.blob);
  const cycAvg = Math.round((cyc.inj + cyc.supp + cyc.wo) / 3);
  let recapTone = 'good', recapTitle, recapText;
  if (wk.isFutureWeek) {
    recapTone = 'neutral';
    recapTitle = LANG === 'it' ? 'Settimana non ancora iniziata.' : 'Week not started yet.';
    recapText = LANG === 'it' ? `Comincia il ${rangeTxt}.` : `Starts ${rangeTxt}.`;
  } else if (!wk.isClosed) {
    recapTone = wk.overall >= 85 ? 'good' : wk.overall >= 65 ? 'warn' : 'bad';
    recapTitle = LANG === 'it' ? 'Per ora nessuno scivolone.' : 'No slip-ups so far.';
    recapText = LANG === 'it'
      ? `Nei primi ${wk.elapsed} giorni: iniezioni ${wk.injPct}%, integratori ${wk.suppPct}%, allenamenti ${wk.woPct}%. Il confronto con le settimane chiuse non regge ancora.`
      : `In the first ${wk.elapsed} days: injections ${wk.injPct}%, supplements ${wk.suppPct}%, workouts ${wk.woPct}%. Comparison with closed weeks doesn't hold yet.`;
  } else {
    recapTone = wk.overall >= 85 ? 'good' : wk.overall >= 65 ? 'warn' : 'bad';
    recapTitle = recapTone === 'good'
      ? (LANG === 'it' ? 'Settimana piena, senza scivoloni.' : 'Full week, no slip-ups.')
      : recapTone === 'warn'
      ? (LANG === 'it' ? 'Settimana con qualche buco.' : 'A few gaps this week.')
      : (LANG === 'it' ? 'Settimana sotto soglia.' : 'Week below threshold.');
    const deltaOv = wk.prevOverall != null ? wk.overall - wk.prevOverall : null;
    const deltaOvTxt = deltaOv == null ? '' : (LANG === 'it'
      ? `, ${deltaOv >= 0 ? 'sopra' : 'sotto'} la precedente di ${Math.abs(deltaOv)} punti`
      : `, ${deltaOv >= 0 ? 'above' : 'below'} the previous by ${Math.abs(deltaOv)} points`);
    recapText = LANG === 'it'
      ? `Aderenza complessiva ${wk.overall}%${deltaOvTxt}. Media del ciclo ${cycAvg}%.`
      : `Overall adherence ${wk.overall}%${deltaOvTxt}. Cycle average ${cycAvg}%.`;
  }
  const recapDot = recapTone === 'good' ? 'var(--ok)' : recapTone === 'warn' ? 'var(--warn)' : recapTone === 'bad' ? 'var(--bad)' : 'var(--idle)';
  const recapLabel = recapTone === 'good' ? (LANG === 'it' ? 'In linea' : 'On track') : recapTone === 'warn' ? (LANG === 'it' ? "Da tenere d'occhio" : 'Worth watching') : recapTone === 'bad' ? (LANG === 'it' ? 'Sotto soglia' : 'Below threshold') : (LANG === 'it' ? 'In attesa' : 'Upcoming');

  // ---- Recap: 3 mini-metriche (peso/HRV/sonno) vs settimana precedente ----
  const pesoAvgCur = wk.avg(wk.pesoArr), hrvAvgCur = wk.avg(wk.hrvArr), sonnoAvgCur = wk.avg(wk.sonnoArr);
  let pesoAvgPrev = null, hrvAvgPrev = null, sonnoAvgPrev = null;
  if (weekIdx > 0) {
    const prevWk = weekAggregate(weekIdx - 1);
    pesoAvgPrev = prevWk.avg(prevWk.pesoArr); hrvAvgPrev = prevWk.avg(prevWk.hrvArr); sonnoAvgPrev = prevWk.avg(prevWk.sonnoArr);
  }
  const sonnoFmt = v => v == null ? '—' : `${Math.floor(v)}h${String(Math.round((v % 1) * 60)).padStart(2, '0')}`;
  const miniStat = (label, val, fmtFn, prevVal, unit) => {
    const dt = deltaTxt(val, prevVal, unit);
    return `
      <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
        <span style="font-size:10px;font-weight:600;color:rgba(255,255,255,.5);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
        <div style="display:flex;align-items:baseline;gap:4px;">
          <span style="font-size:16px;font-weight:700;color:#ffffff;font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${fmtFn(val)}</span>
          ${dt ? `<span style="font-size:10.5px;font-weight:600;color:${dt.color};font-variant-numeric:tabular-nums;">${dt.txt}</span>` : ''}
        </div>
        ${weekIdx > 0 ? `<span style="font-size:9.5px;font-weight:500;color:rgba(255,255,255,.42);">vs W${weekIdx}</span>` : ''}
      </div>`;
  };

  const recapCard = `
    <div style="grid-column:1 / 6;grid-row:1 / 2;border-radius:var(--r-card);background:var(--hero);padding:20px 22px;display:flex;flex-direction:column;gap:12px;overflow:hidden;">
      <div style="display:flex;flex-direction:column;gap:9px;">
        <span style="display:flex;align-items:center;gap:8px;font-size:12px;font-weight:600;color:#9d9da6;">
          <span style="width:7px;height:7px;border-radius:50%;flex:0 0 auto;background:${recapDot};"></span>${recapLabel} · ${rangeTxt}
        </span>
        <span style="font-size:20px;line-height:1.25;letter-spacing:-.014em;font-weight:700;color:#ffffff;text-wrap:pretty;">${esc(recapTitle)}</span>
      </div>
      <span style="font-size:13.5px;line-height:1.55;color:#c8c8ce;text-wrap:pretty;">${esc(recapText)}</span>
      ${wk.isFutureWeek ? '' : `
      <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:8px;justify-content:flex-end;">
        <div style="display:flex;gap:14px;">
          ${miniStat('Peso', pesoAvgCur, v => nf(v, 1), pesoAvgPrev)}
          ${miniStat('HRV', hrvAvgCur, v => v == null ? '—' : Math.round(v), hrvAvgPrev, 'int')}
          ${miniStat('Sonno', sonnoAvgCur, sonnoFmt, sonnoAvgPrev)}
        </div>
      </div>`}
    </div>`;

  // ---- Peso della settimana + curva precedente + biometria ----
  const prevWkForChart = weekIdx > 0 ? weekAggregate(weekIdx - 1) : null;
  const plW = svgPath(wk.pesoArr, 620, 104, 12);
  const plPrev = prevWkForChart ? svgPath(prevWkForChart.pesoArr, 620, 104, 12) : null;
  const pesoValid = wk.pesoArr.filter(v => !isNaN(v));
  const pesoMin = pesoValid.length ? Math.min(...pesoValid) : null, pesoMax = pesoValid.length ? Math.max(...pesoValid) : null;
  const pesoDeltaWeek = pesoValid.length >= 2 ? pesoValid[pesoValid.length - 1] - pesoValid[0] : null;
  const pesoSlope = weeklyTrend(wk.pesoArr);

  const bioTile = (label, arr, unit, fmtFn, invert) => {
    const cur = arr[arr.length - 1] != null && !isNaN(arr[arr.length - 1]) ? arr[arr.length - 1] : wk.avg(arr);
    const prevArr = prevWkForChart ? (label === 'HRV' ? prevWkForChart.hrvArr : label === (LANG === 'it' ? 'Riposo' : 'Resting') ? prevWkForChart.rhrArr : label === 'Sonno' ? prevWkForChart.sonnoArr : label === 'REM' ? prevWkForChart.remArr : label === 'Profondo' ? prevWkForChart.profArr : prevWkForChart.risvArr) : null;
    const prevVal = prevArr ? wk.avg(prevArr) : null;
    const dt = deltaTxt(cur, prevVal, unit, invert);
    const sp = svgPath(arr, 100, 18, 3);
    const isHrv = label === 'HRV';
    const hrvEstToday = isHrv && wk.hrvLastRangeText;
    const anyEst = isHrv && wk.hrvIsEst.some(x => x);
    return `
        <div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
          <span style="font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${label}</span>
          <div style="display:flex;align-items:baseline;gap:4px;">
            <span style="font-size:${hrvEstToday ? '12.5px' : '14px'};font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${hrvEstToday ? esc(hrvEstToday) : fmtFn(cur)}</span>
            ${dt && !hrvEstToday ? `<span style="font-size:10px;font-weight:600;color:${dt.color};font-variant-numeric:tabular-nums;">${dt.txt}</span>` : ''}
          </div>
          <svg viewBox="0 0 100 18" preserveAspectRatio="none" style="width:100%;height:16px;display:block;overflow:visible;">
            <path d="${sp.d}" fill="none" stroke="var(--accent)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" ${anyEst ? 'stroke-dasharray="3 2"' : ''}></path>
          </svg>
          ${anyEst ? `<span style="font-size:8px;color:var(--ink3);">${LANG === 'it' ? 'stimato da intervallo' : 'estimated from range'}</span>` : ''}
        </div>`;
  };

  const pesoCard = `
    <div style="grid-column:6 / 13;grid-row:1 / 2;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:16px 20px;display:flex;flex-direction:column;gap:7px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:flex-start;justify-content:space-between;gap:14px;">
        <div style="display:flex;flex-direction:column;gap:2px;">
          <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Peso · la settimana' : 'Weight · this week'}</span>
          <div style="display:flex;align-items:baseline;gap:7px;">
            <span style="font-size:32px;line-height:1.05;letter-spacing:-.02em;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">${nf(pesoValid[pesoValid.length - 1])}</span>
            <span style="font-size:14px;font-weight:400;color:var(--ink3);">kg</span>
            ${pesoDeltaWeek != null ? `<span style="font-size:13px;font-weight:600;color:${pesoDeltaWeek <= 0 ? 'var(--ok)' : 'var(--warn-ink)'};font-variant-numeric:tabular-nums;margin-left:3px;">${pesoDeltaWeek >= 0 ? '+' : ''}${nf(pesoDeltaWeek)} kg ${LANG === 'it' ? 'nella settimana' : 'this week'}</span>` : ''}
          </div>
        </div>
        <div style="display:flex;flex-direction:column;align-items:flex-end;gap:3px;">
          <span style="font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${pesoSlope == null ? '—' : (pesoSlope >= 0 ? '+' : '') + nf(pesoSlope, 2) + (LANG === 'it' ? ' kg / sett.' : ' kg/wk')}</span>
          ${pesoMin != null ? `<span style="font-size:10.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;">min ${nf(pesoMin)} · max ${nf(pesoMax)} kg</span>` : ''}
        </div>
      </div>
      <svg viewBox="0 0 620 104" preserveAspectRatio="none" style="flex:0 0 auto;width:100%;height:96px;display:block;overflow:visible;">
        <defs><linearGradient id="wkFill" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.16"></stop>
          <stop offset="100%" stop-color="var(--accent)" stop-opacity="0"></stop>
        </linearGradient></defs>
        <line x1="0" y1="26" x2="620" y2="26" stroke="var(--line2)" stroke-width="1"></line>
        <line x1="0" y1="65" x2="620" y2="65" stroke="var(--line2)" stroke-width="1"></line>
        ${plW.d ? `<path d="${plW.area}" fill="url(#wkFill)"></path>` : ''}
        ${plPrev && plPrev.d ? `<path d="${plPrev.d}" fill="none" stroke="var(--ink3)" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.55"></path>` : ''}
        ${plW.d ? `<path d="${plW.d}" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path>` : ''}
      </svg>
      <div style="flex:0 0 auto;display:flex;align-items:center;gap:14px;">
        <span style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:2.5px;border-radius:2px;background:var(--accent);"></span>${LANG === 'it' ? 'questa settimana' : 'this week'}</span>
        ${plPrev && plPrev.d ? `<span style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:2px;border-radius:2px;background:var(--ink3);opacity:.6;"></span>${LANG === 'it' ? 'settimana precedente' : 'previous week'}</span>` : ''}
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:3px;padding-top:12px;border-top:1px solid var(--line);">
        ${bioTile('HRV', wk.hrvArr, 'int', v => v == null ? '—' : Math.round(v))}
        ${bioTile(LANG === 'it' ? 'Riposo' : 'Resting', wk.rhrArr, 'int', v => v == null ? '—' : Math.round(v), true)}
        ${bioTile(LANG === 'it' ? 'Sonno' : 'Sleep', wk.sonnoArr, '', sonnoFmt)}
        ${bioTile('REM', wk.remArr, 'int', v => v == null ? '—' : Math.round(v) + '′')}
        ${bioTile(LANG === 'it' ? 'Profondo' : 'Deep', wk.profArr, 'int', v => v == null ? '—' : Math.round(v) + '′')}
        ${bioTile(LANG === 'it' ? 'Risvegli' : 'Wake-ups', wk.risvArr, '1', v => v == null ? '—' : nf(v), true)}
      </div>
    </div>`;

  // ---- Griglia iniezioni ----
  const dayHeadCells = wk.days.map(d => `
              <span onclick="selDate='${d.dateISO}';oggiViewMode='day';render();" style="display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;padding:2px 0;border-radius:5px;background:transparent;">
                <span style="font-size:9px;font-weight:600;color:#57575f;text-transform:uppercase;">${d.dow}</span>
                <span style="font-size:10px;font-weight:600;color:#57575f;font-variant-numeric:tabular-nums;">${d.num}</span>
              </span>`).join('');

  const injRowsHtml = wk.injRows.map(r => {
    const { name: compName } = splitDose(r.row.field);
    const cells = r.cells.map(c => {
      const st = INJ_CELL_STYLE[c.state];
      return `<span style="height:22px;border-radius:5px;background:${st.bg};border:1px solid ${st.border};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${st.ink};cursor:pointer;">${st.mark}</span>`;
    }).join('');
    const doneColor = r.applicable && r.doneCount === r.applicable ? 'var(--ok)' : r.applicable && r.doneCount / r.applicable < 0.6 ? 'var(--warn-ink)' : 'var(--ink)';
    return `
                <div style="display:grid;grid-template-columns:158px repeat(7,1fr) 62px;gap:2px;align-items:center;">
                  <div style="min-width:0;display:flex;flex-direction:column;">
                    <span style="font-size:10.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(compName)}${r.row.igf ? ' ' + (r.row.field.includes('dx') ? 'dx' : 'sx') : ''}</span>
                    <span style="font-size:8.5px;font-weight:500;color:var(--ink3);white-space:nowrap;">${L.slotLabels[r.row.timing] || r.row.timing} · ${r.row.igf ? 'IM' : 'SC'}</span>
                  </div>
                  ${cells}
                  <span style="text-align:right;font-size:10px;font-weight:600;color:${doneColor};font-variant-numeric:tabular-nums;">${r.doneCount}/${r.applicable}</span>
                </div>`;
  }).join('');

  const injCard = `
    <div style="grid-column:1 / 8;grid-row:2 / 3;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Iniezioni · dose per dose' : 'Injections · dose by dose'}</span>
        <div style="display:flex;align-items:baseline;gap:12px;">
          <span style="display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#ffffff;background:var(--ok);border:1.5px solid var(--ok);">✓</span>${L.doseDone}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--warn-ink);background:#ffffff;border:1.5px solid var(--warn);">–</span>${L.doseSkip}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--ink3);background:var(--surf2);border:1.5px solid var(--surf2);">N</span>${L.doseNa}</span>
          <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.injDoneTot}/${wk.injApplTot}</span>
        </div>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:158px repeat(7,1fr) 62px;gap:2px;">
        <span></span>${dayHeadCells}
        <span style="text-align:right;font-size:8.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;align-self:end;">${LANG === 'it' ? 'fatte' : 'done'}</span>
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;">${injRowsHtml}</div>
      <span style="flex:0 0 auto;font-size:9.5px;font-weight:500;color:var(--ink3);text-wrap:pretty;">${LANG === 'it' ? 'IGF-1 DES solo nei giorni di allenamento' : 'IGF-1 DES only on training days'}</span>
    </div>`;

  // ---- Aderenza: 3 anelli + 16 barre ----
  const ring = (pct, color, label, sub, deltaInfo) => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="position:relative;width:92px;height:92px;">
            <svg viewBox="0 0 84 84" style="width:92px;height:92px;transform:rotate(-90deg);display:block;">
              <circle cx="42" cy="42" r="34" fill="none" stroke="var(--line2)" stroke-width="8"></circle>
              <circle cx="42" cy="42" r="34" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(213.63 * pct / 100).toFixed(1)} 213.63"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">${pct}%</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:1px;">
            <span style="font-size:12px;font-weight:600;color:var(--ink);">${label}</span>
            <span style="font-size:10.5px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${sub}</span>
            ${deltaInfo}
          </div>
        </div>`;
  const ringDelta = (pct, prevPct) => {
    if (!wk.isClosed) return `<span style="font-size:10px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${wk.elapsed} ${LANG === 'it' ? 'di 7 giorni' : 'of 7 days'}</span>`;
    if (prevPct == null) return '';
    const d = pct - prevPct;
    const color = Math.abs(d) < 1 ? 'var(--ink3)' : d > 0 ? 'var(--ok)' : 'var(--warn-ink)';
    const txt = Math.abs(d) < 1 ? '=' : (d > 0 ? '+' : '') + d;
    return `<span style="font-size:10px;font-weight:600;color:${color};font-variant-numeric:tabular-nums;">${txt} vs W${weekIdx}</span>`;
  };
  const prevShallow = weekIdx > 0 ? weekAggregateShallow(weekIdx - 1) : null;

  // 16 barre — fondo scala 50%, la barra della settimana corrente tratteggiata se in corso
  const barsHtml = Array.from({ length: totalWeeks }, (_, w) => {
    if (w === weekIdx) {
      const h = Math.max(8, (wk.overall - 50) / 50 * 100);
      return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:${h}%;border-radius:3px 3px 0 0;background:${wk.isClosed ? 'var(--accent)' : 'transparent'};border:1.5px dashed ${wk.isClosed ? 'transparent' : 'var(--accent)'};"></span>
            <span style="font-size:7.5px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
    }
    const shal = w < weekIdx ? weekAggregateShallow(w) : null;
    if (!shal) {
      return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:3px;border-radius:3px 3px 0 0;background:var(--line2);border:1.5px dashed transparent;"></span>
            <span style="font-size:7.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
    }
    const h = Math.max(8, (shal.overall - 50) / 50 * 100);
    const barColor = shal.overall >= 90 ? 'var(--ok)' : shal.overall >= 70 ? 'var(--warn)' : 'var(--bad)';
    return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:${h}%;border-radius:3px 3px 0 0;background:${barColor};border:1.5px dashed transparent;"></span>
            <span style="font-size:7.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
  }).join('');

  const adherenceCard = `
    <div style="grid-column:8 / 13;grid-row:2 / 3;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Aderenza · settimana' : 'Adherence · week'} ${weekIdx + 1}</span>
        <span style="font-size:10.5px;font-weight:500;color:var(--ink3);">${wk.isClosed ? (LANG === 'it' ? 'settimana chiusa' : 'closed week') : wk.isFutureWeek ? (LANG === 'it' ? 'non iniziata' : 'not started') : `${wk.elapsed} ${LANG === 'it' ? 'giorni su 7 · in corso' : 'of 7 days · in progress'}`}</span>
      </div>
      <div style="flex:0 0 auto;display:flex;justify-content:space-around;">
        ${ring(wk.injPct, 'var(--accent)', L.injectionsRing, `${wk.injDoneTot}/${wk.injApplTot}`, ringDelta(wk.injPct, prevShallow && prevShallow.injPct))}
        ${ring(wk.suppPct, 'var(--ok)', L.supplements, `${wk.suppDoneTot}/${wk.suppApplTot}`, ringDelta(wk.suppPct, prevShallow && prevShallow.suppPct))}
        ${ring(wk.woPct, 'var(--warn)', L.workoutsRing, `${wk.woDone}/${wk.woTot}`, ringDelta(wk.woPct, prevShallow && prevShallow.woPct))}
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;padding-top:10px;border-top:1px solid var(--line);">
        <span style="flex:0 0 auto;font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Le 16 settimane, la stessa misura' : 'All 16 weeks, same measure'}</span>
        <div style="flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:3px;">${barsHtml}</div>
        <span style="flex:0 0 auto;font-size:9.5px;font-weight:500;color:var(--ink3);text-wrap:pretty;">${LANG === 'it' ? 'Aderenza complessiva per settimana · fondo scala 50%' : 'Overall adherence per week · 50% baseline'}</span>
      </div>
    </div>`;

  // ---- Integratori ----
  const dayHeadInitials = wk.dowInitial.map(l => `<span style="text-align:center;font-size:8.5px;font-weight:600;color:#57575f;text-transform:uppercase;">${l}</span>`).join('');
  const suppRowsHtml = wk.suppRows.map(r => {
    const cells = r.cells.map(c => {
      const st = INJ_CELL_STYLE[c.state];
      return `<span style="height:19px;border-radius:4px;background:${st.bg};border:1px solid ${st.border};display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:${st.ink};cursor:pointer;">${st.mark}</span>`;
    }).join('');
    return `
                <div style="display:grid;grid-template-columns:130px repeat(7,1fr);gap:2px;align-items:center;">
                  <span style="font-size:10.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.label)}</span>
                  ${cells}
                </div>`;
  }).join('');
  const suppCard = `
    <div style="grid-column:1 / 5;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.supplements}</span>
        <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.suppDoneTot}/${wk.suppApplTot}</span>
