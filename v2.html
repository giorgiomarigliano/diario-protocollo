        PHOTO_LOG.push(entry);

    .then(function(){

      if (statusEl) statusEl.textContent = "Foto caricata e salvata correttamente.";

}

/* ══════════════════════════════════════════════════════════

var AN_TYPE_LABEL = { "Allenamento BKK": "BKK" };
function AN_buildDays(){
  var idxToday = dayIdxFromISO(today), len = Math.max(CYCLE.days, idxToday + 1), out = [];
  for (var i = 0; i < len; i++) {
    if (i > idxToday) { out.push(null); continue; }
    var rec = (store.blob && store.blob["p2_day_" + i]) || {};
    var d = {};
    Object.keys(rec).forEach(function(k){
      if (k.indexOf("inj_") === 0 || k.indexOf("ck_") === 0 || k === "motra_log") return;
      d[k] = rec[k];
    });
    var vol = getWorkoutVolume2(rec);
    d.wo_volume = (vol != null) ? String(vol) : "";
    var kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe);
    var done = (!isNaN(kcal) && kcal > 0) || (vol != null && vol > 0) || !isNaN(rpe);
    var type = getWorkout2(i).type, planned = type !== "Riposo";
    d._planned = planned ? "1" : "";
    d._done = done ? "1" : "";
    d._type = planned ? (AN_TYPE_LABEL[type] || type) : (done ? "Extra" : "");
    out.push(d);
  }
  return out;
}
/* stessi criteri di adherence() di v2.html, per UN giorno */
function AN_dayAdh(idx){
  var rec = (store.blob && store.blob["p2_day_" + idx]) || {};
  var r = { injDone:0, injTot:0, suppDone:0, suppTot:0, woDone:0, woTot:0 };
  getInjectionSlots2(idx).forEach(function(s){ s.fields.forEach(function(f){
    var v = rec["inj_" + s.n + "_" + fieldKey(f)] || "";
    if (v === "skip" || v === "na") return;
    r.injTot++; if (v === "fatto") r.injDone++;
  }); });
  SUPP_FIELDS.forEach(function(sf){ if (rec[sf + "_skip"]) return; r.suppTot++; if (rec[sf] === "1") r.suppDone++; });
  if (getWorkout2(idx).type !== "Riposo") {
    r.woTot++;
    var kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe), vol = getWorkoutVolume2(rec);
    if ((!isNaN(kcal) && kcal > 0) || (vol != null && vol > 0) || !isNaN(rpe)) r.woDone++;
  }
  return r;
}
function AN_buildAdherence(){
  var a = adherence(store.blob);
  var cur = Math.floor(dayIdxFromISO(today) / 7), weeks = [];
  /* PORTING 23/09: griglia settimanale per dominio (dettaglio a richiesta), stessi tre domini e
     stesso criterio giorno-per-giorno di sempre (AN_dayAdh) — solo scomposti invece che mediati. */
  var weeksInj = [], weeksSupp = [], weeksWo = [];
  for (var k = 0; k < 16; k++) {
    if (k >= cur) { weeks.push(null); weeksInj.push(null); weeksSupp.push(null); weeksWo.push(null); continue; }
    var s = { injDone:0, injTot:0, suppDone:0, suppTot:0, woDone:0, woTot:0 };
    for (var j = 0; j < 7; j++) { var x = AN_dayAdh(k * 7 + j); for (var q in s) s[q] += x[q]; }
    var p = [];
    if (s.injTot) p.push(s.injDone / s.injTot * 100);
    if (s.suppTot) p.push(s.suppDone / s.suppTot * 100);
    if (s.woTot) p.push(s.woDone / s.woTot * 100);
    weeks.push(p.length ? Math.round(p.reduce(function(u, v){ return u + v; }, 0) / p.length) : null);
    weeksInj.push(s.injTot ? Math.round(s.injDone / s.injTot * 100) : null);
    weeksSupp.push(s.suppTot ? Math.round(s.suppDone / s.suppTot * 100) : null);
    weeksWo.push(s.woTot ? Math.round(s.woDone / s.woTot * 100) : null);
  }
  return { inj: a.injTot ? a.inj : null, supp: a.suppTot ? a.supp : null, wo: a.woTot ? a.wo : null,
           weeks: weeks, weeksInj: weeksInj, weeksSupp: weeksSupp, weeksWo: weeksWo };
}
function AN_buildPhotoMetrics(){
  var out = {}, t = dayIdxFromISO(today);
  PHOTO_LOG.forEach(function(p){
    var i = photoDayIndex(p); if (i < 0 || i > t) return;
    var rec = (store.blob && store.blob["p2_day_" + i]) || {}, m = {};
    var pv = num(rec.peso); if (pv != null) m.peso = pv;
    /* PORTING 24/09: HRV era sempre vuoto per ogni giorno a intervallo (la norma dal cambio iOS26) -- leggeva solo la vecchia media singola. m.hrv resta numerico (punto medio se a intervallo, solo per il delta di Confronto); m.hrvHead e' il testo mostrato (min-max, o il numero). */
    var hLo = num(rec.hrv_min), hHi = num(rec.hrv_max), hSc = num(rec.hrv);
    if (hLo != null && hHi != null) { m.hrv = (hLo + hHi) / 2; m.hrvHead = Math.round(hLo) + "–" + Math.round(hHi); }
    else if (hSc != null) { m.hrv = hSc; m.hrvHead = String(Math.round(hSc)); }

       come in V1, che aggiorna in tempo reale mentre spunti iniezioni/integratori. Il divieto
       "il giorno in corso non conta come saltato" resta valido per il VERDETTO di Aderenza (i<t
       li' non cambia), ma qui e' solo un dato descrittivo, non un giudizio: niente da nascondere. */
    var x = AN_dayAdh(i);

    if (x.suppTot) m.supp = Math.round(x.suppDone / x.suppTot * 100);
    /* PORTING 26/09: badge allenamento sempre presente, anche nei giorni di riposo (V1 mostra

    var wo = getWorkout2(i);

}

  var wReal = [];

  if (!iso || !PL || !PL.length) return null;
  var t = new Date(iso + 'T00:00:00'), best = null;
  PL.forEach(function (p) {

    var d = Math.round((new Date(p.date + 'T00:00:00') - t) / 86400000);

  });
  return best;
}

// esc/nf/svgPath/svgTrend/doseLook — porting diretto dal codice reale
// generato da Claude Design (produzione/v2.html), adattati solo dove i nomi
// di campo o gli stati differiscono dallo schema reale già verificato.
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '—' : (LANG === 'it' ? Number(v).toFixed(d).replace('.', ',') : Number(v).toFixed(d));
function svgPath(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  if (v.length < 2) return { d: '', area: '', lastX: 0, lastY: h / 2 };
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  const pts = v.map((x, i) => [(i / (v.length - 1)) * w, pad + (1 - (x - mn) / sp) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return { d, area: d + ` L${last[0].toFixed(1)} ${h} L0 ${h} Z`, lastX: last[0], lastY: last[1] };
}
function svgTrend(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  const n = v.length;
  if (n < 3) return '';
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  v.forEach((y, i) => { sx += i; sy += y; sxy += i * y; sxx += i * i; });
  const m = (n * sxy - sx * sy) / (n * sxx - sx * sx), b = (sy - m * sx) / n;
  const yAt = i => pad + (1 - ((m * i + b) - mn) / sp) * (h - pad * 2);
  return `M0 ${yAt(0).toFixed(1)} L${w} ${yAt(n - 1).toFixed(1)}`;
}
// doseLook — stessa idea del riferimento, ma sui 4 stati REALI
// (''/fatto/saltata/na), non su quelli d'esempio ('','done','skip','na').
function doseLook(v) {

    'fatto':   { bg: 'var(--ok)',    border: 'var(--ok)',   mark: '✓', ink: 'var(--white)',        label: L.doseDone },
    'saltata': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: 'var(--on-warn)',     label: L.doseSkip },
    'saltato': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: 'var(--on-warn)',     label: L.doseSkip },
    'na':      { bg: 'var(--surf2)', border: 'var(--surf2)',mark: 'N', ink: 'var(--ink3)', label: L.doseNa }
  }[v || ''];

/* ------------------------------------------------------------
   Storico peso + trend — nuovo (09/09/2026), nessun equivalente in
   index.html da copiare verbatim (funzione non-MIRROR, prima stesura).
   ------------------------------------------------------------ */
function weightHistory(days, anchorISO) {
  const dIdx = dayIdxFromISO(anchorISO);
  const from = Math.max(0, dIdx - days + 1);
  const arr = [];
  for (let i = from; i <= dIdx; i++) {
    const rec = (store.blob && store.blob['p2_day_' + i]) || {};
    const v = parseFloat(rec.peso);
    arr.push(isNaN(v) ? null : v);
  }
  return arr;
}
// Regressione lineare semplice sui punti non nulli; ritorna kg/settimana
// (slope giornaliero * 7), o null se meno di 2 punti validi.
function weeklyTrend(values) {
  const pts = values.map((v, i) => ({ x: i, y: v })).filter(p => p.y !== null);
  if (pts.length < 2) return null;
  const n = pts.length;
  const sx = pts.reduce((s, p) => s + p.x, 0), sy = pts.reduce((s, p) => s + p.y, 0);
  const sxx = pts.reduce((s, p) => s + p.x * p.x, 0), sxy = pts.reduce((s, p) => s + p.x * p.y, 0);
  const denom = (n * sxx - sx * sx) || 1;
  const slope = (n * sxy - sx * sy) / denom;
  return slope * 7;
}

// MIRROR · drawComplianceRing — verbatim da index.html (riga 6183).
function drawComplianceRing(canvasId, pct, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 56 * dpr; canvas.height = 56 * dpr;
  ctx.scale(dpr, dpr);
  const cx = 28, cy = 28, r = 22, C = 2 * Math.PI * r;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#e8e8ed'; ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2);
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
}

// Grafico peso — adattato da drawChart (index.html riga 2203): stessa
// tecnica (fill a gradiente + linea + puntino), ma senza l'etichetta
// fluttuante sull'ultimo punto (il numero grande è già mostrato sopra
// il grafico nella nuova card).
function drawWeightChart(id, data, color) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width || 300, H = 70;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  const pts = data.filter(v => v !== null);
  if (pts.length < 2) {
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#aeaeb2'; ctx.fillText('Dati insufficienti', 8, 36);
    return;
  }
  const TOP_PAD = 8, BOTTOM_PAD = 8;
  const mn = Math.min(...pts) * 0.997, mx = Math.max(...pts) * 1.003, rng = mx - mn || 1;
  const valid = data.map((v, i) => v !== null ? {
    x: i / (data.length - 1) * (W - 8) + 4,
    y: H - BOTTOM_PAD - ((v - mn) / rng) * (H - TOP_PAD - BOTTOM_PAD), v
  } : null);
  ctx.beginPath(); let st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  const lp = valid.filter(Boolean).pop(), fp = valid.filter(Boolean)[0];
  if (lp && fp) {
    ctx.lineTo(lp.x, H); ctx.lineTo(fp.x, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, color + '28'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.beginPath(); st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  if (lp) { ctx.beginPath(); ctx.arc(lp.x, lp.y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
}

/* ------------------------------------------------------------
   Card narrativa — PRIMA STESURA, non-MIRROR (nessun testo simile
   esiste già in index.html da copiare). Regole/soglie scelte qui
   sono un punto di partenza ragionevole, NON ancora approvate da
   Giorgio nei dettagli — da rivedere con lui alla prima occasione
   utile, in particolare: soglie "segnale da tenere d'occhio" e
   soglia di "HRV fermo" (±1ms/settimana).
   ------------------------------------------------------------ */
function buildHeroNarrative(a, wTrend, hrvTrend) {
  const signals = [];
  if (a.inj < 90) signals.push('iniezioni');
  if (a.supp < 85) signals.push('integratori');
  if (a.wo < 85) signals.push('allenamenti');
  if (wTrend !== null && wTrend > 0.35) signals.push('peso in salita rapida');
  if (wTrend !== null && wTrend < -0.35) signals.push('peso in calo rapido');
  if (hrvTrend !== null && hrvTrend < -3) signals.push('HRV in calo');

  const tone = signals.length === 0 ? 'good' : signals.length <= 2 ? 'warn' : 'bad';
  const title = tone === 'good'
    ? 'Il ciclo tiene, tutto sotto controllo.'
    : `Il ciclo tiene, con ${signals.length} segnal${signals.length === 1 ? 'e' : 'i'} da tenere d'occhio.`;

  const wTrendTxt = wTrend === null ? 'il peso (dati insufficienti)'
    : `il peso, che ${wTrend > 0.05 ? 'sale' : wTrend < -0.05 ? 'scende' : 'resta stabile'} di ${Math.abs(wTrend).toFixed(2)} kg a settimana`;
  const hrvTxt = hrvTrend === null ? 'HRV (dati insufficienti)'
    : `l'HRV è ${Math.abs(hrvTrend) < 1 ? 'fermo' : hrvTrend > 0 ? 'in salita' : 'in calo'}`;

  const text = `Reggono l'aderenza alle iniezioni (${a.inj}%), ${wTrendTxt} e gli allenamenti (${a.wo}%). Gli integratori sono al ${a.supp}% e ${hrvTxt}.`;
  return { title, text, tone };
}

/* ============================================================
   VISTA SETTIMANA — nuova (14/09/2026), portata da
   produzione/v2-settimana-{desktop,mobile}.html (export reale di
   Claude Design). Sola lettura: nessun input, nessun pulsante Salva —
   ogni cella/intestazione porta al giorno in vista Giorno, che resta
   l'unico punto di scrittura (vedi README del pacchetto).
   ============================================================ */

// Righe canoniche delle iniezioni — stesse 9 dosi sempre nello stesso
// ordine, indipendentemente da come getInjectionSlots2() rinumera gli
// slot giorno per giorno (lo slot IGF inserito sposta n del gruppo Sera
// da 3 a 4). L'abbinamento avviene per (timing, nome campo), non per n.
const CANON_INJ_ROWS = [
  { timing: 'Mattino',   field: 'Fragment 176-191 250mcg' },
  { timing: 'Mattino',   field: 'BPC-157 250mcg' },
  { timing: 'Pomeriggio',field: 'Fragment 176-191 250mcg' },
  { timing: 'Post-WO',   field: 'IGF-1 DES 25mcg dx', igf: true },
  { timing: 'Post-WO',   field: 'IGF-1 DES 25mcg sx', igf: true },
  { timing: 'Sera',      field: 'Tesamorelin 2mg' },
  { timing: 'Sera',      field: 'Ipamorelin 100mcg' },
  { timing: 'Sera',      field: 'BPC-157 250mcg' },
  { timing: 'Sera',      field: 'TB-500 500mcg' },
];

// Stato di una singola dose per un giorno dato, cercando lo slot del
// timing giusto in quel giorno specifico (gli slot REALI di quel
// giorno, non un elenco fisso) e leggendo inj_{n}_{fieldKey}.
function injCellState(dayIdx, rec, row) {
  const slots = getInjectionSlots2(dayIdx);
  const slot = slots.find(s => s.label === row.timing && s.fields.includes(row.field));
  if (!slot) return { state: 'non-prevista' }; // IGF in un giorno di riposo
  const v = rec['inj_' + slot.n + '_' + fieldKey(row.field)] || '';
  return { state: v || 'vuoto' };
}

function weekAggregate(weekIdx) {
  const startIdx = weekIdx * 7;
  const todayIdx = dayIdxFromISO(today);
  const dowShort = LANG === 'it' ? ['LUN','MAR','MER','GIO','VEN','SAB','DOM'] : ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dowInitial = LANG === 'it' ? ['L','M','M','G','V','S','D'] : ['M','T','W','T','F','S','S'];

  const days = Array.from({ length: 7 }, (_, i) => {
    const dayIdx = startIdx + i;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    const dateISO = isoLocal(d);
    const rec = getDay(dateISO);
    const wo = getWorkout2(dayIdx);
    return {
      dayIdx, dateISO, date: d, rec, wo,
      isFuture: dayIdx > todayIdx,
      isRest: wo.type === 'Riposo',
      dow: dowShort[i], dowIni: dowInitial[i], num: d.getDate()
    };
  });

  const elapsed = days.filter(d => !d.isFuture).length; // 0..7
  const isClosed = elapsed === 7;
  const isFutureWeek = elapsed === 0;

  // ---- Iniezioni: 9 righe canoniche × 7 giorni ----
  const injRows = CANON_INJ_ROWS.map(row => {
    const cells = days.map(d => d.isFuture ? { state: 'futuro' } : injCellState(d.dayIdx, d.rec, row));
    const doneCount = cells.filter(c => c.state === 'fatto').length;
    const applicable = cells.filter(c => c.state !== 'non-prevista' && c.state !== 'futuro').length;
    return { row, cells, doneCount, applicable };
  });
  const injDoneTot = injRows.reduce((s, r) => s + r.doneCount, 0);
  const injApplTot = injRows.reduce((s, r) => s + r.applicable, 0);

  // ---- Integratori: 9 campi × 7 giorni ----
  const suppRows = SUPP_FIELDS.map(sf => {
    const cells = days.map(d => {
      if (d.isFuture) return { state: 'futuro' };
      if (d.rec[sf + '_skip']) return { state: 'na' };
      return { state: d.rec[sf] === '1' ? 'fatto' : 'vuoto' };
    });
    const doneCount = cells.filter(c => c.state === 'fatto').length;
    const applicable = cells.filter(c => c.state !== 'na' && c.state !== 'futuro').length;
    return { field: sf, label: SUPP_LABELS[sf], cells, doneCount, applicable };
  });
  const suppDoneTot = suppRows.reduce((s, r) => s + r.doneCount, 0);
  const suppApplTot = suppRows.reduce((s, r) => s + r.applicable, 0);

  // ---- Allenamenti della settimana ----
  const trainingDays = days.filter(d => !d.isRest);
  const woTot = trainingDays.length;
  const woDone = trainingDays.filter(d => {
    if (d.isFuture) return false;
    const kcal = parseFloat(d.rec.wo_kcal), rpe = parseFloat(d.rec.rpe);
    const vol = getWorkoutVolume2(d.rec);
    return (!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe);
  }).length;
  const sessions = trainingDays.filter(d => !d.isFuture).map(d => {
    const vol = getWorkoutVolume2(d.rec) || 0;
    const dur = parseFloat(d.rec.wo_durata) || 0;
    const rpe = d.rec.rpe !== undefined && d.rec.rpe !== '' ? parseFloat(d.rec.rpe) : null;
    return { dow: d.dow, dateISO: d.dateISO, type: d.wo.type, vol, dur, rpe, done: vol > 0 || dur > 0 || rpe !== null };
  });
  const weekVolume = sessions.reduce((s, x) => s + x.vol, 0);
  const weekDurationMin = sessions.reduce((s, x) => s + x.dur, 0);
  const weekKcal = trainingDays.filter(d => !d.isFuture).reduce((s, d) => s + (parseFloat(d.rec.wo_kcal) || 0), 0);

  // ---- Percentuali della settimana ----
  const pct = (done, tot) => tot ? Math.round(done / tot * 100) : 0;
  const injPct = pct(injDoneTot, injApplTot), suppPct = pct(suppDoneTot, suppApplTot), woPct = pct(woDone, woTot);
  const overall = Math.round((injPct + suppPct + woPct) / 3);

  // ---- Confronto con la settimana precedente (solo se non è la prima) ----
  let prevOverall = null, prevInjPct = null;
  if (weekIdx > 0) {
    const prev = weekAggregateShallow(weekIdx - 1);
    if (prev) { prevOverall = prev.overall; prevInjPct = prev.injPct; }
  }

  // ---- Categorici: 3 campi × 7 giorni ----
  const CATN = ['pienezza_add', 'ritenzione', 'formicolio'];
  const catRows = CATN.map(key => {
    const cells = days.map(d => {
      if (d.isFuture) return { val: null };
      const raw = d.rec[key];
      if (raw === '' || raw === undefined || raw === null) return { val: null };
      return { val: parseInt(raw, 10) };
    });
    return { key, cells };
  });

  // ---- Biometria + peso: serie di 7 valori ----
  const pesoArr = days.map(d => parseFloat(d.rec.peso));
  // HRV: dal 15/09/2026 alcuni giorni hanno solo hrv_min/hrv_max (intervallo),
  // non più una media vera. Per la LINEA del grafico si usa il punto medio
  // (unico modo di avere comunque un andamento), ma si traccia quali punti
  // sono stimati (hrvIsEst) così il disegno può distinguerli visivamente —
  // il punto medio non va MAI mostrato come fosse una media reale altrove.
  const hrvArr = days.map(d => {
    const lo = parseFloat(d.rec.hrv_min), hi = parseFloat(d.rec.hrv_max);
    if (!isNaN(lo) && !isNaN(hi)) return (lo + hi) / 2;
    const real = parseFloat(d.rec.hrv);
    return isNaN(real) ? NaN : real;
  });
  const hrvIsEst = days.map(d => {
    const lo = parseFloat(d.rec.hrv_min), hi = parseFloat(d.rec.hrv_max);
    return !isNaN(lo) && !isNaN(hi);
  });
  const lastHrvDay = days[days.length - 1] ? days[days.length - 1].rec : {};
  const hrvLastRangeText = (lastHrvDay.hrv_min || lastHrvDay.hrv_max)
    ? `${lastHrvDay.hrv_min || '?'}–${lastHrvDay.hrv_max || '?'}` : null;
  const sonnoArr = days.map(d => parseSonnoHours(d.rec.ore_sonno));
  const rhrArr = days.map(d => parseFloat(d.rec.rhr));
  const remArr = days.map(d => parseFloat(d.rec.sonno_rem_min));
  const profArr = days.map(d => parseFloat(d.rec.sonno_profondo_min));
  const risvArr = days.map(d => parseFloat(d.rec.sonno_risvegli));
  const avg = arr => { const v = arr.filter(x => !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

  // ---- Soggettivo: 8 medie ----
  const SUBJ_KEYS = ['energia', 'recupero', 'umore', 'rpe', 'appetito', 'sonno_sogg', 'libido', 'chiarezza'];
  const subjSeries = {};
  SUBJ_KEYS.forEach(k => { subjSeries[k] = days.map(d => d.isFuture ? NaN : parseFloat(d.rec[k])); });

  return {
    weekIdx, days, elapsed, isClosed, isFutureWeek,
    injRows, injDoneTot, injApplTot, injPct,
    suppRows, suppDoneTot, suppApplTot, suppPct,
    woTot, woDone, woPct, sessions, weekVolume, weekDurationMin, weekKcal,
    overall, prevOverall, prevInjPct,
    catRows,
    pesoArr, hrvArr, hrvIsEst, hrvLastRangeText, sonnoArr, rhrArr, remArr, profArr, risvArr, avg,
    subjSeries, dowInitial
  };
}

// Versione leggera usata solo per il confronto con la settimana precedente
// (evita di ricalcolare le 9+9+3 griglie quando servono solo le percentuali).
function weekAggregateShallow(weekIdx) {
  if (weekIdx < 0) return null;
  const startIdx = weekIdx * 7;
  const todayIdx = dayIdxFromISO(today);
  if (startIdx > todayIdx) return null; // settimana futura, nessun dato
  let injDone = 0, injTot = 0, suppDone = 0, suppTot = 0, woDone = 0, woTot = 0;
  for (let i = 0; i < 7; i++) {
    const dayIdx = startIdx + i;
    if (dayIdx > todayIdx) break;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    const rec = getDay(isoLocal(d));
    getInjectionSlots2(dayIdx).forEach(s => s.fields.forEach(f => {
      const v = rec['inj_' + s.n + '_' + fieldKey(f)] || '';
      if (v === 'na') return;
      injTot++; if (v === 'fatto') injDone++;
    }));
    SUPP_FIELDS.forEach(sf => { if (rec[sf + '_skip']) return; suppTot++; if (rec[sf] === '1') suppDone++; });
    if (getWorkout2(dayIdx).type !== 'Riposo') {
      woTot++;
      const kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe), vol = getWorkoutVolume2(rec);
      if ((!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe)) woDone++;
    }
  }
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const injPct = pct(injDone, injTot), suppPct = pct(suppDone, suppTot), woPct = pct(woDone, woTot);
  return { overall: Math.round((injPct + suppPct + woPct) / 3), injPct, suppPct, woPct };
}

  const cycAvg = Math.round((cyc.inj + cyc.supp + cyc.wo) / 3);
  let recapTone = 'good', recapTitle, recapText;
  if (wk.isFutureWeek) {

  }).join('');

  const injCard = `
    <div style="grid-column:1 / 8;grid-row:2 / 3;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;">
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Iniezioni · dose per dose' : 'Injections · dose by dose'}</span>
        <div style="display:flex;align-items:baseline;gap:12px;">
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--white);background:var(--ok);border:1.5px solid var(--ok);">✓</span>${L.doseDone}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--warn-ink);background:var(--white);border:1.5px solid var(--warn);">–</span>${L.doseSkip}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--ink3);background:var(--surf2);border:1.5px solid var(--surf2);">N</span>${L.doseNa}</span>
          <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.injDoneTot}/${wk.injApplTot}</span>
        </div>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:158px repeat(7,1fr) 62px;gap:2px;">
        <span></span>${dayHeadCells}
        <span style="text-align:right;font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);text-transform:uppercase;align-self:end;">${LANG === 'it' ? 'fatte' : 'done'}</span>
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;">${injRowsHtml}</div>
      <span style="flex:0 0 auto;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);text-wrap:pretty;">${LANG === 'it' ? 'IGF-1 DES solo nei giorni di allenamento' : 'IGF-1 DES only on training days'}</span>
    </div>`;

  // ---- Aderenza: 3 anelli + 16 barre ----
  const ring = (pct, color, label, sub, deltaInfo) => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="position:relative;width:92px;height:92px;">
            <svg viewBox="0 0 84 84" style="width:92px;height:92px;transform:rotate(-90deg);display:block;">
              <circle cx="42" cy="42" r="34" fill="none" stroke="var(--line2)" stroke-width="8"></circle>
              <circle cx="42" cy="42" r="34" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(213.63 * pct / 100).toFixed(1)} 213.63"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:var(--fs-3xl);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">${pct}%</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:1px;">
            <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink);">${label}</span>
            <span style="font-size:var(--fs-xs);font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${sub}</span>
            ${deltaInfo}
          </div>
        </div>`;
  const ringDelta = (pct, prevPct) => {
    if (!wk.isClosed) return `<span style="font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${wk.elapsed} ${LANG === 'it' ? 'di 7 giorni' : 'of 7 days'}</span>`;
    if (prevPct == null) return '';
    const d = pct - prevPct;
    const color = Math.abs(d) < 1 ? 'var(--ink3)' : d > 0 ? 'var(--ok)' : 'var(--warn-ink)';
    const txt = Math.abs(d) < 1 ? '=' : (d > 0 ? '+' : '') + d;
    return `<span style="font-size:var(--fs-2xs);font-weight:600;color:${color};font-variant-numeric:tabular-nums;">${txt} vs W${weekIdx}</span>`;
  };
  const prevShallow = weekIdx > 0 ? weekAggregateShallow(weekIdx - 1) : null;

  // 16 barre — fondo scala 50%, la barra della settimana corrente tratteggiata se in corso
  const barsHtml = Array.from({ length: totalWeeks }, (_, w) => {
    if (w === weekIdx) {
      const h = Math.max(8, (wk.overall - 50) / 50 * 100);
      return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:${h}%;border-radius:var(--r-xs) var(--r-xs) 0 0;background:${wk.isClosed ? 'var(--accent)' : 'transparent'};border:1.5px dashed ${wk.isClosed ? 'transparent' : 'var(--accent)'};"></span>
            <span style="font-size:var(--fs-2xs);font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
    }
    const shal = w < weekIdx ? weekAggregateShallow(w) : null;
    if (!shal) {
      return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:3px;border-radius:var(--r-xs) var(--r-xs) 0 0;background:var(--line2);border:1.5px dashed transparent;"></span>
            <span style="font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
    }
    const h = Math.max(8, (shal.overall - 50) / 50 * 100);
    const barColor = shal.overall >= 90 ? 'var(--ok)' : shal.overall >= 70 ? 'var(--warn)' : 'var(--bad)';
    return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:${h}%;border-radius:var(--r-xs) var(--r-xs) 0 0;background:${barColor};border:1.5px dashed transparent;"></span>
            <span style="font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
  }).join('');

  const adherenceCard = `
    <div style="grid-column:8 / 13;grid-row:2 / 3;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Aderenza · settimana' : 'Adherence · week'} ${weekIdx + 1}</span>
        <span style="font-size:var(--fs-xs);font-weight:500;color:var(--ink3);">${wk.isClosed ? (LANG === 'it' ? 'settimana chiusa' : 'closed week') : wk.isFutureWeek ? (LANG === 'it' ? 'non iniziata' : 'not started') : `${wk.elapsed} ${LANG === 'it' ? 'giorni su 7 · in corso' : 'of 7 days · in progress'}`}</span>
      </div>
      <div style="flex:0 0 auto;display:flex;justify-content:space-around;">
        ${ring(wk.injPct, 'var(--accent)', L.injectionsRing, `${wk.injDoneTot}/${wk.injApplTot}`, ringDelta(wk.injPct, prevShallow && prevShallow.injPct))}
        ${ring(wk.suppPct, 'var(--ok)', L.supplements, `${wk.suppDoneTot}/${wk.suppApplTot}`, ringDelta(wk.suppPct, prevShallow && prevShallow.suppPct))}
        ${ring(wk.woPct, 'var(--wo)', L.workoutsRing, `${wk.woDone}/${wk.woTot}`, ringDelta(wk.woPct, prevShallow && prevShallow.woPct))}
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;padding-top:10px;border-top:1px solid var(--line);">
        <span style="flex:0 0 auto;font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Le 16 settimane, la stessa misura' : 'All 16 weeks, same measure'}</span>
        <div style="flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:3px;">${barsHtml}</div>
        <span style="flex:0 0 auto;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);text-wrap:pretty;">${LANG === 'it' ? 'Aderenza complessiva per settimana · fondo scala 50%' : 'Overall adherence per week · 50% baseline'}</span>
      </div>
    </div>`;

  // ---- Integratori ----
  const dayHeadInitials = wk.dowInitial.map(l => `<span style="text-align:center;font-size:var(--fs-2xs);font-weight:600;color:var(--ink2);text-transform:uppercase;">${l}</span>`).join('');
  const suppRowsHtml = wk.suppRows.map(r => {
    const cells = r.cells.map(c => {
      const st = INJ_CELL_STYLE[c.state];
      return `<span style="height:19px;border-radius:var(--r-xs);background:${st.bg};border:1px solid ${st.border};display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:${st.ink};cursor:pointer;">${st.mark}</span>`;
    }).join('');
    return `
                <div style="display:grid;grid-template-columns:130px repeat(7,1fr);gap:2px;align-items:center;">
                  <span style="font-size:var(--fs-xs);font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.label)}</span>
                  ${cells}
                </div>`;
  }).join('');
  const suppCard = `
    <div style="grid-column:1 / 5;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.supplements}</span>
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.suppDoneTot}/${wk.suppApplTot}</span>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:130px repeat(7,1fr);gap:2px;"><span></span>${dayHeadInitials}</div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;">${suppRowsHtml}</div>
    </div>`;

  // ---- Sedute della settimana ----
  const maxVol = Math.max(1, ...wk.sessions.map(s => s.vol));
  const sessRows = wk.sessions.map(s => `
        <div onclick="selDate='${s.dateISO}';oggiViewMode='day';render();" style="display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line2);cursor:pointer;">
          <span style="flex:0 0 30px;font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${s.dow}</span>
          <span style="flex:0 0 58px;font-size:var(--fs-xs);font-weight:600;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.type)}</span>
          <div style="flex:1 1 auto;min-width:0;height:5px;border-radius:var(--r-pill);background:var(--line2);overflow:hidden;">
            <div style="height:100%;width:${s.vol ? Math.round(s.vol / maxVol * 100) : 0}%;border-radius:var(--r-pill);background:${s.done ? 'var(--accent)' : 'var(--line)'};"></div>
          </div>
          <span style="flex:0 0 auto;font-size:var(--fs-xs);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${s.vol ? nf(s.vol / 1000, 1) + 'k' : '—'}</span>
          <span style="flex:0 0 38px;text-align:right;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${s.dur ? Math.round(s.dur) + '′' : '—'}</span>
          <span style="flex:0 0 26px;text-align:right;font-size:var(--fs-2xs);font-weight:600;color:${s.rpe != null && s.rpe >= 8 ? 'var(--warn-ink)' : 'var(--ink2)'};font-variant-numeric:tabular-nums;">${s.rpe != null ? s.rpe : '—'}</span>
        </div>`).join('');
  const sedCard = `
    <div style="grid-column:5 / 9;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.training}</span>
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.woDone}/${wk.woTot} ${LANG === 'it' ? 'sedute' : 'sessions'}</span>
      </div>
      <div style="flex:0 0 auto;display:flex;gap:16px;">
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:var(--fs-2xs);color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">Volume</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:var(--fs-2xl);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekVolume / 1000, 1)}k</span><span style="font-size:var(--fs-2xs);color:var(--ink3);">kg</span></div>
        </div>
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:var(--fs-2xs);color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Tempo' : 'Time'}</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:var(--fs-2xl);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekDurationMin / 60, 1)}</span><span style="font-size:var(--fs-2xs);color:var(--ink3);">h</span></div>
        </div>
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:var(--fs-2xs);color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Calorie' : 'Calories'}</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:var(--fs-2xl);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekKcal / 1000, 1)}k</span><span style="font-size:var(--fs-2xs);color:var(--ink3);">kcal</span></div>
        </div>
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:1px;">${sessRows || `<span style="font-size:var(--fs-xs);color:var(--ink3);padding-top:8px;">${LANG === 'it' ? 'Nessuna sessione ancora' : 'No sessions yet'}</span>`}</div>
    </div>`;

  // ---- Soggettivo: 8 medie + 3 categorici ----
  const SUBJ_LABELS = { energia: L.subj.energia, recupero: L.subj.recupero, umore: L.subj.umore, rpe: L.subj.rpe, appetito: L.subj.appetito, sonno_sogg: L.subj.sonno_sogg, libido: L.subj.libido, chiarezza: L.subj.chiarezza };
  const SUBJ_COLORS = { energia: 'var(--accent)', recupero: 'var(--c-subj-recupero)', umore: 'var(--warn)', rpe: 'var(--ink3)', appetito: 'var(--c-subj-appetito)', sonno_sogg: 'var(--c-subj-sonno)', libido: 'var(--bad)', chiarezza: 'var(--c-subj-chiarezza)' };
  const prevSubj = weekIdx > 0 ? weekAggregate(weekIdx - 1).subjSeries : null;
  const subjTiles = Object.keys(SUBJ_LABELS).map(k => {
    const arr = wk.subjSeries[k];
    const cur = wk.avg(arr), prev = prevSubj ? wk.avg(prevSubj[k]) : null;
    const dt = deltaTxt(cur, prev, '1');
    const sp = svgPath(arr, 100, 16, 3);
    return `
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:var(--fs-2xs);color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${SUBJ_LABELS[k]}</span>
          <div style="display:flex;align-items:baseline;gap:4px;">
            <span style="font-size:var(--fs-lg);font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${cur == null ? '—' : nf(cur)}</span>
            ${dt ? `<span style="font-size:var(--fs-2xs);font-weight:600;color:${dt.color};font-variant-numeric:tabular-nums;">${dt.txt}</span>` : ''}
          </div>
          <svg viewBox="0 0 100 16" preserveAspectRatio="none" style="width:100%;height:15px;display:block;overflow:visible;">
            <path d="${sp.d}" fill="none" stroke="${SUBJ_COLORS[k]}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>`;
  }).join('');

  const CAT_LABELS3 = { pienezza_add: L.subj.pienezza_add, ritenzione: L.subj.ritenzione, formicolio: L.subj.formicolio };
  const catRowsHtml = wk.catRows.map(r => {
    const cells = r.cells.map(c => {
      if (c.val == null) return `<span style="height:17px;border-radius:var(--r-xs);background:transparent;border:1px solid var(--line);display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:var(--ink3);cursor:pointer;"></span>`;
      const table = r.key === 'formicolio' ? CAT_CELL_COLORS.formicolio : CAT_CELL_COLORS.default;
      const col = table[c.val] || table[0];
      const mark = c.val === 0 ? '·' : c.val;
      return `<span style="height:17px;border-radius:var(--r-xs);background:${col.bg};display:flex;align-items:center;justify-content:center;font-size:var(--fs-2xs);font-weight:700;color:${col.ink};cursor:pointer;">${mark}</span>`;
    }).join('');
    return `
        <div style="display:grid;grid-template-columns:96px repeat(7,1fr);gap:2px;align-items:center;">
          <span style="font-size:var(--fs-2xs);font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(CAT_LABELS3[r.key])}</span>
          ${cells}
        </div>`;
  }).join('');

  const subjCard = `
    <div style="grid-column:9 / 13;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:var(--fs-sm);font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.subjective}</span>
        <span style="font-size:var(--fs-xs);font-weight:500;color:var(--ink3);">${LANG === 'it' ? 'media' : 'average'} · ${L.subjScale}</span>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(4,1fr);gap:8px 12px;">${subjTiles}</div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:5px;padding-top:9px;border-top:1px solid var(--line);">
        <span style="flex:0 0 auto;font-size:var(--fs-2xs);font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Categorici · giorno per giorno' : 'Categorical · day by day'}</span>
        ${catRowsHtml}
        <div style="flex:0 0 auto;display:flex;gap:9px;flex-wrap:wrap;padding-top:4px;">
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:var(--r-xs);background:var(--line2);"></span>0</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:var(--r-xs);background:var(--accent-soft);"></span>1</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:var(--r-xs);background:var(--warn-bg);"></span>2</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:var(--fs-2xs);font-weight:500;color:var(--ink3);"><span style="width:11px;height:11px;border-radius:var(--r-xs);background:var(--bad-bg);"></span>3</span>
        </div>
      </div>
    </div>`;

  if (isDesktop) {
    return `
      ${renderDayNav()}
      <div style="flex:1 1 auto;min-height:0;overflow-y:auto;display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,min-content);gap:9px;align-content:start;">
        ${recapCard}${pesoCard}${injCard}${adherenceCard}${suppCard}${sedCard}${subjCard}
      </div>`;
  }

  // ---- MOBILE: stessa aggregazione dati, una colonna sola ----
  const recapCardM = `
    <div style="flex:0 0 auto;border-radius:var(--r-2xl);background:var(--hero);padding:16px 18px;display:flex;flex-direction:column;gap:9px;">
      <span style="display:flex;align-items:center;gap:7px;font-size:var(--fs-xs);font-weight:600;color:var(--on-dark-2);">
        <span style="width:6px;height:6px;border-radius:50%;flex:0 0 auto;background:${recapDot};"></span>${recapLabel} · ${rangeTxt}
      </span>
      <span style="font-size:var(--fs-2xl);line-height:1.25;letter-spacing:-.012em;font-weight:700;color:var(--white);text-wrap:pretty;">${esc(recapTitle)}</span>

/* ------------------------------------------------------------
   Vista Oggi completa — nav settimana/giorno + card riepilogo
   (nuove, 09/09/2026) sopra la day-card esistente (invariata).
   ------------------------------------------------------------ */
function renderOggiFull() {
  const L = t();
  const a = adherence(store.blob);
  const wHist = weightHistory(pesoRange, selDate);
  const wTrend = weeklyTrend(wHist);
  const hrvHist = (() => {
    const dIdx = dayIdxFromISO(selDate), from = Math.max(0, dIdx - 13);
    const arr = [];
    for (let i = from; i <= dIdx; i++) {
      const rec = (store.blob && store.blob['p2_day_' + i]) || {};
      const lo = parseFloat(rec.hrv_min), hi = parseFloat(rec.hrv_max);
      if (!isNaN(lo) && !isNaN(hi)) { arr.push((lo + hi) / 2); continue; }
      const real = parseFloat(rec.hrv);
      arr.push(isNaN(real) ? null : real);
    }
    return arr;
  })();
  const hrvTrend = weeklyTrend(hrvHist);
  const hero = buildHeroNarrative(a, wTrend, hrvTrend);

  const lastPeso = wHist.filter(v => v !== null).pop();
  const pesoDelta = (lastPeso !== undefined) ? (lastPeso - T0_PESO) : null;
  const trendTxt = wTrend === null ? '—' : `${wTrend >= 0 ? '+' : ''}${wTrend.toFixed(2)} kg / sett. su ${pesoRange}gg`;

  const s = renderOggiSections();

  // Dati di giorno/settimana/allenamento, serve sia per la riga di stato
  // dell'hero sia per il controllo override spostato dentro Allenamento
  // su desktop (vedi sotto — non più una banda a sé stante).
  const day = getDay(selDate);
  const dayIdx = dayIdxFromISO(selDate);
  const wo = getWorkout2(dayIdx);
  const rest = wo.type === 'Riposo';
  const slots = getInjectionSlots2(dayIdx);
  const weekN = Math.floor(dayIdx / 7) + 1;
  const isOverridden = !!day.wo_override;

  function splitDose(f) {
    const m = f.match(/^(.*?)\s+(\d+(?:[.,]\d+)?\s?(?:mcg|mg|g|ml)(?:\s+(?:dx|sx))?)$/i);
    return m ? { name: m[1], dose: m[2] } : { name: f, dose: '' };

  const injDoneCount = flatDoses.filter(fd => day[fd.stateKey] === 'fatto').length;

  const heroCard = `
    <section style="grid-column:1 / 6;grid-row:1 / 2;border-radius:var(--r-card);background:var(--hero);padding:20px 22px;display:flex;flex-direction:column;gap:14px;overflow:hidden;">

          <input class="field-value" style="width:44px" type="number" value="${day.bp_dia || ''}" placeholder="—" oninput="patch(selDate,'bp_dia',this.value)">

      </div>
      <div class="field-row">
        <div class="field-label">HRV</div>
        ${(!day.hrv_min && !day.hrv_max && day.hrv)
          ? `<span class="field-value" style="color:var(--ink3)" title="${LANG === 'it' ? 'Media storica, di sola lettura' : 'Historical average, read-only'}">${esc(day.hrv)}</span><span class="field-value-unit">ms</span>`
          : `<input class="field-value" style="width:44px" type="number" value="${day.hrv_min || ''}" placeholder="min" oninput="patch(selDate,'hrv_min',this.value)"><span class="field-value-unit">–</span><input class="field-value" style="width:44px" type="number" value="${day.hrv_max || ''}" placeholder="max" oninput="patch(selDate,'hrv_max',this.value)"><span class="field-value-unit">ms</span>`}
      </div>
      <div class="field-row">
        <div class="field-label">RHR</div>
        <input class="field-value" type="number" value="${day.rhr || ''}" placeholder="—" oninput="patch(selDate,'rhr',this.value)"><span class="field-value-unit">bpm</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Sonno' : 'Sleep'}</div>

          <input class="field-value" style="width:70px" type="text" value="${day.ore_sonno || ''}" placeholder="5.18" oninput="patch(selDate,'ore_sonno',this.value)">
          <div class="field-sub">${sonnoTxt} · REM ${day.sonno_rem_min || '—'}m · Prof. ${day.sonno_profondo_min || '—'}m · ${day.sonno_risvegli || '—'} risvegli</div>
        </div>
      </div>
    </div>`;

  // Riepilogo compatto degli stessi dati biometrici — SOLO desktop (dentro la
  // card Peso, come nel mockup approvato). Su mobile resta nascosto via CSS:
  // i dati restano editabili nella sezione Biometria sopra, questo è solo un
  // riepilogo a colpo d'occhio in più, non un secondo posto dove scrivere.
  const biometriaChips = `
    <div class="biometria-chips">
      <div class="biometria-chip"><span class="biometria-chip-label">${L.tile.pressione}</span><span class="biometria-chip-value">${day.bp_sys || '—'}/${day.bp_dia || '—'}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Profondo</span><span class="biometria-chip-value">${day.sonno_profondo_min || '—'}m</span></div>

  const iniezioni = `
    <div class="section">
      <div class="section-label">${L.injections}</div>
      ${slots.map(s => `
        <div class="slot-hdr">${L.slotLabels[s.label] || s.label}${s.igfMuscle !== undefined ? ` · ${L.district}: <select class="subj-select" style="font-size:var(--fs-xs);padding:2px 5px" onchange="patch(selDate,'inj_${s.n}_distretto',this.value)"><option value="">${L.choose}</option>${['Petto','Bicipiti','Deltoidi','Tricipiti','Quadricipiti'].map(m => `<option value="${m}" ${(day['inj_' + s.n + '_distretto'] || s.igfMuscle) === m ? 'selected' : ''}>${siteLabel(m)}</option>`).join('')}</select>` : ''}</div>
        ${s.fields.map(f => {

          <div class="state-row">
            <span class="state-name">${f}</span>
            ${!isIgf ? `<select class="state-site" onchange="patch(selDate,'${stKey}_sito',this.value)">

  // Versione desktop: niente intestazione "Mattino/Pomeriggio/Sera" a riga
  // propria (occupava una riga intera nel mockup non c'è) — l'orario è
  // inline nel nome della riga stessa. L'unica eccezione è il selettore
  // distretto post-WO, che resta un'intestazione perché è un controllo, non
  // solo un'etichetta.
  const iniezioniDesktop = `
    <div class="section">
      <div class="section-label">${L.injections}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : slots.map(s => `

        ${s.fields.map(f => {
          const fkeyRaw = fieldKey(f);

  const integratori = `
    <div class="section">
      <div class="section-label">${L.supplements}</div>
      ${SUPP_FIELDS.map(sf => `
        <div class="state-row">
          <span class="state-name">${SUPP_LABELS[sf]}</span>

  const legend = `
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf);border:1.5px solid var(--line)"></div>—</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--ok)"></div>${L.doseDone}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf);border:1.5px solid var(--warn)"></div>${L.doseSkip}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf2)"></div>${L.doseNa}</div>

  // motra_log è salvato come stringa JSON (come index.html), non oggetto —
  // va parsato esplicitamente, con guardia in caso manchi o sia malformato.
  const motraLog = (() => {
    if (!day.motra_log) return null;
    if (typeof day.motra_log === 'object') return day.motra_log;
    try { return JSON.parse(day.motra_log); } catch (e) { return null; }
  })();
  const exList = (motraLog && Array.isArray(motraLog.exercises)) ? motraLog.exercises : null;
  const exercises = exList ? `
    <div class="exercises-block">
      <div class="field-label" style="margin-bottom:6px">${L.exercises}</div>
      ${exList.map(ex => {
        const working = (ex.sets || []).filter(s => s.label !== 'W');
        const reps = working[0] ? working[0].reps : (ex.sets && ex.sets[0] ? ex.sets[0].reps : '—');
        return `<div class="exercise-row"><span>${ex.name}</span><span class="exercise-sets">${working.length || (ex.sets || []).length}×${reps}</span></div>`;
      }).join('')}
    </div>` : `<div class="exercise-empty">${LANG === 'it' ? 'Nessun log Motra importato per questo giorno.' : 'No Motra log imported for this day.'}</div>`;

  const allenamento = `
    <div class="section">
      <div class="section-label">${L.training}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : `
      <div class="field-row">
        <div class="field-label">Volume</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_volume || ''}" placeholder="—" oninput="patch(selDate,'wo_volume',this.value)"><span class="field-value-unit">kg</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Durata' : 'Duration'}</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_durata || ''}" placeholder="—" oninput="patch(selDate,'wo_durata',this.value)"><span class="field-value-unit">min</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Calorie' : 'Calories'}</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_kcal || ''}" placeholder="—" oninput="patch(selDate,'wo_kcal',this.value)"><span class="field-value-unit">kcal</span>
      </div>
      ${exercises}`}
    </div>`;

  // Desktop: Durata/Volume/Calorie su un'unica riga compatta a 3 colonne,
  // come nel mockup, invece di tre field-row impilate.
  const allenamentoDesktop = `
    <div class="section">
      <div class="section-label">${L.training}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : `
      <div class="wo-fields-row">
        <div class="wo-field"><span class="wo-field-label">${LANG === 'it' ? 'Durata' : 'Duration'}</span><div class="wo-field-val"><input type="number" value="${day.wo_durata || ''}" placeholder="—" oninput="patch(selDate,'wo_durata',this.value)"><span class="wo-field-unit">min</span></div></div>
        <div class="wo-field"><span class="wo-field-label">Volume</span><div class="wo-field-val"><input type="number" value="${day.wo_volume || ''}" placeholder="—" oninput="patch(selDate,'wo_volume',this.value)"><span class="wo-field-unit">kg</span></div></div>
        <div class="wo-field"><span class="wo-field-label">${LANG === 'it' ? 'Calorie' : 'Calories'}</span><div class="wo-field-val"><input type="number" value="${day.wo_kcal || ''}" placeholder="—" oninput="patch(selDate,'wo_kcal',this.value)"><span class="wo-field-unit">kcal</span></div></div>
      </div>
      ${exercises}`}
    </div>`;

  const soggettivo = `
    <div class="section">
      <div class="section-label">${L.subjective}</div>
      ${['energia', 'recupero', 'umore', 'libido', 'chiarezza', 'rpe', 'appetito'].map(sf => `
        <div class="field-row">
          <div class="field-label">${L.subj[sf]}</div>
          <select class="subj-select" onchange="patch(selDate,'${sf}',this.value)">
            <option value="">—</option>
            ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}" ${day[sf] == n ? 'selected' : ''}>${n}/10</option>`).join('')}
          </select>
        </div>`).join('')}
      ${['ritenzione', 'formicolio', 'pienezza_add'].map(sf => `
        <div class="field-row">
          <div class="field-label">${L.subj[sf]}</div>
          <select class="subj-select" onchange="patch(selDate,'${sf}',this.value)">
            <option value="">—</option>
            ${ENUM_LABELS[sf].map((lbl, i) => `<option value="${i}" ${day[sf] == i ? 'selected' : ''}>${lbl}</option>`).join('')}
          </select>
        </div>`).join('')}
      <div class="field-row">
        <div class="field-label">${L.subj.sonno_sogg}</div>
        <select class="subj-select" onchange="patch(selDate,'sonno_sogg',this.value)">
          <option value="">—</option>
          ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}" ${day.sonno_sogg == n ? 'selected' : ''}>${n}/10</option>`).join('')}
        </select>
      </div>
    </div>`;

  // Desktop: griglia 2 colonne (verificata a fare i conti, non 3 — vedi nota
  // CSS sopra), barre a segmenti per i punteggi 1-10, pillole cliccabili per
  // le scale testuali — non più menu a tendina, sono proprio controlli diversi.
  const soggettivoDesktop = `
    <div class="section">
      <div class="section-label">${L.subjective}</div>
      <div class="subj-grid-2">
        <div class="field-row"><div class="field-label">${L.subj.energia}</div>${barHtml('energia', day.energia)}</div>
        <div class="field-row"><div class="field-label">${L.subj.recupero}</div>${barHtml('recupero', day.recupero)}</div>
        <div class="field-row"><div class="field-label">${L.subj.umore}</div>${barHtml('umore', day.umore)}</div>
        <div class="field-row"><div class="field-label">${L.subj.libido}</div>${barHtml('libido', day.libido)}</div>
        <div class="field-row"><div class="field-label">${L.subj.chiarezza}</div>${barHtml('chiarezza', day.chiarezza)}</div>
        <div class="field-row"><div class="field-label">${L.subj.rpe}</div>${barHtml('rpe', day.rpe)}</div>
        <div class="field-row"><div class="field-label">${L.subj.appetito}</div>${barHtml('appetito', day.appetito)}</div>
        <div class="field-row"><div class="field-label">${L.subj.sonno_sogg}</div>${barHtml('sonno_sogg', day.sonno_sogg)}</div>
        <div class="field-row"><div class="field-label">${L.subj.ritenzione}</div>${pillHtml('ritenzione', day.ritenzione, ENUM_LABELS.ritenzione)}</div>
        <div class="field-row"><div class="field-label">${L.subj.formicolio}</div>${pillHtml('formicolio', day.formicolio, ENUM_LABELS.formicolio)}</div>
        <div class="field-row"><div class="field-label">${L.subj.pienezza_add}</div>${pillHtml('pienezza_add', day.pienezza_add, ENUM_LABELS.pienezza_add)}</div>
      </div>
    </div>`;

  const note = `
    <div class="section">
      <div class="section-label">${L.notes}</div>
      <textarea style="width:100%;border:1px solid var(--line);border-radius:var(--r-md);padding:8px;font-family:inherit;font-size:var(--fs-base);min-height:60px;background:var(--surf2);color:var(--ink)" placeholder="—" oninput="patch(selDate,'note',this.value)">${day.note || ''}</textarea>
    </div>`;

  return { hdr, biometria, biometriaChips, iniezioni, iniezioniDesktop, integratori, legend, allenamento, allenamentoDesktop, soggettivo, soggettivoDesktop, note };
}

// Vista mobile della card giorno — invariata rispetto a prima: un'unica
// day-card con tutte le sezioni impilate. Ora è solo un assemblaggio dei
// frammenti di renderOggiSections(), la logica dei campi non è duplicata.
function renderOggi() {
  const s = renderOggiSections();
  return `
  <div class="day-card">
    ${s.hdr}
    ${s.biometria}
    ${s.iniezioni}
    ${s.integratori}
    ${s.legend}
    ${s.allenamento}
    ${s.soggettivo}
    ${s.note}
  </div>
  `;
}
function bindOggi() {
  if (!MIGRATED[tab] || tab !== 'oggi' || !store.loaded) return;
  const app = document.getElementById('app');

  // Grafico peso e gauge aderenza sono SVG inline sia su mobile che su
  // desktop (portati verbatim dai due export reali) — niente più canvas
  // da ridisegnare qui, solo handler sui data-attributi delle celle
  // interattive, condivisi tra le due viste.
  //
  // Bug corretto 15/09/2026 (segnalato da iPhone, Safari e Chrome — quindi
  // WebKit, non uno specifico browser): i campi testo/numero salvavano
  // SOLO su 'onchange', che su un <input> scatta solo quando il campo
  // perde il focus. Su mobile questo non è affidabile: se l'utente scrive
  // un valore e poi cambia scheda, blocca lo schermo, o comunque non
  // "sfoca" il campo in modo pulito, onchange può non scattare mai —
  // patch() non viene mai chiamato, non c'è nulla in coda, e il pulsante
  // Salva sembra inerte perché non ha davvero nulla da salvare. Ora
  // 'oninput' (che scatta a ogni tasto premuto, sempre affidabile)
  // aggiorna silenziosamente lo stato e mette in coda il salvataggio
  // SENZA il render() completo di patch() — che ricostruirebbe il campo
  // a ogni carattere, interrompendo la digitazione. 'onchange' resta per
  // il render completo (percentuali di aderenza, ecc.) quando il campo
  // si sistema.
  app.querySelectorAll('[data-f]').forEach(el => {
    el.oninput = () => patchSilent(selDate, el.dataset.f, el.value);
    el.onchange = () => patch(selDate, el.dataset.f, el.value);
  });
  app.querySelectorAll('[data-range]').forEach(el => {
    el.onclick = () => { pesoRange = +el.dataset.range; render(); };
  });
  app.querySelectorAll('[data-week]').forEach(el => {
    el.onclick = () => jumpToWeek(+el.dataset.week);
  });
  app.querySelectorAll('[data-injdose]').forEach(el => {
    const k = +el.dataset.injdose;
    el.onclick = () => {
      // ricostruita qui invece di richiamare renderOggiFull: ci serve solo
      // la stessa lista appiattita di dosi per risalire alla stateKey di k.
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[k];
      if (fd) guardedToggle('inj-' + k, () => cycleInjState(dayIdx2, fd.n, fd.f));
    };
  });
  app.querySelectorAll('[data-injmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.injmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-injsite]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [k, site] = el.dataset.injsite.split('|');
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[+k];
      if (!fd) return;
      const siteKey = fd.isIgf ? ('inj_' + fd.n + '_distretto') : ('inj_' + fd.n + '_' + fieldKey(fd.f) + '_sito');
      const cur = getDay(selDate)[siteKey] || '';
      openMenu = null;
      patch(selDate, siteKey, cur === site ? '' : site);
    };
  });
  app.querySelectorAll('[data-suppdose]').forEach(el => {
    el.onclick = () => guardedToggle('supp-' + el.dataset.suppdose, () => cycleSuppState(el.dataset.suppdose));
  });
  app.querySelectorAll('[data-subjpip]').forEach(el => {
    el.onclick = () => {
      const [key, n] = el.dataset.subjpip.split('|');
      const cur = parseInt(getDay(selDate)[key], 10) || 0;
      patch(selDate, key, cur === +n ? 0 : +n); // ritocco sullo stesso pip azzera
    };
  });
  app.querySelectorAll('[data-subjmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.subjmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-subjenum]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [key, idx] = el.dataset.subjenum.split('|');
      openMenu = null;
      patch(selDate, key, idx);
    };
  });
}

/* Un click fuori dalle celle interattive chiude qualunque menù aperto
   (sede iniezione / valore categorico) — porting diretto dal riferimento. */
document.addEventListener('click', () => {
  if (openMenu) { openMenu = null; render(); }
});

window.addEventListener('hashchange', () => {
  tab = location.hash.replace('#', '') || 'oggi';
  render();
});

// Ridisegna quando si attraversa la soglia desktop (non ad ogni pixel di
// resize, solo quando cambia effettivamente il layout da mostrare).
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const nowDesktop = window.innerWidth >= 1024;
    if (nowDesktop !== isDesktop) { isDesktop = nowDesktop; render(); }
  }, 150);
});


/* ════════════════════════ GESTIONE (Stock · Orari · Alimenti) ════════════════════════
   PORTING 25/09: nuovo modulo, dati e formule dalla specifica SPEC_GESTIONE.md e dal
   codice reale di V1 (index.html): array compounds/UC_PEPTIDES, chiavi vial
   (compoundId_supplierKey_vN), countVialDosesUsed, calcExpiry, stSty. Ogni formula
   verificata contro i numeri della specifica prima di essere collegata ai dati veri.
   Le 7 decisioni aperte della specifica: vedi commento GST_DECISIONI più sotto. */

// PORTING 25/09: le 7 decisioni della specifica (SPEC_GESTIONE.md §4), risolte così:
// 1) consumabili_stock {sc,im,bac} -- nuovo campo creato su store.blob, seminato con
//    i valori oggi fissi in V1 (SC 390, IM 210, BAC 24), poi modificabile e salvato.
// 2) Pasto in Alimenti -- solo in sessione, come V1 (nessun nuovo campo).
// 3) Flacone BAC da 10 mL -- usato come da specifica; è un'ipotesi di Giorgio, non mia,
//    da confermare con lui (non verificabile da qui).
// 4) Composto senza vial in uso -- testo esatto proposto nella specifica §1.4.
// 5) Vial congelato/attesa nella copertura -- esclusi (scelta prudente: non ancora
//    utilizzabili, non contarli come copertura reale).
// 6) Quarto tipo di giornata (viaggio/malattia) -- non creato: nessun testo è stato

// non raggiungibili da qui -- versione locale, con separatore delle migliaia col punto come
// richiesto dalla specifica ("Migliaia col punto: 5.000"), assente nell'originale di ANV2.
function gstIt(v, dec){
  if (v == null || isNaN(v)) return "\u2014";
  var s = (dec == null ? String(v) : Number(v).toFixed(dec));
  var parts = s.split(".");
  parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
  s = parts.join(",");
  return s.replace("-", "\u2212");
}
function gstItSigned(v, dec){
  if (v == null || isNaN(v)) return "\u2014";
  return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + gstIt(Math.abs(v), dec);
}
// PORTING 25/09: gstNum() e' anch'essa privata alla closure di ANV2 -- stessa ragione di gstIt.
function gstNum(raw){
  if (raw == null || raw === "") return null;
  var v = parseFloat(String(raw).replace(",", "."));
  return isNaN(v) ? null : v;
}

function gstVialKey(compoundId, supplierKey, n){ return compoundId+"_"+supplierKey+"_v"+n; }

function gstAllVials(c, vd){

// ── conteggio dosi reali fatte per composto (MIRROR di countVialDosesUsed, V1) ──
function gstDosesUsed(compoundName, compoundId, doseMcg, recoStr){
  if (!recoStr || !doseMcg) return null;
  var recoDate = new Date(recoStr+"T00:00:00");
  var today = new Date(); today.setHours(0,0,0,0);
  if (recoDate > today) return 0;
  var mcgUsed = 0;
  var testStart = new Date(TEST_PROTO_START+"T00:00:00");
  var testEnd = new Date(testStart); testEnd.setDate(testEnd.getDate()+TEST_PROTO_DAYS-1);
  for (var d=new Date(Math.max(recoDate, testStart)); d<=today; d.setDate(d.getDate()+1)){
    var rec, woIdx;
    if (d>=testStart && d<=testEnd){
      var t = Math.round((d-testStart)/86400000);
      rec = store.blob["test_proto_"+t] || {}; woIdx = t - TEST_PROTO_DAYS;
    } else {
      var dIdx = dayIdxFromISO(isoLocal(d));
      rec = store.blob["p2_day_"+dIdx] || {}; woIdx = dIdx;
    }
    getInjectionSlots2(woIdx).forEach(function(s){
      s.fields.forEach(function(f){
        if (f.indexOf(compoundName)!==0) return;
        var k = "inj_"+s.n+"_"+fieldKey(f);
        if ((rec[k]||"")==="fatto") mcgUsed += (compoundId==="igf") ? doseMcg/2 : doseMcg;
      });
    });
  }
  return mcgUsed/doseMcg;
}

function gstDoseTotals(c, mg){ return Math.floor(mg*1000/c.dose_mcg); }
function gstDaysBetween(a,b){ var A=new Date(a+"T00:00:00"), B=new Date(b+"T00:00:00"); return Math.round((B-A)/86400000); }
function gstAddDays(dateStr, n){ var d=new Date(dateStr+"T00:00:00"); d.setDate(d.getDate()+Math.round(n)); return d; }
function gstFmtDate(d){ return d.getDate()+" "+["gen","feb","mar","apr","mag","giu","lug","ago","set","ott","nov","dic"][d.getMonth()]; }

// ── esito 1.4: vince la prima condizione vera ──
function gstVialStatus(c, av, todayStr){
  if (!av || !av.reco) return null;
  var fatte = gstDosesUsed(c.name, c.id, c.dose_mcg, av.reco);
  if (fatte == null) fatte = 0;
  var totali = gstDoseTotals(c, av.mg);
  var rimaste = Math.max(0, totali - Math.round(fatte));
  var etaGiorni = gstDaysBetween(av.reco, todayStr);
  var vitaResidua = Math.max(0, c.stabilityDays - etaGiorni);
  var esito;
  if (vitaResidua <= 0) esito = { tipo:"scaduto", testo:"Scaduto: segna il vial come esaurito", col:"var(--bad)" };
  else if (rimaste === 0) esito = { tipo:"esaurite", testo:"Dosi esaurite: segna il vial come esaurito", col:"var(--bad)" };
  else {
    var giorniPerDosi = rimaste / c.voltePerDie;
    if (giorniPerDosi > vitaResidua) {
      var N = Math.round(rimaste - vitaResidua*c.voltePerDie);
      var scadeIl = gstAddDays(todayStr, vitaResidua);
      esito = { tipo:"scade", testo:"Scade il "+gstFmtDate(scadeIl)+" con "+N+" dosi non usate", col:"var(--warn-ink)" };
    } else {
      var finisceIl = gstAddDays(todayStr, giorniPerDosi);
      esito = { tipo:"finisce", testo:"Finisce per dosi il "+gstFmtDate(finisceIl), col:"var(--ink2)" };
    }
  }
  return { fatte:fatte, totali:totali, rimaste:rimaste, vitaResidua:vitaResidua, etaGiorni:etaGiorni, esito:esito };
}

// ── copertura 1.6 (esclude congelato/attesa: decisione #5) ──
function gstDurataVial(c){ return Math.min(gstDoseTotals(c, c.defaultMg)/c.voltePerDie, c.stabilityDays); }
function gstCopertura(c, vd, todayStr){
  var av = gstActiveVial(c, vd);
  var vs = gstAllVials(c, vd);
  var intatti = vs.filter(function(v){return v.stato==="intatto";}).length;
  var finiti = vs.filter(function(v){return v.stato==="esaurito";}).length;
  var persi = vs.filter(function(v){return v.stato==="perso";}).length;
  var usoRimasti = 0, st = null;
  if (av) { st = gstVialStatus(c, av, todayStr); if (st) usoRimasti = Math.min(st.rimaste/c.voltePerDie, st.vitaResidua); }
  var giorni = Math.floor(usoRimasti + intatti*gstDurataVial(c));
  return { intatti:intatti, finiti:finiti, persi:persi, giorni:giorni, vialInUso:av, statoInUso:st };
}

function gstMacroFor(food, qty){
  if (food.unit === "fixed") return { kcal: Math.round(food.kcal*qty), p: +(food.p*qty).toFixed(1), c: +(food.c*qty).toFixed(1), g: +(food.g*qty).toFixed(1) };
  var f = qty/100;
  return { kcal: Math.round(food.kcal*f), p: +(food.p*f).toFixed(1), c: +(food.c*f).toFixed(1), g: +(food.g*f).toFixed(1) };
}
function gstQtyLabel(food, qty){
  if (food.unit === "fixed") return food.barLabel ? (qty===1?"1 barretta":qty+" barrette") : (qty+" porz.");
  return qty+" g";
}

function GST_mount(){
  var root = document.querySelector('[data-gst-view="stock"]') ? document.body : null;
  root = document.body;
  var cycleEl = document.querySelector('[data-gst-cycle]');
  if (cycleEl) cycleEl.textContent = "Ciclo 1 \u00b7 giorno "+(gstE()+1)+" di 112 \u00b7 "+gstGiorniAllaFine()+" giorni alla fine";
  document.querySelectorAll('[data-gst-tab]').forEach(function(b){
    if (b.dataset.bound) return; b.dataset.bound = "1";
    b.addEventListener("click", function(){
      GST.subtab = b.getAttribute("data-gst-tab");
      document.querySelectorAll('[data-gst-tab]').forEach(function(x){ x.classList.toggle("is-active", x===b); });
      document.querySelectorAll('[data-gst-view]').forEach(function(v){ v.classList.toggle("is-active", v.getAttribute("data-gst-view")===GST.subtab); });
    });
  });
  if (!GST_V1.loaded) {
    GST_V1.loaded = true; // evita fetch doppie durante il caricamento
    fetch(CFG.PROXY_URL + "?user_id=eq.giorgio_protocollo_2026&select=data-%3Estock_v2_vials", {
      headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY }
    }).then(function(r){ return r.json(); }).then(function(rows){
      GST_V1.stock_v2_vials = (rows[0] && rows[0].stock_v2_vials) || {};
      GST_renderAll();
    }).catch(function(e){ console.error("Errore caricamento stock_v2_vials", e); GST_renderAll(); });
  }
  GST_renderAll();
}

function GST_renderAll(){
  GST_renderStock();
  GST_renderOrari();
  GST_renderAlimenti();
}

function GST_stockHero(){
  var vd = GST_V1.stock_v2_vials || {};
  var left = gstGiorniAllaFine();
  if (!Object.keys(vd).length) return CLIN_hero("Scorte \u00b7 peptidi", "Dati dei vial in caricamento\u2026", [{ v:String(left), l:"Giorni a fine ciclo" }]);
  var rows = GST_COMPOUNDS.map(function(c){ return { name:c.name, g:gstCopertura(c,vd,today).giorni }; });
  var red = rows.filter(function(r){ return r.g < left; }).sort(function(a,b){ return a.g-b.g; });
  var amber = rows.filter(function(r){ return r.g >= left && r.g < left+14; });
  var green = rows.length - red.length - amber.length;
  var sentence = red.length
    ? (red.length===1 ? red[0].name+" finisce tra "+red[0].g+" giorni, prima della fine del ciclo (tra "+left+")." :
       red.length+" composti non arrivano a fine ciclo: "+red.slice(0,3).map(function(r){ return r.name+" ("+r.g+" gg)"; }).join(", ")+(red.length>3?"\u2026":"")+".")
    : "Tutte le scorte coprono il ciclo (fine tra "+left+" giorni).";
  return CLIN_hero("Scorte \u00b7 fine ciclo tra "+left+" giorni", sentence, [
    { v:String(left), l:"Giorni a fine ciclo" },
    { v:String(red.length), l:"Non coprono il ciclo", c:red.length?"var(--bad-on-dark)":"var(--white)" },
    { v:String(amber.length), l:"Margine sotto 14 gg", c:amber.length?"var(--warn-on-dark)":"var(--white)" },
    { v:String(green), l:"Coperti", c:"var(--ok-on-dark)" } ]);
}

/* PORTING 28/09: registrazione di una nuova ricostituzione da V2 (prima si faceva solo da V1).
   Scrive SOLO stock_v2_vials sul record V1 (stessa forma di stockSetStato/stockSaveRecon di V1:
   {mg,bac,reco,stato} come stringhe), con lettura fresca subito prima, controllo che il vial
   scelto sia ancora intatto, vial in uso attuale -> esaurito, e rilettura di verifica dopo. */
function GST_recoTableVals(c){
  var reco = (store.blob && store.blob.peptide_reconstitution) || [];
  var r = reco.find(function(x){return x.id===c.id;});
  return { mg: r ? gstNum(r.vial_mg) : c.defaultMg, bac: r ? gstNum(r.bac_ml) : c.defaultBac };
}
function GST_recoSummary(c, vd, av){
  var f = GST.recoForm, mg = gstNum(f.mg), bac = gstNum(f.bac), parts = [];
  var t = gstAllVials(c, vd).find(function(v){return v.key===f.key;});
  if (t) parts.push("Verr\u00e0 ricostituito <strong>"+esc(t.sup)+" vial "+t.n+"</strong>"+(f.date?" il <strong>"+gstFmtDate(new Date(f.date+"T00:00:00"))+"</strong>":"")+(mg>0&&bac>0?": "+gstIt(mg,1)+" mg in "+gstIt(bac,1)+" mL":"")+".");
  if (av) parts.push("Il vial "+av.n+" ("+esc(av.sup)+") ora in uso verr\u00e0 segnato come esaurito.");
  if (mg>0 && bac>0){
    var u = gstUI(c.dose_mcg, gstConc(mg, bac));
    if (u!=null) parts.push("Da prelevare con questi valori: <strong>"+(c.bilat ? gstIt(u/2,1)+" UI/lato" : gstIt(u,1)+" UI")+"</strong> (dose "+c.dose_mcg+" mcg"+(c.bilat?" totali":"")+").");
    var tv = GST_recoTableVals(c);
    if (tv.mg!==mg || tv.bac!==bac) parts.push('<span style="color:var(--warn-ink);font-weight:600">Diversi dalla tabella ('+gstIt(tv.mg,1)+" mg in "+gstIt(tv.bac,1)+' mL): la tabella "Da prelevare" non si aggiorna da sola.</span>');
  }
  return parts.join(" ");
}
function GST_recoBlock(c, vd, av){

  if (GST.recoOpen !== c.id) return '<button type="button" data-gst-reco-open="'+c.id+'" style="'+btn+'">+ Ricostituisci nuovo vial</button>';
  var intact = gstAllVials(c, vd).filter(function(v){return v.stato==="intatto";});
  if (!intact.length) return '<span style="font-size:var(--fs-xs);font-weight:600;color:var(--bad)">Nessun vial intatto disponibile per questo composto.</span><button type="button" data-gst-reco-cancel style="'+btn+'">Chiudi</button>';
  var f = GST.recoForm;
  if (!intact.some(function(v){return v.key===f.key;})) f.key = intact[0].key;
  var fld = "height:30px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surf2);padding:0 8px;font-size:var(--fs-sm);font-weight:600;color:var(--ink);min-width:0;width:100%;box-sizing:border-box";

      '<label style="'+lab+'">BAC (mL)<input type="number" step="0.5" min="0" data-gst-reco-f="bac" value="'+esc(f.bac)+'" style="'+fld+'"></label>' +
