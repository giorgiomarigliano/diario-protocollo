<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>Diario Protocollo v2</title>
<link rel="apple-touch-icon" href="apple-touch-icon-v2.png">
<style>
  :root{
    --bg:#f4f4f6; --surf:#ffffff; --surf2:#f7f7f9; --line:#e4e4e8; --line2:#eeeef1;
    --ink:#0a0a0c; --ink2:#57575f; --ink3:#8a8a93;
    --accent:#1f5fbf; --accent-soft:#e7effc; --accent-ink:#1a4f9e;
    --hero:#0a0a0c;
    --ok:#2e9e4f; --warn:#f5c400; --warn-ink:#8a6d00; --bad:#d81e05; --idle:#b6b6be;
    --shadow:0 1px 2px rgba(10,10,14,.05), 0 8px 24px -8px rgba(10,10,14,.10);
    --shadow-lg:0 2px 4px rgba(10,10,14,.06), 0 24px 60px -20px rgba(10,10,14,.22);
    --r-card:16px;
  }
  [data-theme="dark"]{
    --bg:#000000; --surf:#131317; --surf2:#1b1b20; --line:#292930; --line2:#212127;
    --ink:#f5f5f7; --ink2:#9d9da6; --ink3:#6d6d76;
    --accent:#5b95e8; --accent-soft:#0f2340; --accent-ink:#9cc2f5;
    --hero:#131317;
    --ok:#3ecf65; --warn:#ffd426; --warn-ink:#ffd426; --bad:#ff4433; --idle:#4a4a54;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;height:100%;}
  body{
    background:var(--bg); color:var(--ink);
    font:400 15px/1.45 -apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,sans-serif;
    -webkit-font-smoothing:antialiased;
    padding-bottom:env(safe-area-inset-bottom);
  }
  a{color:var(--accent);text-decoration:none;}
  a:hover{text-decoration:underline;}
  input,textarea,select,button{font:inherit;color:inherit;}
  ::-webkit-scrollbar{width:8px;height:8px;}
  ::-webkit-scrollbar-thumb{background:rgba(128,128,140,.35);border-radius:8px;}
  ::-webkit-scrollbar-track{background:transparent;}

  /* ══ Card giorno — porting di day_card_mockup_v2.html (approvato dopo
     due iterazioni: pattern a righe uniforme, pallini di stato al posto
     delle tendine). Nessun colore nuovo: riusa le variabili sopra. ══ */
  .day-card{background:var(--surf);border-radius:var(--r-card);box-shadow:var(--shadow);overflow:hidden;max-width:600px;}
  .day-hdr{padding:18px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);flex-wrap:wrap;}
  .day-hdr-left{display:flex;align-items:baseline;gap:10px;}
  .day-date{font-size:18px;font-weight:600;letter-spacing:-.01em;}
  .day-meta{font-size:13px;color:var(--ink2);}
  .day-badge{font-size:12px;font-weight:600;padding:5px 12px;border-radius:980px;background:var(--accent-soft);color:var(--accent-ink);white-space:nowrap;}
  .day-badge.overridden{background:var(--warn);color:var(--warn-ink);}
  .day-override-sel{font-size:12px;color:var(--ink2);background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:4px 8px;}

  .section{padding:16px 22px;}
  .section + .section{border-top:1px solid var(--line);}
  .section-label{font-size:12px;font-weight:600;color:var(--ink2);margin-bottom:2px;letter-spacing:.01em;text-transform:uppercase;}

  .field-row{display:flex;align-items:center;justify-content:space-between;padding:11px 0;min-height:24px;gap:12px;}
  .field-row + .field-row{border-top:1px solid var(--line);}
  .field-label{font-size:15px;color:var(--ink);font-weight:400;}
  .field-value{font-size:17px;font-weight:600;letter-spacing:-.005em;color:var(--ink);border:none;background:transparent;text-align:right;font-family:inherit;width:90px;padding:0;}
  .field-value:focus{outline:none;background:var(--accent-soft);border-radius:6px;}
  .field-value-unit{font-size:13px;color:var(--ink3);font-weight:400;margin-left:2px;}
  .field-sub{font-size:13px;color:var(--ink2);}

  .state-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;gap:10px;}
  .state-row + .state-row{border-top:1px solid var(--line);}
  .state-name{font-size:15px;color:var(--ink);flex:1;min-width:0;}
  .state-site{font-size:11px;color:var(--ink3);background:var(--surf2);border:1px solid var(--line);border-radius:6px;padding:3px 6px;flex-shrink:0;max-width:120px;}
  .state-dot{
    width:26px;height:26px;border-radius:50%;flex-shrink:0;border:none;padding:0;
    display:flex;align-items:center;justify-content:center;
    border:1.5px solid var(--line);background:var(--surf);
    font-size:13px;font-weight:700;cursor:pointer;
  }
  .state-dot.fatto{background:var(--ok);border-color:var(--ok);color:#fff;}
  .state-dot.saltato,.state-dot.saltata{background:var(--surf);border-color:var(--warn);color:var(--warn-ink);}
  .state-dot.na{background:var(--surf2);border-color:var(--surf2);color:var(--ink3);}

  .slot-hdr{font-size:13px;font-weight:600;color:var(--ink3);padding-top:12px;padding-bottom:2px;}
  .slot-hdr:first-child{padding-top:0;}

  .legend{display:flex;gap:16px;padding:12px 22px;background:var(--surf2);font-size:11px;color:var(--ink2);align-items:center;flex-wrap:wrap;}
  .legend-item{display:flex;align-items:center;gap:6px;}
  .legend-dot{width:14px;height:14px;border-radius:50%;flex-shrink:0;}

  .subj-select{font-size:14px;color:var(--ink);background:var(--surf2);border:1px solid var(--line);border-radius:8px;padding:5px 8px;}
  .rest-msg{padding:24px 0;text-align:center;color:var(--ink2);font-size:14px;}

  /* ══ Navigazione giorno/settimana + card riepilogo — aggiunte 09/09/2026
     per portare il resto del mockup "Diario - Palette navy" approvato da
     Giorgio. Nessun colore nuovo: riusa le stesse variabili sopra. ══ */
  .oggi-top{display:flex;flex-direction:column;gap:10px;max-width:600px;margin-bottom:10px;}
  .view-toggle{display:flex;gap:2px;background:var(--surf2);border-radius:9px;padding:3px;align-self:flex-start;}
  .view-toggle button{border:none;background:transparent;padding:6px 14px;border-radius:7px;font-size:13px;font-weight:600;color:var(--ink2);cursor:pointer;}
  .view-toggle button.active{background:var(--surf);color:var(--ink);box-shadow:var(--shadow);}
  .week-tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px;}
  .week-tab{flex:0 0 auto;border:1px solid var(--line);background:var(--surf);color:var(--ink2);font-size:12.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;}
  .week-tab.active{background:var(--accent);border-color:var(--accent);color:#fff;}
  .day-strip{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;}
  .day-pill{border:1px solid var(--line);background:var(--surf);border-radius:10px;padding:8px 4px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:4px;}
  @media (min-width:1024px){
    .day-strip{grid-template-columns:repeat(7,1fr);}
    .day-pill{padding:6px 4px;gap:2px;}
    .day-pill-num{font-size:13px;}
    .day-pill-dow{font-size:9.5px;}
  }
  .day-pill.active{background:var(--accent);border-color:var(--accent);}
  .day-pill.active .day-pill-dow,.day-pill.active .day-pill-num{color:#fff;}
  .day-pill-dow{font-size:10.5px;font-weight:600;color:var(--ink2);text-transform:uppercase;}
  .day-pill-num{font-size:14px;font-weight:600;color:var(--ink);}

  /* ══ Testata desktop — rifatta il 10/09/2026 sul mockup "Mac 1340x852":
     le 16 settimane stanno su una riga sola (nessuno scroll), "Ciclo 1" e
     il pulsante warm-up sono nella stessa riga, tutta la pagina è centrata
     invece di allargarsi bordo a bordo. Sotto i 1024px resta tutto come
     prima (verificato, non toccato). ══ */
  .page-wrap{max-width:1320px;margin:0 auto;}
  @media (min-width:1024px){
    .week-row-desktop{display:flex;align-items:center;gap:14px;}
    .cycle-label{flex:0 0 auto;font-size:12.5px;font-weight:600;color:var(--ink2);white-space:nowrap;}
    .week-tabs-desktop{flex:1 1 auto;display:flex;gap:5px;min-width:0;}
    .week-tabs-desktop .week-tab{flex:1 1 0;min-width:0;padding:7px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
    .warmup-btn{flex:0 0 auto;border:1px solid var(--line);background:var(--surf2);color:var(--ink2);font-size:11.5px;font-weight:600;padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;text-decoration:none;}
    .warmup-btn:hover{background:var(--line2);}
    .header-actions{display:flex;align-items:center;gap:10px;}
    .sync-status{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:500;color:var(--ink2);white-space:nowrap;}
    .sync-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:0 0 auto;}
    .sync-dot.saving{background:var(--warn);}
    .sync-dot.error{background:var(--bad);}
    .save-btn{border:none;background:var(--accent);color:#fff;font-size:12.5px;font-weight:600;padding:7px 16px;border-radius:8px;cursor:pointer;white-space:nowrap;}
    .save-btn.saving{background:var(--ink3);cursor:default;}
  }
  .day-pill-dot{width:5px;height:5px;border-radius:50%;background:var(--idle);}
  .day-pill-dot.has-data{background:var(--ok);}
  .day-pill-dot.is-future{background:transparent;}

  .hero-card{background:var(--hero);color:#fff;border-radius:var(--r-card);padding:20px 22px;max-width:600px;box-shadow:var(--shadow);}
  .hero-status{display:flex;align-items:center;gap:6px;font-size:12px;color:#9d9da6;margin-bottom:10px;}
  .hero-status-dot{width:7px;height:7px;border-radius:50%;background:var(--ok);}
  .hero-title{font-size:19px;font-weight:700;line-height:1.3;margin-bottom:8px;letter-spacing:-.01em;}
  .hero-text{font-size:13.5px;line-height:1.55;color:#c8c8ce;}

  .weight-card{background:var(--surf);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 22px;max-width:600px;margin-top:10px;}
  .weight-card-hdr{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:2px;}
  .weight-value-row{display:flex;align-items:baseline;gap:6px;}
  .weight-value{font-size:32px;font-weight:700;letter-spacing:-.02em;}
  .weight-unit{font-size:14px;color:var(--ink3);}
  .weight-delta{font-size:13px;font-weight:600;color:var(--ok);}
  .weight-delta.neg{color:var(--bad);}
  .weight-chart-wrap{position:relative;margin:10px 0 6px;}
  .weight-foot{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;}
  .weight-trend-note{font-size:12px;color:var(--ink2);}
  .range-btns{display:flex;gap:2px;background:var(--surf2);border-radius:8px;padding:3px;}
  .range-btns button{border:none;background:transparent;padding:5px 10px;border-radius:6px;font-size:12px;font-weight:600;color:var(--ink2);cursor:pointer;}
  .range-btns button.active{background:var(--surf);color:var(--ink);box-shadow:var(--shadow);}

  .adherence-card{background:var(--surf);border-radius:var(--r-card);box-shadow:var(--shadow);padding:18px 22px;max-width:600px;margin-top:10px;}
  .adherence-title{font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;margin-bottom:14px;}
  .adherence-grid{display:flex;justify-content:space-between;gap:10px;}
  .adherence-item{display:flex;flex-direction:column;align-items:center;gap:8px;flex:1;}
  .adherence-ring-wrap{position:relative;width:56px;height:56px;}
  .adherence-ring-wrap canvas{position:absolute;top:0;left:0;width:56px;height:56px;}
  .adherence-pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:700;color:var(--ink);}
  .adherence-label{font-size:12.5px;font-weight:600;color:var(--ink);text-align:center;}
  .adherence-sub{font-size:11px;color:var(--ink3);}

  /* ══ Layout desktop a griglia — aggiunto 10/09/2026, porta il mockup
     "Diario - Palette navy" / artboard "Mac 1340x852" approvato da Giorgio.
     Sotto i 1024px resta tutto come prima (colonna singola, verificata). ══ */
  .biometria-chips{display:none;}
  @media (min-width:1024px){
    .oggi-grid{display:grid;grid-template-columns:repeat(12,1fr);gap:16px;align-items:stretch;}
    .oggi-grid .g-nav{grid-column:1/-1;}
    .oggi-grid .g-hero{grid-column:1/6;}       /* 5/12, come nel mockup */
    .oggi-grid .g-peso{grid-column:6/13;}      /* 7/12 */
    .oggi-grid .g-iniezioni{grid-column:1/7;}  /* 6/12 */
    .oggi-grid .g-adherence{grid-column:7/13;} /* 6/12 */
    .oggi-grid .g-integratori{grid-column:1/5;}     /* 4/12 */
    .oggi-grid .g-allenamento{grid-column:5/9;}     /* 4/12 */
    .oggi-grid .g-soggettivo{grid-column:9/13;}     /* 4/12 */
    .oggi-grid .g-legend{grid-column:1/-1;}
    .oggi-grid .g-note{grid-column:1/-1;}
    /* Le card che su mobile hanno un max-width fisso per restare leggibili
       a colonna singola devono invece riempire la loro cella di griglia. */
    .oggi-grid .hero-card,.oggi-grid .weight-card,.oggi-grid .adherence-card,
    .oggi-grid .day-card,.oggi-grid .oggi-top{max-width:none;margin-top:0;height:100%;}
    .oggi-grid .oggi-top{max-width:none;}
    /* Riepilogo biometrico compatto dentro la card Peso — solo desktop,
       come nel mockup. Su mobile i dati restano editabili sopra, invariati. */
    .biometria-chips{display:flex;flex-wrap:wrap;gap:16px;margin-top:14px;padding-top:14px;border-top:1px solid var(--line);}
    .biometria-chip{display:flex;flex-direction:column;gap:2px;min-width:64px;}
    .biometria-chip-label{font-size:10.5px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;}
    .biometria-chip-value{font-size:14px;font-weight:600;color:var(--ink);}
    .weight-value-input{border:none;background:transparent;font:inherit;font-size:32px;font-weight:700;letter-spacing:-.02em;color:var(--ink);width:110px;padding:0;}
    .weight-value-input:focus{outline:none;border-bottom:1.5px solid var(--accent);}
    .chip-input{border:none;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-size:14px;font-weight:600;color:var(--ink);padding:0 1px;text-align:center;}
    .chip-input:focus{outline:none;border-bottom-color:var(--accent);}

    /* Esercizi svolti (da motra_log) dentro Allenamento */
    .exercises-block{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);}
    .exercise-row{display:flex;justify-content:space-between;padding:5px 0;font-size:13px;color:var(--ink);}
    .exercise-sets{color:var(--ink2);font-weight:600;}
    .exercise-empty{margin-top:6px;padding-top:10px;border-top:1px solid var(--line);font-size:12.5px;color:var(--ink3);}

    /* Densità da cruscotto — sul mockup approvato le righe sono molto più
       compatte che su mobile (dove servono target di tocco più larghi).
       Restringo solo qui, sotto i 1024px resta tutto come prima. */
    .oggi-grid .field-row{padding:6px 0;min-height:0;}
    .oggi-grid .state-row{padding:5px 0;}
    .oggi-grid .section{padding:14px 18px;}
    .oggi-grid .day-hdr{padding:14px 18px;}
    .oggi-grid .field-sub,.oggi-grid .state-name,.oggi-grid .field-label{font-size:12.5px;}
    .oggi-grid .slot-hdr{font-size:11.5px;margin-top:6px;}

    /* Iniezioni — due colonne dense come nel mockup (stesso markup, il
       flusso CSS a colonne lo spezza da solo). L'orario è inline nel nome
       della riga (.inj-time), non più un'intestazione a riga intera. */
    .oggi-grid .g-iniezioni .section{column-count:2;column-gap:20px;}
    .oggi-grid .g-iniezioni .section-label{column-span:all;}
    .oggi-grid .g-iniezioni .slot-hdr{column-span:all;}
    .oggi-grid .rest-msg{column-span:all;}
    .oggi-grid .g-iniezioni .state-row{break-inside:avoid;}
    .inj-time{font-size:10.5px;color:var(--ink3);font-weight:400;}
    .oggi-grid .state-dot{width:20px;height:20px;font-size:11px;}

    /* Integratori — stesso trattamento a 2 colonne di Iniezioni: 9 righe in
       una sola colonna erano la seconda causa principale dei 3 schermi di
       scroll che Giorgio segnalava. */
    .oggi-grid .g-integratori .section{column-count:2;column-gap:20px;}
    .oggi-grid .g-integratori .section-label{column-span:all;}
    .oggi-grid .g-integratori .state-row{break-inside:avoid;}

    /* Soggettivo — 2 colonne, non 3. Calcolo verificato: la card è 4/12
       di una griglia 1280px con gap 16px = 416px di larghezza, meno il
       padding della card (36px) = 380px utilizzabili. Con 3 colonne
       sarebbero 113px l'una — non ci sta nemmeno la sola barra (10 segmenti
       ≈128px), da qui il testo tagliato che Giorgio ha visto. Con 2 colonne
       sono 180px l'una, margine reale verificato, non a occhio. */
    .subj-grid-2{display:grid;grid-template-columns:repeat(2,1fr);column-gap:20px;}
    .subj-grid-2 .field-row{flex-direction:column;align-items:flex-start;gap:4px;padding:8px 0;}
    .bar-row{display:flex;align-items:center;gap:8px;}
    .bar-segs{display:flex;gap:2px;}
    .bar-seg{width:11px;height:11px;border-radius:2.5px;background:var(--line);cursor:pointer;}
    .bar-seg.filled{background:var(--accent);}
    .bar-val{font-size:11.5px;color:var(--ink2);font-weight:600;min-width:26px;}
    .pill-cycle{border:none;background:var(--accent-soft);color:var(--accent-ink);font:inherit;font-size:12px;font-weight:600;padding:4px 12px;border-radius:999px;cursor:pointer;}

    /* Allenamento desktop — Durata/Volume/Calorie su una riga sola invece
       di tre field-row impilate. */
    .wo-fields-row{display:flex;gap:28px;padding:8px 0 2px;}
    .wo-field{display:flex;flex-direction:column;gap:4px;}
    .wo-field-label{font-size:11px;color:var(--ink3);text-transform:uppercase;}
    .wo-field-val{display:flex;align-items:baseline;gap:4px;}
    .wo-field-val input{border:none;border-bottom:1px solid var(--line);background:transparent;font:inherit;font-size:15px;font-weight:600;color:var(--ink);width:44px;padding:0;}
    .wo-field-val input:focus{outline:none;border-bottom-color:var(--accent);}
    .wo-field-unit{font-size:11px;color:var(--ink3);}
  }

  /* ══ ANDAMENTO v2 — porting di produzione/andamento_v2_*.html (Claude Design). ══ */
.an-root{--bg:#f4f4f6; --surf:#ffffff; --surf2:#f7f7f9; --line:#e4e4e8; --line2:#eeeef1;
  --ink:#0a0a0c; --ink2:#57575f; --ink3:#8a8a93;
  --accent:#1f5fbf; --accent-soft:#e7effc; --accent-ink:#1a4f9e;
  --hero:#0a0a0c;
  --ok:#2e9e4f; --warn:#f5c400; --warn-ink:#8a6d00; --bad:#d81e05; --idle:#b6b6be;
  --shadow:0 1px 2px rgba(10,10,14,.05),0 8px 24px -8px rgba(10,10,14,.10);
  --shadow-lg:0 2px 4px rgba(10,10,14,.06),0 24px 60px -20px rgba(10,10,14,.22);
  --r-card:16px;
  
  /* PORTING 26/09: prima ogni serie/gruppo partiva dallo stesso blu (--accent) ripetuto ovunque
     (grafico peso, HRV, volume, prima fascia muscolo, prima fascia sentinel, evidenziazione
     viaggio) -- risultato una dominante azzurra che in Oggi non c'e', dove il blu resta riservato
     a pulsanti/stati attivi. Qui il blu resta SOLO dove segna "fase attuale/enfasi", il resto
     passa a grigi neutri o ai colori semantici gia' in uso (verde/ambra/rosso). */
  --c-s1:var(--ink2); --c-s2:#2e9e4f; --c-s3:#8a6d00; --c-s4:#d81e05;
  --c-band:rgba(10,10,14,.07);
  --c-ph1:#e4e4e8; --c-ph2:#b6b6be; --c-ph3:var(--accent); --c-ph4:#8a8a93; --c-ph5:#eeeef1;
  /* PORTING 26/09: Bangkok/Mallorca (etichetta + fascia) non hanno un corrispettivo in Oggi -- Oggi non mostra periodi di viaggio. Tolto il marrone-oliva, allineato al grigio neutro gia' usato per la fascia "viaggio" nel grafico Ricomposizione, stesso token. */
  --c-event:rgba(10,10,14,.07); --c-event-ink:var(--ink2);
  --c-mark:#d81e05;
  
  --c-g1:var(--ink2); --c-g2:#2e9e4f; --c-g3:#8a6d00; --c-g4:#d81e05; --c-g5:#6b4ea8; --c-g6:#57575f;
  
  --c-m1:var(--ink2); --c-m2:#2e9e4f; --c-m3:#d81e05; --c-m4:#6b4ea8; --c-m5:#a8591a;
  --c-m6:#b03060; --c-m7:#12796b; --c-m8:#8a6d00; --c-m9:#6e6e78; --c-m10:#4a4a54; --c-m11:#7a5a3a;
  font:400 15px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,sans-serif;
  color:var(--ink); background:var(--bg);
  display:flex; flex-direction:column; min-height:0;}
.an-root[data-an-theme="dark"],
[data-theme="dark"] .an-root{--bg:#000000; --surf:#131317; --surf2:#1b1b20; --line:#292930; --line2:#212127;
  --ink:#f5f5f7; --ink2:#9d9da6; --ink3:#6d6d76;

  --c-mark:#ff4433;
  --c-g1:#5b95e8; --c-g2:#3ecf65; --c-g3:#ffd426; --c-g4:#ff4433; --c-g5:#b39ae8; --c-g6:#9d9da6;
  --c-m1:#5b95e8; --c-m2:#3ecf65; --c-m3:#ff4433; --c-m4:#b39ae8; --c-m5:#e0a060;
  --c-m6:#e87fa8; --c-m7:#4fc4b8; --c-m8:#ffd426; --c-m9:#7ab0e0; --c-m10:#9d9da6; --c-m11:#c9a080;}
.an-root *{box-sizing:border-box;}
.an-root button,
.an-root select,
.an-root input{font:inherit;color:inherit;}
.an-subnav{flex:0 0 auto;background:var(--surf2);border-bottom:1px solid var(--line);padding:8px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;}

.an-chip{flex:0 0 auto;padding:6px 14px;border-radius:999px;font-size:12px;font-weight:600;cursor:pointer;background:var(--surf);color:var(--ink2);border:1px solid var(--line);}

.an-globalrange{flex:0 0 auto;display:flex;align-items:center;gap:8px;}
.an-globalrange-l{font-size:11px;font-weight:600;color:var(--ink2);}

.an-range button.is-active{background:var(--accent);color:#fff;}
.an-themebtn{border:1px solid var(--line);background:var(--surf);border-radius:8px;padding:5px 10px;font-size:10.5px;font-weight:600;color:var(--ink2);cursor:pointer;}
.an-lang{display:flex;gap:2px;background:var(--surf);border:1px solid var(--line);border-radius:8px;padding:3px;}
.an-lang button{border:none;cursor:pointer;padding:4px 9px;border-radius:6px;font-size:10.5px;font-weight:600;text-transform:uppercase;background:transparent;color:var(--ink2);}
.an-lang button.is-active{background:var(--accent);color:#fff;}
.an-main{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;padding:12px;}

.an-view.is-active{display:grid;gap:9px;align-content:start;}
.an-card{border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;min-width:0;}
.an-card-hero{background:var(--hero);}
.an-head{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;}

.an-note{font-size:11px;line-height:1.45;color:var(--ink3);padding-top:8px;border-top:1px solid var(--line2);text-wrap:pretty;}
.an-chart{position:relative;width:100%;min-width:0;}
.an-chart svg{display:block;width:100%;height:100%;overflow:visible;}
.an-chart-n{position:absolute;top:0;right:0;font-size:9.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;pointer-events:none;}
.an-chart-state{display:flex;align-items:center;justify-content:center;height:100%;min-height:52px;font-size:11.5px;font-weight:500;color:var(--ink3);text-align:center;padding:0 12px;}
.an-chart-skel{height:100%;border-radius:8px;background:linear-gradient(90deg,var(--line2) 25%,var(--surf2) 50%,var(--line2) 75%);background-size:200% 100%;animation:anSkel 1.4s ease-in-out infinite;}

.an-pop{position:fixed;z-index:9999;background:#ffffff;border:1px solid #e4e4e8;border-radius:10px;box-shadow:0 2px 4px rgba(10,10,14,.06),0 24px 60px -20px rgba(10,10,14,.22);padding:9px 11px;font:500 11px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Helvetica,sans-serif;color:#57575f;pointer-events:none;max-width:230px;}

.is-up{color:var(--ok);}

.an-num{font-variant-numeric:tabular-nums;text-align:right;}

/* ============================================================
   4 · DATA — Consolidamento 08/09/2026: riscritto da zero. La
   produzione NON ha una riga per giorno: la tabella `diary` ha
   UNA riga per utente, colonna `data` (jsonb) con dentro TUTTI i
   giorni come chiavi p2_day_N. Ogni scrittura deve quindi:
     1. fetch fresco dell'INTERO blob (mai lavorare su una copia
        in cache — è la stessa disciplina già in uso su index.html,
        vedi KB "near-miss" sul fetch-modify-write)
     2. merge del solo giorno cambiato dentro il blob
     3. PATCH dell'intero blob aggiornato
   ============================================================ */
const store = { blob: null, loaded: false, dirty: {}, saving: false, saveError: false, justSaved: false };

function dayIdxFromISO(dateISO) {
  const start = new Date(CFG.CYCLE_START + 'T00:00:00');
  const d = new Date(dateISO + 'T00:00:00');
  return Math.round((d - start) / 86400000);
}
function dayKeyFromISO(dateISO) { return 'p2_day_' + dayIdxFromISO(dateISO); }

// Bug reale trovato il 10/09/2026: ".toISOString().slice(0,10)" converte
// SEMPRE in UTC — a mezzanotte locale in Italia (UTC+1/+2) questo fa
// scivolare la data indietro di un giorno. In Node (dove giravano i miei
// test) il fuso è UTC, quindi il bug non si vedeva mai; nel browser vero
// di Giorgio sì — è la causa dei giorni sbagliati che ha segnalato
// (pallino attivo sbagliato in renderDayNav, click su un giorno che ne
// selezionava un altro, adherence() che leggeva il record del giorno
// sbagliato ad ogni iterazione). Usare SEMPRE questa funzione per
// convertire un Date in stringa AAAA-MM-GG, mai .toISOString().
function isoLocal(d) {
  const y = d.getFullYear(), m = String(d.getMonth() + 1).padStart(2, '0'), day = String(d.getDate()).padStart(2, '0');
  return y + '-' + m + '-' + day;
}

async function loadBlob() {
  const res = await fetch(`${CFG.PROXY_URL}?user_id=eq.${CFG.USER_ID}&select=data`, {
    headers: { apikey: CFG.PROXY_KEY, Authorization: `Bearer ${CFG.PROXY_KEY}` }
  });
  if (!res.ok) throw new Error(`load ${res.status}`);
  const rows = await res.json();
  store.blob = (rows[0] && rows[0].data) || {};
  store.loaded = true;
  return store.blob;
}

function getDay(dateISO) {
  const key = dayKeyFromISO(dateISO);
  return (store.blob && store.blob[key]) || {};
}

/* Consolidamento 09/09/2026: patch() e patchPending() erano due funzioni
   scollegate — flush() legge solo da store.pending, ma patch() non lo
   popolava mai. Ogni modifica sarebbe stata persa in silenzio al primo
   salvataggio. Unite in un'unica funzione: patch() ora aggiorna sia il
   blob locale (per il render immediato) sia store.pending (l'unica
   fonte che flush() usa davvero per il merge fetch-modify-write). */
store.pending = {}; // { 'p2_day_44': { peso: '73.2', ... } }

function patchSilent(dateISO, field, value) {
  const key = dayKeyFromISO(dateISO);
  if (!store.blob) return; // non scrivere mai prima del fetch iniziale
  if (!store.blob[key]) store.blob[key] = {};
  store.blob[key][field] = value;
  if (!store.pending[key]) store.pending[key] = {};
  store.pending[key][field] = value;
  store.dirty[key] = true;
  queueSave();
}

function patch(dateISO, field, value) {
  patchSilent(dateISO, field, value);
  render();
}

let saveTimer = null;
function queueSave() {
  clearTimeout(saveTimer);
  saveTimer = setTimeout(flush, 700);
}

/* Fetch-modify-write reale: rilegge il blob dal server subito prima
   di scrivere, riapplica sopra la versione fresca solo i campi
   effettivamente pendenti (store.pending), poi fa un unico PATCH.
   Evita di sovrascrivere un cambiamento fatto nel frattempo dalla
   vecchia app o da un'altra scheda. */

// Aggiorna SOLO l'indicatore di sync e i pulsanti Salva, senza toccare
// il resto della pagina. Bug corretto 16/09/2026: flush() chiamava
// render() completo (app.innerHTML) sia all'inizio che alla fine del
// salvataggio automatico in background. Con DUE campi nello stesso
// riquadro (Pressione: sistolica/diastolica), il salvataggio poteva
// scattare proprio nell'istante di passaggio da un campo all'altro —
// in quel momento NESSUNO dei due ha il focus, quindi anche il
// ripristino del focus (aggiunto in un tentativo precedente) non aveva
// nulla da ripristinare, e la ricostruzione interrompeva comunque la
// digitazione in corso, troncando il valore. La correzione strutturale:
// il salvataggio in background non deve mai poter toccare un campo di
// inserimento, quindi ora aggiorna solo questi elementi via DOM diretto.
function updateSaveUI() {
  const isDirty = Object.keys(store.dirty).length > 0;
  const dot = document.getElementById('sync-dot');
  const text = document.getElementById('sync-text');
  if (dot) dot.className = 'sync-dot' + (store.saving ? ' saving' : (store.saveError ? ' error' : ''));
  if (text) text.textContent = store.saving ? (LANG === 'it' ? 'Salvataggio…' : 'Saving…')
    : store.saveError ? (LANG === 'it' ? 'Errore, ritento…' : 'Error, retrying…')
    : store.justSaved ? (LANG === 'it' ? 'Sincronizzato' : 'Synced')
    : isDirty ? (LANG === 'it' ? 'Modifiche in sospeso' : 'Unsaved changes')
    : (LANG === 'it' ? 'Sincronizzato' : 'Synced');

  const btn = document.getElementById('save-now-btn');
  if (btn) {
    btn.disabled = !!store.saving;
    btn.className = 'save-btn' + (store.saving ? ' saving' : '');
    btn.textContent = store.saving ? (LANG === 'it' ? 'Salvataggio…' : 'Saving…')
      : store.justSaved ? (LANG === 'it' ? '✓ Sincronizzato' : '✓ Synced')
      : (LANG === 'it' ? 'Salva' : 'Save');
  }
  const btnM = document.getElementById('save-now-btn-mobile');
  if (btnM) {
    btnM.style.background = store.saving ? 'var(--ink3)' : store.saveError ? 'var(--bad)' : store.justSaved ? 'var(--ok)' : 'var(--accent)';
    btnM.style.cursor = store.saving ? 'default' : 'pointer';
    btnM.textContent = store.saving ? (LANG === 'it' ? 'Salvataggio…' : 'Saving…')
      : store.saveError ? (LANG === 'it' ? 'Errore, tocca per riprovare' : 'Error, tap to retry')
      : store.justSaved ? (LANG === 'it' ? '✓ Già sincronizzato' : '✓ Already synced')
      : (LANG === 'it' ? 'Salva il giorno' : 'Save the day');
  }
}

async function flush() {
  const dirtyKeys = Object.keys(store.dirty);
  if (!dirtyKeys.length || store.saving) return;
  store.saving = true;
  store.saveError = false;
  updateSaveUI(); // MAI render() qui: un salvataggio in background non
                   // deve poter ricostruire (e quindi interrompere) un
                   // campo che l'utente sta ancora scrivendo.
  try {
    const fresh = await loadBlob();
    dirtyKeys.forEach(key => {
      fresh[key] = Object.assign({}, fresh[key] || {}, store.pending[key] || {});
    });
    store.blob = fresh;
    const res = await fetch(`${CFG.PROXY_URL}?user_id=eq.${CFG.USER_ID}`, {
      method: 'PATCH',
      headers: {
        apikey: CFG.PROXY_KEY,
        Authorization: `Bearer ${CFG.PROXY_KEY}`,
        'Content-Type': 'application/json',
        Prefer: 'return=minimal'
      },
      body: JSON.stringify({ data: store.blob })
    });
    if (!res.ok) throw new Error(`save ${res.status}`);
    dirtyKeys.forEach(key => { delete store.dirty[key]; delete store.pending[key]; });
  } catch (e) {
    console.warn('salvataggio rimandato, verrà ritentato', e);
    store.saveError = true; // prima solo in console, invisibile a Giorgio
  }
  store.saving = false;
  updateSaveUI();
  if (Object.keys(store.dirty).length) queueSave();
}

/* ============================================================

   re-implementazioni. MIRROR_INDEX è la lista da ricontrollare
   quando cambi la vecchia app: se una di queste diverge anche di

   Consolidamento 08/09/2026: getWorkout2/getInjectionSlots2/

   settimanale sbagliato (riposo mar/ven invece di lun/gio) e uno

// Aggiornata il 09/09/2026 insieme alla produzione: override manuale del
// tipo giornata (wo_override), priorità massima — vedi commento in
// index.html per il razionale completo. Letto dal blob (store.blob), non
// da _lastData2 come in produzione, dato il diverso livello dati di v2.
function getWorkout2(dayIdx) {
  const key = 'p2_day_' + dayIdx;
  const rec = (store.blob && store.blob[key]) || {};
  if (rec.wo_override) return { type: rec.wo_override };
  const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
  if (isBkkDate(d)) {
    // Trasferta BKK: allenamento di default ogni giorno, salvo override
    // manuale "Riposo" impostato dalla card stessa (split irregolare).
    if (rec.bkk_riposo === '1') return { type: 'Riposo' };
    return { type: 'Allenamento BKK' };
  }
  const dow = d.getDay(); // 0=dom
  const map = {0:'Upper Dom',1:'Riposo',2:'Push',3:'Pull',4:'Riposo',5:'Legs',6:'Upper Sab'};
  const type = map[dow] || 'Riposo';
  return { type };
}

// MIRROR · getInjectionSlots2 — verbatim da index.html. Attenzione:
// nei giorni di allenamento si INSERISCE uno slot Post-WO (IGF-1 DES)
// e lo slot Sera CAMBIA numero (da n:3 a n:4) — non è una lista fissa.
function getInjectionSlots2(dayIdx) {
  const wo = getWorkout2(dayIdx);
  const isTraining = wo.type !== 'Riposo';
  const slots = [
    { n:1, label:'Mattino', momento:'Mattino · digiuno', fields:['Fragment 176-191 250mcg','BPC-157 250mcg'] },
    { n:2, label:'Pomeriggio', momento:'Pomeriggio', fields:['Fragment 176-191 250mcg'] },
    { n:3, label:'Sera', momento:'Sera · 90–120min post-cena', fields:['Tesamorelin 2mg','Ipamorelin 100mcg','BPC-157 250mcg','TB-500 500mcg'] },
  ];
  if (isTraining) {
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    let defaultMuscle = '';
    if (!isBkkDate(d)) {
      const wkDay = dayIdx % 7; // 0=lun,1=mar,2=mer,3=gio,4=ven,5=sab,6=dom
      const muscleMap = { 1:'Petto', 2:'Bicipiti', 4:'Quadricipiti', 5:'Tricipiti', 6:'Deltoidi' };
      defaultMuscle = muscleMap[wkDay] || '';
    }
    slots.splice(2, 0, { n:3, label:'Post-WO', momento:'Post-workout · IM bilaterale', fields:['IGF-1 DES 25mcg dx','IGF-1 DES 25mcg sx'], igfMuscle: defaultMuscle });
    slots[3].n = 4;
  }
  return slots;
}

// MIRROR · parseSonnoHours — verbatim da index.html. "5.18" = 5h18m,
// NON 5,18 ore decimali — usare SEMPRE questa funzione per il sonno,
// mai parseFloat diretto (vedi KB 26.14, bug reale già trovato e corretto).
function parseSonnoHours(raw) {
  if (raw === null || raw === undefined || raw === '') return NaN;
  const s = String(raw).trim();
  const m = s.match(/^(\d+)\.(\d{1,2})$/);
  if (!m) return parseFloat(s);
  const h = parseInt(m[1], 10);
  let mm = m[2];
  if (mm.length === 1) mm += '0';
  const mins = parseInt(mm, 10);
  if (mins >= 0 && mins <= 59) return h + mins / 60;
  return parseFloat(s);
}

// MIRROR · adherence — da index.html (getInjComplianceV2/getSuppComplianceV2/
// getWorkoutComplianceV2 unificate). Corretta il 10/09/2026 dopo una verifica
// diretta contro index.html (Giorgio ha segnalato lo scarto: v2 mostrava
// 91%/84%, index.html 98%/93% per lo stesso giorno). Due bug reali trovati:
//   1) mancavano i 2 giorni "test_proto" (18-19 luglio, dati reali già
//      presenti sotto le chiavi test_proto_0/test_proto_1, non p2_day_N) —
//      index.html li include nel calcolo cumulativo, qui erano ignorati.
//   2) il criterio "allenamento fatto" era sbagliato: controllavo solo
//      wo_durata, la produzione (getWorkoutComplianceV2) considera fatto se
//      calorie>0 OPPURE volume>0 (anche da motra_log) OPPURE RPE è un numero.
// Iterare per DATA (come fa resolveDay() in produzione), non per chiavi del
// blob, è l'unico modo per includere correttamente i giorni test_proto.
const TEST_PROTO_START = '2026-07-18'; // MIRROR — invariato rispetto a index.html
const TEST_PROTO_DAYS = 2;             // MIRROR

// MIRROR · getWorkoutVolume2 — da index.html: legge wo_volume, altrimenti
// prova a estrarre il volume dalla stringa di motra_log (es. "11,8K kg").
function getWorkoutVolume2(rec) {
  if (!rec) return null;
  if (rec.wo_volume) {
    const v = parseFloat(rec.wo_volume);
    if (!isNaN(v) && v > 0) return v;
  }
  if (rec.motra_log) {
    try {
      const m = typeof rec.motra_log === 'object' ? rec.motra_log : JSON.parse(rec.motra_log);
      if (m.volume) {
        const mm = String(m.volume).match(/([\d,\.]+)([Kk])?/);
        if (mm) {
          let val = parseFloat(mm[1].replace(',', '.'));
          if (mm[2]) val *= 1000;
          if (!isNaN(val) && val > 0) return Math.round(val);
        }
      }
    } catch (e) { /* motra_log malformato: ignora, non è un dato di volume valido */ }
  }
  return null;
}

function adherence(blob) {
  blob = blob || {};
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const testStart = new Date(TEST_PROTO_START + 'T00:00:00');
  if (today < testStart) return { inj: 0, supp: 0, wo: 0, injDone: 0, injTot: 0, suppDone: 0, suppTot: 0, woDone: 0, woTot: 0 };

  let injDone = 0, injTot = 0, suppDone = 0, suppTot = 0, woDone = 0, woTot = 0;

  for (let d = new Date(testStart); d <= today; d.setDate(d.getDate() + 1)) {
    const dateISO = isoLocal(d);
    let rec, woIdx;
    const testEnd = new Date(testStart); testEnd.setDate(testEnd.getDate() + TEST_PROTO_DAYS - 1);
    if (d >= testStart && d <= testEnd) {
      const t = Math.round((d - testStart) / 86400000);
      rec = blob['test_proto_' + t] || {};
      woIdx = t - TEST_PROTO_DAYS; // -2, -1 — stessa convenzione a indici negativi di index.html
    } else {
      const dIdx = dayIdxFromISO(dateISO);
      rec = blob['p2_day_' + dIdx] || {};
      woIdx = dIdx;
    }

    getInjectionSlots2(woIdx).forEach(s => {
      s.fields.forEach(f => {
        const v = rec['inj_' + s.n + '_' + fieldKey(f)] || '';
        if (v === 'skip' || v === 'na') return; // 'skip' = valore legacy pre-31/07, trattato come 'na'
        injTot++; if (v === 'fatto') injDone++;
      });
    });

    SUPP_FIELDS.forEach(sf => {
      if (rec[sf + '_skip']) return;
      suppTot++; if (rec[sf] === '1') suppDone++;
    });

    if (getWorkout2(woIdx).type !== 'Riposo') {
      woTot++;
      const kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe);
      const vol = getWorkoutVolume2(rec);
      if ((!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe)) woDone++;
    }
  }

  return {
    inj: injTot ? Math.round(injDone / injTot * 100) : 0,
    supp: suppTot ? Math.round(suppDone / suppTot * 100) : 0,
    wo: woTot ? Math.round(woDone / woTot * 100) : 0,
    injDone, injTot, suppDone, suppTot, woDone, woTot
  };
}

// MIRROR · verdict — da index.html
function verdict(a) {
  if (!a.injTot) return { tone: 'neutral', key: 'noData' };
  if (a.inj >= 90 && a.wo >= 90 && a.supp >= 85) return { tone: 'good', key: 'onTrack' };
  if (a.wo < 75) return { tone: 'bad', key: 'trainingGaps' };
  return { tone: 'warn', key: 'someGaps' };
}

function parseSonnoHours(raw){
  if (raw == null || raw === "") return null;
  var s = String(raw).trim().replace(",", ".");
  var m = s.match(/^(\d+)\.(\d{1,2})$/);
  if (!m) { var f = parseFloat(s); return isNaN(f) ? null : f; }
  var mm = m[2].length === 1 ? m[2] + "0" : m[2];
  var mins = parseInt(mm, 10);
  if (mins > 59) { var f2 = parseFloat(s); return isNaN(f2) ? null : f2; }
  return parseInt(m[1], 10) + mins / 60;
}
function fmtHours(v){
  if (v == null) return "—";
  var h = Math.floor(v), mm = Math.round((v - h) * 60);
  if (mm === 60) { h += 1; mm = 0; }
  return h + "h" + String(mm).padStart(2, "0");
}
function num(raw){
  if (raw == null || raw === "") return null;
  var v = parseFloat(String(raw).replace(",", "."));
  return isNaN(v) ? null : v;
}
function it(v, dec){
  if (v == null) return "—";
  var s = (dec == null ? String(v) : Number(v).toFixed(dec));
  return s.replace(".", ",").replace("-", "\u2212");
}
function itSigned(v, dec){
  if (v == null) return "—";
  return (v > 0 ? "+" : v < 0 ? "\u2212" : "") + it(Math.abs(v), dec);
}

/* ══════════════════════════════════════════════════════════
   4 · ESTRAZIONE SERIE — i buchi restano buchi
   ══════════════════════════════════════════════════════════ */
function seriesOf(days, field, conv){
  return days.map(function(d, i){
    var raw = d ? d[field] : "";
    var v = conv ? conv(raw) : num(raw);
    return { x: i, y: (v == null ? null : v) };
  });
}
/* HRV coesiste in due formati: media storica (hrv) e intervallo
   recente (hrv_min/hrv_max). Restituiti separati, il grafico li
   disegna in modo diverso.                                     */
function hrvSeries(days){
  var mean = [], band = [];
  days.forEach(function(d, i){
    var lo = d ? num(d.hrv_min) : null, hi = d ? num(d.hrv_max) : null;
    var mu = d ? num(d.hrv) : null;
    if (lo != null && hi != null) {
      band.push({ x: i, lo: lo, hi: hi });
      mean.push({ x: i, y: mu != null ? mu : (lo + hi) / 2 });
    } else {
      band.push({ x: i, lo: null, hi: null });
      mean.push({ x: i, y: mu });
    }
  });
  return { mean: mean, band: band };
}
function validPts(s){ return (s || []).filter(function(p){ return p.y != null; }); }

/* ══════════════════════════════════════════════════════════
   5 · DERIVATE — formule nel README
   ══════════════════════════════════════════════════════════ */
/* Delta contro l ULTIMO VALORE VALIDO precedente, non contro una
   posizione fissa: con i buchi "ieri" spesso non esiste.       */
function lastDelta(s){
  var v = validPts(s);
  if (v.length < 2) return null;
  return v[v.length - 1].y - v[v.length - 2].y;
}
function statsOf(s){
  var v = validPts(s).map(function(p){ return p.y; });
  if (!v.length) return { n: 0, min: null, max: null, avg: null, last: null };
  var sum = 0, mn = v[0], mx = v[0];
  for (var i = 0; i < v.length; i++){ sum += v[i]; if (v[i] < mn) mn = v[i]; if (v[i] > mx) mx = v[i]; }
  return { n: v.length, min: mn, max: mx, avg: sum / v.length, last: v[v.length - 1] };
}
/* Tendenza: minimi quadrati sugli x reali, così i buchi non
   deformano la pendenza.                                       */
function trendOf(s){
  var v = validPts(s);
  if (v.length < 3) return null;
  var n = v.length, sx = 0, sy = 0, sxy = 0, sxx = 0;
  v.forEach(function(p){ sx += p.x; sy += p.y; sxy += p.x * p.y; sxx += p.x * p.x; });
  var den = n * sxx - sx * sx;
  if (!den) return null;
  var m = (n * sxy - sx * sy) / den, b = (sy - m * sx) / n;
  return { m: m, b: b, x0: v[0].x, x1: v[v.length - 1].x,
           y0: m * v[0].x + b, y1: m * v[v.length - 1].x + b };
}
function pearson(pairs){
  var p = pairs.filter(function(q){ return q[0] != null && q[1] != null; });
  var n = p.length;
  if (n < 3) return { r: null, n: n };
  var mx = 0, my = 0;
  p.forEach(function(q){ mx += q[0]; my += q[1]; });
  mx /= n; my /= n;
  var sxy = 0, sxx = 0, syy = 0;
  p.forEach(function(q){ var a = q[0] - mx, b = q[1] - my; sxy += a * b; sxx += a * a; syy += b * b; });
  if (!sxx || !syy) return { r: null, n: n };
  return { r: sxy / Math.sqrt(sxx * syy), n: n };
}
function strengthOf(r){
  if (r == null) return "non calcolabile";
  var a = Math.abs(r);
  return a >= 0.5 ? "forte" : (a >= 0.3 ? "moderata" : "debole");
}
function meanOf(arr){
  var v = arr.filter(function(x){ return x != null; });
  if (!v.length) return null;
  return v.reduce(function(a, b){ return a + b; }, 0) / v.length;
}

/* ══════════════════════════════════════════════════════════
   6 · MOTORE GRAFICI
   renderChart(container, { series, options }) — funzione pura:
   riceve i dati, non li cerca nel DOM.
   ══════════════════════════════════════════════════════════ */
var CHART_FONT = "-apple-system,BlinkMacSystemFont,'SF Pro Text','Helvetica Neue',Helvetica,sans-serif";

/* Larghezza reale del testo: i margini nascono da qui, non da
   valori fissi — altrimenti restano cornici vuote oppure le
   etichette vengono tagliate.                                  */
function measureText(text, size, weight){
  if (!measureText._ctx) measureText._ctx = document.createElement("canvas").getContext("2d");
  measureText._ctx.font = (weight || 500) + " " + size + "px " + CHART_FONT;
  return measureText._ctx.measureText(String(text)).width;
}
function svgEl(tag, attrs){
  var e = document.createElementNS("http://www.w3.org/2000/svg", tag);
  for (var k in attrs) if (attrs[k] != null) e.setAttribute(k, attrs[k]);
  return e;
}
function niceTicks(lo, hi, count){
  if (lo === hi) { lo -= 1; hi += 1; }
  var span = hi - lo;
  var step = Math.pow(10, Math.floor(Math.log(span / count) / Math.LN10));
  var err = (span / count) / step;
  if (err >= 7.5) step *= 10; else if (err >= 3) step *= 5; else if (err >= 1.5) step *= 2;
  var t = [], v = Math.ceil(lo / step) * step;
  for (; v <= hi + step * 0.001; v += step) t.push(Math.round(v * 1e6) / 1e6);
  return t;
}

function renderChart(container, cfg){
  if (!container) return;
  var series = (cfg && cfg.series) || [];
  var o = (cfg && cfg.options) || {};
  container.innerHTML = "";
  container.classList.remove("is-loading");

  if (o.loading) {
    container.classList.add("is-loading");
    var sk = document.createElement("div");
    sk.className = "an-chart-skel";
    container.appendChild(sk);
    return;
  }

  var nReal = 0;
  series.forEach(function(s){
    if (s.type === "band") nReal += (s.data || []).filter(function(p){ return p.lo != null && p.hi != null; }).length;
    else if (s.type === "scatter") nReal += (s.points || []).length;
    else nReal += validPts(s.data).length;
  });

  if (!nReal) {
    var st = document.createElement("div");
    st.className = "an-chart-state";
    st.textContent = o.emptyText || "Nessun dato in questo intervallo";
    container.appendChild(st);
    return;
  }

  var W = container.clientWidth || o.width || 320;
  var H = o.height || container.clientHeight || 160;

  var ys = [];
  series.forEach(function(s){
    if (s.type === "band") (s.data || []).forEach(function(p){ if (p.lo != null) { ys.push(p.lo); ys.push(p.hi); } });
    else if (s.type === "scatter") (s.points || []).forEach(function(p){ ys.push(p.y); });
    else validPts(s.data).forEach(function(p){ ys.push(p.y); });
  });
  var yLo = o.yMin != null ? o.yMin : Math.min.apply(null, ys);
  var yHi = o.yMax != null ? o.yMax : Math.max.apply(null, ys);
  /* i soggettivi variano poco: senza respiro la linea si appiattisce */
  var pad = (yHi - yLo) * 0.12;
  if (pad < (o.minPad || 0)) pad = o.minPad || 0;
  if (yHi === yLo) pad = Math.max(1, Math.abs(yHi) * 0.05);
  yLo -= pad; yHi += pad;
  if (o.clampZero && yLo < 0) yLo = 0;

  var ticks = niceTicks(yLo, yHi, o.yTicks || 3);
  var fmtY = o.fmtY || function(v){ return it(Math.round(v * 10) / 10); };

  var maxYW = 0;
  ticks.forEach(function(t){ var w = measureText(fmtY(t), 9.5, 500); if (w > maxYW) maxYW = w; });
  var padL = o.hideY ? 2 : Math.ceil(maxYW) + 8;
  var padT = 10;
  var padB = o.hideX ? 6 : 18;
  var xLabels = o.xLabels || [];
  var lastLblW = xLabels.length ? measureText(xLabels[xLabels.length - 1].label, 9.5, 500) : 0;
  var padR = Math.ceil(Math.max(6, lastLblW / 2 + 2));

  var xLo = o.xMin != null ? o.xMin : 0;
  var xHi = o.xMax != null ? o.xMax : Math.max(1, ((series[0] && (series[0].data || series[0].points)) || []).length - 1);
  var iw = Math.max(10, W - padL - padR), ih = Math.max(10, H - padT - padB);
  var px = function(x){ return padL + (xHi === xLo ? iw / 2 : (x - xLo) / (xHi - xLo) * iw); };
  var py = function(y){ return padT + (yHi === yLo ? ih / 2 : (1 - (y - yLo) / (yHi - yLo)) * ih); };

  var svg = svgEl("svg", { viewBox: "0 0 " + W + " " + H, width: W, height: H, "font-family": CHART_FONT });

  (o.bands || []).forEach(function(b){
    svg.appendChild(svgEl("rect", { x: px(b.from), y: padT, width: Math.max(1, px(b.to) - px(b.from)),
                                    height: ih, fill: "var(--c-event)" }));
  });

  if (!o.hideY) ticks.forEach(function(t){
    var y = py(t);
    if (y < padT - 1 || y > padT + ih + 1) return;
    svg.appendChild(svgEl("line", { x1: padL, y1: y, x2: padL + iw, y2: y, stroke: "var(--line2)", "stroke-width": 1 }));
    var tx = svgEl("text", { x: padL - 5, y: y + 3, "text-anchor": "end", "font-size": 9.5, "font-weight": 500, fill: "var(--ink3)" });
    tx.textContent = fmtY(t);
    svg.appendChild(tx);
  });

  /* etichette x da destra a sinistra: in caso di collisione
     sopravvive sempre l ultima */
  if (!o.hideX && xLabels.length) {
    var occupied = W + 99;
    for (var li = xLabels.length - 1; li >= 0; li--) {
      var lb = xLabels[li];
      var w = measureText(lb.label, 9.5, 500);
      var cx = px(lb.x);
      if (cx + w / 2 + 6 > occupied) continue;
      occupied = cx - w / 2;
      var t2 = svgEl("text", { x: cx, y: H - 5, "text-anchor": "middle", "font-size": 9.5, "font-weight": 500, fill: "var(--ink3)" });
      t2.textContent = lb.label;
      svg.appendChild(t2);
    }
  }

  (o.marks || []).forEach(function(m){
    var x = px(m.x);
    svg.appendChild(svgEl("line", { x1: x, y1: padT, x2: x, y2: padT + ih, stroke: "var(--c-mark)",
                                    "stroke-width": 1.5, "stroke-dasharray": "3 3" }));
  });

  series.forEach(function(s){
    if (s.type === "band") {
      var runs = [], cur = [];
      (s.data || []).forEach(function(p){
        if (p.lo == null || p.hi == null) { if (cur.length) { runs.push(cur); cur = []; } }
        else cur.push(p);
      });
      if (cur.length) runs.push(cur);
      runs.forEach(function(run){
        if (run.length === 1) {
          svg.appendChild(svgEl("line", { x1: px(run[0].x), y1: py(run[0].hi), x2: px(run[0].x), y2: py(run[0].lo),
                                          stroke: s.color || "var(--c-band)", "stroke-width": 3, "stroke-linecap": "round" }));
          return;
        }
        var up = run.map(function(p){ return px(p.x).toFixed(1) + "," + py(p.hi).toFixed(1); });
        var dn = run.slice().reverse().map(function(p){ return px(p.x).toFixed(1) + "," + py(p.lo).toFixed(1); });
        svg.appendChild(svgEl("polygon", { points: up.concat(dn).join(" "), fill: s.color || "var(--c-band)" }));
      });
      return;
    }

    if (s.type === "scatter") {
      (s.points || []).forEach(function(p){
        svg.appendChild(svgEl("circle", { cx: px(p.x), cy: py(p.y), r: 3.2, fill: s.color || "var(--accent)", "fill-opacity": 0.72 }));
      });
      if (s.fit) svg.appendChild(svgEl("line", { x1: px(s.fit.x0), y1: py(s.fit.y0), x2: px(s.fit.x1), y2: py(s.fit.y1),
                                                 stroke: "var(--ink3)", "stroke-width": 1.4, "stroke-dasharray": "4 4", opacity: 0.75 }));
      return;
    }

    if (s.type === "bar") {
      var pts = validPts(s.data);
      var bw = Math.max(2, Math.min(18, iw / Math.max(1, (xHi - xLo + 1)) - 1.5));
      var y0 = py(Math.max(yLo, 0));
      pts.forEach(function(p){
        var y = py(p.y);
        svg.appendChild(svgEl("rect", { x: px(p.x) - bw / 2, y: Math.min(y, y0), width: bw,
                                        height: Math.max(1, Math.abs(y0 - y)), rx: 2,
                                        fill: (s.colorAt ? s.colorAt(p) : (s.color || "var(--accent)")) }));
      });
      return;
    }

    /* linea: si spezza sui buchi, mai interpolati */
    var segs = [], seg = [];
    (s.data || []).forEach(function(p){
      if (p.y == null) { if (seg.length) { segs.push(seg); seg = []; } }
      else seg.push(p);
    });
    if (seg.length) segs.push(seg);

    segs.forEach(function(g){
      if (g.length === 1) {
        svg.appendChild(svgEl("circle", { cx: px(g[0].x), cy: py(g[0].y), r: 2.6, fill: s.color || "var(--accent)" }));
        return;
      }
      var d = g.map(function(p, k){ return (k ? "L" : "M") + px(p.x).toFixed(1) + " " + py(p.y).toFixed(1); }).join(" ");
      svg.appendChild(svgEl("path", { d: d, fill: "none", stroke: s.color || "var(--accent)",
                                      "stroke-width": s.width || 2, "stroke-linecap": "round",
                                      "stroke-linejoin": "round", "stroke-dasharray": s.dash || null }));
    });

    /* niente pallino su ogni punto: solo ultimo, min e max */
    if (s.markExtremes !== false) {
      var v = validPts(s.data);
      if (v.length) {
        var mn = v[0], mx = v[0];
        v.forEach(function(p){ if (p.y < mn.y) mn = p; if (p.y > mx.y) mx = p; });
        var seen = {};
        [mn, mx, v[v.length - 1]].forEach(function(p, idx){
          var key = p.x + ":" + p.y;
          if (seen[key]) return;
          seen[key] = 1;
          svg.appendChild(svgEl("circle", { cx: px(p.x), cy: py(p.y), r: idx === 2 ? 3.6 : 2.6, fill: s.color || "var(--accent)" }));
        });
      }
    }

    if (s.trend) {
      var tr = trendOf(s.data);
      if (tr) svg.appendChild(svgEl("line", { x1: px(tr.x0), y1: py(tr.y0), x2: px(tr.x1), y2: py(tr.y1),
                                              stroke: "var(--ink3)", "stroke-width": 1.3, "stroke-dasharray": "4 5", opacity: 0.6 }));
    }
  });

  container.appendChild(svg);

  if (o.showN !== false) {
    var nb = document.createElement("span");
    nb.className = "an-chart-n";
    nb.textContent = "n=" + nReal;
    container.appendChild(nb);
  }
  if (nReal === 1) {
    var one = document.createElement("span");
    one.className = "an-chart-n";
    one.style.left = "0"; one.style.right = "auto";
    one.textContent = "un solo rilevamento";
    container.appendChild(one);
  }

  if (o.tooltip) attachTooltip(container, svg, series, px, o);
}

/* ── popover: position:fixed, quindi nessun antenato lo taglia,
      e vicino al bordo inferiore si apre verso l alto ── */
var _pop = null;
function showPop(html, cx, cy){
  if (!_pop) { _pop = document.createElement("div"); _pop.className = "an-pop"; document.body.appendChild(_pop); }
  _pop.innerHTML = html;
  _pop.style.visibility = "hidden";
  _pop.style.display = "block";
  var r = _pop.getBoundingClientRect();
  var x = cx + 12, y = cy + 12;
  if (x + r.width > window.innerWidth - 8) x = cx - r.width - 12;
  if (y + r.height > window.innerHeight - 8) y = cy - r.height - 12;
  if (x < 8) x = 8;
  if (y < 8) y = 8;
  _pop.style.left = x + "px";
  _pop.style.top = y + "px";
  _pop.style.visibility = "visible";
}
function hidePop(){ if (_pop) _pop.style.display = "none"; }

function attachTooltip(container, svg, series, px, o){
  var line = series.filter(function(s){ return s.type !== "band" && s.type !== "scatter"; })[0];
  if (!line) return;
  var pts = validPts(line.data);
  if (!pts.length) return;
  function nearest(clientX){
    var box = svg.getBoundingClientRect();
    var rel = (clientX - box.left) * (svg.getAttribute("width") / box.width);
    var best = pts[0], bd = Infinity;
    pts.forEach(function(p){ var d = Math.abs(px(p.x) - rel); if (d < bd) { bd = d; best = p; } });
    return best;
  }
  function show(ev){
    var cx = ev.touches ? ev.touches[0].clientX : ev.clientX;
    var cy = ev.touches ? ev.touches[0].clientY : ev.clientY;
    var p = nearest(cx);
    var d = dateOfDay(p.x);
    var rows = "<strong>" + fmtDM(d) + " · g" + (p.x + 1) + "</strong>";
    series.forEach(function(s){
      if (s.type === "band") {
        var b = (s.data || [])[p.x];
        if (b && b.lo != null) rows += "<div class='an-pop-row'><span>" + (s.label || "intervallo") + "</span><span>" + it(b.lo) + "\u2013" + it(b.hi) + "</span></div>";
        return;
      }
      if (s.type === "scatter") return;
      var q = (s.data || [])[p.x];
      var val = (q && q.y != null) ? (o.fmtTip ? o.fmtTip(q.y) : it(Math.round(q.y * 10) / 10)) : "non registrato";
      rows += "<div class='an-pop-row'><span>" + (s.label || "") + "</span><span>" + val + "</span></div>";
    });
    showPop(rows, cx, cy);
  }
  svg.addEventListener("mousemove", show);
  svg.addEventListener("mouseleave", hidePop);
  /* su mobile il tocco sostituisce l hover: niente hover-only */
  svg.addEventListener("touchstart", show, { passive: true });
  svg.addEventListener("touchmove", show, { passive: true });
  svg.addEventListener("touchend", hidePop);
}



/* PORTING: nessun dato di esempio. AN_mount() riempie MOCK dal blob reale; AN_loadV1() riempie PHOTO_LOG,
   LAB_T1, DEXA (T1), MUSCLE_VOL dal record V1 (sola lettura). */
var MOCK = { days: [], todayIndex: 0 };

PHOTO_LOG = [];

   4 · STATO — un solo intervallo, globale.

function $(root,sel){ return root.querySelector(sel); }

function windowDays(days,t,n){ var f=Math.max(0,t-n+1); return { from:f, slice:days.slice(f,t+1) }; }
function xLabelsFor(from,count){

/* ore_sonno "0" vale non registrato, come da regola. */
function sleepH(raw){ if (raw==="0"||raw==="0.00") return null; return parseSonnoHours(raw); }
/* HRV: se esiste l intervallo prevale. Il punto medio serve solo
   alla tendenza ed è tratteggiato: non è una media misurata.    */
function hrvOf(days){
  var band=[],mid=[],meas=[];
  days.forEach(function(d,i){
    var lo=d?num(d.hrv_min):null, hi=d?num(d.hrv_max):null, mu=d?num(d.hrv):null;
    if (lo!=null&&hi!=null){ band.push({x:i,lo:lo,hi:hi}); mid.push({x:i,y:(lo+hi)/2}); meas.push({x:i,y:null}); }
    else { band.push({x:i,lo:null,hi:null}); mid.push({x:i,y:mu}); meas.push({x:i,y:mu}); }
  });
  return {band:band,mid:mid,meas:meas};
}
function hrvHead(days){
  for (var i=days.length-1;i>=0;i--){
    var d=days[i]; if(!d) continue;
    var lo=num(d.hrv_min), hi=num(d.hrv_max);
    if (lo!=null&&hi!=null) return Math.round(lo)+"\u2013"+Math.round(hi);
    var mu=num(d.hrv); if (mu!=null) return String(Math.round(mu));
  }
  return null;
}

/* PORTING 26/09: HRV -- nessun target numerico e' mai stato fissato (serve un clinico, non
   un'estrapolazione statistica), quindi niente barra verso un obiettivo. Al suo posto un
   confronto con te stesso: media dei primi 14 giorni del ciclo contro la media degli ultimi 14
   giorni fino a oggi, punto medio dell'intervallo dove il dato e' a intervallo. */
/* PORTING 26/09: Volume -- niente estrapolazione a fine ciclo (sarebbe un numero calcolato
   spacciato per obiettivo). Due indicatori concreti al suo posto: quanti esercizi sono in salita
   (dalla stessa Progressione di Workout) e il confronto delle ultime 2 settimane piene contro le
   2 precedenti, stesso principio del confronto HRV -- con te stesso, non con un target. */
function weeklyVolumeSeriesFull(){
  /* PORTING 26/09: D() e' sempre lungo 112 (i giorni futuri esistono come null) -- il numero di
     settimane concluse va calcolato da OGGI, non dalla lunghezza dell'array, altrimenti le
     "ultime 2 settimane" prese con slice(-2) sono settimane future a zero. */
  var days = D(), nW = Math.floor((dayIdxFromISO(today) + 1) / 7), weeks = [];
  for (var w = 0; w < nW; w++) {
    var sum = 0;
    for (var d = 0; d < 7; d++) { var day = days[w*7+d]; if (day) sum += num(day.wo_volume) || 0; }
    weeks.push(sum);
  }
  return weeks;
}
function volumeTrendVsPrev(){
  var weeks = weeklyVolumeSeriesFull();
  if (weeks.length < 4) return null;
  var lastTwo = weeks.slice(-2), prevTwo = weeks.slice(-4, -2);
  var a = (lastTwo[0]+lastTwo[1]) / 2, b = (prevTwo[0]+prevTwo[1]) / 2;
  if (!b) return null;
  return { pct: Math.round((a - b) / b * 100) };
}
function progressionQuota(){
  if (!HISTORY_SESSIONS.length) return null;
  var data = AN_progressionData(), total = 0, rising = 0;
  Object.keys(data).forEach(function(m){
    data[m].rows.forEach(function(r){ total++; if (r.delta > 0) rising++; });
  });
  return total ? { rising: rising, total: total } : null;
}
function hrvMidOf(d){
  if (!d) return null;
  var lo = num(d.hrv_min), hi = num(d.hrv_max);
  if (lo != null && hi != null) return (lo + hi) / 2;
  return num(d.hrv);
}
function hrvBaselineVsNow(){
  var days = D(), t = dayIdxFromISO(today), base = [], cur = [];
  for (var i = 0; i < 14 && i < days.length; i++) { var v = hrvMidOf(days[i]); if (v != null) base.push(v); }
  for (var j = Math.max(0, t - 13); j <= t; j++) { var v2 = hrvMidOf(days[j]); if (v2 != null) cur.push(v2); }
  if (!base.length || !cur.length) return null;
  var avg = function(a){ return a.reduce(function(s,x){ return s+x; },0) / a.length; };
  return { base: avg(base), cur: avg(cur), delta: avg(cur) - avg(base) };
}
function buildHero(root){
  var host=ch(root,"hero.pillars"); if(!host) return;
  host.innerHTML="";
  var w=W(), t=T();
  var pesoS=seriesOf(w.slice,"peso"), pesoSt=statsOf(pesoS);
  var hrvHd=hrvHead(w.slice);
  var dexaLast=DEXA.length?DEXA[DEXA.length-1]:null;
  var volTot=w.slice.reduce(function(a,d){ return a+(d&&num(d.wo_volume)||0); },0);
  var adhAvg=(ADHERENCE.inj!=null&&ADHERENCE.supp!=null&&ADHERENCE.wo!=null)
    ? Math.round((ADHERENCE.inj+ADHERENCE.supp+ADHERENCE.wo)/3) : null;
  var pills=[
    {k:"peso", l:t.peso, v:pesoSt.last==null?null:it(pesoSt.last,1), u:"kg", cur:pesoSt.last, tgt:TARGETS.peso, from:(validPts(pesoS)[0]||{}).y, c:"var(--accent)"},
    {k:"lean", l:t.leanMass, v:dexaLast?it(dexaLast.lean_kg,1):null, u:"kg", cur:dexaLast?dexaLast.lean_kg:null, tgt:TARGETS.leanMass, from:DEXA.length?DEXA[0].lean_kg:null, c:"var(--c-s2)"},
    {k:"hrv",  l:t.hrv, v:hrvHd, u:"ms", cur:null, tgt:TARGETS.hrv, from:null, c:"var(--c-s1)"},
    {k:"adh",  l:t.adhShort, v:adhAvg==null?null:adhAvg, u:"%", cur:adhAvg, tgt:100, from:0, c:"var(--c-s2)"},
    {k:"vol",  l:t.volShort, v:volTot?it(Math.round(volTot/100)/10,1)+"t":null, u:"", cur:null, tgt:null, from:null, c:"var(--c-s3)"}
  ];
  var hrvCmp = hrvBaselineVsNow();
  var volTrend = volumeTrendVsPrev(), progQ = progressionQuota();
  pills.forEach(function(p){
    var el=document.createElement("div"); el.className="an-pill";
    var pct=null;
    if (p.tgt!=null&&p.cur!=null&&p.from!=null&&p.tgt!==p.from) pct=Math.max(0,Math.min(100,(p.cur-p.from)/(p.tgt-p.from)*100));
    var sub;
    if (p.k==="hrv"){
      /* PORTING 26/09: confronto con l'inizio ciclo, non un target -- niente barra colorata,
         solo il numero e il verso (su/giu'/invariato rispetto ai primi 14 giorni). */
      sub = (hrvCmp==null) ? '<span class="an-pill-t"><span class="an-slot"></span> vs inizio ciclo</span>'
        : '<span class="an-pill-t">'+(Math.abs(hrvCmp.delta)<1?"invariato":itSigned(Math.round(hrvCmp.delta),0)+" ms")+' vs inizio ciclo</span>';
    } else if (p.k==="vol"){
      /* PORTING 26/09: due righe invece della barra a target -- quota esercizi in salita
         (Progressione) e confronto ultime 2 settimane piene vs le 2 precedenti. */
      var l1 = progQ==null ? '<span class="an-pill-t"><span class="an-slot"></span> esercizi in salita</span>'
        : '<span class="an-pill-t">'+progQ.rising+"/"+progQ.total+' esercizi in salita</span>';
      var l2 = volTrend==null ? '<span class="an-pill-t"><span class="an-slot"></span> vs 2 sett. prima</span>'
        : '<span class="an-pill-t">'+itSigned(volTrend.pct,0)+'% vs 2 sett. prima</span>';
      sub = '<div style="display:flex;flex-direction:column;gap:2px;margin-top:2px">'+l1+l2+'</div>';
    } else {
      sub = (pct==null?'<span class="an-pill-t"><span class="an-slot"></span> '+T().target+'</span>'
                 :'<div class="an-pill-bar"><i style="width:'+pct.toFixed(0)+'%;background:'+p.c+'"></i></div>'+
                  '<span class="an-pill-t">'+pct.toFixed(0)+'% verso '+it(p.tgt,1)+'</span>');
    }
    el.innerHTML='<span class="an-pill-l">'+p.l+'</span>'+
      '<div class="an-pill-v"><strong data-bind="hero.'+p.k+'">'+(p.v==null?"\u2014":p.v)+'</strong><span>'+p.u+'</span></div>'+

/* Carico e recupero. La frase è una REGOLA con soglie dichiarate
   nel README: volume +/-5%, HRV +/-3%. Niente testo a mano.     */
function buildLoad(root){
  var el=ch(root,"load.chart"); if(!el) return;
  /* PORTING: bucket = settimane di calendario del ciclo (non blocchi di 7 giorni dall'inizio finestra) */
  var w=W(), fw=Math.floor(w.from/7), lw=Math.floor(TODAY()/7), nW=lw-fw+1, vols=[], hrvs=[];
  for (var k=0;k<nW;k++){
    var v=0, hv=[];
    for (var j=0;j<7;j++){
      var gi=(fw+k)*7+j-w.from, d=(gi>=0&&gi<w.slice.length)?w.slice[gi]:null; if(!d) continue;
      v+=num(d.wo_volume)||0;
      var lo=num(d.hrv_min),hi=num(d.hrv_max),mu=num(d.hrv);
      if (lo!=null&&hi!=null) hv.push((lo+hi)/2); else if (mu!=null) hv.push(mu);
    }
    vols.push({x:k,y:v||null}); hrvs.push({x:k,y:meanOf(hv)});
  }
  /* PORTING: la linea HRV ha scala propria (min-max del periodo), non quella dei kg */
  var hvv=validPts(hrvs).map(function(p){return p.y;}), hmin=Math.min.apply(null,hvv), hmax=Math.max.apply(null,hvv);
  var vmax=Math.max.apply(null,validPts(vols).map(function(p){return p.y;}).concat([1]));
  var hrvPlot=hrvs.map(function(p){ return {x:p.x, y:p.y==null?null:(hmax>hmin?(0.15+0.75*(p.y-hmin)/(hmax-hmin))*vmax:0.5*vmax)}; });
  renderChart(el,{
    series:[{type:"bar",data:vols,color:"var(--accent-soft)",label:T().volume},
            {type:"line",data:hrvPlot,color:"var(--c-s1)",label:T().hrv,markExtremes:false,dash:"4 4"}],
    options:{height:124,clampZero:true,loading:AN.loading,xMax:Math.max(1,nW-1),
      xLabels:vols.map(function(p){return {x:p.x,label:"W"+(Math.floor(w.from/7)+p.x+1)};}),
      emptyText:T().noData,fmtY:function(v){return it(Math.round(v/100)/10,1);}}
  });
  /* PORTING: solo settimane intere e concluse (la settimana in corso e quella tagliata dalla finestra non contano) */
  var fullK=function(p){ return (fw+p.x)*7>=w.from && (fw+p.x)<lw; };
  var vv=validPts(vols).filter(fullK).map(function(p){return p.y;}), hh=validPts(hrvs).filter(fullK).map(function(p){return p.y;});
  var verdict="\u2014";
  if (vv.length>=2&&hh.length>=2){
    var dv=(vv[vv.length-1]-vv[vv.length-2])/vv[vv.length-2];
    var dh=(hh[hh.length-1]-hh[hh.length-2])/hh[hh.length-2];
    if (dv>=0.05&&dh<=-0.03) verdict="volume +"+Math.round(dv*100)+"%, HRV "+Math.round(dh*100)+"%";
    else if (dv<=-0.05&&dh>=0.03) verdict="volume "+Math.round(dv*100)+"%, HRV +"+Math.round(dh*100)+"%";
    else verdict="volume "+itSigned(Math.round(dv*100),0)+"%, HRV "+itSigned(Math.round(dh*100),0)+"%";
  }
  setB(root,"load.verdict",verdict);
}

function buildWorkout(root){
  var w=W(), ev=eventsFor(w.from,w.slice.length);

  var hr=ch(root,"wo.table");
  if (hr){
    hr.innerHTML="";
    var rows=[];

        '<span>'+DOW[dowIndex(dt)]+'</span>'+

        '<span class="an-num">'+(r.d.wo_durata?r.d.wo_durata+"\u2032":"\u2014")+'</span>'+

      hr.appendChild(el);

  }
  var hp=ch(root,"wo.phase");
  if (hp){
    hp.innerHTML=""; var acc=0;
    PHASES.forEach(function(p){
      var from=acc, to=acc+p.weeks*7-1; acc=to+1;

        '<strong class="an-num">'+(vols.length?it(Math.round(meanOf(vols)/100)/10,1)+"t":"\u2014")+'</strong>'+
        '<span class="an-num">'+(rpes.length?it(meanOf(rpes),1):"\u2014")+'</span>';

      g.appendChild(c);
    });
    hw.appendChild(g);

  buildSentinels(root);

/* PORTING 23/09 - Progressione esercizi. Da history_sessions (V1): nome esatto + muscolo, come
   importato da Motra, non dalla mappa fissa dei sentinel. Segue da sola le sostituzioni (stessa
   macchina occupata -> esercizio diverso, stesso muscolo). Soglia: 2 sessioni per avere riga
   propria; sotto soglia finisce in "altri esercizi" per muscolo, senza tendenza. Un esercizio
   fatto su due macchine diverse (es. due shoulder press diverse) resta due righe separate: nome
   esatto, mai raggruppato, perche' i limiti sono specifici della macchina, non del movimento. */
function AN_progressionData(){
  var byKey = {};
  HISTORY_SESSIONS.forEach(function(s){
    (s.exercises || []).forEach(function(e){
      var ws = (e.sets || []).filter(function(st){ return st.kg != null; });
      if (!ws.length) return;
      var best = ws[0];
      ws.forEach(function(st){ if (st.kg > best.kg || (st.kg === best.kg && (st.reps || 0) > (best.reps || 0))) best = st; });
      var muscle = (e.muscle || "").split(",")[0].trim() || "altro";
      var key = muscle + "|" + e.name;
      if (!byKey[key]) byKey[key] = { muscle: muscle, name: e.name, hits: [] };
      byKey[key].hits.push({ date: s.date, kg: best.kg, reps: best.reps });
    });
  });
  var byMuscle = {};
  Object.keys(byKey).forEach(function(k){
    var x = byKey[k];
    x.hits.sort(function(a, b){ return a.date < b.date ? -1 : 1; });
    var first = x.hits[0], last = x.hits[x.hits.length - 1];
    var row = { name: x.name, n: x.hits.length, kg: last.kg, reps: last.reps, date: last.date,
                delta: x.hits.length >= 2 ? last.kg - first.kg : null };
    (byMuscle[x.muscle] = byMuscle[x.muscle] || { rows: [], other: [] });
    if (x.hits.length >= 2) byMuscle[x.muscle].rows.push(row); else byMuscle[x.muscle].other.push(x.name);
  });
  return byMuscle;
}
function buildProgression(root){
  var host = ch(root, "wo.progress"); if (!host) return;
  host.innerHTML = "";
  if (!HISTORY_SESSIONS.length) { host.innerHTML = '<div class="an-chart-state">' + (AN_V1.status === "loading" ? "Caricamento..." : T().noData) + '</div>'; return; }
  var data = AN_progressionData();
  /* PORTING 25/09: sezioni collassabili per muscolo, stesso pattern del Sentinel Lift
     (an-grp/an-grp-head/an-grp-body, stato AN.open) -- la card era troppo lunga aperta tutta
     insieme. Chiave "prog_<muscolo>" per non toccare lo stato dei gruppi Sentinel. */
  MUSCLES.forEach(function(m){
    var g = data[m.id]; if (!g || !g.rows.length) return;
    g.rows.sort(function(a, b){ return b.n - a.n; });
    var openKey = "prog_" + m.id;
    var grp = document.createElement("div");
    grp.className = "an-grp" + (AN.open[openKey] ? " is-open" : "");
    var head = document.createElement("button");
    head.type = "button"; head.className = "an-grp-head";
    head.setAttribute("aria-expanded", AN.open[openKey] ? "true" : "false");
    head.innerHTML = '<span class="an-caret">\u25B6</span><span class="an-gsw" style="background:' + m.color + '"></span>' +
      '<span class="an-gname">' + m.label + '</span><span class="an-gmeta">' + g.rows.length + '</span>';
    head.addEventListener("click", function(){
      AN.open[openKey] = !AN.open[openKey];
      grp.classList.toggle("is-open");
      head.setAttribute("aria-expanded", AN.open[openKey] ? "true" : "false");
    });
    grp.appendChild(head);
    var body = document.createElement("div"); body.className = "an-grp-body";
    g.rows.forEach(function(r){
      var el = document.createElement("div"); el.className = "an-trow";
      el.style.gridTemplateColumns = "1fr 54px 48px 54px";
      /* PORTING 23/09: RDL (qualunque attrezzo) e' vincolato -- niente stacco tradizionale sopra
         60-70 kg, ernia cervicale/lombare -- il verdetto non e' mai "in salita/in calo". */
      var capped = /romanian deadlift/i.test(r.name);
      var col = capped ? "var(--ink2)" : (r.delta == null ? "var(--ink3)" : (r.delta > 0 ? "var(--ok)" : (r.delta < 0 ? "var(--warn-ink)" : "var(--ink3)")));
      var deltaTxt = capped ? "entro il limite" : (r.delta == null ? "\u2014" : itSigned(r.delta, 1));
      el.innerHTML = '<span style="font-weight:500;color:var(--ink)">' + esc(r.name) + '</span>' +
        '<strong class="an-num">' + it(r.kg, 1) + ' kg</strong>' +
        '<span class="an-num" style="color:var(--ink3)">n=' + r.n + '</span>' +
        '<span class="an-num" style="font-weight:600;color:' + col + '">' + deltaTxt + '</span>';
      body.appendChild(el);
    });
    if (g.other.length) {
      var o = document.createElement("div");
      o.style.cssText = "font-size:9.5px;color:var(--ink3);padding:3px 9px 6px";
      o.textContent = "altri esercizi (1 sola sessione): " + g.other.join(", ");
      body.appendChild(o);

/* PORTING 23/09 - Frequenza per gruppo muscolare, ultime 4 settimane: quante sessioni hanno
   toccato ogni muscolo e da quanti giorni non viene allenato -- completa il volume cumulativo,
   che non dice se un gruppo e' trascurato di recente. */
function buildMuscleFreq(root){
  var host = ch(root, "wo.freq"); if (!host) return;
  host.innerHTML = "";
  if (!HISTORY_SESSIONS.length) { host.innerHTML = '<div class="an-chart-state">' + (AN_V1.status === "loading" ? "Caricamento..." : T().noData) + '</div>'; return; }
  var todayISO = today, cutoff = new Date(todayISO); cutoff.setDate(cutoff.getDate() - 28);
  var stats = {};
  HISTORY_SESSIONS.forEach(function(s){
    var seen = {};
    (s.exercises || []).forEach(function(e){
      (e.muscle || "").split(",").forEach(function(m){
        m = m.trim(); if (!m) return;
        var st = (stats[m] = stats[m] || { count28: 0, last: null });
        if (st.last == null || s.date > st.last) st.last = s.date;
        if (new Date(s.date) >= cutoff && !seen[m]) { st.count28++; seen[m] = true; }
      });
    });
  });
  MUSCLES.forEach(function(m){
    var st = stats[m.id]; if (!st) return;
    var days = st.last ? Math.round((new Date(todayISO) - new Date(st.last)) / 86400000) : null;
    var el = document.createElement("div"); el.className = "an-trow";
    el.style.gridTemplateColumns = "1fr 70px 90px";
    el.innerHTML = '<span style="display:flex;align-items:center;gap:7px;font-weight:600;color:var(--ink)"><span style="width:8px;height:8px;border-radius:2px;background:' + m.color + '"></span>' + m.label + '</span>' +
      '<strong class="an-num">' + st.count28 + '</strong>' +
      '<span class="an-num" style="color:' + (days == null ? "var(--ink3)" : (days > 10 ? "var(--warn-ink)" : "var(--ink3)")) + '">' + (days == null ? "\u2014" : days + "gg fa") + '</span>';
    host.appendChild(el);
  });
  if (!host.children.length) host.innerHTML = '<div class="an-chart-state">' + T().noData + '</div>';
}

function buildSentinels(root){
  var host=ch(root,"wo.sent"); if(!host) return;
  host.innerHTML=""; var t=TODAY();
  SL_GROUPS.forEach(function(g){
    var lifts=g.lifts.map(function(l){
      var first=null,last=null,n=0;
      for (var i=0;i<=t;i++){
        var d=D()[i], kg=d?num(d["sl_"+l.id+"_kg"]):null;
        if (kg==null) continue;
        n++; if (first==null) first=kg;
        last={kg:kg,reps:d["sl_"+l.id+"_reps"],sets:d["sl_"+l.id+"_sets"]};
      }
      return {def:l,first:first,last:last,n:n};
    });
    var withData=lifts.filter(function(x){return x.last;});
    var grp=document.createElement("div");
    grp.className="an-grp"+(AN.open[g.id]?" is-open":"");

    head.type="button"; head.className="an-grp-head";
    head.setAttribute("aria-expanded",AN.open[g.id]?"true":"false");
    head.innerHTML='<span class="an-caret">\u25B6</span><span class="an-gsw" style="background:'+g.color+'"></span>'+
      '<span class="an-gname">'+g.label+'</span><span class="an-gmeta">'+withData.length+"/"+lifts.length+'</span>';
    head.addEventListener("click",function(){
      AN.open[g.id]=!AN.open[g.id];
      grp.classList.toggle("is-open");
      head.setAttribute("aria-expanded",AN.open[g.id]?"true":"false");
    });
    grp.appendChild(head);
    var body=document.createElement("div"); body.className="an-grp-body";
    lifts.forEach(function(x){
      var row=document.createElement("div"); row.className="an-slrow";
      if (!x.last){ row.innerHTML='<span class="an-slname">'+x.def.label+'</span><span class="an-slempty" style="grid-column:2 / -1">'+T().noShots.toLowerCase()+'</span>'; }
      else {
        var dl=x.first!=null?x.last.kg-x.first:null;
        /* PORTING 23/09: RDL è vincolato (ernia cervicale/lombare, niente stacco tradizionale
           sopra 60-70 kg) — il carico non deve "salire", va giudicato entro il limite, mai in rosso. */
        var capped = x.def.id === "rdl";
        var col = capped ? "var(--ink2)" : (dl==null?"var(--ink3)":(dl>0?"var(--ok)":(dl<0?"var(--warn-ink)":"var(--ink3)")));
        var deltaTxt = capped ? "entro il limite" : (dl==null?"\u2014":itSigned(dl,1));
        row.innerHTML='<span class="an-slname">'+x.def.label+'</span>'+
          '<strong class="an-num" style="font-size:11px">'+it(x.last.kg,1)+' kg</strong>'+
          '<span class="an-num" style="font-size:10px;color:var(--ink3)">'+(x.last.sets||"?")+"\u00d7"+(x.last.reps||"?")+'</span>'+
          '<span class="an-num" style="font-size:10px;font-weight:600;color:'+col+'">'+deltaTxt+'</span>';
      }
      body.appendChild(row);
    });
    grp.appendChild(body); host.appendChild(grp);
  });
}

/* Volume per gruppo muscolare: 11 muscoli cumulativi, nessun

var MUSCLE_VOL = {};

function buildMuscles(root){
