      </div>
      <div style="flex:1 1 auto;display:flex;flex-direction:column;gap:3px;">
        <span style="font-size:9.5px;font-weight:600;color:var(--ink2);">${L.exercises}</span>
        ${exList ? exList.map(e => {
          const working = (e.sets || []).filter(st => st.label !== 'W');
          const reps = working[0] ? working[0].reps : ((e.sets || [])[0] || {}).reps;
          const kg = working[0] ? working[0].kg : ((e.sets || [])[0] || {}).kg;
          return `
            <div style="display:flex;align-items:center;gap:8px;padding:2px 0;">
              <span style="flex:1 1 auto;min-width:0;font-size:11px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(e.name)}</span>
              <span style="flex:0 0 38px;text-align:right;font-size:10px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;">${(working.length || (e.sets || []).length) + '×' + (reps != null ? reps : '—')}</span>
              <span style="flex:0 0 auto;font-size:11px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${kg != null ? kg + 'kg' : ''}</span>
            </div>`;
        }).join('') : `<span style="font-size:11px;font-weight:500;color:var(--ink2);">—</span>`}
      </div>`}
    </section>`;

  const SUBJ_SCALE_KEYS = ['energia', 'recupero', 'umore', 'rpe', 'appetito', 'sonno_sogg', 'libido', 'chiarezza'];
  const SUBJ_COLOR = {
    energia: 'var(--accent)', recupero: '#5b93cc', umore: 'var(--warn)', rpe: '#57575f',
    appetito: '#a86a00', sonno_sogg: '#3d6f9e', libido: 'var(--bad)', chiarezza: '#6d6d76'
  };
  const soggettivoCard = `
    <section style="grid-column:8 / 13;grid-row:3 / 4;${card}padding:12px 15px;display:flex;flex-direction:column;gap:7px;">
      <span style="flex:0 0 auto;${lbl}">${L.subjective} · scala 1-10</span>
      <div style="flex:1 1 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:7px 11px;align-content:start;">
        ${SUBJ_SCALE_KEYS.map(key => {
          const cur = parseInt(day[key], 10) || 0;
          return `<div style="display:flex;flex-direction:column;gap:3px;min-width:0;">
            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:5px;">
              <span style="font-size:9px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${L.subj[key]}</span>
              <span style="font-size:9.5px;font-weight:600;color:${cur ? SUBJ_COLOR[key] : 'var(--ink2)'};font-variant-numeric:tabular-nums;">${cur || '—'}</span>
            </div>
            <div style="display:flex;gap:1px;">
              ${Array.from({ length: 10 }, (_, n) => `<span data-subjpip="${key}|${n + 1}" style="flex:1 1 0;height:10px;border-radius:2px;background:${n < cur ? SUBJ_COLOR[key] : 'var(--line2)'};cursor:pointer;"></span>`).join('')}
            </div>
          </div>`;
        }).join('')}
        ${['ritenzione', 'formicolio', 'pienezza_add'].map(key => {
          const idx = day[key] === '' || day[key] == null ? -1 : parseInt(day[key], 10);
          const cur = idx >= 0 ? ENUM_LABELS[key][idx] : '';
          const open = openMenu === 'cat-' + key;
          const hot = cur === 'Marcata' || cur === 'Intensa' || cur === 'Presente';
          const ink = !cur ? 'var(--ink2)' : (hot ? 'var(--bad)' : 'var(--accent-ink)');
          const bg = cur ? (hot ? 'rgba(216,30,5,.10)' : 'var(--accent-soft)') : 'transparent';
          return `<div style="display:flex;flex-direction:column;gap:3px;min-width:0;position:relative;">
            <span style="font-size:9px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${L.subj[key]}</span>
            <span data-subjmenu="cat-${key}" style="display:flex;align-items:center;justify-content:center;height:10px;padding:5px 4px;box-sizing:content-box;border-radius:5px;background:${bg};border:1px solid ${cur ? 'transparent' : 'var(--line)'};font-size:9px;font-weight:600;color:${ink};cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${cur || '—'}</span>
            ${open ? `<div style="position:absolute;bottom:100%;margin-bottom:5px;right:0;z-index:25;min-width:104px;background:var(--surf);border:1px solid var(--line);border-radius:9px;box-shadow:var(--shadow-lg);padding:4px;display:flex;flex-direction:column;">
              ${ENUM_LABELS[key].map((o, i) => `<span data-subjenum="${key}|${i}" style="padding:6px 9px;border-radius:6px;background:${i === idx ? 'var(--surf2)' : 'transparent'};color:var(--ink);font-size:10.5px;font-weight:${i === idx ? 700 : 500};cursor:pointer;white-space:nowrap;">${o}</span>`).join('')}
            </div>` : ''}
          </div>`;
        }).join('')}
      </div>
    </section>`;

  return `
    <div class="g-nav">${renderDayNav()}</div>
    <div class="oggi-grid" style="display:grid;grid-template-columns:repeat(12,1fr);grid-template-rows:repeat(3,min-content);gap:9px;max-width:1280px;">
      ${heroCard}${pesoCard}${iniezioniCard}${adherenceCard}${integratoriCard}${allenamentoCard}${soggettivoCard}
    </div>
  `;
}
function L2() { return t(); } // alias breve, usato solo dentro renderOggiFull per leggibilità

function renderOggiSections() {
  const L = t();
  const day = getDay(selDate);
  const dayIdx = dayIdxFromISO(selDate);
  const wo = getWorkout2(dayIdx);
  const slots = getInjectionSlots2(dayIdx);
  const weekN = Math.floor(dayIdx / 7) + 1;
  const isOverridden = !!day.wo_override;

  const dowLbl = new Date(selDate + 'T00:00:00').getDay();
  const mapLbl = { 0: 'Upper Dom', 1: 'Riposo', 2: 'Push', 3: 'Pull', 4: 'Riposo', 5: 'Legs', 6: 'Upper Sab' };
  const defaultType = mapLbl[dowLbl] || 'Riposo';
  const overrideOpts = ['Riposo', 'Push', 'Pull', 'Legs', 'Upper Sab', 'Upper Dom'];

  const sonnoTot = parseSonnoHours(day.ore_sonno);
  const sonnoTxt = isNaN(sonnoTot) ? '—' : Math.floor(sonnoTot) + 'h' + Math.round((sonnoTot % 1) * 60);

  const dateLabel = new Date(selDate + 'T00:00:00').toLocaleDateString(LANG === 'it' ? 'it-IT' : 'en-GB', { weekday: 'long', day: 'numeric', month: 'long' });

  const hdr = `
    <div class="day-hdr">
      <div class="day-hdr-left">
        <div class="day-date">${dateLabel[0].toUpperCase() + dateLabel.slice(1)}</div>
        <div class="day-meta">${L.day} ${dayIdx}/${CFG.CYCLE_DAYS} · ${L.week} ${weekN}</div>
      </div>
      <div style="display:flex;align-items:center;gap:8px">
        <span class="day-badge ${isOverridden ? 'overridden' : ''}">${wo.type.toUpperCase()}</span>
        <select class="day-override-sel" onchange="patch(selDate,'wo_override',this.value)">
          <option value="" ${!isOverridden ? 'selected' : ''}>${L.choose} (${defaultType})</option>
          ${overrideOpts.map(o => `<option value="${o}" ${day.wo_override === o ? 'selected' : ''}>${o}</option>`).join('')}
        </select>
      </div>
    </div>`;

  const biometria = `
    <div class="section">
      <div class="section-label">${L.weight}</div>
      <div class="field-row">
        <div class="field-label">${L.weight}</div>
        <input class="field-value" type="number" step="0.1" value="${day.peso || ''}" placeholder="—" oninput="patch(selDate,'peso',this.value)"><span class="field-value-unit">kg</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Pressione' : 'Blood pressure'}</div>
        <div style="display:flex;align-items:center;gap:4px">
          <input class="field-value" style="width:44px" type="number" value="${day.bp_sys || ''}" placeholder="—" oninput="patch(selDate,'bp_sys',this.value)">
          <span class="field-value-unit">/</span>
          <input class="field-value" style="width:44px" type="number" value="${day.bp_dia || ''}" placeholder="—" oninput="patch(selDate,'bp_dia',this.value)">
        </div>
      </div>
      <div class="field-row">
        <div class="field-label">HRV</div>
        <input class="field-value" type="number" value="${day.hrv || ''}" placeholder="—" oninput="patch(selDate,'hrv',this.value)"><span class="field-value-unit">ms</span>
      </div>
      <div class="field-row">
        <div class="field-label">RHR</div>
        <input class="field-value" type="number" value="${day.rhr || ''}" placeholder="—" oninput="patch(selDate,'rhr',this.value)"><span class="field-value-unit">bpm</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Sonno' : 'Sleep'}</div>
        <div style="text-align:right">
          <input class="field-value" style="width:70px" type="text" value="${day.ore_sonno || ''}" placeholder="5.18" oninput="patch(selDate,'ore_sonno',this.value)">
          <div class="field-sub">${sonnoTxt} · REM ${day.sonno_rem_min || '—'}m · Prof. ${day.sonno_profondo_min || '—'}m · ${day.sonno_risvegli || '—'} risvegli</div>
        </div>
      </div>
    </div>`;

  // Riepilogo compatto degli stessi dati biometrici — SOLO desktop (dentro la
  // card Peso, come nel mockup approvato). Su mobile resta nascosto via CSS:
  // i dati restano editabili nella sezione Biometria sopra, questo è solo un
  // riepilogo a colpo d'occhio in più, non un secondo posto dove scrivere.
  const biometriaChips = `
    <div class="biometria-chips">
      <div class="biometria-chip"><span class="biometria-chip-label">Pressione</span><span class="biometria-chip-value">${day.bp_sys || '—'}/${day.bp_dia || '—'}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Profondo</span><span class="biometria-chip-value">${day.sonno_profondo_min || '—'}m</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Risvegli</span><span class="biometria-chip-value">${day.sonno_risvegli || '—'}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">HRV</span><span class="biometria-chip-value">${day.hrv || '—'} ms</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Freq. a riposo</span><span class="biometria-chip-value">${day.rhr || '—'} bpm</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Sonno</span><span class="biometria-chip-value">${sonnoTxt}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">REM</span><span class="biometria-chip-value">${day.sonno_rem_min || '—'}m</span></div>
    </div>`;

  const iniezioni = `
    <div class="section">
      <div class="section-label">${L.injections}</div>
      ${slots.map(s => `
        <div class="slot-hdr">${s.label}${s.igfMuscle !== undefined ? ` · ${L.district}: <select class="subj-select" style="font-size:11px;padding:2px 5px" onchange="patch(selDate,'inj_${s.n}_distretto',this.value)"><option value="">${L.choose}</option>${['Petto','Bicipiti','Deltoidi','Tricipiti','Quadricipiti'].map(m => `<option value="${m}" ${(day['inj_' + s.n + '_distretto'] || s.igfMuscle) === m ? 'selected' : ''}>${m}</option>`).join('')}</select>` : ''}</div>
        ${s.fields.map(f => {
          const fkeyRaw = fieldKey(f);
          const stKey = 'inj_' + s.n + '_' + fkeyRaw;
          const state = day[stKey] || '';
          const isIgf = f.indexOf('IGF-1 DES') === 0;
          return `
          <div class="state-row">
            <span class="state-name">${f}</span>
            ${!isIgf ? `<select class="state-site" onchange="patch(selDate,'${stKey}_sito',this.value)">
              <option value="">${L.site}</option>
              ${SITES_SC.map(site => `<option value="${site}" ${day[stKey + '_sito'] === site ? 'selected' : ''}>${site}</option>`).join('')}
            </select>` : ''}
            ${stateDot(state, `cycleInjState(${dayIdx},${s.n},${JSON.stringify(f)})`, f)}
          </div>`;
        }).join('')}
      `).join('')}
    </div>`;

  // Versione desktop: niente intestazione "Mattino/Pomeriggio/Sera" a riga
  // propria (occupava una riga intera nel mockup non c'è) — l'orario è
  // inline nel nome della riga stessa. L'unica eccezione è il selettore
  // distretto post-WO, che resta un'intestazione perché è un controllo, non
  // solo un'etichetta.
  const iniezioniDesktop = `
    <div class="section">
      <div class="section-label">${L.injections}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : slots.map(s => `
        ${s.igfMuscle !== undefined ? `<div class="slot-hdr">${L.district}: <select class="subj-select" style="font-size:11px;padding:2px 5px" onchange="patch(selDate,'inj_${s.n}_distretto',this.value)"><option value="">${L.choose}</option>${['Petto','Bicipiti','Deltoidi','Tricipiti','Quadricipiti'].map(m => `<option value="${m}" ${(day['inj_' + s.n + '_distretto'] || s.igfMuscle) === m ? 'selected' : ''}>${m}</option>`).join('')}</select></div>` : ''}
        ${s.fields.map(f => {
          const fkeyRaw = fieldKey(f);
          const stKey = 'inj_' + s.n + '_' + fkeyRaw;
          const state = day[stKey] || '';
          const isIgf = f.indexOf('IGF-1 DES') === 0;
          return `
          <div class="state-row">
            <span class="state-name">${f} <span class="inj-time">· ${s.label}</span></span>
            ${!isIgf ? `<select class="state-site" onchange="patch(selDate,'${stKey}_sito',this.value)">
              <option value="">${L.site}</option>
              ${SITES_SC.map(site => `<option value="${site}" ${day[stKey + '_sito'] === site ? 'selected' : ''}>${site}</option>`).join('')}
            </select>` : ''}
            ${stateDot(state, `cycleInjState(${dayIdx},${s.n},${JSON.stringify(f)})`, f)}
          </div>`;
        }).join('')}
      `).join('')}
    </div>`;

  const integratori = `
    <div class="section">
      <div class="section-label">${L.supplements}</div>
      ${SUPP_FIELDS.map(sf => `
        <div class="state-row">
          <span class="state-name">${SUPP_LABELS[sf]}</span>
          ${stateDot(suppState(day, sf), `cycleSuppState('${sf}')`, SUPP_LABELS[sf])}
        </div>`).join('')}
    </div>`;

  const legend = `
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf);border:1.5px solid var(--line)"></div>—</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--ok)"></div>${L.doseDone}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf);border:1.5px solid var(--warn)"></div>${L.doseSkip}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf2)"></div>${L.doseNa}</div>
    </div>`;

  // motra_log è salvato come stringa JSON (come index.html), non oggetto —
  // va parsato esplicitamente, con guardia in caso manchi o sia malformato.
  const motraLog = (() => {
    if (!day.motra_log) return null;
    if (typeof day.motra_log === 'object') return day.motra_log;
    try { return JSON.parse(day.motra_log); } catch (e) { return null; }
  })();
  const exList = (motraLog && Array.isArray(motraLog.exercises)) ? motraLog.exercises : null;
  const exercises = exList ? `
    <div class="exercises-block">
      <div class="field-label" style="margin-bottom:6px">${L.exercises}</div>
      ${exList.map(ex => {
        const working = (ex.sets || []).filter(s => s.label !== 'W');
        const reps = working[0] ? working[0].reps : (ex.sets && ex.sets[0] ? ex.sets[0].reps : '—');
        return `<div class="exercise-row"><span>${ex.name}</span><span class="exercise-sets">${working.length || (ex.sets || []).length}×${reps}</span></div>`;
      }).join('')}
    </div>` : `<div class="exercise-empty">${LANG === 'it' ? 'Nessun log Motra importato per questo giorno.' : 'No Motra log imported for this day.'}</div>`;

  const allenamento = `
    <div class="section">
      <div class="section-label">${L.training}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : `
      <div class="field-row">
        <div class="field-label">Volume</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_volume || ''}" placeholder="—" oninput="patch(selDate,'wo_volume',this.value)"><span class="field-value-unit">kg</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Durata' : 'Duration'}</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_durata || ''}" placeholder="—" oninput="patch(selDate,'wo_durata',this.value)"><span class="field-value-unit">min</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Calorie' : 'Calories'}</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_kcal || ''}" placeholder="—" oninput="patch(selDate,'wo_kcal',this.value)"><span class="field-value-unit">kcal</span>
      </div>
      ${exercises}`}
    </div>`;

  // Desktop: Durata/Volume/Calorie su un'unica riga compatta a 3 colonne,
  // come nel mockup, invece di tre field-row impilate.
  const allenamentoDesktop = `
    <div class="section">
      <div class="section-label">${L.training}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : `
      <div class="wo-fields-row">
        <div class="wo-field"><span class="wo-field-label">${LANG === 'it' ? 'Durata' : 'Duration'}</span><div class="wo-field-val"><input type="number" value="${day.wo_durata || ''}" placeholder="—" oninput="patch(selDate,'wo_durata',this.value)"><span class="wo-field-unit">min</span></div></div>
        <div class="wo-field"><span class="wo-field-label">Volume</span><div class="wo-field-val"><input type="number" value="${day.wo_volume || ''}" placeholder="—" oninput="patch(selDate,'wo_volume',this.value)"><span class="wo-field-unit">kg</span></div></div>
        <div class="wo-field"><span class="wo-field-label">${LANG === 'it' ? 'Calorie' : 'Calories'}</span><div class="wo-field-val"><input type="number" value="${day.wo_kcal || ''}" placeholder="—" oninput="patch(selDate,'wo_kcal',this.value)"><span class="wo-field-unit">kcal</span></div></div>
      </div>
      ${exercises}`}
    </div>`;

  const soggettivo = `
    <div class="section">
      <div class="section-label">${L.subjective}</div>
      ${['energia', 'recupero', 'umore', 'libido', 'chiarezza', 'rpe', 'appetito'].map(sf => `
        <div class="field-row">
          <div class="field-label">${L.subj[sf]}</div>
          <select class="subj-select" onchange="patch(selDate,'${sf}',this.value)">
            <option value="">—</option>
            ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}" ${day[sf] == n ? 'selected' : ''}>${n}/10</option>`).join('')}
          </select>
        </div>`).join('')}
      ${['ritenzione', 'formicolio', 'pienezza_add'].map(sf => `
        <div class="field-row">
          <div class="field-label">${L.subj[sf]}</div>
          <select class="subj-select" onchange="patch(selDate,'${sf}',this.value)">
            <option value="">—</option>
            ${ENUM_LABELS[sf].map((lbl, i) => `<option value="${i}" ${day[sf] == i ? 'selected' : ''}>${lbl}</option>`).join('')}
          </select>
        </div>`).join('')}
      <div class="field-row">
        <div class="field-label">${L.subj.sonno_sogg}</div>
        <select class="subj-select" onchange="patch(selDate,'sonno_sogg',this.value)">
          <option value="">—</option>
          ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}" ${day.sonno_sogg == n ? 'selected' : ''}>${n}/10</option>`).join('')}
        </select>
      </div>
    </div>`;

  // Desktop: griglia 2 colonne (verificata a fare i conti, non 3 — vedi nota
  // CSS sopra), barre a segmenti per i punteggi 1-10, pillole cliccabili per
  // le scale testuali — non più menu a tendina, sono proprio controlli diversi.
  const soggettivoDesktop = `
    <div class="section">
      <div class="section-label">${L.subjective}</div>
      <div class="subj-grid-2">
        <div class="field-row"><div class="field-label">${L.subj.energia}</div>${barHtml('energia', day.energia)}</div>
        <div class="field-row"><div class="field-label">${L.subj.recupero}</div>${barHtml('recupero', day.recupero)}</div>
        <div class="field-row"><div class="field-label">${L.subj.umore}</div>${barHtml('umore', day.umore)}</div>
        <div class="field-row"><div class="field-label">${L.subj.libido}</div>${barHtml('libido', day.libido)}</div>
        <div class="field-row"><div class="field-label">${L.subj.chiarezza}</div>${barHtml('chiarezza', day.chiarezza)}</div>
        <div class="field-row"><div class="field-label">${L.subj.rpe}</div>${barHtml('rpe', day.rpe)}</div>
        <div class="field-row"><div class="field-label">${L.subj.appetito}</div>${barHtml('appetito', day.appetito)}</div>
        <div class="field-row"><div class="field-label">${L.subj.sonno_sogg}</div>${barHtml('sonno_sogg', day.sonno_sogg)}</div>
        <div class="field-row"><div class="field-label">${L.subj.ritenzione}</div>${pillHtml('ritenzione', day.ritenzione, ENUM_LABELS.ritenzione)}</div>
        <div class="field-row"><div class="field-label">${L.subj.formicolio}</div>${pillHtml('formicolio', day.formicolio, ENUM_LABELS.formicolio)}</div>
        <div class="field-row"><div class="field-label">${L.subj.pienezza_add}</div>${pillHtml('pienezza_add', day.pienezza_add, ENUM_LABELS.pienezza_add)}</div>
      </div>
    </div>`;

  const note = `
    <div class="section">
      <div class="section-label">${L.notes}</div>
      <textarea style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px;min-height:60px;background:var(--surf2);color:var(--ink)" placeholder="—" oninput="patch(selDate,'note',this.value)">${day.note || ''}</textarea>
    </div>`;

  return { hdr, biometria, biometriaChips, iniezioni, iniezioniDesktop, integratori, legend, allenamento, allenamentoDesktop, soggettivo, soggettivoDesktop, note };
}

// Vista mobile della card giorno — invariata rispetto a prima: un'unica
// day-card con tutte le sezioni impilate. Ora è solo un assemblaggio dei
// frammenti di renderOggiSections(), la logica dei campi non è duplicata.
function renderOggi() {
  const s = renderOggiSections();
  return `
  <div class="day-card">
    ${s.hdr}
    ${s.biometria}
    ${s.iniezioni}
    ${s.integratori}
    ${s.legend}
    ${s.allenamento}
    ${s.soggettivo}
    ${s.note}
  </div>
  `;
}
function bindOggi() {
  if (!MIGRATED[tab] || tab !== 'oggi' || !store.loaded) return;
  const app = document.getElementById('app');

  if (!isDesktop) {
    // Mobile — canvas per grafico peso e gauge aderenza, come sempre.
    const wHist = weightHistory(pesoRange, selDate);
    drawWeightChart('peso-chart-canvas', wHist, getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1f5fbf');
    const a = adherence(store.blob);
    drawComplianceRing('ring-inj', a.inj, getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#1f5fbf');
    drawComplianceRing('ring-supp', a.supp, getComputedStyle(document.documentElement).getPropertyValue('--warn').trim() || '#f5c400');
    drawComplianceRing('ring-wo', a.wo, getComputedStyle(document.documentElement).getPropertyValue('--bad').trim() || '#d81e05');
    return;
  }

  // Desktop — porting da produzione/v2.html: niente canvas (il grafico e i
  // gauge sono SVG inline, si aggiornano da soli col resto del markup),
  // solo handler sui data-attributi delle celle interattive.
  app.querySelectorAll('[data-f]').forEach(el => {
    el.onchange = () => patch(selDate, el.dataset.f, el.value);
  });
  app.querySelectorAll('[data-range]').forEach(el => {
    el.onclick = () => { pesoRange = +el.dataset.range; render(); };
  });
  app.querySelectorAll('[data-injdose]').forEach(el => {
    const k = +el.dataset.injdose;
    el.onclick = () => {
      // ricostruita qui invece di richiamare renderOggiFull: ci serve solo
      // la stessa lista appiattita di dosi per risalire alla stateKey di k.
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[k];
      if (fd) cycleInjState(dayIdx2, fd.n, fd.f);
    };
  });
  app.querySelectorAll('[data-injmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.injmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-injsite]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [k, site] = el.dataset.injsite.split('|');
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[+k];
      if (!fd) return;
      const siteKey = fd.isIgf ? ('inj_' + fd.n + '_distretto') : ('inj_' + fd.n + '_' + fieldKey(fd.f) + '_sito');
      const cur = getDay(selDate)[siteKey] || '';
      openMenu = null;
      patch(selDate, siteKey, cur === site ? '' : site);
    };
  });
  app.querySelectorAll('[data-suppdose]').forEach(el => {
    el.onclick = () => cycleSuppState(el.dataset.suppdose);
  });
  app.querySelectorAll('[data-subjpip]').forEach(el => {
    el.onclick = () => {
      const [key, n] = el.dataset.subjpip.split('|');
      const cur = parseInt(getDay(selDate)[key], 10) || 0;
      patch(selDate, key, cur === +n ? 0 : +n); // ritocco sullo stesso pip azzera
    };
  });
  app.querySelectorAll('[data-subjmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.subjmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-subjenum]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [key, idx] = el.dataset.subjenum.split('|');
      openMenu = null;
      patch(selDate, key, idx);
    };
  });
}

/* Un click fuori dalle celle interattive chiude qualunque menù aperto
   (sede iniezione / valore categorico) — porting diretto dal riferimento. */
document.addEventListener('click', () => {
  if (openMenu) { openMenu = null; render(); }
});

window.addEventListener('hashchange', () => {
  tab = location.hash.replace('#', '') || 'oggi';
  render();
});

// Ridisegna quando si attraversa la soglia desktop (non ad ogni pixel di
// resize, solo quando cambia effettivamente il layout da mostrare).
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const nowDesktop = window.innerWidth >= 1024;
    if (nowDesktop !== isDesktop) { isDesktop = nowDesktop; render(); }
  }, 150);
});

document.documentElement.lang = LANG;
render();
loadBlob().then(render).catch(e => console.error('Errore caricamento dati', e));
</script>
