/* ══════════════════════════════════════════════════════════
   8 · FOTO
   photo_log = [{date, note, luogo, filename, peso_manual?}].
   Le immagini stanno in storage privato: qui solo il segnaposto
   con data-photo="<filename>". Le metriche del giorno arrivano
   da PHOTO_METRICS, non le calcolo io.
   Le azioni di scrittura NON sono qui: "Nuovo scatto" emette
   soltanto un evento an:photo:new.
   ══════════════════════════════════════════════════════════ */
/* PORTING: gli scatti pre-ciclo (i<0) non hanno un "giorno di ciclo" */
function gTag(i){ return i>=0 ? "g"+(i+1) : "pre"; }
function photoDayIndex(p){
  var parts=String(p.date).split("-");
  return dayOfCycle(new Date(+parts[0], +parts[1]-1, +parts[2]));
}
function photoMetrics(p){
  var m=PHOTO_METRICS[p.date]||{};
  var i=photoDayIndex(p), d=D()[i]||{};
  return [
    [T().peso, m.peso!=null?it(m.peso,1)+" kg":(p.peso_manual?it(num(p.peso_manual),1)+" kg":(num(d.peso)!=null?it(num(d.peso),1)+" kg":null))],
    [T().hrv,  m.hrvHead!=null?m.hrvHead+" ms":null],
    [T().sonno,m.sonno!=null?fmtHours(m.sonno):null],
    ["% "+T().injections,  m.inj!=null?m.inj+"%":null],
    ["% "+T().supplements, m.supp!=null?m.supp+"%":null],
    [T().workouts, m.workout!=null?m.workout:null]
  ];
}
/* PORTING 25/09: countdown T1/T2 e giorno/settimana -- stessi dati gia' mostrati altrove
   nell'app (T1 12/09, T2 07/11), qui applicati alla DATA DELLO SCATTO come in V1, non a oggi. */
function photoT1T2Label(p){
  var t1 = new Date(2026, 8, 12), t2 = new Date(2026, 10, 7);
  var d = new Date(p.date + "T00:00:00");
  var dT1 = Math.round((t1 - d) / 86400000), dT2 = Math.round((t2 - d) / 86400000);
  var lab = function(n){ return n > 0 ? n + "gg" : (n === 0 ? "Oggi" : "\u2713 fatto"); };
  return "T1 " + lab(dT1) + " \u00b7 T2 " + lab(dT2);
}
function photoDayWeekLabel(p){
  var i = photoDayIndex(p);
  if (i < 0) return "Pre-ciclo";
  return "Giorno " + i + "/" + CYCLE.days + " \u00b7 Settimana " + (Math.floor(i / 7) + 1);
}
/* PORTING 26/09: quota allenamenti della settimana, congelata alla data dello scatto (non a
   oggi) -- stesso identico criterio (AN_dayAdh) gia' usato ovunque, letto giorno per giorno
   dall'inizio della settimana fino al giorno della foto. */
function photoWorkoutWeekLabel(p){
  var i = photoDayIndex(p);
  if (i < 0) return null;
  var wkStart = Math.floor(i / 7) * 7, tot = 0, done = 0;
  for (var k = wkStart; k <= i; k++) { var x = AN_dayAdh(k); tot += x.woTot; done += x.woDone; }
  return tot > 0 ? (done + "/" + tot) : null;
}
/* PORTING 26/09: la pillola ora renderizza sempre, anche senza dato -- un trattino invece di
   una cella vuota. Prima una cella nulla lasciava un buco nella griglia 3x2 (visto sul 21/09,
   primo giorno della settimana: "WO sett." a 0/0 spariva del tutto invece di mostrare "0/0"
   o un trattino), che sembrava un problema di visualizzazione. */
function statPill(label, val, color){
  var empty = (val == null || val === "");
  var display = empty ? "\u2014" : val;
  var col = empty ? "var(--ink3)" : (color || "var(--ink)");
  return '<div style="background:var(--surf2);border-radius:10px;padding:10px 6px;text-align:center">' +
    '<div style="font-size:15px;font-weight:700;letter-spacing:-.01em;color:' + col + '">' + display + '</div>' +
    '<div style="font-size:9px;color:var(--ink3);text-transform:uppercase;letter-spacing:.03em;margin-top:2px">' + label + '</div></div>';
}
function photoDeleteBtn(filename, pos){
  var b = document.createElement("button"); b.type = "button"; b.className = "an-fdel";
  b.style.cssText = pos || "top:5px;right:5px;";
  b.title = "Elimina foto"; b.textContent = "\u2715";
  b.addEventListener("click", function(ev){ ev.stopPropagation(); AN_deletePhotoEntry(filename); });
  return b;
}
/* PORTING 26/09: elimina SOLO il riferimento in photo_log (stesso comportamento di V1 --
   fotoDeleteEntry -- il file nello storage non viene rimosso: gia' cosi' in V1, decisione
   presa in precedenza e mai cambiata). Stesso read-modify-write di sempre. */
function AN_deletePhotoEntry(filename){
  if (!confirm("Eliminare questa foto dalla timeline?")) return;
  var qs = "?user_id=eq.giorgio_protocollo_2026";
  fetch(CFG.PROXY_URL + qs + "&select=data", { headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY } })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var d = (rows[0] && rows[0].data) || {};
      d.photo_log = (Array.isArray(d.photo_log) ? d.photo_log : []).filter(function(e){ return e.filename !== filename; });
      return fetch(CFG.PROXY_URL + qs, {
        method: "PATCH",
        headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: JSON.stringify({ data: d })
      });
    })
    .then(function(res){
      if (!res.ok) throw new Error("HTTP " + res.status);
      PHOTO_LOG = PHOTO_LOG.filter(function(e){ return e.filename !== filename; });
      renderAll();
    })
    .catch(function(e){ alert("Errore nella cancellazione: " + e.message); });
}
function pctColor(pct){ return pct == null ? "var(--ink3)" : (pct >= 100 ? "var(--ok)" : (pct > 0 ? "var(--warn-ink)" : "var(--bad)")); }
function photoSlot(p, cls){
  var el=document.createElement("div");

/* PORTING 24/09: salva SOLO il rating (1-5) sullo scatto -- fetch fresco, aggiorna la sola
   voce del filename in photo_log, PATCH, poi allinea PHOTO_LOG in locale e ridisegna. */
function AN_savePhotoRating(filename, rating){
  var base = CFG.PROXY_URL, qs = "?user_id=eq.giorgio_protocollo_2026";
  fetch(base + qs + "&select=data", { headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY } })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var d = (rows[0] && rows[0].data) || {};
      var log = Array.isArray(d.photo_log) ? d.photo_log.slice() : [];
      var idx = -1;
      for (var i = 0; i < log.length; i++) if (log[i] && log[i].filename === filename) { idx = i; break; }
      if (idx < 0) throw new Error("scatto non trovato in photo_log: " + filename);
      log[idx] = Object.assign({}, log[idx], { rating: rating });
      d.photo_log = log;
      return fetch(base + qs, {
        method: "PATCH",
        headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: JSON.stringify({ data: d })
      });
    })
    .then(function(){
      var e = PHOTO_LOG.find ? PHOTO_LOG.find(function(p){ return p.filename === filename; }) : null;
      if (!e) { for (var i = 0; i < PHOTO_LOG.length; i++) if (PHOTO_LOG[i].filename === filename) { e = PHOTO_LOG[i]; break; } }
      if (e) e.rating = rating;
      renderAll();
    })
    .catch(function(err){ console.error("Salvataggio valutazione fallito:", err); });
}

/* Nuovo scatto: solo UI. La scrittura resta fuori dal design:
   il modulo emette un evento e non tocca i dati.               */
/* PORTING 25/09 -- upload reale, pipeline identica a index.html (V1): EXIF prima di ogni
   conversione (data/ora + GPS), HEIC->JPEG con heic2any se serve, ridimensionamento su canvas
   a 1200px lato lungo e ricompressione JPEG 85%, nome file "<data>_<timestamp>.jpg", reverse
   geocoding via Nominatim per il luogo se ci sono coordinate. Al salvataggio: POST multipart a
   {base}/photo-upload (stesso Edge Function diario-proxy), poi fetch fresco + append a
   photo_log + PATCH sul record V1 -- stesso read-modify-write di sempre. */
var AN_PHOTO_PENDING = null;
function AN_photoIsHeic(file){
  return /heic|heif/i.test(file.type || "") || /\.(heic|heif)$/i.test(file.name || "");
}
function AN_photoReadExif(file){
  return new Promise(function(resolve){
    if (typeof EXIF === "undefined") { resolve({date:null,time:null,lat:null,lon:null}); return; }
    try {
      EXIF.getData(file, function(){
        var raw = EXIF.getTag(this, "DateTimeOriginal");
        var date = null, time = null;
        if (raw) { var m = /^(\d{4}):(\d{2}):(\d{2})\s+(\d{2}):(\d{2})/.exec(raw); if (m) { date = m[1]+"-"+m[2]+"-"+m[3]; time = m[4]+":"+m[5]; } }
        var latDMS = EXIF.getTag(this, "GPSLatitude"), lonDMS = EXIF.getTag(this, "GPSLongitude");
        var latRef = EXIF.getTag(this, "GPSLatitudeRef"), lonRef = EXIF.getTag(this, "GPSLongitudeRef");
        var lat = null, lon = null;
        if (latDMS && lonDMS && latRef && lonRef) {
          var toDec = function(dms, ref){ var dec = dms[0] + dms[1]/60 + dms[2]/3600; return (ref === "S" || ref === "W") ? -dec : dec; };
          lat = toDec(latDMS, latRef); lon = toDec(lonDMS, lonRef);
        }
        resolve({date:date, time:time, lat:lat, lon:lon});
      });
    } catch (e) { resolve({date:null,time:null,lat:null,lon:null}); }
  });
}
function AN_photoMaybeHeic(file){
  if (!AN_photoIsHeic(file)) return Promise.resolve(file);
  if (typeof heic2any === "undefined") return Promise.reject(new Error("Libreria di conversione HEIC non disponibile"));
  return heic2any({ blob: file, toType: "image/jpeg", quality: 0.9 }).then(function(converted){
    return Array.isArray(converted) ? converted[0] : converted;
  });
}
function AN_photoCompress(blob, maxDim, quality){
  return new Promise(function(resolve, reject){
    var img = new Image(); var url = URL.createObjectURL(blob);
    img.onload = function(){
      var width = img.width, height = img.height;
      if (width > height && width > maxDim) { height = Math.round(height * maxDim / width); width = maxDim; }
      else if (height >= width && height > maxDim) { width = Math.round(width * maxDim / height); height = maxDim; }
      var canvas = document.createElement("canvas"); canvas.width = width; canvas.height = height;
      canvas.getContext("2d").drawImage(img, 0, 0, width, height);
      canvas.toBlob(function(out){ URL.revokeObjectURL(url); out ? resolve(out) : reject(new Error("Compressione fallita")); }, "image/jpeg", quality);
    };
    img.onerror = function(){ URL.revokeObjectURL(url); reject(new Error("Immagine non leggibile")); };
    img.src = url;
  });
}
function AN_photoReverseGeocode(lat, lon){
  return fetch("https://nominatim.openstreetmap.org/reverse?format=json&lat=" + lat + "&lon=" + lon + "&zoom=10")
    .then(function(res){ return res.ok ? res.json() : null; })
    .then(function(data){
      if (!data) return null;
      var a = data.address || {};
      var city = a.city || a.town || a.village || a.suburb || a.county;
      if (!city) return null;
      return a.country ? city + ", " + a.country : city;
    })
    .catch(function(){ return null; });
}
function AN_photoFileSelected(root, file){
  var statusEl = root.querySelector("[data-an-photo-status]");
  var previewWrap = root.querySelector("[data-an-photo-preview]");
  var btn = root.querySelector("[data-an-photo-submit]");
  AN_PHOTO_PENDING = null;
  if (btn) btn.disabled = true;
  if (previewWrap) previewWrap.style.display = "block";
  if (statusEl) statusEl.textContent = "Elaborazione in corso\u2026";
  var exifMeta;
  AN_photoReadExif(file)
    .then(function(m){ exifMeta = m; return AN_photoMaybeHeic(file); })
    .then(function(converted){ return AN_photoCompress(converted, 1200, 0.85); })
    .then(function(compressed){
      var finalDate = exifMeta.date || today;
      var filename = finalDate + "_" + Date.now() + ".jpg";
      AN_PHOTO_PENDING = { blob: compressed, filename: filename };
      var dateIn = root.querySelector('[data-an-photo="date"]'); if (dateIn && !dateIn.value) dateIn.value = finalDate;
      var img = root.querySelector("[data-an-photo-img]"); if (img) img.src = URL.createObjectURL(compressed);
      if (statusEl) statusEl.textContent = "Pronta (" + Math.round(compressed.size/1024) + " KB dopo compressione, originale " + Math.round(file.size/1024) + " KB).";
      if (btn) btn.disabled = false;
      var luogoIn = root.querySelector('[data-an-photo="luogo"]');
      if (luogoIn && !luogoIn.value && exifMeta.lat != null && exifMeta.lon != null) {
        if (statusEl) statusEl.textContent += " Ricerca luogo da GPS\u2026";
        return AN_photoReverseGeocode(exifMeta.lat, exifMeta.lon).then(function(place){
          if (place) luogoIn.value = place;
          if (statusEl) statusEl.textContent = statusEl.textContent.replace(" Ricerca luogo da GPS\u2026", "");
        });
      }
    })
    .catch(function(e){ if (statusEl) statusEl.textContent = "Errore nella preparazione della foto: " + e.message; });
}
function AN_photoUploadAndSave(root){
  var statusEl = root.querySelector("[data-an-photo-status]");
  var btn = root.querySelector("[data-an-photo-submit]");
  if (!AN_PHOTO_PENDING) { if (statusEl) statusEl.textContent = "Seleziona prima una foto."; return; }
  var g = function(f){ var e = root.querySelector('[data-an-photo="' + f + '"]'); return e ? e.value.trim() : ""; };
  var date = g("date") || AN_PHOTO_PENDING.filename.slice(0, 10);
  var luogo = g("luogo") || null, note = g("note") || null, pesoManual = g("peso") || null;
  var ratingRaw = g("rating"), rating = ratingRaw ? parseInt(ratingRaw, 10) : null;
  if (btn) { btn.disabled = true; btn.textContent = "Caricamento\u2026"; }
  if (statusEl) statusEl.textContent = "";
  var base = CFG.PROXY_URL.replace(/\/rest\/v1\/diary$/, ""), qs = "?user_id=eq.giorgio_protocollo_2026";
  var form = new FormData();
  form.append("file", AN_PHOTO_PENDING.blob, AN_PHOTO_PENDING.filename);
  form.append("filename", AN_PHOTO_PENDING.filename);
  fetch(base + "/photo-upload", { method: "POST", headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY }, body: form })
    .then(function(upRes){
      if (!upRes.ok) return upRes.text().then(function(t){ throw new Error("Upload fallito: " + t); });
      return fetch(CFG.PROXY_URL + qs + "&select=data", { headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY } });
    })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var freshData = (rows[0] && rows[0].data) || {};
      if (!Array.isArray(freshData.photo_log)) freshData.photo_log = [];
      var entry = { filename: AN_PHOTO_PENDING.filename, date: date, time: null, luogo: luogo, note: note };
      if (pesoManual) entry.peso_manual = pesoManual;
      if (rating) entry.rating = rating;
      freshData.photo_log.push(entry);
      return fetch(CFG.PROXY_URL + qs, {
        method: "PATCH",
        headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY, "Content-Type": "application/json", "Prefer": "return=minimal" },
        body: JSON.stringify({ data: freshData })
      }).then(function(patchRes){
        if (!patchRes.ok) throw new Error("Salvataggio riferimento foto fallito (HTTP " + patchRes.status + ")");
        PHOTO_LOG.push(entry);
      });
    })
    .then(function(){
      AN_PHOTO_PENDING = null;
      if (statusEl) statusEl.textContent = "Foto caricata e salvata correttamente.";
      if (btn) { btn.disabled = true; btn.textContent = "Registra scatto"; }
      var fileIn = root.querySelector("[data-an-photo-file]"); if (fileIn) fileIn.value = "";
      var prev = root.querySelector("[data-an-photo-preview]"); if (prev) prev.style.display = "none";
      ["date","luogo","peso","rating","note"].forEach(function(f){ var e = root.querySelector('[data-an-photo="' + f + '"]'); if (e) e.value = ""; });
      AN_refresh(); renderAll();
    })
    .catch(function(e){
      if (statusEl) statusEl.textContent = "Errore: " + e.message;
      if (btn) { btn.disabled = false; btn.textContent = "Registra scatto"; }
    });
}
function bindFotoNew(root){
  var fileIn = root.querySelector("[data-an-photo-file]");
  if (fileIn && !fileIn.dataset.bound) {
    fileIn.dataset.bound = "1";
    fileIn.addEventListener("change", function(){
      var f = fileIn.files && fileIn.files[0];
      if (f) AN_photoFileSelected(root, f);
    });
  }
  var btn = root.querySelector("[data-an-photo-submit]");
  if (btn && !btn.dataset.bound) {
    btn.dataset.bound = "1";
    btn.addEventListener("click", function(){ AN_photoUploadAndSave(root); });
  }
}

    var v = rec["inj_" + s.n + "_" + fieldKey(f)] || "";

  var weeksInj = [], weeksSupp = [], weeksWo = [];
  for (var k = 0; k < 16; k++) {
    if (k >= cur) { weeks.push(null); weeksInj.push(null); weeksSupp.push(null); weeksWo.push(null); continue; }
    var s = { injDone:0, injTot:0, suppDone:0, suppTot:0, woDone:0, woTot:0 };
    for (var j = 0; j < 7; j++) { var x = AN_dayAdh(k * 7 + j); for (var q in s) s[q] += x[q]; }

  const saveNowClicked = () => {

/* ------------------------------------------------------------
   Helper di stato — un solo meccanismo, usato sia per le iniezioni
   (4 stati reali: vuoto/fatto/saltata/na, un campo stringa) sia per
   gli integratori (3 stati: vuoto/fatto/saltato, derivati da DUE
   campi reali — ck_X booleano + ck_X_skip — non uno stato unico).
   ------------------------------------------------------------ */
// Protezione aggiunta 17/09/2026: il ciclo a 4 stati (vuoto->fatto->
// saltata->na->vuoto) significa che 4 tocchi ravvicinati sullo stesso
// cerchietto -- anche solo un doppio tocco accidentale ripetuto due
// volte -- riportano lo stato a vuoto senza che l'utente se ne accorga.
// Non è stata trovata una causa di codice specifica per la perdita dati
// del 17/09, ma questa è una protezione sensata a prescindere: ignora un
// secondo click sullo stesso elemento entro 400ms dal primo.
const _lastToggleAt = {};
function guardedToggle(id, fn) {
  const now = Date.now();
  if (_lastToggleAt[id] && now - _lastToggleAt[id] < 400) return;
  _lastToggleAt[id] = now;
  fn();
}

function cycleInjState(dayIdx, slotN, fkey) {
  const key = 'inj_' + slotN + '_' + fieldKey(fkey);
  const cur = getDay(selDate)[key] || '';
  const next = { '': 'fatto', fatto: 'saltata', saltata: 'na', na: '' }[cur] || '';
  patch(selDate, key, next);
}

function suppState(day, sf) {
  if (day[sf + '_skip']) return 'saltato';
  if (day[sf] === '1') return 'fatto';
  return '';
}
function cycleSuppState(sf) {
  const day = getDay(selDate);
  const cur = suppState(day, sf);
  if (cur === '') { patch(selDate, sf, '1'); patch(selDate, sf + '_skip', ''); }
  else if (cur === 'fatto') { patch(selDate, sf, ''); patch(selDate, sf + '_skip', '1'); }
  else { patch(selDate, sf, ''); patch(selDate, sf + '_skip', ''); }
}

// esc/nf/svgPath/svgTrend/doseLook — porting diretto dal codice reale
// generato da Claude Design (produzione/v2.html), adattati solo dove i nomi
// di campo o gli stati differiscono dallo schema reale già verificato.
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const nf = (v, d = 1) => v == null || isNaN(v) ? '—' : (LANG === 'it' ? Number(v).toFixed(d).replace('.', ',') : Number(v).toFixed(d));
function svgPath(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  if (v.length < 2) return { d: '', area: '', lastX: 0, lastY: h / 2 };
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  const pts = v.map((x, i) => [(i / (v.length - 1)) * w, pad + (1 - (x - mn) / sp) * (h - pad * 2)]);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ');
  const last = pts[pts.length - 1];
  return { d, area: d + ` L${last[0].toFixed(1)} ${h} L0 ${h} Z`, lastX: last[0], lastY: last[1] };
}
function svgTrend(vals, w, h, pad) {
  const v = vals.filter(x => x != null && !isNaN(x));
  const n = v.length;
  if (n < 3) return '';
  const mn = Math.min(...v), mx = Math.max(...v), sp = (mx - mn) || 1;
  let sx = 0, sy = 0, sxy = 0, sxx = 0;
  v.forEach((y, i) => { sx += i; sy += y; sxy += i * y; sxx += i * i; });
  const m = (n * sxy - sx * sy) / (n * sxx - sx * sx), b = (sy - m * sx) / n;
  const yAt = i => pad + (1 - ((m * i + b) - mn) / sp) * (h - pad * 2);
  return `M0 ${yAt(0).toFixed(1)} L${w} ${yAt(n - 1).toFixed(1)}`;
}
// doseLook — stessa idea del riferimento, ma sui 4 stati REALI
// (''/fatto/saltata/na), non su quelli d'esempio ('','done','skip','na').
function doseLook(v) {
  const L = t();
  return {
    '':        { bg: 'transparent',  border: 'var(--idle)', mark: '',  ink: 'var(--ink2)', label: '' },
    'fatto':   { bg: 'var(--ok)',    border: 'var(--ok)',   mark: '✓', ink: '#fff',        label: L.doseDone },
    'saltata': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: '#3d3100',     label: L.doseSkip },
    'saltato': { bg: 'var(--warn)',  border: 'var(--warn)', mark: '–', ink: '#3d3100',     label: L.doseSkip },

/* ------------------------------------------------------------
   Storico peso + trend — nuovo (09/09/2026), nessun equivalente in
   index.html da copiare verbatim (funzione non-MIRROR, prima stesura).
   ------------------------------------------------------------ */
function weightHistory(days, anchorISO) {
  const dIdx = dayIdxFromISO(anchorISO);
  const from = Math.max(0, dIdx - days + 1);
  const arr = [];
  for (let i = from; i <= dIdx; i++) {
    const rec = (store.blob && store.blob['p2_day_' + i]) || {};
    const v = parseFloat(rec.peso);
    arr.push(isNaN(v) ? null : v);
  }
  return arr;
}
// Regressione lineare semplice sui punti non nulli; ritorna kg/settimana
// (slope giornaliero * 7), o null se meno di 2 punti validi.
function weeklyTrend(values) {
  const pts = values.map((v, i) => ({ x: i, y: v })).filter(p => p.y !== null);
  if (pts.length < 2) return null;
  const n = pts.length;
  const sx = pts.reduce((s, p) => s + p.x, 0), sy = pts.reduce((s, p) => s + p.y, 0);
  const sxx = pts.reduce((s, p) => s + p.x * p.x, 0), sxy = pts.reduce((s, p) => s + p.x * p.y, 0);
  const denom = (n * sxx - sx * sx) || 1;
  const slope = (n * sxy - sx * sy) / denom;
  return slope * 7;
}

// MIRROR · drawComplianceRing — verbatim da index.html (riga 6183).
function drawComplianceRing(canvasId, pct, color) {
  const canvas = document.getElementById(canvasId);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  canvas.width = 56 * dpr; canvas.height = 56 * dpr;
  ctx.scale(dpr, dpr);
  const cx = 28, cy = 28, r = 22, C = 2 * Math.PI * r;
  ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2);
  ctx.strokeStyle = '#e8e8ed'; ctx.lineWidth = 5; ctx.stroke();
  ctx.beginPath();
  ctx.arc(cx, cy, r, -Math.PI / 2, -Math.PI / 2 + (pct / 100) * Math.PI * 2);
  ctx.strokeStyle = color; ctx.lineWidth = 5; ctx.lineCap = 'round'; ctx.stroke();
}

// Grafico peso — adattato da drawChart (index.html riga 2203): stessa
// tecnica (fill a gradiente + linea + puntino), ma senza l'etichetta
// fluttuante sull'ultimo punto (il numero grande è già mostrato sopra
// il grafico nella nuova card).
function drawWeightChart(id, data, color) {
  const canvas = document.getElementById(id);
  if (!canvas) return;
  const ctx = canvas.getContext('2d');
  const dpr = window.devicePixelRatio || 1;
  const rect = canvas.getBoundingClientRect();
  const W = rect.width || 300, H = 70;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.scale(dpr, dpr);
  const pts = data.filter(v => v !== null);
  if (pts.length < 2) {
    ctx.font = '12px -apple-system, BlinkMacSystemFont, sans-serif';
    ctx.fillStyle = '#aeaeb2'; ctx.fillText('Dati insufficienti', 8, 36);
    return;
  }
  const TOP_PAD = 8, BOTTOM_PAD = 8;
  const mn = Math.min(...pts) * 0.997, mx = Math.max(...pts) * 1.003, rng = mx - mn || 1;
  const valid = data.map((v, i) => v !== null ? {
    x: i / (data.length - 1) * (W - 8) + 4,
    y: H - BOTTOM_PAD - ((v - mn) / rng) * (H - TOP_PAD - BOTTOM_PAD), v
  } : null);
  ctx.beginPath(); let st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  const lp = valid.filter(Boolean).pop(), fp = valid.filter(Boolean)[0];
  if (lp && fp) {
    ctx.lineTo(lp.x, H); ctx.lineTo(fp.x, H); ctx.closePath();
    const g = ctx.createLinearGradient(0, 0, 0, H);
    g.addColorStop(0, color + '28'); g.addColorStop(1, color + '00');
    ctx.fillStyle = g; ctx.fill();
  }
  ctx.beginPath(); st = false;
  valid.forEach(p => { if (!p) return; if (!st) { ctx.moveTo(p.x, p.y); st = true; } else ctx.lineTo(p.x, p.y); });
  ctx.strokeStyle = color; ctx.lineWidth = 1.5; ctx.lineJoin = 'round'; ctx.lineCap = 'round'; ctx.stroke();
  if (lp) { ctx.beginPath(); ctx.arc(lp.x, lp.y, 3, 0, Math.PI * 2); ctx.fillStyle = color; ctx.fill(); }
}

/* ------------------------------------------------------------
   Card narrativa — PRIMA STESURA, non-MIRROR (nessun testo simile
   esiste già in index.html da copiare). Regole/soglie scelte qui
   sono un punto di partenza ragionevole, NON ancora approvate da
   Giorgio nei dettagli — da rivedere con lui alla prima occasione
   utile, in particolare: soglie "segnale da tenere d'occhio" e
   soglia di "HRV fermo" (±1ms/settimana).
   ------------------------------------------------------------ */
function buildHeroNarrative(a, wTrend, hrvTrend) {
  const signals = [];
  if (a.inj < 90) signals.push('iniezioni');
  if (a.supp < 85) signals.push('integratori');
  if (a.wo < 85) signals.push('allenamenti');
  if (wTrend !== null && wTrend > 0.35) signals.push('peso in salita rapida');
  if (wTrend !== null && wTrend < -0.35) signals.push('peso in calo rapido');
  if (hrvTrend !== null && hrvTrend < -3) signals.push('HRV in calo');

  const tone = signals.length === 0 ? 'good' : signals.length <= 2 ? 'warn' : 'bad';
  const title = tone === 'good'
    ? 'Il ciclo tiene, tutto sotto controllo.'
    : `Il ciclo tiene, con ${signals.length} segnal${signals.length === 1 ? 'e' : 'i'} da tenere d'occhio.`;

  const wTrendTxt = wTrend === null ? 'il peso (dati insufficienti)'
    : `il peso, che ${wTrend > 0.05 ? 'sale' : wTrend < -0.05 ? 'scende' : 'resta stabile'} di ${Math.abs(wTrend).toFixed(2)} kg a settimana`;
  const hrvTxt = hrvTrend === null ? 'HRV (dati insufficienti)'
    : `l'HRV è ${Math.abs(hrvTrend) < 1 ? 'fermo' : hrvTrend > 0 ? 'in salita' : 'in calo'}`;

  const text = `Reggono l'aderenza alle iniezioni (${a.inj}%), ${wTrendTxt} e gli allenamenti (${a.wo}%). Gli integratori sono al ${a.supp}% e ${hrvTxt}.`;
  return { title, text, tone };
}

  { timing: 'Sera',      field: 'TB-500 500mcg' },
];

// Stato di una singola dose per un giorno dato, cercando lo slot del
// timing giusto in quel giorno specifico (gli slot REALI di quel
// giorno, non un elenco fisso) e leggendo inj_{n}_{fieldKey}.
function injCellState(dayIdx, rec, row) {
  const slots = getInjectionSlots2(dayIdx);
  const slot = slots.find(s => s.label === row.timing && s.fields.includes(row.field));
  if (!slot) return { state: 'non-prevista' }; // IGF in un giorno di riposo
  const v = rec['inj_' + slot.n + '_' + fieldKey(row.field)] || '';
  return { state: v || 'vuoto' };
}

function weekAggregate(weekIdx) {
  const startIdx = weekIdx * 7;
  const todayIdx = dayIdxFromISO(today);
  const dowShort = LANG === 'it' ? ['LUN','MAR','MER','GIO','VEN','SAB','DOM'] : ['MON','TUE','WED','THU','FRI','SAT','SUN'];
  const dowInitial = LANG === 'it' ? ['L','M','M','G','V','S','D'] : ['M','T','W','T','F','S','S'];

  const days = Array.from({ length: 7 }, (_, i) => {
    const dayIdx = startIdx + i;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    const dateISO = isoLocal(d);
    const rec = getDay(dateISO);
    const wo = getWorkout2(dayIdx);
    return {
      dayIdx, dateISO, date: d, rec, wo,
      isFuture: dayIdx > todayIdx,
      isRest: wo.type === 'Riposo',
      dow: dowShort[i], dowIni: dowInitial[i], num: d.getDate()
    };
  });

  const elapsed = days.filter(d => !d.isFuture).length; // 0..7
  const isClosed = elapsed === 7;
  const isFutureWeek = elapsed === 0;

  // ---- Iniezioni: 9 righe canoniche × 7 giorni ----
  const injRows = CANON_INJ_ROWS.map(row => {
    const cells = days.map(d => d.isFuture ? { state: 'futuro' } : injCellState(d.dayIdx, d.rec, row));
    const doneCount = cells.filter(c => c.state === 'fatto').length;
    const applicable = cells.filter(c => c.state !== 'non-prevista' && c.state !== 'futuro').length;
    return { row, cells, doneCount, applicable };
  });
  const injDoneTot = injRows.reduce((s, r) => s + r.doneCount, 0);
  const injApplTot = injRows.reduce((s, r) => s + r.applicable, 0);

  // ---- Integratori: 9 campi × 7 giorni ----
  const suppRows = SUPP_FIELDS.map(sf => {
    const cells = days.map(d => {
      if (d.isFuture) return { state: 'futuro' };
      if (d.rec[sf + '_skip']) return { state: 'na' };
      return { state: d.rec[sf] === '1' ? 'fatto' : 'vuoto' };
    });
    const doneCount = cells.filter(c => c.state === 'fatto').length;
    const applicable = cells.filter(c => c.state !== 'na' && c.state !== 'futuro').length;
    return { field: sf, label: SUPP_LABELS[sf], cells, doneCount, applicable };
  });
  const suppDoneTot = suppRows.reduce((s, r) => s + r.doneCount, 0);
  const suppApplTot = suppRows.reduce((s, r) => s + r.applicable, 0);

  // ---- Allenamenti della settimana ----
  const trainingDays = days.filter(d => !d.isRest);
  const woTot = trainingDays.length;
  const woDone = trainingDays.filter(d => {
    if (d.isFuture) return false;
    const kcal = parseFloat(d.rec.wo_kcal), rpe = parseFloat(d.rec.rpe);
    const vol = getWorkoutVolume2(d.rec);
    return (!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe);
  }).length;
  const sessions = trainingDays.filter(d => !d.isFuture).map(d => {
    const vol = getWorkoutVolume2(d.rec) || 0;
    const dur = parseFloat(d.rec.wo_durata) || 0;
    const rpe = d.rec.rpe !== undefined && d.rec.rpe !== '' ? parseFloat(d.rec.rpe) : null;
    return { dow: d.dow, dateISO: d.dateISO, type: d.wo.type, vol, dur, rpe, done: vol > 0 || dur > 0 || rpe !== null };
  });
  const weekVolume = sessions.reduce((s, x) => s + x.vol, 0);
  const weekDurationMin = sessions.reduce((s, x) => s + x.dur, 0);
  const weekKcal = trainingDays.filter(d => !d.isFuture).reduce((s, d) => s + (parseFloat(d.rec.wo_kcal) || 0), 0);

  // ---- Percentuali della settimana ----
  const pct = (done, tot) => tot ? Math.round(done / tot * 100) : 0;
  const injPct = pct(injDoneTot, injApplTot), suppPct = pct(suppDoneTot, suppApplTot), woPct = pct(woDone, woTot);
  const overall = Math.round((injPct + suppPct + woPct) / 3);

  // ---- Confronto con la settimana precedente (solo se non è la prima) ----
  let prevOverall = null, prevInjPct = null;
  if (weekIdx > 0) {
    const prev = weekAggregateShallow(weekIdx - 1);
    if (prev) { prevOverall = prev.overall; prevInjPct = prev.injPct; }
  }

  // ---- Categorici: 3 campi × 7 giorni ----
  const CATN = ['pienezza_add', 'ritenzione', 'formicolio'];
  const catRows = CATN.map(key => {
    const cells = days.map(d => {
      if (d.isFuture) return { val: null };
      const raw = d.rec[key];
      if (raw === '' || raw === undefined || raw === null) return { val: null };
      return { val: parseInt(raw, 10) };
    });
    return { key, cells };
  });

  // ---- Biometria + peso: serie di 7 valori ----
  const pesoArr = days.map(d => parseFloat(d.rec.peso));
  // HRV: dal 15/09/2026 alcuni giorni hanno solo hrv_min/hrv_max (intervallo),
  // non più una media vera. Per la LINEA del grafico si usa il punto medio
  // (unico modo di avere comunque un andamento), ma si traccia quali punti
  // sono stimati (hrvIsEst) così il disegno può distinguerli visivamente —
  // il punto medio non va MAI mostrato come fosse una media reale altrove.
  const hrvArr = days.map(d => {
    const lo = parseFloat(d.rec.hrv_min), hi = parseFloat(d.rec.hrv_max);
    if (!isNaN(lo) && !isNaN(hi)) return (lo + hi) / 2;
    const real = parseFloat(d.rec.hrv);
    return isNaN(real) ? NaN : real;
  });
  const hrvIsEst = days.map(d => {
    const lo = parseFloat(d.rec.hrv_min), hi = parseFloat(d.rec.hrv_max);
    return !isNaN(lo) && !isNaN(hi);
  });
  const lastHrvDay = days[days.length - 1] ? days[days.length - 1].rec : {};
  const hrvLastRangeText = (lastHrvDay.hrv_min || lastHrvDay.hrv_max)
    ? `${lastHrvDay.hrv_min || '?'}–${lastHrvDay.hrv_max || '?'}` : null;
  const sonnoArr = days.map(d => parseSonnoHours(d.rec.ore_sonno));
  const rhrArr = days.map(d => parseFloat(d.rec.rhr));
  const remArr = days.map(d => parseFloat(d.rec.sonno_rem_min));
  const profArr = days.map(d => parseFloat(d.rec.sonno_profondo_min));
  const risvArr = days.map(d => parseFloat(d.rec.sonno_risvegli));
  const avg = arr => { const v = arr.filter(x => !isNaN(x)); return v.length ? v.reduce((a, b) => a + b, 0) / v.length : null; };

  // ---- Soggettivo: 8 medie ----
  const SUBJ_KEYS = ['energia', 'recupero', 'umore', 'rpe', 'appetito', 'sonno_sogg', 'libido', 'chiarezza'];
  const subjSeries = {};
  SUBJ_KEYS.forEach(k => { subjSeries[k] = days.map(d => d.isFuture ? NaN : parseFloat(d.rec[k])); });

  return {
    weekIdx, days, elapsed, isClosed, isFutureWeek,
    injRows, injDoneTot, injApplTot, injPct,
    suppRows, suppDoneTot, suppApplTot, suppPct,
    woTot, woDone, woPct, sessions, weekVolume, weekDurationMin, weekKcal,
    overall, prevOverall, prevInjPct,
    catRows,
    pesoArr, hrvArr, hrvIsEst, hrvLastRangeText, sonnoArr, rhrArr, remArr, profArr, risvArr, avg,
    subjSeries, dowInitial
  };
}

// Versione leggera usata solo per il confronto con la settimana precedente
// (evita di ricalcolare le 9+9+3 griglie quando servono solo le percentuali).
function weekAggregateShallow(weekIdx) {
  if (weekIdx < 0) return null;
  const startIdx = weekIdx * 7;
  const todayIdx = dayIdxFromISO(today);
  if (startIdx > todayIdx) return null; // settimana futura, nessun dato
  let injDone = 0, injTot = 0, suppDone = 0, suppTot = 0, woDone = 0, woTot = 0;
  for (let i = 0; i < 7; i++) {
    const dayIdx = startIdx + i;
    if (dayIdx > todayIdx) break;
    const d = new Date(CFG.CYCLE_START + 'T00:00:00'); d.setDate(d.getDate() + dayIdx);
    const rec = getDay(isoLocal(d));
    getInjectionSlots2(dayIdx).forEach(s => s.fields.forEach(f => {
      const v = rec['inj_' + s.n + '_' + fieldKey(f)] || '';
      if (v === 'na') return;
      injTot++; if (v === 'fatto') injDone++;
    }));
    SUPP_FIELDS.forEach(sf => { if (rec[sf + '_skip']) return; suppTot++; if (rec[sf] === '1') suppDone++; });
    if (getWorkout2(dayIdx).type !== 'Riposo') {
      woTot++;
      const kcal = parseFloat(rec.wo_kcal), rpe = parseFloat(rec.rpe), vol = getWorkoutVolume2(rec);
      if ((!isNaN(kcal) && kcal > 0) || (vol !== null && vol > 0) || !isNaN(rpe)) woDone++;
    }
  }
  const pct = (a, b) => b ? Math.round(a / b * 100) : 0;
  const injPct = pct(injDone, injTot), suppPct = pct(suppDone, suppTot), woPct = pct(woDone, woTot);
  return { overall: Math.round((injPct + suppPct + woPct) / 3), injPct, suppPct, woPct };
}

  // ---- Recap: tre varianti temporali (chiusa/in corso/futura) ----

  if (wk.isFutureWeek) {

          <span style="font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${pesoSlope == null ? '—' : (pesoSlope >= 0 ? '+' : '') + nf(pesoSlope, 2) + (LANG === 'it' ? ' kg / sett.' : ' kg/wk')}</span>
          ${pesoMin != null ? `<span style="font-size:10.5px;font-weight:500;color:var(--ink2);font-variant-numeric:tabular-nums;">min ${nf(pesoMin)} · max ${nf(pesoMax)} kg</span>` : ''}
        </div>
      </div>
      <svg viewBox="0 0 620 104" preserveAspectRatio="none" style="flex:0 0 auto;width:100%;height:96px;display:block;overflow:visible;">

          <stop offset="0%" stop-color="var(--accent)" stop-opacity="0.16"></stop>

        </linearGradient></defs>

        <line x1="0" y1="65" x2="620" y2="65" stroke="var(--line2)" stroke-width="1"></line>
        ${plW.d ? `<path d="${plW.area}" fill="url(#wkFill)"></path>` : ''}
        ${plPrev && plPrev.d ? `<path d="${plPrev.d}" fill="none" stroke="var(--ink3)" stroke-width="1.4" stroke-dasharray="3 4" opacity="0.55"></path>` : ''}
        ${plW.d ? `<path d="${plW.d}" fill="none" stroke="var(--accent)" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"></path>` : ''}
      </svg>
      <div style="flex:0 0 auto;display:flex;align-items:center;gap:14px;">
        <span style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:2.5px;border-radius:2px;background:var(--accent);"></span>${LANG === 'it' ? 'questa settimana' : 'this week'}</span>
        ${plPrev && plPrev.d ? `<span style="display:flex;align-items:center;gap:5px;font-size:10px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:2px;border-radius:2px;background:var(--ink3);opacity:.6;"></span>${LANG === 'it' ? 'settimana precedente' : 'previous week'}</span>` : ''}
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-top:3px;padding-top:12px;border-top:1px solid var(--line);">
        ${bioTile('HRV', wk.hrvArr, 'int', v => v == null ? '—' : Math.round(v))}
        ${bioTile(LANG === 'it' ? 'Riposo' : 'Resting', wk.rhrArr, 'int', v => v == null ? '—' : Math.round(v), true)}
        ${bioTile(LANG === 'it' ? 'Sonno' : 'Sleep', wk.sonnoArr, '', sonnoFmt)}
        ${bioTile('REM', wk.remArr, 'int', v => v == null ? '—' : Math.round(v) + '′')}
        ${bioTile(LANG === 'it' ? 'Profondo' : 'Deep', wk.profArr, 'int', v => v == null ? '—' : Math.round(v) + '′')}
        ${bioTile(LANG === 'it' ? 'Risvegli' : 'Wake-ups', wk.risvArr, '1', v => v == null ? '—' : nf(v), true)}
      </div>
    </div>`;

  // ---- Griglia iniezioni ----
  const dayHeadCells = wk.days.map(d => `
              <span onclick="selDate='${d.dateISO}';oggiViewMode='day';render();" style="display:flex;flex-direction:column;align-items:center;gap:0;cursor:pointer;padding:2px 0;border-radius:5px;background:transparent;">
                <span style="font-size:9px;font-weight:600;color:#57575f;text-transform:uppercase;">${d.dow}</span>
                <span style="font-size:10px;font-weight:600;color:#57575f;font-variant-numeric:tabular-nums;">${d.num}</span>
              </span>`).join('');

  const injRowsHtml = wk.injRows.map(r => {
    const { name: compName } = splitDose(r.row.field);
    const cells = r.cells.map(c => {
      const st = INJ_CELL_STYLE[c.state];
      return `<span style="height:22px;border-radius:5px;background:${st.bg};border:1px solid ${st.border};display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:${st.ink};cursor:pointer;">${st.mark}</span>`;
    }).join('');
    const doneColor = r.applicable && r.doneCount === r.applicable ? 'var(--ok)' : r.applicable && r.doneCount / r.applicable < 0.6 ? 'var(--warn-ink)' : 'var(--ink)';
    return `
                <div style="display:grid;grid-template-columns:158px repeat(7,1fr) 62px;gap:2px;align-items:center;">
                  <div style="min-width:0;display:flex;flex-direction:column;">
                    <span style="font-size:10.5px;font-weight:600;color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(compName)}${r.row.igf ? ' ' + (r.row.field.includes('dx') ? 'dx' : 'sx') : ''}</span>
                    <span style="font-size:8.5px;font-weight:500;color:var(--ink3);white-space:nowrap;">${L.slotLabels[r.row.timing] || r.row.timing} · ${r.row.igf ? 'IM' : 'SC'}</span>
                  </div>
                  ${cells}
                  <span style="text-align:right;font-size:10px;font-weight:600;color:${doneColor};font-variant-numeric:tabular-nums;">${r.doneCount}/${r.applicable}</span>
                </div>`;
  }).join('');

  const injCard = `
    <div style="grid-column:1 / 8;grid-row:2 / 3;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;gap:12px;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Iniezioni · dose per dose' : 'Injections · dose by dose'}</span>
        <div style="display:flex;align-items:baseline;gap:12px;">
          <span style="display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:#ffffff;background:var(--ok);border:1.5px solid var(--ok);">✓</span>${L.doseDone}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--warn-ink);background:#ffffff;border:1.5px solid var(--warn);">–</span>${L.doseSkip}</span>
          <span style="display:flex;align-items:center;gap:4px;font-size:9.5px;font-weight:500;color:var(--ink2);"><span style="width:12px;height:12px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:700;color:var(--ink3);background:var(--surf2);border:1.5px solid var(--surf2);">N</span>${L.doseNa}</span>
          <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.injDoneTot}/${wk.injApplTot}</span>
        </div>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:158px repeat(7,1fr) 62px;gap:2px;">
        <span></span>${dayHeadCells}
        <span style="text-align:right;font-size:8.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;align-self:end;">${LANG === 'it' ? 'fatte' : 'done'}</span>
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;">${injRowsHtml}</div>
      <span style="flex:0 0 auto;font-size:9.5px;font-weight:500;color:var(--ink3);text-wrap:pretty;">${LANG === 'it' ? 'IGF-1 DES solo nei giorni di allenamento' : 'IGF-1 DES only on training days'}</span>
    </div>`;

  // ---- Aderenza: 3 anelli + 16 barre ----
  const ring = (pct, color, label, sub, deltaInfo) => `
        <div style="display:flex;flex-direction:column;align-items:center;gap:8px;">
          <div style="position:relative;width:92px;height:92px;">
            <svg viewBox="0 0 84 84" style="width:92px;height:92px;transform:rotate(-90deg);display:block;">
              <circle cx="42" cy="42" r="34" fill="none" stroke="var(--line2)" stroke-width="8"></circle>
              <circle cx="42" cy="42" r="34" fill="none" stroke="${color}" stroke-width="8" stroke-linecap="round" stroke-dasharray="${(213.63 * pct / 100).toFixed(1)} 213.63"></circle>
            </svg>
            <div style="position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:19px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;">${pct}%</div>
          </div>
          <div style="display:flex;flex-direction:column;align-items:center;gap:1px;">
            <span style="font-size:12px;font-weight:600;color:var(--ink);">${label}</span>
            <span style="font-size:10.5px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${sub}</span>
            ${deltaInfo}
          </div>
        </div>`;
  const ringDelta = (pct, prevPct) => {
    if (!wk.isClosed) return `<span style="font-size:10px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${wk.elapsed} ${LANG === 'it' ? 'di 7 giorni' : 'of 7 days'}</span>`;
    if (prevPct == null) return '';
    const d = pct - prevPct;
    const color = Math.abs(d) < 1 ? 'var(--ink3)' : d > 0 ? 'var(--ok)' : 'var(--warn-ink)';
    const txt = Math.abs(d) < 1 ? '=' : (d > 0 ? '+' : '') + d;
    return `<span style="font-size:10px;font-weight:600;color:${color};font-variant-numeric:tabular-nums;">${txt} vs W${weekIdx}</span>`;
  };
  const prevShallow = weekIdx > 0 ? weekAggregateShallow(weekIdx - 1) : null;

  // 16 barre — fondo scala 50%, la barra della settimana corrente tratteggiata se in corso
  const barsHtml = Array.from({ length: totalWeeks }, (_, w) => {
    if (w === weekIdx) {
      const h = Math.max(8, (wk.overall - 50) / 50 * 100);
      return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:${h}%;border-radius:3px 3px 0 0;background:${wk.isClosed ? 'var(--accent)' : 'transparent'};border:1.5px dashed ${wk.isClosed ? 'transparent' : 'var(--accent)'};"></span>
            <span style="font-size:7.5px;font-weight:600;color:var(--accent-ink);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
    }
    const shal = w < weekIdx ? weekAggregateShallow(w) : null;
    if (!shal) {
      return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:3px;border-radius:3px 3px 0 0;background:var(--line2);border:1.5px dashed transparent;"></span>
            <span style="font-size:7.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
    }
    const h = Math.max(8, (shal.overall - 50) / 50 * 100);
    const barColor = shal.overall >= 90 ? 'var(--ok)' : shal.overall >= 70 ? 'var(--warn)' : 'var(--bad)';
    return `
          <div data-week="${w}" style="flex:1 1 0;min-width:0;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;height:100%;justify-content:flex-end;">
            <span style="width:100%;height:${h}%;border-radius:3px 3px 0 0;background:${barColor};border:1.5px dashed transparent;"></span>
            <span style="font-size:7.5px;font-weight:600;color:var(--ink3);font-variant-numeric:tabular-nums;">${w + 1}</span>
          </div>`;
  }).join('');

  const adherenceCard = `
    <div style="grid-column:8 / 13;grid-row:2 / 3;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Aderenza · settimana' : 'Adherence · week'} ${weekIdx + 1}</span>
        <span style="font-size:10.5px;font-weight:500;color:var(--ink3);">${wk.isClosed ? (LANG === 'it' ? 'settimana chiusa' : 'closed week') : wk.isFutureWeek ? (LANG === 'it' ? 'non iniziata' : 'not started') : `${wk.elapsed} ${LANG === 'it' ? 'giorni su 7 · in corso' : 'of 7 days · in progress'}`}</span>
      </div>
      <div style="flex:0 0 auto;display:flex;justify-content:space-around;">
        ${ring(wk.injPct, 'var(--accent)', L.injectionsRing, `${wk.injDoneTot}/${wk.injApplTot}`, ringDelta(wk.injPct, prevShallow && prevShallow.injPct))}
        ${ring(wk.suppPct, 'var(--ok)', L.supplements, `${wk.suppDoneTot}/${wk.suppApplTot}`, ringDelta(wk.suppPct, prevShallow && prevShallow.suppPct))}
        ${ring(wk.woPct, 'var(--warn)', L.workoutsRing, `${wk.woDone}/${wk.woTot}`, ringDelta(wk.woPct, prevShallow && prevShallow.woPct))}
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:7px;padding-top:10px;border-top:1px solid var(--line);">
        <span style="flex:0 0 auto;font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Le 16 settimane, la stessa misura' : 'All 16 weeks, same measure'}</span>
        <div style="flex:1 1 auto;min-height:0;display:flex;align-items:flex-end;gap:3px;">${barsHtml}</div>
        <span style="flex:0 0 auto;font-size:9.5px;font-weight:500;color:var(--ink3);text-wrap:pretty;">${LANG === 'it' ? 'Aderenza complessiva per settimana · fondo scala 50%' : 'Overall adherence per week · 50% baseline'}</span>
      </div>
    </div>`;

  // ---- Integratori ----
  const dayHeadInitials = wk.dowInitial.map(l => `<span style="text-align:center;font-size:8.5px;font-weight:600;color:#57575f;text-transform:uppercase;">${l}</span>`).join('');
  const suppRowsHtml = wk.suppRows.map(r => {
    const cells = r.cells.map(c => {
      const st = INJ_CELL_STYLE[c.state];
      return `<span style="height:19px;border-radius:4px;background:${st.bg};border:1px solid ${st.border};display:flex;align-items:center;justify-content:center;font-size:8.5px;font-weight:700;color:${st.ink};cursor:pointer;">${st.mark}</span>`;
    }).join('');
    return `
                <div style="display:grid;grid-template-columns:130px repeat(7,1fr);gap:2px;align-items:center;">
                  <span style="font-size:10.5px;font-weight:500;color:var(--ink2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(r.label)}</span>
                  ${cells}
                </div>`;
  }).join('');
  const suppCard = `
    <div style="grid-column:1 / 5;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:9px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.supplements}</span>
        <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.suppDoneTot}/${wk.suppApplTot}</span>
      </div>
      <div style="flex:0 0 auto;display:grid;grid-template-columns:130px repeat(7,1fr);gap:2px;"><span></span>${dayHeadInitials}</div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:2px;">${suppRowsHtml}</div>
    </div>`;

  // ---- Sedute della settimana ----
  const maxVol = Math.max(1, ...wk.sessions.map(s => s.vol));
  const sessRows = wk.sessions.map(s => `
        <div onclick="selDate='${s.dateISO}';oggiViewMode='day';render();" style="display:flex;align-items:center;gap:9px;padding:5px 0;border-top:1px solid var(--line2);cursor:pointer;">
          <span style="flex:0 0 30px;font-size:9.5px;font-weight:600;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${s.dow}</span>
          <span style="flex:0 0 58px;font-size:10.5px;font-weight:600;color:#57575f;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${esc(s.type)}</span>
          <div style="flex:1 1 auto;min-width:0;height:5px;border-radius:999px;background:var(--line2);overflow:hidden;">
            <div style="height:100%;width:${s.vol ? Math.round(s.vol / maxVol * 100) : 0}%;border-radius:999px;background:${s.done ? 'var(--accent)' : 'var(--line)'};"></div>
          </div>
          <span style="flex:0 0 auto;font-size:10.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${s.vol ? nf(s.vol / 1000, 1) + 'k' : '—'}</span>
          <span style="flex:0 0 38px;text-align:right;font-size:10px;font-weight:500;color:var(--ink3);font-variant-numeric:tabular-nums;">${s.dur ? Math.round(s.dur) + '′' : '—'}</span>
          <span style="flex:0 0 26px;text-align:right;font-size:10px;font-weight:600;color:${s.rpe != null && s.rpe >= 8 ? 'var(--warn-ink)' : 'var(--ink2)'};font-variant-numeric:tabular-nums;">${s.rpe != null ? s.rpe : '—'}</span>
        </div>`).join('');
  const sedCard = `
    <div style="grid-column:5 / 9;grid-row:3 / 4;border-radius:var(--r-card);background:var(--surf);box-shadow:var(--shadow);padding:14px 18px;display:flex;flex-direction:column;gap:10px;overflow:hidden;">
      <div style="flex:0 0 auto;display:flex;align-items:baseline;justify-content:space-between;">
        <span style="font-size:12px;font-weight:600;color:var(--ink2);text-transform:uppercase;letter-spacing:.01em;">${L.training}</span>
        <span style="font-size:11.5px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums;">${wk.woDone}/${wk.woTot} ${LANG === 'it' ? 'sedute' : 'sessions'}</span>
      </div>
      <div style="flex:0 0 auto;display:flex;gap:16px;">
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">Volume</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekVolume / 1000, 1)}k</span><span style="font-size:10px;color:var(--ink3);">kg</span></div>
        </div>
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Tempo' : 'Time'}</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekDurationMin / 60, 1)}</span><span style="font-size:10px;color:var(--ink3);">h</span></div>
        </div>
        <div style="flex:1 1 0;display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:10px;color:var(--ink3);text-transform:uppercase;letter-spacing:.01em;">${LANG === 'it' ? 'Calorie' : 'Calories'}</span>
          <div style="display:flex;align-items:baseline;gap:3px;"><span style="font-size:17px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${nf(wk.weekKcal / 1000, 1)}k</span><span style="font-size:10px;color:var(--ink3);">kcal</span></div>
        </div>
      </div>
      <div style="flex:1 1 auto;min-height:0;display:flex;flex-direction:column;gap:1px;">${sessRows || `<span style="font-size:11px;color:var(--ink3);padding-top:8px;">${LANG === 'it' ? 'Nessuna sessione ancora' : 'No sessions yet'}</span>`}</div>
    </div>`;

  // ---- Soggettivo: 8 medie + 3 categorici ----
  const SUBJ_LABELS = { energia: L.subj.energia, recupero: L.subj.recupero, umore: L.subj.umore, rpe: L.subj.rpe, appetito: L.subj.appetito, sonno_sogg: L.subj.sonno_sogg, libido: L.subj.libido, chiarezza: L.subj.chiarezza };
  const SUBJ_COLORS = { energia: 'var(--accent)', recupero: '#5b93cc', umore: 'var(--warn)', rpe: '#8a8a93', appetito: '#a86a00', sonno_sogg: '#3d6f9e', libido: 'var(--bad)', chiarezza: '#6d6d76' };
  const prevSubj = weekIdx > 0 ? weekAggregate(weekIdx - 1).subjSeries : null;
  const subjTiles = Object.keys(SUBJ_LABELS).map(k => {
    const arr = wk.subjSeries[k];
    const cur = wk.avg(arr), prev = prevSubj ? wk.avg(prevSubj[k]) : null;
    const dt = deltaTxt(cur, prev, '1');
    const sp = svgPath(arr, 100, 16, 3);
    return `
        <div style="display:flex;flex-direction:column;gap:2px;min-width:0;">
          <span style="font-size:9.5px;color:var(--ink3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;">${SUBJ_LABELS[k]}</span>
          <div style="display:flex;align-items:baseline;gap:4px;">
            <span style="font-size:15px;font-weight:700;color:var(--ink);font-variant-numeric:tabular-nums;letter-spacing:-.01em;">${cur == null ? '—' : nf(cur)}</span>
            ${dt ? `<span style="font-size:9.5px;font-weight:600;color:${dt.color};font-variant-numeric:tabular-nums;">${dt.txt}</span>` : ''}
          </div>
          <svg viewBox="0 0 100 16" preserveAspectRatio="none" style="width:100%;height:15px;display:block;overflow:visible;">
            <path d="${sp.d}" fill="none" stroke="${SUBJ_COLORS[k]}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"></path>
          </svg>
        </div>`;
  }).join('');

    const m = f.match(/^(.*?)\s+(\d+(?:[.,]\d+)?\s?(?:mcg|mg|g|ml)(?:\s+(?:dx|sx))?)$/i);

        <div style="text-align:right">
          <input class="field-value" style="width:70px" type="text" value="${day.ore_sonno || ''}" placeholder="5.18" oninput="patch(selDate,'ore_sonno',this.value)">
          <div class="field-sub">${sonnoTxt} · REM ${day.sonno_rem_min || '—'}m · Prof. ${day.sonno_profondo_min || '—'}m · ${day.sonno_risvegli || '—'} risvegli</div>
        </div>
      </div>
    </div>`;

  // Riepilogo compatto degli stessi dati biometrici — SOLO desktop (dentro la
  // card Peso, come nel mockup approvato). Su mobile resta nascosto via CSS:
  // i dati restano editabili nella sezione Biometria sopra, questo è solo un
  // riepilogo a colpo d'occhio in più, non un secondo posto dove scrivere.
  const biometriaChips = `
    <div class="biometria-chips">
      <div class="biometria-chip"><span class="biometria-chip-label">${L.tile.pressione}</span><span class="biometria-chip-value">${day.bp_sys || '—'}/${day.bp_dia || '—'}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Profondo</span><span class="biometria-chip-value">${day.sonno_profondo_min || '—'}m</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Risvegli</span><span class="biometria-chip-value">${day.sonno_risvegli || '—'}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">HRV</span><span class="biometria-chip-value">${(day.hrv_min || day.hrv_max) ? `${day.hrv_min || '?'}–${day.hrv_max || '?'} ms` : day.hrv ? day.hrv + ' ms' : '—'}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">Freq. a riposo</span><span class="biometria-chip-value">${day.rhr || '—'} bpm</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">${L.tile.sonno}</span><span class="biometria-chip-value">${sonnoTxt}</span></div>
      <div class="biometria-chip"><span class="biometria-chip-label">REM</span><span class="biometria-chip-value">${day.sonno_rem_min || '—'}m</span></div>
    </div>`;

  const iniezioni = `
    <div class="section">
      <div class="section-label">${L.injections}</div>
      ${slots.map(s => `
        <div class="slot-hdr">${L.slotLabels[s.label] || s.label}${s.igfMuscle !== undefined ? ` · ${L.district}: <select class="subj-select" style="font-size:11px;padding:2px 5px" onchange="patch(selDate,'inj_${s.n}_distretto',this.value)"><option value="">${L.choose}</option>${['Petto','Bicipiti','Deltoidi','Tricipiti','Quadricipiti'].map(m => `<option value="${m}" ${(day['inj_' + s.n + '_distretto'] || s.igfMuscle) === m ? 'selected' : ''}>${siteLabel(m)}</option>`).join('')}</select>` : ''}</div>
        ${s.fields.map(f => {
          const fkeyRaw = fieldKey(f);
          const stKey = 'inj_' + s.n + '_' + fkeyRaw;
          const state = day[stKey] || '';
          const isIgf = f.indexOf('IGF-1 DES') === 0;
          return `
          <div class="state-row">
            <span class="state-name">${f}</span>
            ${!isIgf ? `<select class="state-site" onchange="patch(selDate,'${stKey}_sito',this.value)">
              <option value="">${L.site}</option>
              ${SITES_SC.map(site => `<option value="${site}" ${day[stKey + '_sito'] === site ? 'selected' : ''}>${siteLabel(site)}</option>`).join('')}
            </select>` : ''}
            ${stateDot(state, `cycleInjState(${dayIdx},${s.n},${JSON.stringify(f)})`, f)}
          </div>`;
        }).join('')}
      `).join('')}
    </div>`;

  // Versione desktop: niente intestazione "Mattino/Pomeriggio/Sera" a riga
  // propria (occupava una riga intera nel mockup non c'è) — l'orario è
  // inline nel nome della riga stessa. L'unica eccezione è il selettore
  // distretto post-WO, che resta un'intestazione perché è un controllo, non
  // solo un'etichetta.
  const iniezioniDesktop = `
    <div class="section">
      <div class="section-label">${L.injections}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : slots.map(s => `
        ${s.igfMuscle !== undefined ? `<div class="slot-hdr">${L.district}: <select class="subj-select" style="font-size:11px;padding:2px 5px" onchange="patch(selDate,'inj_${s.n}_distretto',this.value)"><option value="">${L.choose}</option>${['Petto','Bicipiti','Deltoidi','Tricipiti','Quadricipiti'].map(m => `<option value="${m}" ${(day['inj_' + s.n + '_distretto'] || s.igfMuscle) === m ? 'selected' : ''}>${siteLabel(m)}</option>`).join('')}</select></div>` : ''}
        ${s.fields.map(f => {
          const fkeyRaw = fieldKey(f);
          const stKey = 'inj_' + s.n + '_' + fkeyRaw;
          const state = day[stKey] || '';
          const isIgf = f.indexOf('IGF-1 DES') === 0;
          return `
          <div class="state-row">
            <span class="state-name">${f} <span class="inj-time">· ${s.label}</span></span>
            ${!isIgf ? `<select class="state-site" onchange="patch(selDate,'${stKey}_sito',this.value)">
              <option value="">${L.site}</option>
              ${SITES_SC.map(site => `<option value="${site}" ${day[stKey + '_sito'] === site ? 'selected' : ''}>${siteLabel(site)}</option>`).join('')}
            </select>` : ''}
            ${stateDot(state, `cycleInjState(${dayIdx},${s.n},${JSON.stringify(f)})`, f)}
          </div>`;
        }).join('')}
      `).join('')}
    </div>`;

  const integratori = `
    <div class="section">
      <div class="section-label">${L.supplements}</div>
      ${SUPP_FIELDS.map(sf => `
        <div class="state-row">
          <span class="state-name">${SUPP_LABELS[sf]}</span>
          ${stateDot(suppState(day, sf), `cycleSuppState('${sf}')`, SUPP_LABELS[sf])}
        </div>`).join('')}
    </div>`;

  const legend = `
    <div class="legend">
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf);border:1.5px solid var(--line)"></div>—</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--ok)"></div>${L.doseDone}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf);border:1.5px solid var(--warn)"></div>${L.doseSkip}</div>
      <div class="legend-item"><div class="legend-dot" style="background:var(--surf2)"></div>${L.doseNa}</div>
    </div>`;

  // motra_log è salvato come stringa JSON (come index.html), non oggetto —
  // va parsato esplicitamente, con guardia in caso manchi o sia malformato.
  const motraLog = (() => {
    if (!day.motra_log) return null;
    if (typeof day.motra_log === 'object') return day.motra_log;
    try { return JSON.parse(day.motra_log); } catch (e) { return null; }
  })();
  const exList = (motraLog && Array.isArray(motraLog.exercises)) ? motraLog.exercises : null;
  const exercises = exList ? `
    <div class="exercises-block">
      <div class="field-label" style="margin-bottom:6px">${L.exercises}</div>
      ${exList.map(ex => {
        const working = (ex.sets || []).filter(s => s.label !== 'W');
        const reps = working[0] ? working[0].reps : (ex.sets && ex.sets[0] ? ex.sets[0].reps : '—');
        return `<div class="exercise-row"><span>${ex.name}</span><span class="exercise-sets">${working.length || (ex.sets || []).length}×${reps}</span></div>`;
      }).join('')}
    </div>` : `<div class="exercise-empty">${LANG === 'it' ? 'Nessun log Motra importato per questo giorno.' : 'No Motra log imported for this day.'}</div>`;

  const allenamento = `
    <div class="section">
      <div class="section-label">${L.training}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : `
      <div class="field-row">
        <div class="field-label">Volume</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_volume || ''}" placeholder="—" oninput="patch(selDate,'wo_volume',this.value)"><span class="field-value-unit">kg</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Durata' : 'Duration'}</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_durata || ''}" placeholder="—" oninput="patch(selDate,'wo_durata',this.value)"><span class="field-value-unit">min</span>
      </div>
      <div class="field-row">
        <div class="field-label">${LANG === 'it' ? 'Calorie' : 'Calories'}</div>
        <input class="field-value" style="width:auto" type="number" value="${day.wo_kcal || ''}" placeholder="—" oninput="patch(selDate,'wo_kcal',this.value)"><span class="field-value-unit">kcal</span>
      </div>
      ${exercises}`}
    </div>`;

  // Desktop: Durata/Volume/Calorie su un'unica riga compatta a 3 colonne,
  // come nel mockup, invece di tre field-row impilate.
  const allenamentoDesktop = `
    <div class="section">
      <div class="section-label">${L.training}</div>
      ${wo.type === 'Riposo' ? `<div class="rest-msg">${L.restDay}</div>` : `
      <div class="wo-fields-row">
        <div class="wo-field"><span class="wo-field-label">${LANG === 'it' ? 'Durata' : 'Duration'}</span><div class="wo-field-val"><input type="number" value="${day.wo_durata || ''}" placeholder="—" oninput="patch(selDate,'wo_durata',this.value)"><span class="wo-field-unit">min</span></div></div>
        <div class="wo-field"><span class="wo-field-label">Volume</span><div class="wo-field-val"><input type="number" value="${day.wo_volume || ''}" placeholder="—" oninput="patch(selDate,'wo_volume',this.value)"><span class="wo-field-unit">kg</span></div></div>
        <div class="wo-field"><span class="wo-field-label">${LANG === 'it' ? 'Calorie' : 'Calories'}</span><div class="wo-field-val"><input type="number" value="${day.wo_kcal || ''}" placeholder="—" oninput="patch(selDate,'wo_kcal',this.value)"><span class="wo-field-unit">kcal</span></div></div>
      </div>
      ${exercises}`}
    </div>`;

  const soggettivo = `
    <div class="section">
      <div class="section-label">${L.subjective}</div>
      ${['energia', 'recupero', 'umore', 'libido', 'chiarezza', 'rpe', 'appetito'].map(sf => `
        <div class="field-row">
          <div class="field-label">${L.subj[sf]}</div>
          <select class="subj-select" onchange="patch(selDate,'${sf}',this.value)">
            <option value="">—</option>
            ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}" ${day[sf] == n ? 'selected' : ''}>${n}/10</option>`).join('')}
          </select>
        </div>`).join('')}
      ${['ritenzione', 'formicolio', 'pienezza_add'].map(sf => `
        <div class="field-row">
          <div class="field-label">${L.subj[sf]}</div>
          <select class="subj-select" onchange="patch(selDate,'${sf}',this.value)">
            <option value="">—</option>
            ${ENUM_LABELS[sf].map((lbl, i) => `<option value="${i}" ${day[sf] == i ? 'selected' : ''}>${lbl}</option>`).join('')}
          </select>
        </div>`).join('')}
      <div class="field-row">
        <div class="field-label">${L.subj.sonno_sogg}</div>
        <select class="subj-select" onchange="patch(selDate,'sonno_sogg',this.value)">
          <option value="">—</option>
          ${Array.from({length:10},(_,i)=>i+1).map(n => `<option value="${n}" ${day.sonno_sogg == n ? 'selected' : ''}>${n}/10</option>`).join('')}
        </select>
      </div>
    </div>`;

  // Desktop: griglia 2 colonne (verificata a fare i conti, non 3 — vedi nota
  // CSS sopra), barre a segmenti per i punteggi 1-10, pillole cliccabili per
  // le scale testuali — non più menu a tendina, sono proprio controlli diversi.
  const soggettivoDesktop = `
    <div class="section">
      <div class="section-label">${L.subjective}</div>
      <div class="subj-grid-2">
        <div class="field-row"><div class="field-label">${L.subj.energia}</div>${barHtml('energia', day.energia)}</div>
        <div class="field-row"><div class="field-label">${L.subj.recupero}</div>${barHtml('recupero', day.recupero)}</div>
        <div class="field-row"><div class="field-label">${L.subj.umore}</div>${barHtml('umore', day.umore)}</div>
        <div class="field-row"><div class="field-label">${L.subj.libido}</div>${barHtml('libido', day.libido)}</div>
        <div class="field-row"><div class="field-label">${L.subj.chiarezza}</div>${barHtml('chiarezza', day.chiarezza)}</div>
        <div class="field-row"><div class="field-label">${L.subj.rpe}</div>${barHtml('rpe', day.rpe)}</div>
        <div class="field-row"><div class="field-label">${L.subj.appetito}</div>${barHtml('appetito', day.appetito)}</div>
        <div class="field-row"><div class="field-label">${L.subj.sonno_sogg}</div>${barHtml('sonno_sogg', day.sonno_sogg)}</div>
        <div class="field-row"><div class="field-label">${L.subj.ritenzione}</div>${pillHtml('ritenzione', day.ritenzione, ENUM_LABELS.ritenzione)}</div>
        <div class="field-row"><div class="field-label">${L.subj.formicolio}</div>${pillHtml('formicolio', day.formicolio, ENUM_LABELS.formicolio)}</div>
        <div class="field-row"><div class="field-label">${L.subj.pienezza_add}</div>${pillHtml('pienezza_add', day.pienezza_add, ENUM_LABELS.pienezza_add)}</div>
      </div>
    </div>`;

  const note = `
    <div class="section">
      <div class="section-label">${L.notes}</div>
      <textarea style="width:100%;border:1px solid var(--line);border-radius:8px;padding:8px;font-family:inherit;font-size:14px;min-height:60px;background:var(--surf2);color:var(--ink)" placeholder="—" oninput="patch(selDate,'note',this.value)">${day.note || ''}</textarea>
    </div>`;

  return { hdr, biometria, biometriaChips, iniezioni, iniezioniDesktop, integratori, legend, allenamento, allenamentoDesktop, soggettivo, soggettivoDesktop, note };
}

// Vista mobile della card giorno — invariata rispetto a prima: un'unica
// day-card con tutte le sezioni impilate. Ora è solo un assemblaggio dei
// frammenti di renderOggiSections(), la logica dei campi non è duplicata.
function renderOggi() {
  const s = renderOggiSections();
  return `
  <div class="day-card">
    ${s.hdr}
    ${s.biometria}
    ${s.iniezioni}
    ${s.integratori}
    ${s.legend}
    ${s.allenamento}
    ${s.soggettivo}
    ${s.note}
  </div>
  `;
}
function bindOggi() {
  if (!MIGRATED[tab] || tab !== 'oggi' || !store.loaded) return;
  const app = document.getElementById('app');

  // Grafico peso e gauge aderenza sono SVG inline sia su mobile che su
  // desktop (portati verbatim dai due export reali) — niente più canvas
  // da ridisegnare qui, solo handler sui data-attributi delle celle
  // interattive, condivisi tra le due viste.
  //
  // Bug corretto 15/09/2026 (segnalato da iPhone, Safari e Chrome — quindi
  // WebKit, non uno specifico browser): i campi testo/numero salvavano
  // SOLO su 'onchange', che su un <input> scatta solo quando il campo
  // perde il focus. Su mobile questo non è affidabile: se l'utente scrive
  // un valore e poi cambia scheda, blocca lo schermo, o comunque non
  // "sfoca" il campo in modo pulito, onchange può non scattare mai —
  // patch() non viene mai chiamato, non c'è nulla in coda, e il pulsante
  // Salva sembra inerte perché non ha davvero nulla da salvare. Ora
  // 'oninput' (che scatta a ogni tasto premuto, sempre affidabile)
  // aggiorna silenziosamente lo stato e mette in coda il salvataggio
  // SENZA il render() completo di patch() — che ricostruirebbe il campo
  // a ogni carattere, interrompendo la digitazione. 'onchange' resta per
  // il render completo (percentuali di aderenza, ecc.) quando il campo
  // si sistema.
  app.querySelectorAll('[data-f]').forEach(el => {
    el.oninput = () => patchSilent(selDate, el.dataset.f, el.value);
    el.onchange = () => patch(selDate, el.dataset.f, el.value);
  });
  app.querySelectorAll('[data-range]').forEach(el => {
    el.onclick = () => { pesoRange = +el.dataset.range; render(); };
  });
  app.querySelectorAll('[data-week]').forEach(el => {
    el.onclick = () => jumpToWeek(+el.dataset.week);
  });
  app.querySelectorAll('[data-injdose]').forEach(el => {
    const k = +el.dataset.injdose;
    el.onclick = () => {
      // ricostruita qui invece di richiamare renderOggiFull: ci serve solo
      // la stessa lista appiattita di dosi per risalire alla stateKey di k.
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[k];
      if (fd) guardedToggle('inj-' + k, () => cycleInjState(dayIdx2, fd.n, fd.f));
    };
  });
  app.querySelectorAll('[data-injmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.injmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-injsite]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [k, site] = el.dataset.injsite.split('|');
      const dayIdx2 = dayIdxFromISO(selDate);
      const slots2 = getInjectionSlots2(dayIdx2);
      const flat = [];
      slots2.forEach(s => { const isIgf = s.igfMuscle !== undefined; s.fields.forEach(f => flat.push({ n: s.n, f, isIgf })); });
      const fd = flat[+k];
      if (!fd) return;
      const siteKey = fd.isIgf ? ('inj_' + fd.n + '_distretto') : ('inj_' + fd.n + '_' + fieldKey(fd.f) + '_sito');
      const cur = getDay(selDate)[siteKey] || '';
      openMenu = null;
      patch(selDate, siteKey, cur === site ? '' : site);
    };
  });
  app.querySelectorAll('[data-suppdose]').forEach(el => {
    el.onclick = () => guardedToggle('supp-' + el.dataset.suppdose, () => cycleSuppState(el.dataset.suppdose));
  });
  app.querySelectorAll('[data-subjpip]').forEach(el => {
    el.onclick = () => {
      const [key, n] = el.dataset.subjpip.split('|');
      const cur = parseInt(getDay(selDate)[key], 10) || 0;
      patch(selDate, key, cur === +n ? 0 : +n); // ritocco sullo stesso pip azzera
    };
  });
  app.querySelectorAll('[data-subjmenu]').forEach(el => {
    el.onclick = e => { e.stopPropagation(); const id = el.dataset.subjmenu; openMenu = openMenu === id ? null : id; render(); };
  });
  app.querySelectorAll('[data-subjenum]').forEach(el => {
    el.onclick = e => {
      e.stopPropagation();
      const [key, idx] = el.dataset.subjenum.split('|');
      openMenu = null;
      patch(selDate, key, idx);
    };
  });
}

/* Un click fuori dalle celle interattive chiude qualunque menù aperto
   (sede iniezione / valore categorico) — porting diretto dal riferimento. */
document.addEventListener('click', () => {
  if (openMenu) { openMenu = null; render(); }
});

window.addEventListener('hashchange', () => {
  tab = location.hash.replace('#', '') || 'oggi';
  render();
});

// Ridisegna quando si attraversa la soglia desktop (non ad ogni pixel di
// resize, solo quando cambia effettivamente il layout da mostrare).
let resizeTimer;
window.addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const nowDesktop = window.innerWidth >= 1024;
    if (nowDesktop !== isDesktop) { isDesktop = nowDesktop; render(); }
  }, 150);
});

document.documentElement.lang = LANG;
render();
loadBlob().then(render).catch(e => console.error('Errore caricamento dati', e));
</script>
