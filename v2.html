    '<button type="button" data-gst-reco-cancel style="border:1px solid var(--line);background:var(--surf2);color:var(--ink2);font-size:var(--fs-xs);font-weight:700;border-radius:var(--r-md);padding:6px 12px;cursor:pointer">Annulla</button></div></div>';
}
function GST_recoMsg(t){ var m = document.querySelector('[data-gst-reco-msg]'); if (m) m.textContent = t || ""; }
function GST_saveReco(cid){
  var c = GST_COMPOUNDS.find(function(x){return x.id===cid;}), f = GST.recoForm;
  var mg = gstNum(f.mg), bac = gstNum(f.bac);
  if (!(mg>0) || !(bac>0)) return GST_recoMsg("Vial (mg) e BAC (mL) devono essere numeri maggiori di zero.");
  if (!f.date || f.date > today) return GST_recoMsg("La data della ricostituzione non pu\u00f2 essere futura.");
  if (!f.key) return GST_recoMsg("Scegli il vial da ricostituire.");
  var btn = document.querySelector('[data-gst-reco-save]'); if (btn){ btn.disabled = true; btn.textContent = "Salvataggio\u2026"; }
  var url = CFG.PROXY_URL + "?user_id=eq.giorgio_protocollo_2026";
  var hdr = { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY };
  fetch(url + "&select=data", { headers: hdr }).then(function(r){ return r.json(); }).then(function(rows){
    var data = rows[0] && rows[0].data; if (!data) throw new Error("record V1 non trovato");
    var vd = data.stock_v2_vials || {};
    var target = gstAllVials(c, vd).find(function(v){return v.key===f.key;});
    if (!target || target.stato !== "intatto") throw new Error("il vial scelto non risulta pi\u00f9 intatto: ricarica la pagina");
    var old = gstActiveVial(c, vd);
    if (old) vd[old.key] = Object.assign({}, vd[old.key] || {}, { stato: "esaurito" });
    vd[target.key] = Object.assign({}, vd[target.key] || {}, { mg: String(mg), bac: String(bac), reco: f.date, stato: "in_uso" });
    data.stock_v2_vials = vd;
    return fetch(url, { method: "PATCH", headers: Object.assign({ "Content-Type": "application/json", Prefer: "return=minimal" }, hdr), body: JSON.stringify({ data: data }) })
      .then(function(r){ if (!r.ok) throw new Error("salvataggio non riuscito ("+r.status+")"); });
  }).then(function(){
    return fetch(url + "&select=data-%3Estock_v2_vials", { headers: hdr }).then(function(r){ return r.json(); });
  }).then(function(rows){
    var got = (rows[0] && rows[0].stock_v2_vials) || {};
    if (!got[f.key] || got[f.key].stato !== "in_uso" || got[f.key].reco !== f.date) throw new Error("verifica dopo la scrittura fallita: controlla il vial da V1");
    GST_V1.stock_v2_vials = got; GST.recoOpen = null; GST_renderStock();
  }).catch(function(e){
    if (btn){ btn.disabled = false; btn.textContent = "Conferma ricostituzione"; }
    GST_recoMsg("Errore: " + e.message);
  });
}

function GST_bindStock(host){
  host.querySelectorAll('[data-gst-uc]').forEach(function(el){
    el.addEventListener("input", function(){
      var k = el.getAttribute("data-gst-uc");
      if (k==="peptide") {
        GST.ucPeptide = el.value;
        var p = UC_PEPTIDES_G.find(function(x){return x.id===el.value;});
        GST.ucMg = p.defaultMg; GST.ucBac = p.defaultBac;
        if (el.value !== "custom") GST.ucDose = p.dose_mcg;
      } else if (k==="mg") GST.ucMg = gstNum(el.value)||0;
      else if (k==="bac") GST.ucBac = gstNum(el.value)||0;
      else if (k==="dose") GST.ucDose = gstNum(el.value)||0;
      GST_renderStock();
      /* PORTING 28/09: il ridisegno completo faceva perdere il focus dopo ogni tasto; lo rimetto
         sul campo e porto il cursore in fondo (input number: trucco type=text per setSelectionRange). */
      if (k !== "peptide") { var nx = document.querySelector('[data-gst-uc="'+k+'"]'); if (nx){ nx.focus(); try { nx.type = "text"; nx.setSelectionRange(nx.value.length, nx.value.length); nx.type = "number"; } catch(e){} } }
    });
  });
  host.querySelectorAll('[data-gst-reco-open]').forEach(function(b){
    b.addEventListener("click", function(){
      var cid = b.getAttribute("data-gst-reco-open"), c = GST_COMPOUNDS.find(function(x){return x.id===cid;});
      GST.recoOpen = cid; GST.recoForm = { key: null, date: today, mg: String(c.defaultMg), bac: String(c.defaultBac) };
      GST_renderStock();
    });
  });
  host.querySelectorAll('[data-gst-reco-cancel]').forEach(function(b){
    b.addEventListener("click", function(){ GST.recoOpen = null; GST_renderStock(); });
  });
  host.querySelectorAll('[data-gst-reco-f]').forEach(function(el){
    el.addEventListener(el.tagName==="SELECT" ? "change" : "input", function(){
      GST.recoForm[el.getAttribute("data-gst-reco-f")] = el.value;
      var c = GST_COMPOUNDS.find(function(x){return x.id===GST.recoOpen;}), box = host.querySelector('[data-gst-reco-summary]');
      if (c && box){ var vd2 = GST_V1.stock_v2_vials || {}; box.innerHTML = GST_recoSummary(c, vd2, gstActiveVial(c, vd2)); }
    });
  });
  host.querySelectorAll('[data-gst-reco-save]').forEach(function(b){
    b.addEventListener("click", function(){ GST_saveReco(b.getAttribute("data-gst-reco-save")); });
  });
  host.querySelectorAll('[data-gst-recon-mg],[data-gst-recon-bac]').forEach(function(el){
    el.addEventListener("change", function(){ GST_saveRecon(el); });
  });
  host.querySelectorAll('[data-gst-cons]').forEach(function(el){
    el.addEventListener("change", function(){ GST_saveConsumabili(); });
  });
}

function GST_saveRecon(el){
  var id = el.getAttribute("data-gst-recon-mg") || el.getAttribute("data-gst-recon-bac");
  var qs = "?user_id=eq.giorgio_proto2_2026&select=data";
  fetch(CFG.PROXY_URL + qs, { headers: { apikey: CFG.PROXY_KEY, Authorization: "Bearer " + CFG.PROXY_KEY } })
    .then(function(r){ return r.json(); })
    .then(function(rows){
      var d = (rows[0] && rows[0].data) || {};
      var list = Array.isArray(d.peptide_reconstitution) ? d.peptide_reconstitution.slice() : [];
      var idx = list.findIndex(function(x){return x.id===id;});
      var c = GST_COMPOUNDS.find(function(x){return x.id===id;});
      var mgEl = document.querySelector('[data-gst-recon-mg="'+id+'"]'), bacEl = document.querySelector('[data-gst-recon-bac="'+id+'"]');
      var entry = { id:id, name:c.name, vial_mg: gstNum(mgEl.value), bac_ml: gstNum(bacEl.value), date_reconstituted: (idx>=0?list[idx].date_reconstituted:isoLocal(new Date())) };
      if (idx>=0) list[idx] = entry; else list.push(entry);
      d.peptide_reconstitution = list;
      store.blob.peptide_reconstitution = list;
      return fetch(CFG.PROXY_URL + "?user_id=eq.giorgio_proto2_2026", {
        method:"PATCH", headers:{ apikey:CFG.PROXY_KEY, Authorization:"Bearer "+CFG.PROXY_KEY, "Content-Type":"application/json", "Prefer":"return=minimal" },
        body: JSON.stringify({ data: d })

    }).then(function(){ GST_renderStock(); }).catch(function(e){ alert("Errore nel salvataggio: "+e.message); });
}

function GST_mealTotals(){
  var kcal=0,p=0,c=0,g=0,n=0;

}

    '<div class="an-tbl gst-foodlist" data-gst-food-list></div>' +

    '<div style="background:var(--hero);color:var(--white);border-radius:var(--r-xl);padding:14px 16px">' +
      '<div style="display:flex;justify-content:space-between;align-items:center">' +

          '<div class="gst-macros" style="display:flex;gap:14px;margin-top:8px;font-size:var(--fs-xs);color:#fffc">' +

          '<span>Carboidrati <strong style="color:var(--white)">'+gstIt(tot.c,1)+' g</strong> \u00b7 '+Math.round(ck/tk*100)+'%</span>' +
          '<span>Grassi <strong style="color:var(--white)">'+gstIt(tot.g,1)+' g</strong> \u00b7 '+Math.round(gk/tk*100)+'%</span></div>';
      })() : '') +

    '<div data-gst-meal-rows style="display:flex;flex-direction:column;gap:8px;margin-top:10px"></div>' +
  '</section></div>';

}

function GST_renderFoodList(host){
  var list = host.querySelector('[data-gst-food-list]'); if (!list) return;
  var q = GST.mealQuery.toLowerCase();
  var rows = [];
  Object.keys(GST_FOOD_DB).forEach(function(cat){
    if (GST.mealCat!=="all" && GST.mealCat!==cat) return;
    GST_FOOD_DB[cat].forEach(function(f){ if (!q || f.name.toLowerCase().indexOf(q)>=0) rows.push([cat,f]); });
  });
  if (!rows.length) { list.innerHTML = '<div class="an-note">Nessun alimento trovato.</div>'; return; }
  var html = "", lastCat = null;
  rows.forEach(function(pair){
    var cat=pair[0], f=pair[1], inMeal = GST_MEAL[f.name]!=null;
    if (cat!==lastCat) { html += '<div style="font-size:var(--fs-2xs);text-transform:uppercase;color:var(--ink3);font-weight:700;margin-top:8px">'+esc(cat)+'</div>'; lastCat=cat; }
    var m = gstMacroFor(f, f.ref);
    html += '<div class="an-trow" style="grid-template-columns:'+(isDesktop?'1fr 60px 40px 32px':'1fr 58px 44px')+';'+(isDesktop?'':'min-height:56px;gap:8px;')+'align-items:center;'+(inMeal?"background:var(--accent-soft)":"")+'">' +
      /* PORTING 26/09: era un <span> (inline) a contenere due <div> -- su una nota lunga a
         due righe (es. "Ember Biltong") la riga non cresceva per contenerla e sovrapponeva la
         successiva. <div> con min-width:0 (necessario perche' un figlio di grid non si allarga
         mai oltre la sua colonna di default, altrimenti il testo lungo avrebbe spinto la riga
         intera fuori dai bordi invece di andare a capo). */
      '<div style="min-width:0"><div style="font-weight:500;font-size:var(--fs-md)">'+esc(f.name)+'</div><div style="font-size:var(--fs-2xs);color:var(--ink3)">'+gstQtyLabel(f,f.ref)+' \u00b7 '+esc(f.note||"")+'</div></div>' +
      '<span class="an-num" style="font-size:var(--fs-sm)">'+m.kcal+' kcal</span>' +
      (isDesktop?'<span class="an-num" style="font-size:var(--fs-xs);color:var(--ink3)">P'+gstIt(m.p,1)+'</span>':'') +
      '<button type="button" data-gst-food-add="'+esc(f.name)+'" style="border:none;border-radius:50%;width:'+(isDesktop?26:40)+'px;height:'+(isDesktop?26:40)+'px;cursor:pointer;font-size:'+(isDesktop?14:19)+'px;background:'+(inMeal?"var(--ok)":"var(--accent)")+';color:var(--white);font-weight:700">'+(inMeal?"\u2713":"+")+'</button>' +
    '</div>';
  });
  list.innerHTML = html;
}

function GST_findFood(name){ var found=null; Object.keys(GST_FOOD_DB).some(function(cat){ var f=GST_FOOD_DB[cat].find(function(x){return x.name===name;}); if(f){found=f;return true;} return false;}); return found; }

function GST_renderMealPanel(host){
  var wrap = host.querySelector('[data-gst-meal-rows]'); if (!wrap) return;
  var names = Object.keys(GST_MEAL);
  if (!names.length) { wrap.innerHTML = '<div class="an-note">Il pasto \u00e8 vuoto. Tocca + su un alimento: compare qui con la sua porzione tipica.</div>'; return; }
  var html = "";
  names.forEach(function(name){
    var f = GST_findFood(name); if (!f) return;
    var qty = GST_MEAL[name], m = gstMacroFor(f, qty), step = f.unit==="fixed" ? 1 : 10;
    html += '<div style="display:flex;align-items:center;gap:8px;border:1px solid var(--line2);border-radius:var(--r-lg);padding:8px 10px">' +
      '<span style="flex:1;min-width:0"><div style="font-size:var(--fs-md);font-weight:500">'+esc(name)+'</div><div style="font-size:var(--fs-2xs);color:var(--ink3)">'+m.kcal+' kcal \u00b7 P'+gstIt(m.p,1)+' \u00b7 C'+gstIt(m.c,1)+' \u00b7 G'+gstIt(m.g,1)+'</div></span>' +
      '<button type="button" data-gst-meal-dec="'+esc(name)+'" style="width:'+(isDesktop?22:36)+'px;height:'+(isDesktop?22:36)+'px;border:1px solid var(--line2);border-radius:50%;background:var(--surf);cursor:pointer;color:var(--ink)">\u2212</button>' +
      '<span style="font-size:var(--fs-xs);min-width:44px;text-align:center">'+gstQtyLabel(f,qty)+'</span>' +
      '<button type="button" data-gst-meal-inc="'+esc(name)+'" style="width:'+(isDesktop?22:36)+'px;height:'+(isDesktop?22:36)+'px;border:1px solid var(--line2);border-radius:50%;background:var(--surf);cursor:pointer;color:var(--ink)">+</button>' +
      '<button type="button" data-gst-meal-del="'+esc(name)+'" style="border:none;background:none;color:var(--ink3);cursor:pointer;font-size:var(--fs-md);'+(isDesktop?'':'width:36px;height:36px')+'">\u2715</button>' +
    '</div>';
  });
  wrap.innerHTML = html;
}

function GST_bindAlimenti(host){
  var q = host.querySelector('[data-gst-food-q]');
  if (q) q.addEventListener("input", function(){ GST.mealQuery = q.value; GST_renderFoodList(host); });
  host.querySelectorAll('[data-gst-food-cat]').forEach(function(b){
    b.addEventListener("click", function(){ GST.mealCat = b.getAttribute("data-gst-food-cat"); GST_renderAlimenti(); });
  });
  host.querySelectorAll('[data-gst-food-add]').forEach(function(b){
    b.addEventListener("click", function(){
      /* PORTING 25/09: bug reale trovato in test -- l'aggiunta ridisegnava solo la lista e le
         righe del pasto, non l'intestazione con il totale kcal/macro, che restava ferma a 0
         anche dopo aver aggiunto alimenti. Ridisegno completo, come gia' fanno +/-/elimina. */
      var name = b.getAttribute("data-gst-food-add"), f = GST_findFood(name);
      GST_MEAL[name] = (GST_MEAL[name] || 0) + f.ref;
      GST_renderAlimenti();
    });
  });
  host.querySelectorAll('[data-gst-meal-inc],[data-gst-meal-dec]').forEach(function(b){
    var isInc = b.hasAttribute("data-gst-meal-inc");
    b.addEventListener("click", function(){
      var name = b.getAttribute(isInc?"data-gst-meal-inc":"data-gst-meal-dec"), f = GST_findFood(name), step = f.unit==="fixed"?1:10;
      GST_MEAL[name] = Math.max(0, (GST_MEAL[name]||0) + (isInc?step:-step));
      if (GST_MEAL[name]<=0) delete GST_MEAL[name];
      GST_renderAlimenti();
    });
  });
  host.querySelectorAll('[data-gst-meal-del]').forEach(function(b){
    b.addEventListener("click", function(){ delete GST_MEAL[b.getAttribute("data-gst-meal-del")]; GST_renderAlimenti(); });
  });
  var clearBtn = host.querySelector('[data-gst-meal-clear]');
  if (clearBtn) clearBtn.addEventListener("click", function(){ GST_MEAL = {}; GST_renderAlimenti(); });
}
function GST_updateMealHero(){ /* il ridisegno completo di GST_renderAlimenti gia' aggiorna il totale */ }


document.documentElement.lang = LANG;
render();
loadBlob().then(() => { restorePending(); render(); }).catch(e => console.error('Errore caricamento dati', e));
</script>

      { label: 'Massa magra DEXA T0 -> T1', val: ln1 != null ? pdfN(CLIN_DEXA_META[1].t0, 1) + ' -> ' + pdfN(ln1, 1) + ' kg' : 'T0 ' + pdfN(CLIN_DEXA_META[1].t0, 1) + ' kg' }]);
    y = sectionTitle(y, 'Andamento del peso: dal test protocollo a oggi');
    if (wser.length >= 2) {
      const cx = mL, cy = y, cw = cW, ch = 46;
      doc.setFillColor(245, 245, 247); doc.roundedRect(cx, cy, cw, ch + 12, 2, 2, 'F');
      const vals = wser.map(p => p.v), vMin = Math.floor(Math.min(...vals) - 0.3), vMax = Math.ceil(Math.max(...vals) + 0.3);
      const t0d = new Date(wser[0].iso + 'T00:00:00'), t1d = new Date(wser[wser.length - 1].iso + 'T00:00:00'), span = Math.max(1, (t1d - t0d) / 86400000);
      const px = iso => cx + 12 + (cw - 20) * ((new Date(iso + 'T00:00:00') - t0d) / 86400000) / span, py = v => cy + 6 + (ch - 10) * (1 - (v - vMin) / (vMax - vMin));
      doc.setFont('helvetica', 'normal'); doc.setFontSize(6.5); doc.setTextColor(134, 134, 139); doc.setDrawColor(225, 225, 230); doc.setLineWidth(0.2);
      [vMin, (vMin + vMax) / 2, vMax].forEach(v => { doc.line(cx + 11, py(v), cx + cw - 5, py(v)); doc.text(pdfN(v, 1), cx + 9, py(v) + 1, { align: 'right' }); });
      const drawnCk = [];
      [[CLIN_CK.t0, 'T0'], [CLIN_CK.t1, 'T1']].forEach(([iso, lb]) => { if (iso >= wser[0].iso && iso <= wser[wser.length - 1].iso) { drawnCk.push(lb); doc.setDrawColor(255, 149, 0); doc.setLineDashPattern([1, 1], 0); doc.line(px(iso), cy + 4, px(iso), cy + ch - 4); doc.setLineDashPattern([], 0); doc.setTextColor(255, 149, 0); doc.text(lb, px(iso), cy + 3.2, { align: 'center' }); } });
      doc.setDrawColor(0, 113, 227); doc.setLineWidth(0.5);
      let gaps = 0;
      for (let i = 0; i < wser.length - 1; i++) {
        const gapD = (new Date(wser[i + 1].iso + 'T00:00:00') - new Date(wser[i].iso + 'T00:00:00')) / 86400000;
        if (gapD > 3) { gaps++; doc.setDrawColor(190, 190, 196); doc.setLineDashPattern([0.6, 1.2], 0); doc.line(px(wser[i].iso), py(wser[i].v), px(wser[i + 1].iso), py(wser[i + 1].v)); doc.setLineDashPattern([], 0); doc.setDrawColor(0, 113, 227); }
        else doc.line(px(wser[i].iso), py(wser[i].v), px(wser[i + 1].iso), py(wser[i + 1].v));
      }
      doc.setFillColor(0, 113, 227); wser.forEach(p => doc.circle(px(p.iso), py(p.v), 0.6, 'F'));
      doc.setTextColor(134, 134, 139); doc.setFontSize(6.5);
      [wser[0], wser[Math.floor(wser.length / 2)], wser[wser.length - 1]].forEach((p, i) => doc.text(pdfDM(p.iso), px(p.iso), cy + ch + 5, { align: i === 0 ? 'left' : (i === 2 ? 'right' : 'center') }));
      doc.text('Peso giornaliero (kg). ' + (drawnCk.length ? 'Verticale arancio: checkpoint ' + drawnCk.join(' e ') + (drawnCk.length < 2 ? ' (il T0 del ' + pdfDMY(CLIN_CK.t0) + ' precede la prima pesata del grafico)' : '') + '. ' : '') + 'Tratto puntinato: piu di 3 giorni senza pesata, andamento non noto.', cx + 3, cy + ch + 9.5);
      y = cy + ch + 18;
    } else y = bodyText(y, 'Dati insufficienti per il grafico.');
    y = sectionTitle(y, 'Confronto visivo: checkpoint T0 e T1');
    try {
      set('Scarico le foto…');
      const cps = [['T0', CLIN_CK.t0], ['T1', CLIN_CK.t1]].map(([lb, iso]) => ({ lb, iso, near: CLIN_photoNear(iso, 3) }));
      const imgs = await Promise.all(cps.map(c => c.near ? pdfPhoto(c.near.p.filename).catch(() => null) : null));
      const iw = 55, gap = 12, x0 = mL + (cW - (2 * iw + gap)) / 2;
      cps.forEach((c, i) => {
        const x = x0 + i * (iw + gap), im = imgs[i];
        if (im) { const ih = Math.min(73, iw * im.h / im.w); doc.addImage(im.data, 'JPEG', x, y, iw, ih); }
        else { doc.setFillColor(245, 245, 247); doc.roundedRect(x, y, iw, 73, 2, 2, 'F'); doc.setFontSize(8); doc.setTextColor(134, 134, 139); doc.text(c.near ? 'foto non disponibile' : 'nessuna foto entro 3 giorni', x + iw / 2, y + 37, { align: 'center' }); }
        doc.setFont('helvetica', 'bold'); doc.setFontSize(8); doc.setTextColor(86, 86, 86);
        doc.text(c.lb + ' \u00b7 ' + pdfDMY(c.iso) + (c.near && c.near.d ? ' (foto ' + (c.near.d > 0 ? '+' : '') + c.near.d + ' g)' : ''), x + iw / 2, y + 78, { align: 'center' });
      });
      y += 84;
    } catch (e) { y = bodyText(y, '(Foto non disponibili: ' + e.message + ')'); }

    doc.addPage(); parts.push({ label: 'Parte 1 di 3', title: 'Ricomposizione corporea (segue)', page: doc.getNumberOfPages() }); y = 38;
    y = sectionTitle(y, 'Parametri vitali: medie settimanali');
    tbl2({ startY: y, head: [['Settimana', 'Peso kg', 'Pressione mmHg', 'FC riposo bpm', 'Sonno', 'HRV min-max ms']], body: pdfWeeks(6), styles: { fontSize: 8, cellPadding: 2.2, textColor: [58, 58, 60] } });
    y = tblY() + 4; y = bodyText(y, 'Tra parentesi i giorni con il dato. * settimana in corso, parziale. HRV: media dei minimi e dei massimi giornalieri (Salute iOS fornisce un intervallo, non una media). Sonno: media delle ore totali.', 7.5) + 2;
    y = sectionTitle(y, 'Forza ai checkpoint (sentinel lift)');
    const leanT0 = CLIN_DEXA_META[1].t0;
    const liftRows = CLIN_LIFTS_META.map(l => {
      const b0 = CLIN_sentinelAt(l.id, CLIN_CK.t0), b1 = CLIN_sentinelAt(l.id, CLIN_CK.t1);
      const r0 = b0 ? pdfN(b0.kg / leanT0, 2) : '\u2014', r1 = (b1 && ln1 != null) ? pdfN(b1.kg / ln1, 2) : '\u2014';
      return [l.label + ' (' + l.muscle + ')', b0 ? pdfN(b0.kg, 0) + ' kg' : 'n/d', b1 ? pdfN(b1.kg, 0) + ' kg' : 'n/d', (b0 && b1) ? (b1.kg - b0.kg >= 0 ? '+' : '') + pdfN(b1.kg - b0.kg, 0) + ' kg' : 'n/d', r0 + ' -> ' + r1];
    });
    tbl2({ startY: y, head: [['Esercizio', 'T0', 'T1', 'Differenza', 'kg / kg di massa magra']], body: liftRows });
    y = tblY() + 4; bodyText(y, 'Carico della seduta piu vicina al checkpoint, entro 7 giorni. "n/d" = nessuna seduta in quella finestra. Il rapporto usa la massa magra DEXA del checkpoint.', 7.5);

    /* ---------- PARTE 2 ---------- */
    y = startPart('Parte 2 di 3', 'Protocollo peptidico');
    y = sectionTitle(y, 'Composti e dosaggi');
    tbl2({ startY: y, head: [['Composto', 'Dosaggio da protocollo']], body: GST_COMPOUNDS.map(c => [c.name, pdfTxt(c.doseLabel)]), styles: { fontSize: 9, cellPadding: 2.6, textColor: [58, 58, 60] }, columnStyles: { 0: { fontStyle: 'bold', cellWidth: 60 } } });
    y = tblY() + 8;
    y = sectionTitle(y, 'Aderenza cumulativa (dal test protocollo del 18/07)');
    const A = adherence(store.blob);
    y = kpiRow(y, [{ label: 'Iniezioni ' + A.injDone + '/' + A.injTot, val: A.inj + '%' }, { label: 'Integratori ' + A.suppDone + '/' + A.suppTot, val: A.supp + '%' }, { label: 'Allenamenti ' + A.woDone + '/' + A.woTot, val: A.wo + '%' }]);
    y = bodyText(y - 1, 'Dosi fatte su dovute; dosi saltate a scopo o non applicabili escluse. Il giorno in corso non conta come mancato.', 7.5) + 2;
    y = sectionTitle(y, 'Scorte a oggi');
    const vd = (typeof GST_V1 !== 'undefined' && GST_V1.stock_v2_vials) || null, left = gstGiorniAllaFine();
    if (vd && Object.keys(vd).length) {
      const rows = GST_COMPOUNDS.map(c => { const g = gstCopertura(c, vd, today).giorni; return [c.name, g + ' giorni', g < left ? 'non arriva a fine ciclo (mancano ' + left + ' giorni)' : (g < left + 14 ? 'copre il ciclo, margine sotto 14 giorni' : 'copre il ciclo')]; });
      tbl2({ startY: y, head: [['Composto', 'Copertura', 'Rispetto alla fine del ciclo']], body: rows, didParseCell: d => { if (d.section === 'body' && d.column.index === 2 && String(d.cell.raw).indexOf('non arriva') === 0) { d.cell.styles.textColor = [216, 30, 5]; d.cell.styles.fontStyle = 'bold'; } } });
      y = tblY() + 8;
    } else { y = bodyText(y, 'Dati dei vial non disponibili al momento della generazione.'); }
    y = sectionTitle(y, 'Fasi del protocollo');
    tbl2({ startY: y, head: [['Fase', 'Periodo', 'Note']], body: [['Warm-up', '8 giu - 17 lug', 'Fase preparatoria; Tesamorelin sospeso dopo 2-3 iniezioni'], ['Test protocollo', '18-19 lug', 'Introduzione dello stack completo'], ['Ciclo 1', '20 lug - 8 nov', '112 giorni, protocollo completo'], ['Trasferta Bangkok', '7-21 ago', 'Iniezioni mantenute, allenamento adattato']] });

    /* ---------- PARTE 3 ---------- */
    y = startPart('Parte 3 di 3', 'Laboratorio T0 -> T1');
    y = bodyText(y, 'T0: DEXA 9 maggio 2026 e pannello ematico 13 luglio 2026. T1: 12 settembre 2026. Valori come registrati nel diario; i range sono quelli del laboratorio.');
    y = sectionTitle(y, 'DEXA');
    const dRows = CLIN_DEXA_META.map(d => { const v1 = CLIN_dexaT(d.key, 't1'), dd = v1 != null ? v1 - d.t0 : null; return [d.label + ((d.label.indexOf('(') >= 0 || (d.unit === '%' && d.label.indexOf('%') >= 0)) ? '' : ' (' + pdfTxt(d.unit) + ')'), pdfN(d.t0, d.dec), v1 != null ? pdfN(v1, d.dec) : 'n/d', dd != null ? (dd >= 0 ? '+' : '') + pdfN(dd, d.dec) : '\u2014']; });
    tbl2({ startY: y, head: [['Parametro', 'T0 (9 mag)', 'T1 (12 set)', 'Differenza']], body: dRows, columnStyles: { 0: { fontStyle: 'bold' } } });
    y = tblY() + 8;
    { const dx1 = CLIN_EXTRA.dexa_t1 || {}, ts = parseFloat(String(dx1.dexa_bmd_tscore).replace(',', '.')), zs = parseFloat(String(dx1.dexa_bmd_zscore).replace(',', '.'));
      if (!isNaN(ts) || !isNaN(zs)) { doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); doc.setTextColor(134, 134, 139);
        doc.text(pdfTxt('BMD T1: MOC total body del 12/09/2026' + (isNaN(ts) ? '' : ', T-score ' + pdfN(ts, 1)) + (isNaN(zs) ? '' : ', Z-score ' + pdfN(zs, 1)) + ', normale secondo OMS. Stesso apparecchio della DEXA T0.'), mL, y - 4); } }
    y = sectionTitle(y, 'Pannello ematico Santagostino');
    const mRows = [];
    Object.keys(CLIN_MARKERS).forEach(k => {
      const m = CLIN_MARKERS[k], ref = CLIN_parseRef(m.ref), p0 = CLIN_parseVal(m.t0), p1 = CLIN_parseVal(CLIN_labT(k, 't1'));
      const s1 = p1 ? CLIN_statusOf(p1, ref, m) : CLIN_statusOf(p0, ref, m);
      let dl = '\u2014'; if (p1 && p0) { const dv = p1.v - p0.v, pc = p0.v !== 0 ? dv / Math.abs(p0.v) * 100 : 0; dl = (dv > 0 ? '+' : '') + (Math.abs(dv) < 0.005 ? '0' : CLIN_fmtNum(dv, CLIN_decOf(p0.v))) + ' (' + (pc > 0 ? '+' : '') + pdfN(pc, 1) + '%)'; }
      mRows.push([m.label + (m.unit ? ' (' + m.unit + ')' : ''), CLIN_fmtP(p0), p1 ? CLIN_fmtP(p1) : 'n/d', dl, m.ref + (m.target_lo != null ? ' | target ' + m.target_lo + '+' : ''), s1 === 'out' ? '*' : (s1 === 'target' ? '\u2020' : '')]);
    });
    tbl2({ startY: y, head: [['Esame', 'T0', 'T1', 'Differenza', 'Riferimento', '']], body: mRows, styles: { fontSize: 8, cellPadding: 2, textColor: [58, 58, 60] }, columnStyles: { 0: { fontStyle: 'bold' }, 5: { cellWidth: 8, halign: 'center', fontStyle: 'bold', textColor: [216, 30, 5] } } });
    y = tblY() + 5; const nOut = mRows.filter(r => r[5] === '*').length, nTg = mRows.filter(r => r[5] === '\u2020').length;
    doc.setFont('helvetica', 'italic'); doc.setFontSize(7.5); doc.setTextColor(134, 134, 139);
    doc.text(pdfTxt('* fuori range di riferimento (' + nOut + ' su ' + mRows.length + ')' + (nTg ? '   \u2020 sotto target clinico (' + nTg + ')' : '')), mL, y);
    /* marker da seguire: stessa logica della vista Referti > Da seguire */
    doc.addPage(); parts.push({ label: 'Parte 3 di 3', title: 'Laboratorio (segue)', page: doc.getNumberOfPages() }); y = 38;
    y = sectionTitle(y, 'Marker fuori range all\'ultima misura');
    const SER = CLIN_DATA.series;
    const watch = Object.keys(SER).map(k => {
      const pts = CLIN_seriesPoints(k).filter(p => !(p.checkpoint && !CLIN_labT(k, p.checkpoint))), last = pts[pts.length - 1]; if (!last) return null;
      const kind = CLIN_kindOf(last, k); if (kind === 'ok') return null;
      const outN = pts.filter(p => CLIN_kindOf(p, k) !== 'ok').length;
      return [SER[k].label, CLIN_fmtNum(last.v) + ' ' + SER[k].unit, last.ref || '\u2014', (last.date || '') + (last.src ? ' \u00b7 ' + last.src : ''), kind === 'target' ? 'sotto target clinico' : (outN === pts.length ? 'sempre fuori' : 'fuori ' + outN + (outN === 1 ? ' volta' : ' volte') + ' su ' + pts.length)];
    }).filter(Boolean);
    tbl2({ startY: y, head: [['Marker', 'Ultima misura', 'Riferimento', 'Data e fonte', 'Frequenza']], body: watch.length ? watch : [['Nessun marker fuori range', '', '', '', '']], styles: { fontSize: 7.8, cellPadding: 2, textColor: [58, 58, 60] }, columnStyles: { 0: { fontStyle: 'bold' } } });
    y = tblY() + 6; bodyText(y, 'Frequenza: su quante misure storiche (dal 2020) il marker risulta fuori range. Report generato dai dati del diario personale: non sostituisce i referti originali.', 7.5);

    /* ---------- intestazioni e piè di pagina ---------- */
    const total = doc.getNumberOfPages();
    for (let p = 1; p <= total; p++) {
      doc.setPage(p);
      const part = parts.slice().reverse().find(x => x.page <= p) || parts[0];
      doc.setFont('helvetica', 'bold'); doc.setFontSize(15); doc.setTextColor(28, 28, 30); doc.text('Diario Protocollo \u2014 Report Ciclo 1', mL, 18);
      doc.setFont('helvetica', 'normal'); doc.setFontSize(9); doc.setTextColor(134, 134, 139); doc.text(pdfTxt('Giorgio Marigliano \u00b7 20 lug \u2013 8 nov 2026 \u00b7 generato il ' + todayStr), mL, 24);
      doc.setFont('helvetica', 'bold'); doc.setTextColor(0, 113, 227); doc.text(pdfTxt(part.label), pageW - mR, 18, { align: 'right' });
      doc.setFont('helvetica', 'normal'); doc.setTextColor(134, 134, 139); doc.text(pdfTxt(part.title), pageW - mR, 24, { align: 'right' });
      doc.setDrawColor(0, 113, 227); doc.setLineWidth(0.8); doc.line(mL, 28, pageW - mR, 28);
      doc.setFontSize(8); doc.text('Diario Protocollo \u00b7 pagina ' + p + ' di ' + total, pageW / 2, 289, { align: 'center' });
    }
    doc.save('diario_protocollo_report_' + today + '.pdf');
    set('PDF generato \u2713 ' + total + ' pagine');
  } catch (e) {
    console.warn('export PDF', e);
    set('Non riesco a generare il PDF: ' + e.message + '. Controlla la connessione e riprova.');
  } finally { if (btn) btn.disabled = false; }
}
document.addEventListener('click', ev => {
  const b = ev.target.closest && ev.target.closest('[data-export-pdf]'); if (!b) return;
  exportPDF(b.closest('section').querySelector('[data-export-status]'), b);
});
