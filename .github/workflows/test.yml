name: Test
# Controlli automatici a ogni pubblicazione. Girano su DATI FINTI (tests/fixtures, generati da tools/audit/make_fixture.py):
# nessun dato reale del diario entra in questo repo o in questi test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test statici e di regressione
        run: |
          (cd tools/audit && npm install --silent)
          node tests/v2.static.test.js
          node tests/regression.test.js
      - name: Installa Playwright
        run: |
          pip install playwright
          python -m playwright install --with-deps chromium
      - name: Audit di v2.html su dati finti (desktop, iPhone, inglese)
        run: python tools/audit/audit.py --data-dir tests/fixtures --today 2026-11-12 --baseline tools/audit/baseline.fake.json --en
      - name: Dettagli dell'audit (solo se fallisce)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: audit-out
          path: tools/audit/out
          if-no-files-found: ignore
